services:
  postgres:
    image: postgres:17-alpine
    profiles:
      - postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REZZERV_POSTGRES_DB:-rezzerv}
      POSTGRES_USER: ${REZZERV_POSTGRES_USER:-rezzerv}
      POSTGRES_PASSWORD: ${REZZERV_POSTGRES_PASSWORD:-rezzerv-local-only}
    ports:
      - "${REZZERV_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REZZERV_POSTGRES_USER:-rezzerv} -d ${REZZERV_POSTGRES_DB:-rezzerv}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rezzerv_postgres:/var/lib/postgresql/data

volumes:
  rezzerv_postgres:
