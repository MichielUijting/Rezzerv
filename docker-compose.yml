services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${REZZERV_BACKEND_PORT:-8011}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REZZERV_DATASTORE_POLICY: postgresql-only
      PYTHONUNBUFFERED: "1"
      REZZERV_SESSION_COOKIE_SECURE: "false"
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: "true"
      REZZERV_SUPERGEBRUIKER_PASSWORD: ${REZZERV_SUPERGEBRUIKER_PASSWORD:-RezzervSuper123!}
      REZZERV_RECEIPT_STARTUP_OCR_WARMUP: "false"
      REZZERV_RECEIPT_STARTUP_REMBG_WARMUP: "true"
      REZZERV_OFF_SEARCH_PROVIDER: ${REZZERV_OFF_SEARCH_PROVIDER:-search_a_licious}
      REZZERV_OFF_SEARCH_A_LICIOUS_BASE_URL: ${REZZERV_OFF_SEARCH_A_LICIOUS_BASE_URL:-https://search.openfoodfacts.org/search}
      REZZERV_OFF_SEARCH_BASE_URL: ${REZZERV_OFF_SEARCH_BASE_URL:-https://world.openfoodfacts.org/cgi/search.pl}
      REZZERV_OFF_SEARCH_TIMEOUT_SECONDS: ${REZZERV_OFF_SEARCH_TIMEOUT_SECONDS:-8}
      REZZERV_OFF_SEARCH_MAX_QUERIES: ${REZZERV_OFF_SEARCH_MAX_QUERIES:-3}
      REZZERV_RECEIPT_EMAIL_DOMAIN: iogaroulda.resend.app
      REZZERV_EMAIL_ENABLED: "false"
      REZZERV_RESEND_API_KEY: ""
      REZZERV_RESEND_API_BASE_URL: https://api.resend.com
      REZZERV_RESEND_WEBHOOK_SECRET: ${REZZERV_RESEND_WEBHOOK_SECRET:-}
      REZZERV_NOTIFICATION_FROM_EMAIL: ""
      REZZERV_NOTIFICATION_FROM_NAME: Inhuis
      REZZERV_APP_BASE_URL: ${REZZERV_APP_BASE_URL:-http://localhost:5174}
      REZZERV_BACKEND_PUBLIC_URL: ${REZZERV_BACKEND_PUBLIC_URL:-}
      REZZERV_GS1_MPM_SHARE_BASE_URL: ${REZZERV_GS1_MPM_SHARE_BASE_URL:-}
      REZZERV_GS1_MPM_SHARE_API_KEY: ${REZZERV_GS1_MPM_SHARE_API_KEY:-}
      REZZERV_RETAILER_ACCOUNT_KEY: ${REZZERV_RETAILER_ACCOUNT_KEY:-}
      REZZERV_RETAILER_ACCOUNT_KEY_PATH: /app/secrets/retailer_accounts.key
      REZZERV_IN_HUIS_DEMO_SCANNER_BASE_URL: ${REZZERV_IN_HUIS_DEMO_SCANNER_BASE_URL:-}
      REZZERV_IN_HUIS_DEMO_SCANNER_API_KEY: ${REZZERV_IN_HUIS_DEMO_SCANNER_API_KEY:-}
      REZZERV_IN_HUIS_DEMO_SCANNER_API_KEY_HEADER: ${REZZERV_IN_HUIS_DEMO_SCANNER_API_KEY_HEADER:-X-API-Key}
      REZZERV_IN_HUIS_DEMO_SCANNER_SUBMIT_PATH: ${REZZERV_IN_HUIS_DEMO_SCANNER_SUBMIT_PATH:-/scan}
      REZZERV_IN_HUIS_DEMO_SCANNER_POLL_PATH: ${REZZERV_IN_HUIS_DEMO_SCANNER_POLL_PATH:-/scan/{job_id}}
      REZZERV_IN_HUIS_DEMO_SCANNER_REQUEST_TIMEOUT_SECONDS: ${REZZERV_IN_HUIS_DEMO_SCANNER_REQUEST_TIMEOUT_SECONDS:-30}
    volumes:
      - ./tools:/app/tools:ro
      - rezzerv_u2net:/root/.u2net
      - rezzerv_paddlex:/root/.paddlex
      - rezzerv_retailer_secrets:/app/secrets

  frontend:
    build:
      context: ./frontend
      args:
        REZZERV_VERSION: ${REZZERV_VERSION:-Rezzerv-dev}
        REZZERV_COMMIT: ${REZZERV_COMMIT:-unknown}
    restart: unless-stopped
    ports:
      - "${REZZERV_FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend

volumes:
  rezzerv_u2net:
  rezzerv_paddlex:
  rezzerv_retailer_secrets:
