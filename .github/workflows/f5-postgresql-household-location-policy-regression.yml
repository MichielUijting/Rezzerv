name: F5 PostgreSQL household location policy regression

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - '.github/workflows/f5-postgresql-household-location-policy-regression.yml'
      - 'backend/alembic/**'
      - 'backend/app/api/household_capability_expansion_routes.py'
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/services/household_product_configuration_service.py'
      - 'backend/app/services/household_location_onboarding_service.py'
      - 'backend/app/services/inventory_location_policy_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/settings_location_policy_api_selftest.py'
      - 'frontend/src/features/settings/settingsNavigation.js'
      - 'frontend/tests/dynamic-settings-navigation.contract.mjs'
      - 'frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js'
      - 'quality/regression/historical_defect_registry.json'
      - 'scripts/acceptance/validate_historical_defect_registry.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f5-postgresql-household-location-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  household-location-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_f5_location_policy_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_f5_location_policy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_f5_location_policy_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_f5_location_policy_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      REZZERV_SESSION_COOKIE_SECURE: 'false'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'false'
      REZZERV_TEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Prepare shared PostgreSQL acceptance foundation
        uses: ./.github/actions/postgresql-acceptance-foundation
        with:
          database-name: rezzerv_f5_location_policy_ci
          bootstrap-user: rezzerv_bootstrap
          bootstrap-password: rezzerv_bootstrap_ci
          port: '55432'
          migrator-password: rezzerv_migrator_ci
          runtime-password: rezzerv_app_ci
          migration-mode: alembic
          evidence-file: f5-location-policy-shared-postgresql-foundation.log

      - name: Validate Phase 5 historical defect registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acceptance/validate_historical_defect_registry.py | tee f5-historical-defect-registry.log
          grep -F 'PASS household_location_policy_has_explicit_acceptance_and_evidence' f5-historical-defect-registry.log
          grep -F 'F5_HISTORICAL_DEFECT_REGISTRY_GREEN' f5-historical-defect-registry.log

      - name: Compile location policy backend authority
        run: |
          python -m py_compile \
            backend/app/api/household_capability_expansion_routes.py \
            backend/app/services/household_product_configuration_service.py \
            backend/app/services/household_location_onboarding_service.py \
            backend/app/services/inventory_location_policy_service.py \
            backend/tests/settings_location_policy_api_selftest.py \
            scripts/acceptance/validate_historical_defect_registry.py

      - name: Prove saved household setting drives PostgreSQL backend location policy
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend python backend/tests/settings_location_policy_api_selftest.py | tee f5-postgresql-household-location-policy.log
          grep -F 'PASS postgresql_dml_only_runtime' f5-postgresql-household-location-policy.log
          grep -F 'PASS household_member_cannot_manage_settings' f5-postgresql-household-location-policy.log
          grep -F 'PASS settings_api_persists_locationless_mode' f5-postgresql-household-location-policy.log
          grep -F 'PASS settings_api_persists_global_location_mode' f5-postgresql-household-location-policy.log
          grep -F 'PASS session_household_is_authoritative' f5-postgresql-household-location-policy.log
          grep -F 'PASS database_and_runtime_policy_match_saved_settings' f5-postgresql-household-location-policy.log
          grep -F 'PASS unrelated_household_remains_isolated' f5-postgresql-household-location-policy.log
          grep -F 'SETTINGS_LOCATION_POLICY_API_POSTGRESQL_GREEN' f5-postgresql-household-location-policy.log

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prove Settings UI follows the same location policy
        shell: bash
        run: |
          set -euo pipefail
          node frontend/tests/dynamic-settings-navigation.contract.mjs | tee f5-household-location-policy-ui.log
          grep -F 'DYNAMIC_SETTINGS_NAVIGATION_CONTRACT_GREEN' f5-household-location-policy-ui.log

      - name: Guard locationless L4 authority remains policy-driven
        shell: bash
        run: |
          set -euo pipefail
          spec='frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js'
          grep -F "expect(capabilities.product_configuration.location_tracking_level).toBe('none')" "$spec"
          grep -F "home-tile-locaties" "$spec"
          grep -F "columnheader', { name: 'Locatie'" "$spec"
          grep -F "receipt-line-location-select-" "$spec"
          grep -F "expect(processResponse.ok()).toBeTruthy()" "$spec"
          echo 'F5_HOUSEHOLD_LOCATION_POLICY_L4_GUARD_GREEN'

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload F5 household location policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-postgresql-household-location-policy-evidence
          path: |
            f5-location-policy-shared-postgresql-foundation.log
            f5-historical-defect-registry.log
            f5-postgresql-household-location-policy.log
            f5-household-location-policy-ui.log
          if-no-files-found: error
          retention-days: 7

      - name: F5 household location policy gate marker
        run: echo 'F5_HOUSEHOLD_LOCATION_POLICY_GREEN'
