name: PR253 v01.12.109 release package

on:
  pull_request:
    paths:
      - '.github/workflows/pr253-v0112109-release-package.yml'
      - 'VERSION.txt'
      - 'backend/VERSION.txt'
      - 'version.json'
      - 'frontend/version.json'
      - 'frontend/public/version.json'
      - 'frontend/package.json'
      - 'frontend/tests/e2e/**'
      - 'backend/app/receipt_ingestion/**'
      - 'backend/app/runtime_preflight.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/tests/test_receipt_financial_components_regression.py'
      - 'backend/tests/test_receipt_runtime_preflight.py'
      - 'backend/tests/test_receipt_scanner_line_count_equivalence.py'
      - 'frontend/src/features/externalDatabases/**'
      - 'frontend/src/ui/Table.jsx'
      - 'frontend/src/ui/components/table.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr253-v0112109-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-v0112109:
    name: Build runtime and package v01.12.109
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_VERSION: Rezzerv-MVP-v01.12.109
      EXPECTED_PACKAGE_VERSION: 1.12.109
      PACKAGE_NAME: Rezzerv-MVP-v01.12.109
      PRODUCT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REZZERV_FRONTEND_PORT: '5147'
      REZZERV_APP_BASE_URL: http://127.0.0.1:5147

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Validate exact release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n' < VERSION.txt)" = "$EXPECTED_VERSION"
          test "$(tr -d '\r\n' < backend/VERSION.txt)" = "$EXPECTED_VERSION"
          python - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_VERSION']
          for path in ('version.json', 'frontend/version.json', 'frontend/public/version.json'):
              with open(path, encoding='utf-8') as handle:
                  assert json.load(handle)['version'] == expected, path
          with open('frontend/package.json', encoding='utf-8') as handle:
              assert json.load(handle)['version'] == os.environ['EXPECTED_PACKAGE_VERSION']
          print('PACKAGE_VERSION_SYNC_GREEN')
          PY

      - name: Build frontend production output
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Build Docker stack without cache
        shell: bash
        run: |
          set -euo pipefail
          REZZERV_VERSION="$EXPECTED_VERSION" REZZERV_COMMIT="$PRODUCT_SHA" docker compose build --no-cache

      - name: Start stack and validate runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            REZZERV_VERSION="$EXPECTED_VERSION" REZZERV_COMMIT="$PRODUCT_SHA" docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          REZZERV_VERSION="$EXPECTED_VERSION" REZZERV_COMMIT="$PRODUCT_SHA" docker compose up -d

          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8011/api/health > /tmp/health.json; then
              break
            fi
            if [ "$attempt" = 120 ]; then
              docker compose ps
              docker compose logs --no-color --tail=600 backend
              exit 1
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          assert health.get('status') == 'ok', health
          print('PACKAGE_BACKEND_HEALTH_GREEN')
          PY

          curl --fail --silent http://127.0.0.1:8011/openapi.json > /tmp/openapi.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/openapi.json').read_text(encoding='utf-8'))
          assert payload.get('openapi'), payload
          print('PACKAGE_OPENAPI_GREEN')
          PY

          curl --fail --silent -I http://127.0.0.1:5147/ > /tmp/frontend-headers.txt
          grep -Eq '^HTTP/.* 200' /tmp/frontend-headers.txt
          echo PACKAGE_FRONTEND_RUNTIME_GREEN

      - name: Create standalone release zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-package
          mkdir -p .release-package/$PACKAGE_NAME
          git archive --format=tar HEAD | tar -xf - -C .release-package/$PACKAGE_NAME
          rm -rf .release-package/$PACKAGE_NAME/frontend/node_modules
          rm -rf .release-package/$PACKAGE_NAME/frontend/playwright-report
          rm -rf .release-package/$PACKAGE_NAME/frontend/test-results
          rm -rf .release-package/$PACKAGE_NAME/.git
          printf '%s\n' "$PRODUCT_SHA" > .release-package/$PACKAGE_NAME/RELEASE_COMMIT.txt
          printf '%s\n' "$EXPECTED_VERSION" > .release-package/$PACKAGE_NAME/RELEASE_VERSION.txt
          (
            cd .release-package
            zip -qr "$PACKAGE_NAME.zip" "$PACKAGE_NAME"
          )
          test -s ".release-package/$PACKAGE_NAME.zip"
          echo PACKAGE_ZIP_GREEN

      - name: Upload full release zip
        uses: actions/upload-artifact@v4
        with:
          name: Rezzerv-MVP-v01.12.109-full-package
          path: .release-package/Rezzerv-MVP-v01.12.109.zip
          if-no-files-found: error
          retention-days: 14
