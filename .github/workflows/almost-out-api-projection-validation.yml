name: Almost-out API projection validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - '.github/workflows/almost-out-api-projection-validation.yml'
      - 'backend/alembic.ini'
      - 'backend/alembic/**'
      - 'backend/app/main.py'
      - 'backend/app/database.py'
      - 'backend/app/testing/canonical_scenario_catalog.py'
      - 'backend/app/testing/postgresql_acceptance_foundation.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/almost_out_api_projection_selftest.py'
      - 'quality/acceptance/canonical_scenario_catalog.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almost-out-api-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  almost-out-api-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_f3_almost_out_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_f3_almost_out_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_f3_almost_out_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_f3_almost_out_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      REZZERV_EMAIL_ENABLED: 'false'
      REZZERV_SESSION_COOKIE_SECURE: 'false'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'false'
      RECEIPT_STORAGE_ROOT: /tmp/rezzerv-f3-receipts/raw
      REZZERV_TEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Prepare shared PostgreSQL acceptance foundation
        uses: ./.github/actions/postgresql-acceptance-foundation
        with:
          database-name: rezzerv_f3_almost_out_ci
          bootstrap-user: rezzerv_bootstrap
          bootstrap-password: rezzerv_bootstrap_ci
          port: '55432'
          migrator-password: rezzerv_migrator_ci
          runtime-password: rezzerv_app_ci
          migration-mode: alembic
          evidence-file: almost-out-shared-postgresql-foundation.log

      - name: Compile F3-05 API authority
        run: |
          python -m py_compile \
            backend/tests/almost_out_api_projection_selftest.py \
            backend/app/main.py \
            backend/app/testing/canonical_scenario_catalog.py

      - name: Validate Almost-out projection through real PostgreSQL API
        shell: bash
        run: |
          set -euo pipefail
          python backend/tests/almost_out_api_projection_selftest.py | tee almost-out-api-projection.log
          grep -F 'PASS postgresql_dml_only_runtime' almost-out-api-projection.log
          grep -F 'PASS canonical_threshold_cases_project_through_real_api' almost-out-api-projection.log
          grep -F 'PASS locationless_inventory_projects_without_location_requirement' almost-out-api-projection.log
          grep -F 'PASS cross_household_almost_out_read_is_blocked_and_isolated' almost-out-api-projection.log
          grep -F 'PASS repeated_projection_read_is_idempotent' almost-out-api-projection.log
          grep -F 'PASS recalculation_disappears_above_threshold_and_reappears_below' almost-out-api-projection.log
          grep -F 'PASS postgresql_end_state_preserves_projection_source_and_household_isolation' almost-out-api-projection.log
          grep -F 'ALMOST_OUT_API_PROJECTION_POSTGRESQL_GREEN' almost-out-api-projection.log

      - name: Upload F3-05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almost-out-api-projection-evidence
          path: |
            almost-out-shared-postgresql-foundation.log
            almost-out-api-projection.log
          if-no-files-found: error
          retention-days: 7
