name: PR251 v01.12.97 release package

on:
  push:
    branches:
      - fix/article-detail-mutation-contracts
    paths:
      - .github/workflows/pr251-v011297-release-package.yml
  workflow_dispatch:

jobs:
  package-v011297:
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: 9a1944cc760d4d7355b48f8106f620ab0ee351ed
      EXPECTED_VERSION: Rezzerv-MVP-v01.12.97
      PACKAGE_NAME: Rezzerv-v01.12.97
    steps:
      - name: Checkout bewezen productcommit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Controleer exacte productcommit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$PRODUCT_SHA"
          echo "PACKAGE_PRODUCT_SHA_GREEN=$actual"

      - name: Controleer versieconsistentie
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION.txt)" = "$EXPECTED_VERSION"
          test "$(tr -d '\r\n' < backend/VERSION.txt)" = "$EXPECTED_VERSION"
          python - <<'PY'
          import json, os
          expected = os.environ['EXPECTED_VERSION']
          for path in ('version.json', 'frontend/version.json', 'frontend/public/version.json'):
              with open(path, encoding='utf-8') as handle:
                  assert json.load(handle)['version'] == expected, path
          with open('frontend/package.json', encoding='utf-8') as handle:
              assert json.load(handle)['version'] == '1.12.97'
          print('PACKAGE_VERSION_SYNC_GREEN')
          PY

      - name: Controleer gevraagde Artikeldetail UI-contracten
        shell: bash
        run: |
          set -euo pipefail
          node frontend/tests/article-detail-flat-subtabs.contract.mjs | tee /tmp/article-detail-flat-subtabs.log
          grep -F 'ARTICLE_DETAIL_FLAT_SUBTABS_CONTRACT_GREEN' /tmp/article-detail-flat-subtabs.log
          python backend/tests/run_article_detail_mutation_contract.py | tee /tmp/article-detail-mutation-contract.log
          grep -F 'ARTICLE_DETAIL_MEMBER_READONLY_CONTRACT_GREEN' /tmp/article-detail-mutation-contract.log
          grep -F 'ARTICLE_DETAIL_SUBTABS_CONTRACT_GREEN' /tmp/article-detail-mutation-contract.log
          grep -F 'ARTICLE_DETAIL_ROUTE_OWNERSHIP_GREEN' /tmp/article-detail-mutation-contract.log

      - name: Bouw frontend productie-output
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Bouw volledige Docker stack zonder cache
        shell: bash
        run: |
          set -euo pipefail
          REZZERV_VERSION="$EXPECTED_VERSION" docker compose build --no-cache

      - name: Start volledige Docker stack en valideer runtime
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            REZZERV_VERSION="$EXPECTED_VERSION" docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          REZZERV_VERSION="$EXPECTED_VERSION" docker compose up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8011/api/health > /tmp/health.json; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          assert payload.get('status') == 'ok', payload
          print('PACKAGE_BACKEND_HEALTH_GREEN')
          PY
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174/version.json > /tmp/frontend-version.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose ps
              docker compose logs --no-color frontend
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/frontend-version.json').read_text(encoding='utf-8'))
          assert payload.get('version') == os.environ['EXPECTED_VERSION'], payload
          print('PACKAGE_FRONTEND_VERSION_GREEN')
          PY
          cleanup
          trap - EXIT

      - name: Maak volledige zelfstandige zip
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/$PACKAGE_NAME"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          rsync -a \
            --exclude='.git/' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/dist/' \
            --exclude='backend/.venv/' \
            --exclude='**/__pycache__/' \
            ./ "$package_root/"
          (cd "$RUNNER_TEMP" && zip -qr "$PACKAGE_NAME.zip" "$PACKAGE_NAME")
          unzip -t "$RUNNER_TEMP/$PACKAGE_NAME.zip" | tail -n 2
          test -f "$package_root/VERSION.txt"
          test -f "$package_root/docker-compose.yml"
          test -f "$package_root/frontend/src/features/articles/tabs/ArticleOverviewSubtabs.jsx"
          test -f "$package_root/frontend/src/features/articles/articleDetailMutationPolicy.css"
          test -f "$package_root/backend/app/api/article_detail_admin_routes.py"
          test -f "$package_root/docs/quality/M2C2N-ROUTE-CATALOG-BASELINE.json"
          test "$(tr -d '\r\n' < "$package_root/VERSION.txt")" = "$EXPECTED_VERSION"
          echo "PACKAGE_ZIP_GREEN=$RUNNER_TEMP/$PACKAGE_NAME.zip"

      - name: Upload volledige releasezip
        uses: actions/upload-artifact@v4
        with:
          name: Rezzerv-v01.12.97
          path: ${{ runner.temp }}/Rezzerv-v01.12.97.zip
          if-no-files-found: error
          retention-days: 30
