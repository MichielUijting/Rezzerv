name: Unpacking readiness article model validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/features/stores/StoreBatchDetailPage.jsx'
      - 'backend/tests/test_unpacking_readiness_article_model_contract.py'
      - 'tools/check_unpacking_readiness_article_model.py'
      - 'docs/technical/UNPACKING-READINESS-ARTICLE-MODEL-RECOVERY.md'
      - '.github/workflows/unpacking-readiness-article-model-validation.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/features/stores/StoreBatchDetailPage.jsx'
      - 'backend/tests/test_unpacking_readiness_article_model_contract.py'
      - 'tools/check_unpacking_readiness_article_model.py'
      - 'docs/technical/UNPACKING-READINESS-ARTICLE-MODEL-RECOVERY.md'
      - '.github/workflows/unpacking-readiness-article-model-validation.yml'
  workflow_dispatch:

jobs:
  article-model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --quiet pytest
      - name: Validate source contract
        run: python tools/check_unpacking_readiness_article_model.py
      - name: Run focused regression tests
        run: python -m pytest -q backend/tests/test_unpacking_readiness_article_model_contract.py
      - name: No whitespace errors
        run: git diff --check origin/main...HEAD
