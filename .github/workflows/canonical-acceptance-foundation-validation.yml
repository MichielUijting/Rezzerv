name: Canonical acceptance foundation validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/alembic/**'
      - 'backend/app/testing/canonical_acceptance_foundation.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/app/testing/onboarding_request_schema_fixture.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/authorization_membership_service.py'
      - 'backend/app/services/household_onboarding_service.py'
      - 'backend/app/services/household_location_onboarding_service.py'
      - 'backend/app/services/password_service.py'
      - 'quality/acceptance/**'
      - 'docs/TEST_*.md'
      - '.github/workflows/canonical-acceptance-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-acceptance-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-postgresql-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_acceptance_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_acceptance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_acceptance_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_acceptance_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      REZZERV_TEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Bootstrap separate migrator and DML-only runtime roles
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_acceptance_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_acceptance_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_acceptance_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical schema through Alembic
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Generate temporary acceptance credential
        shell: bash
        run: |
          acceptance_password="Ra$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "REZZERV_ACCEPTANCE_TEST_PASSWORD=$acceptance_password" >> "$GITHUB_ENV"
          echo "::add-mask::$acceptance_password"

      - name: Compile canonical foundation
        run: |
          python -m py_compile \
            backend/app/testing/canonical_acceptance_foundation.py \
            backend/app/testing/postgresql_onboarding_selftest_fixture.py

      - name: Validate canonical PostgreSQL scenarios and evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m app.testing.canonical_acceptance_foundation | tee canonical-acceptance-foundation.log
          grep -F 'datastore=postgresql' canonical-acceptance-foundation.log
          grep -F 'runtime_create=False' canonical-acceptance-foundation.log
          grep -F 'migrator_create=True' canonical-acceptance-foundation.log
          grep -F 'scenario_count=3' canonical-acceptance-foundation.log
          grep -F 'locations_on_spaces=1' canonical-acceptance-foundation.log
          grep -F 'locations_on_sublocations=1' canonical-acceptance-foundation.log
          grep -F 'locations_off_spaces=0' canonical-acceptance-foundation.log
          grep -F 'isolation_spaces=0' canonical-acceptance-foundation.log
          grep -F 'CANONICAL_ACCEPTANCE_FOUNDATION_GREEN' canonical-acceptance-foundation.log

      - name: Prove deterministic reset and reseed
        shell: bash
        run: |
          set -euo pipefail
          python -m app.testing.canonical_acceptance_foundation | tee canonical-acceptance-foundation-rerun.log
          grep -F 'scenario_count=3' canonical-acceptance-foundation-rerun.log
          grep -F 'locations_on_spaces=1' canonical-acceptance-foundation-rerun.log
          grep -F 'locations_off_spaces=0' canonical-acceptance-foundation-rerun.log
          grep -F 'CANONICAL_ACCEPTANCE_FOUNDATION_GREEN' canonical-acceptance-foundation-rerun.log

      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-acceptance-foundation-evidence
          path: |
            canonical-acceptance-foundation.log
            canonical-acceptance-foundation-rerun.log
          if-no-files-found: error
          retention-days: 7
