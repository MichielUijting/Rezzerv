name: Server-side session security

on:
  pull_request:
    paths:
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/tests/test_server_session_*.py'
      - 'backend/tests/test_session_request_context.py'
      - 'backend/requirements.txt'
      - '.github/workflows/server-side-session-security.yml'
  workflow_dispatch:

jobs:
  server-session-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run server-side session security tests
        env:
          DATABASE_URL: sqlite:////tmp/rezzerv-server-session-tests.db
          REZZERV_SESSION_COOKIE_SECURE: 'false'
        run: |
          pytest -q \
            tests/test_server_session_service.py \
            tests/test_server_session_routes.py \
            tests/test_server_session_entrypoint.py \
            tests/test_session_request_context.py
