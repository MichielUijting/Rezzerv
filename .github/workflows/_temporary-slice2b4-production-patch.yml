name: Temporary Slice 2B4 production patch

on:
  push:
    branches:
      - feature/uitpakken-dagartikelen-release-b
    paths:
      - '.github/workflows/_temporary-slice2b4-production-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b
          fetch-depth: 0
      - name: Apply canonical production mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text=text.replace(old,new,1)

          def section(name, next_name=None):
              start=text.index(name)
              end=text.index(next_name, start) if next_name else text.index('\ndef ', start+5)
              return start,end,text[start:end]

          # Inventory row helpers expose and select canonical identity.
          start=text.index('def fetch_inventory_row(')
          end=text.index('\ndef ', start+5)
          s=text[start:end]
          if 'i.household_article_id,' not in s:
              s=s.replace('              i.household_id,\n', '              i.household_id,\n              i.household_article_id,\n', 1)
          text=text[:start]+s+text[end:]

          start=text.index('def fetch_inventory_row_by_article_and_location(')
          end=text.index('\ndef ', start+5)
          s=text[start:end]
          s=s.replace('def fetch_inventory_row_by_article_and_location(conn, *, household_id: str, article_name: str, resolved_location: dict):',
                      'def fetch_inventory_row_by_article_and_location(conn, *, household_id: str, household_article_id: str, resolved_location: dict):',1)
          if 'i.household_article_id,' not in s:
              s=s.replace('              i.household_id,\n', '              i.household_id,\n              i.household_article_id,\n',1)
          s=s.replace('AND lower(trim(i.naam)) = lower(trim(:article_name))','AND i.household_article_id = :household_article_id',1)
          s=s.replace('"article_name": article_name,','"household_article_id": str(household_article_id),',1)
          if 'lower(trim(i.naam))' in s:
              raise SystemExit('fetch_inventory_row_by_article_and_location still name-based')
          text=text[:start]+s+text[end:]

          # Strict ingress resolver: legacy name input may resolve to exactly one existing canonical ID.
          anchor='def fetch_inventory_row_by_article_and_location('
          insert_at=text.index(anchor)
          helper='''def resolve_existing_inventory_household_article_id(conn, household_id: str, article_name: str) -> str:\n    normalized_household_id = str(household_id or "").strip()\n    normalized_name = normalize_household_article_name(article_name)\n    if not normalized_household_id or not normalized_name:\n        raise HTTPException(status_code=400, detail="Huishoudartikel-id of artikelnaam ontbreekt")\n    matches = conn.execute(\n        text(\n            """\n            SELECT id\n            FROM household_articles\n            WHERE household_id = :household_id\n              AND lower(trim(COALESCE(custom_name, naam))) = lower(trim(:article_name))\n              AND COALESCE(status, 'active') = 'active'\n            ORDER BY datetime(created_at) ASC, id ASC\n            LIMIT 2\n            """\n        ),\n        {"household_id": normalized_household_id, "article_name": normalized_name},\n    ).scalars().all()\n    if not matches:\n        raise HTTPException(status_code=404, detail="Geen bestaand huishoudartikel gevonden")\n    if len(matches) > 1:\n        raise HTTPException(status_code=409, detail="Meerdere huishoudartikelen met deze naam; gebruik household_article_id")\n    return str(matches[0])\n\n\n'''
          if 'def resolve_existing_inventory_household_article_id(' not in text:
              text=text[:insert_at]+helper+text[insert_at:]

          # Manual inventory adjustment: old and new totals use canonical IDs.
          start=text.index('def apply_manual_inventory_adjustment(')
          end=text.index('\ndef ', start+5)
          s=text[start:end]
          old='    old_total = get_article_total_quantity(conn, household_id, old_article_name)\n'
          if old not in s: raise SystemExit('manual adjustment old total anchor missing')
          s=s.replace(old, '''    existing_identity = conn.execute(\n        text("SELECT household_article_id FROM inventory WHERE id = :id AND household_id = :household_id LIMIT 1"),\n        {"id": inventory_id, "household_id": str(household_id)},\n    ).scalar()\n    old_household_article_id = str(existing_identity or "").strip()\n    if not old_household_article_id:\n        old_household_article_id = resolve_existing_inventory_household_article_id(conn, household_id, old_article_name)\n        conn.execute(\n            text("UPDATE inventory SET household_article_id = :household_article_id WHERE id = :id AND household_id = :household_id"),\n            {"household_article_id": old_household_article_id, "id": inventory_id, "household_id": str(household_id)},\n        )\n    old_total = get_inventory_total_by_household_article(conn, household_id, old_household_article_id)\n''',1)
          s=s.replace('    new_total = get_article_total_quantity(conn, household_id, new_article_name)\n','    new_total = get_inventory_total_by_household_article(conn, household_id, household_article_id)\n',1)
          text=text[:start]+s+text[end:]

          # Auto-repurchase history totals use canonical ID.
          start=text.index('def create_auto_repurchase_event(')
          end=text.index('\ndef ', start+5)
          s=text[start:end]
          s=s.replace('old_total = get_article_total_quantity(conn, household_id, article_name)','old_total = get_inventory_total_by_household_article(conn, household_id, str(article_id))',1)
          text=text[:start]+s+text[end:]

          # Manual purchase route.
          start=text.index('def create_manual_purchase(')
          end=text.index('\n\n@app.', start+5)
          s=text[start:end]
          s=s.replace('        article_id = ensure_household_article(conn, household_id, payload.article_name)\n',
                      '        article_id = ensure_household_article(conn, household_id, payload.article_name)\n        old_total = get_inventory_total_by_household_article(conn, household_id, str(article_id))\n',1)
          s=s.replace('old_quantity=get_article_total_quantity(conn, household_id, payload.article_name),','old_quantity=old_total,',1)
          s=s.replace('new_quantity=get_article_total_quantity(conn, household_id, payload.article_name) + int(payload.quantity),','new_quantity=old_total + int(payload.quantity),',1)
          s=s.replace('inventory_id = apply_inventory_purchase(conn, household_id, payload.article_name, payload.quantity, resolved_location)',
                      '''inventory_id = apply_inventory_purchase_by_identity(\n            conn, household_id=household_id, household_article_id=str(article_id), quantity=payload.quantity,\n            space_id=resolved_location.get("space_id"), sublocation_id=resolved_location.get("sublocation_id"),\n        )''',1)
          text=text[:start]+s+text[end:]

          # Barcode purchase route.
          start=text.index('def create_barcode_purchase(')
          end=text.index('\n\n@app.', start+5)
          s=text[start:end]
          s=s.replace('old_total = get_article_total_quantity(conn, household_id, article_name)','old_total = get_inventory_total_by_household_article(conn, household_id, str(article_id))',1)
          s=s.replace('inventory_id = apply_inventory_purchase(conn, household_id, article_name, payload.quantity, resolved_location)',
                      '''inventory_id = apply_inventory_purchase_by_identity(\n            conn, household_id=household_id, household_article_id=str(article_id), quantity=payload.quantity,\n            space_id=resolved_location.get("space_id"), sublocation_id=resolved_location.get("sublocation_id"),\n        )''',1)
          text=text[:start]+s+text[end:]

          # Generic inventory mutation route.
          start=text.index('def mutate_inventory_event(')
          end=text.index('\n\n@app.', start+5)
          s=text[start:end]
          s=s.replace('            old_total = get_article_total_quantity(conn, household_id, article_name)\n            article_id = ensure_household_article(conn, household_id, article_name)\n',
                      '            article_id = ensure_household_article(conn, household_id, article_name)\n            old_total = get_inventory_total_by_household_article(conn, household_id, str(article_id))\n',1)
          s=s.replace('inventory_id = apply_inventory_purchase(conn, household_id, article_name, payload.quantity, resolved_location)',
                      '''inventory_id = apply_inventory_purchase_by_identity(\n                conn, household_id=household_id, household_article_id=str(article_id), quantity=payload.quantity,\n                space_id=resolved_location.get("space_id"), sublocation_id=resolved_location.get("sublocation_id"),\n            )''',1)
          s=s.replace("            article_name = normalize_household_article_name(inventory_row.get('article_name'))\n            resolved_location = build_location_payload_from_inventory_row(inventory_row)\n",
                      "            article_name = normalize_household_article_name(inventory_row.get('article_name'))\n            household_article_id = str(inventory_row.get('household_article_id') or '').strip()\n            if not household_article_id:\n                household_article_id = resolve_existing_inventory_household_article_id(conn, household_id, article_name)\n                conn.execute(text(\"UPDATE inventory SET household_article_id = :household_article_id WHERE id = :id AND household_id = :household_id\"), {'household_article_id': household_article_id, 'id': str(inventory_row['id']), 'household_id': household_id})\n                inventory_row['household_article_id'] = household_article_id\n            resolved_location = build_location_payload_from_inventory_row(inventory_row)\n",1)
          s=s.replace("            inventory_row = fetch_inventory_row_by_article_and_location(\n                conn,\n                household_id=household_id,\n                article_name=article_name,\n                resolved_location=resolved_location,\n            )\n",
                      "            household_article_id = resolve_existing_inventory_household_article_id(conn, household_id, article_name)\n            inventory_row = fetch_inventory_row_by_article_and_location(\n                conn,\n                household_id=household_id,\n                household_article_id=household_article_id,\n                resolved_location=resolved_location,\n            )\n",1)
          s=s.replace('        old_total = get_article_total_quantity(conn, household_id, article_name)','        old_total = get_inventory_total_by_household_article(conn, household_id, household_article_id)',1)
          s=s.replace('                article_id=inventory_id,','                article_id=household_article_id,',1)
          s=s.replace('            article_id=inventory_id,','            article_id=household_article_id,',1)
          text=text[:start]+s+text[end:]

          # Inventory transfer route.
          start=text.index('def transfer_inventory(')
          end=text.index('\ndef create_space(', start+5)
          s=text[start:end]
          s=s.replace("            article_name = normalize_household_article_name(source_row.get('article_name'))\n            source_location = build_location_payload_from_inventory_row(source_row)\n",
                      "            article_name = normalize_household_article_name(source_row.get('article_name'))\n            household_article_id = str(source_row.get('household_article_id') or '').strip()\n            if not household_article_id:\n                household_article_id = resolve_existing_inventory_household_article_id(conn, household_id, article_name)\n                conn.execute(text(\"UPDATE inventory SET household_article_id = :household_article_id WHERE id = :id AND household_id = :household_id\"), {'household_article_id': household_article_id, 'id': str(source_row['id']), 'household_id': household_id})\n                source_row['household_article_id'] = household_article_id\n            source_location = build_location_payload_from_inventory_row(source_row)\n",1)
          s=s.replace("            source_row = fetch_inventory_row_by_article_and_location(\n                conn,\n                household_id=household_id,\n                article_name=article_name,\n                resolved_location=source_location,\n            )\n",
                      "            household_article_id = resolve_existing_inventory_household_article_id(conn, household_id, article_name)\n            source_row = fetch_inventory_row_by_article_and_location(\n                conn,\n                household_id=household_id,\n                household_article_id=household_article_id,\n                resolved_location=source_location,\n            )\n",1)
          s=s.replace('        old_total = get_article_total_quantity(conn, household_id, article_name)','        old_total = get_inventory_total_by_household_article(conn, household_id, household_article_id)',1)
          s=s.replace('target_inventory_id = apply_inventory_purchase(conn, household_id, article_name, transfer_quantity, target_location)',
                      '''target_inventory_id = apply_inventory_purchase_by_identity(\n            conn, household_id=household_id, household_article_id=household_article_id, quantity=transfer_quantity,\n            space_id=target_location.get("space_id"), sublocation_id=target_location.get("sublocation_id"),\n        )''',1)
          s=s.replace("            article_id=str(source_row['id']),","            article_id=household_article_id,",1)
          s=s.replace("            article_id=str(target_inventory_id),","            article_id=household_article_id,",1)
          text=text[:start]+s+text[end:]

          # Remove obsolete name-total helper only when no callsites remain outside its definition.
          occurrences=text.count('get_article_total_quantity(')
          if occurrences != 1:
              raise SystemExit(f'expected only obsolete get_article_total_quantity definition, found {occurrences} occurrences')
          start=text.index('def get_article_total_quantity(')
          end=text.index('\ndef ', start+5)
          text=text[:start]+text[end+1:]

          # Core invariant: location lookup and targeted mutation routes cannot select inventory by article name.
          for fn in ['def fetch_inventory_row_by_article_and_location(', 'def mutate_inventory_event(', 'def transfer_inventory(']:
              st=text.index(fn); en=text.index('\ndef ', st+5) if fn != 'def mutate_inventory_event(' else text.index('\n\n@app.', st+5)
              sec=text[st:en]
              if 'lower(trim(i.naam))' in sec or 'get_article_total_quantity(' in sec:
                  raise SystemExit(f'name identity remains in {fn}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate production identity patch
        run: |
          python -m py_compile backend/app/main.py backend/app/services/canonical_inventory_identity_service.py
          python backend/tests/test_household_article_identity_slice2b4_inventory_contract.py
          python - <<'PY'
          from pathlib import Path
          t=Path('backend/app/main.py').read_text(encoding='utf-8')
          assert 'def get_article_total_quantity(' not in t
          assert 'get_article_total_quantity(' not in t
          assert 'AND i.household_article_id = :household_article_id' in t
          assert t.count('apply_inventory_purchase_by_identity(') >= 4
          print('SLICE2B4_PRODUCTION_MUTATIONS_CANONICAL=PASS')
          PY
          git diff --check
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git commit -m "refactor: canonicalize remaining inventory mutations slice 2B4"
          git push origin HEAD:feature/uitpakken-dagartikelen-release-b
