name: F5 PostgreSQL locationless unpacking regression

on:
  pull_request:
    paths:
      - 'backend/tests/locationless_unpacking_configuration_fixture.py'
      - 'backend/alembic/**'
      - 'backend/app/main.py'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'frontend/src/features/receipts/**'
      - 'frontend/src/pages/Voorraad.jsx'
      - 'frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'quality/regression/historical_defect_registry.json'
      - 'scripts/acceptance/validate_historical_defect_registry.py'
      - '.github/workflows/f5-postgresql-locationless-unpacking-regression.yml'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f5-locationless-unpacking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locationless-unpacking:
    name: F5-08 locationless unpacking through real browser and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Phase 5 historical defect registry
        run: python scripts/acceptance/validate_historical_defect_registry.py

      - name: Prepare deterministic F5-08 identity
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="F5-08-Locations-Off-${suffix}-Pass!"
          echo "PLAYWRIGHT_L4_04_EMAIL=f5-08-locations-off-${suffix}@example.com" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_04_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_04_HOUSEHOLD=F5-08 Locations Off ${suffix}" >> "$GITHUB_ENV"
          echo "::add-mask::$password"

      - name: Guard browser authority against core route mocks
        shell: bash
        run: |
          spec='frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js'
          if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
            echo 'F5-08 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
            exit 1
          fi
          grep -F "getByRole('columnheader', { name: 'Locatie', exact: true })).toHaveCount(0)" "$spec"
          grep -F "receipt-line-location-select-${lineId}" "$spec"
          grep -F "receipt-process-button')).toBeEnabled()" "$spec"
          echo 'F5_08_NO_CORE_ROUTE_MOCKS_GREEN'

      - name: Build and start real frontend, backend and PostgreSQL
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              docker compose logs --no-color --tail=100 backend
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Prove production-like PostgreSQL runtime boundary
        shell: bash
        run: |
          docker compose exec -T backend python -u - <<'PY' | tee f5-08-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine

          assert engine.dialect.name == 'postgresql', engine.dialect.name
          with engine.begin() as conn:
              current_user = str(conn.execute(text('SELECT current_user')).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
              alembic_head = str(conn.execute(text('SELECT version_num FROM public.alembic_version')).scalar_one())
          assert current_user == 'rezzerv_app', current_user
          assert runtime_create is False
          assert alembic_head
          print(f'runtime_user={current_user}')
          print(f'alembic_head={alembic_head}')
          print('F5_08_POSTGRESQL_BOUNDARY_GREEN')
          PY

      - name: Run locationless unpacking through the real browser UI
        shell: bash
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_04_EMAIL="$PLAYWRIGHT_L4_04_EMAIL" \
            -e PLAYWRIGHT_L4_04_PASSWORD="$PLAYWRIGHT_L4_04_PASSWORD" \
            -e PLAYWRIGHT_L4_04_HOUSEHOLD="$PLAYWRIGHT_L4_04_HOUSEHOLD" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npm ci && npx playwright test tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack --grep prepare | tee /work/f5-08-setup.log"
          household_id="$(jq -er '.householdId' frontend/p0-l4-04-setup.json)"
          docker compose exec -T -e LOCATIONLESS_TEST_HOUSEHOLD_ID="$household_id" backend \
            python -u /app/tests/locationless_unpacking_configuration_fixture.py
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_04_EMAIL="$PLAYWRIGHT_L4_04_EMAIL" \
            -e PLAYWRIGHT_L4_04_PASSWORD="$PLAYWRIGHT_L4_04_PASSWORD" \
            -e PLAYWRIGHT_L4_04_HOUSEHOLD="$PLAYWRIGHT_L4_04_HOUSEHOLD" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack --grep-invert prepare | tee /work/f5-08-browser.log"
          grep -F 'P0_L4_04_LOCATIONS_OFF_BROWSER_GREEN' frontend/f5-08-browser.log
          grep -F 'P0_L4_04_LOCATIONLESS_INVENTORY_BROWSER_GREEN' frontend/f5-08-browser.log
          test -s frontend/p0-l4-04-browser-proof.json

      - name: Capture exact browser identities
        shell: bash
        run: |
          proof='frontend/p0-l4-04-browser-proof.json'
          test "$(jq -r '.locationTrackingLevel' "$proof")" = 'none'
          for key in householdId receiptId batchId lineId inventoryId householdArticleId; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' "$proof")"
            test -n "$value" || { echo "Browser proof mist $key" >&2; exit 1; }
            case "$key" in
              householdId) echo "F5_HOUSEHOLD_ID=$value" >> "$GITHUB_ENV" ;;
              receiptId) echo "F5_RECEIPT_ID=$value" >> "$GITHUB_ENV" ;;
              batchId) echo "F5_BATCH_ID=$value" >> "$GITHUB_ENV" ;;
              lineId) echo "F5_LINE_ID=$value" >> "$GITHUB_ENV" ;;
              inventoryId) echo "F5_INVENTORY_ID=$value" >> "$GITHUB_ENV" ;;
              householdArticleId) echo "F5_HOUSEHOLD_ARTICLE_ID=$value" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Verify exact locationless unpacking PostgreSQL end state
        shell: bash
        run: |
          docker compose exec -T \
            -e F5_HOUSEHOLD_ID="$F5_HOUSEHOLD_ID" \
            -e F5_RECEIPT_ID="$F5_RECEIPT_ID" \
            -e F5_BATCH_ID="$F5_BATCH_ID" \
            -e F5_LINE_ID="$F5_LINE_ID" \
            -e F5_HOUSEHOLD_ARTICLE_ID="$F5_HOUSEHOLD_ARTICLE_ID" \
            backend python -u - <<'PY' 2>&1 | tee f5-08-postgresql-end-state.log
          import os
          from sqlalchemy import text
          from app.db import engine

          household_id = os.environ['F5_HOUSEHOLD_ID'].strip()
          receipt_id = os.environ['F5_RECEIPT_ID'].strip()
          batch_id = os.environ['F5_BATCH_ID'].strip()
          line_id = os.environ['F5_LINE_ID'].strip()
          article_id = os.environ['F5_HOUSEHOLD_ARTICLE_ID'].strip()

          with engine.begin() as conn:
              configuration = conn.execute(text('''
                  SELECT inventory_tracking_level, location_tracking_level, unpacking_enabled
                  FROM public.household_product_configuration
                  WHERE household_id = :household_id
              '''), {'household_id': household_id}).mappings().one()
              assert str(configuration['inventory_tracking_level']) == 'quantity', configuration
              assert str(configuration['location_tracking_level']) == 'none', configuration
              assert bool(configuration['unpacking_enabled']) is True, configuration

              receipt = conn.execute(text('''
                  SELECT household_id, approved_at
                  FROM public.receipt_tables
                  WHERE id = :receipt_id
              '''), {'receipt_id': receipt_id}).mappings().one()
              assert str(receipt['household_id']) == household_id, receipt
              assert receipt['approved_at'] is not None, receipt

              batch = conn.execute(text('''
                  SELECT household_id
                  FROM public.purchase_import_batches
                  WHERE id = :batch_id
              '''), {'batch_id': batch_id}).mappings().one()
              assert str(batch['household_id']) == household_id, batch

              line = conn.execute(text('''
                  SELECT processing_status, target_location_id, processed_event_id
                  FROM public.purchase_import_lines
                  WHERE id = :line_id
              '''), {'line_id': line_id}).mappings().one()
              assert str(line['processing_status']) == 'processed', line
              assert line['target_location_id'] is None, line
              assert line['processed_event_id'] is not None, line

              purchase_event = conn.execute(text('''
                  SELECT household_id, household_article_id, location_id, event_type, source
                  FROM public.inventory_events
                  WHERE id = :event_id
              '''), {'event_id': str(line['processed_event_id'])}).mappings().one()
              assert str(purchase_event['household_id']) == household_id, purchase_event
              assert str(purchase_event['household_article_id']) == article_id, purchase_event
              assert purchase_event['location_id'] is None, purchase_event
              assert str(purchase_event['event_type']) == 'purchase', purchase_event
              assert str(purchase_event['source']) == 'store_import', purchase_event

          print('location_tracking_level=none')
          print('purchase_import_line=processed_without_target_location')
          print('purchase_event_location_id=null')
          print('F5_08_LOCATIONLESS_UNPACKING_POSTGRESQL_GREEN')
          PY

      - name: Upload F5-08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-08-locationless-unpacking-evidence
          path: |
            f5-08-postgresql-boundary.log
            f5-08-postgresql-end-state.log
            frontend/f5-08-browser.log
            frontend/p0-l4-04-setup.json
            frontend/*-setup.log
            frontend/p0-l4-04-browser-proof.json
            frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: F5-08 gate marker
        run: echo 'F5_08_LOCATIONLESS_UNPACKING_GREEN'

      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=400 backend || true
          docker compose logs --no-color --tail=200 frontend || true

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
