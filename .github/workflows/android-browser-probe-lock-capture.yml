name: PR733 one-time dependency lock capture
on:
  pull_request:
    paths:
      - '.github/workflows/android-browser-probe-lock-capture.yml'
permissions:
  contents: read
jobs:
  capture:
    if: >-
      ${{ github.event.pull_request.number == 733 &&
          github.event.pull_request.head.ref == 'codex/native-retailer-browser-probe-20261125' &&
          github.event.pull_request.head.repo.full_name == 'MichielUijting/Rezzerv' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 45714427162
          name: inhuis-browserprobe-b00547890fd4aae83fe3b8c911e6225dd73475a8
          path: .lock-artifact
          github-token: ${{ github.token }}
      - name: Validate artifact provenance, lock and pinned versions
        shell: bash
        run: |
          set -euo pipefail
          echo "e842269020d0a1aa48fe52353bf04d5ae6c3ed8890c8601ea2446292ca67a1e1  .lock-artifact/package-lock.json" | sha256sum -c -
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('packaging/mobile-browser-probe/package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('.lock-artifact/package-lock.json','utf8'));
          assert.equal(lock.lockfileVersion,3);
          assert.deepEqual(lock.packages[''].dependencies,p.dependencies);
          assert.deepEqual(lock.packages[''].devDependencies,p.devDependencies);
          assert.ok(Object.keys(lock.packages).length > 100);
          for (const [name,version] of Object.entries({...p.dependencies,...p.devDependencies})) {
            assert.equal(lock.packages['node_modules/'+name]?.version,version);
          }
          for (const [name,entry] of Object.entries(lock.packages)) {
            if (name) assert.ok(entry.integrity?.startsWith('sha512-') || entry.integrity?.startsWith('sha1-'),name);
          }
          JS
          test ! -f packaging/mobile-browser-probe/package-lock.json
          cp .lock-artifact/package-lock.json packaging/mobile-browser-probe/package-lock.json
      - name: Commit only reviewed package-lock to designated Draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packaging/mobile-browser-probe/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Pin audited Android browser probe dependency graph"
          git push origin HEAD:refs/heads/codex/native-retailer-browser-probe-20261125
