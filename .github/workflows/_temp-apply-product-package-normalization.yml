name: TEMP apply product package normalization

on:
  push:
    branches:
      - feature/generic-product-package-normalization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-product-package-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply generic normalization release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          main_path = root / 'backend/app/main.py'
          gateway_path = root / 'backend/app/receipt_ingestion/product_candidate_gateway.py'
          structured_path = root / 'backend/app/receipt_ingestion/structured_product_gateway.py'
          package_path = root / 'backend/app/receipt_ingestion/package_label_extraction.py'

          main = main_path.read_text(encoding='utf-8')
          gateway = gateway_path.read_text(encoding='utf-8')
          structured = structured_path.read_text(encoding='utf-8')
          package = package_path.read_text(encoding='utf-8')

          # 1. Package extraction: quantity is purchase quantity; package content is separate metadata.
          old = """    if quantity not in (None, ''):\n        return package['article_label'], quantity, existing_unit, package\n    if existing_unit:\n        return package['article_label'], quantity, existing_unit, package\n    return package['article_label'], package['package_quantity'], package['package_unit'], package\n"""
          new = """    if quantity not in (None, ''):\n        return package['article_label'], quantity, existing_unit, package\n    if existing_unit:\n        return package['article_label'], quantity, existing_unit, package\n    # A package label describes the content of one purchased sales unit. Do not\n    # overload purchase quantity with 500 g / 1 l / 250 ml.\n    return package['article_label'], 1, 'stuk', package\n"""
          if old not in package:
              raise SystemExit('package extraction target not found')
          package = package.replace(old, new, 1)
          package_path.write_text(package, encoding='utf-8')

          # 2. Candidate gateways expose the structured package fields.
          candidate_anchor = """        'quantity': amount_to_float(quantity),\n        'unit': unit_value,\n        'unit_price': amount_to_float(unit_price),\n"""
          candidate_repl = """        'quantity': amount_to_float(quantity),\n        'unit': unit_value,\n        'package_count': amount_to_float((package_metadata or {}).get('package_count')),\n        'content_value': amount_to_float((package_metadata or {}).get('package_quantity')),\n        'content_unit': (package_metadata or {}).get('package_unit'),\n        'unit_price': amount_to_float(unit_price),\n"""
          if candidate_anchor not in gateway:
              raise SystemExit('product gateway candidate anchor not found')
          gateway = gateway.replace(candidate_anchor, candidate_repl, 1)
          gateway_path.write_text(gateway, encoding='utf-8')

          # Structured gateway: preserve source label and publish package composition.
          structured_anchor = """    label_value = clean_label(label)\n    label_value, encoding_metadata = normalize_receipt_text_encoding(label_value)\n"""
          structured_repl = """    label_value = clean_label(label)\n    label_value, encoding_metadata = normalize_receipt_text_encoding(label_value)\n    raw_label_value = label_value\n"""
          if structured_anchor not in structured:
              raise SystemExit('structured raw label anchor not found')
          structured = structured.replace(structured_anchor, structured_repl, 1)
          structured = structured.replace("""            'raw_label': label_value,\n            'normalized_label': label_value,\n            'quantity': amount_to_float(quantity),\n            'unit': unit,\n""", """            'raw_label': raw_label_value,\n            'normalized_label': label_value,\n            'quantity': amount_to_float(quantity),\n            'unit': unit,\n            'package_count': amount_to_float((package_metadata or {}).get('package_count')),\n            'content_value': amount_to_float((package_metadata or {}).get('package_quantity')),\n            'content_unit': (package_metadata or {}).get('package_unit'),\n""", 1)
          structured = structured.replace("""            'package_text': package_metadata.get('package_text'),\n            'package_quantity': package_metadata.get('package_quantity'),\n            'package_unit': package_metadata.get('package_unit'),\n""", """            'package_text': package_metadata.get('package_text'),\n            'package_count': package_metadata.get('package_count'),\n            'package_quantity': package_metadata.get('package_quantity'),\n            'package_unit': package_metadata.get('package_unit'),\n""", 1)
          structured_path.write_text(structured, encoding='utf-8')

          # 3. Main imports the existing package extractor for legacy/lazy backfill.
          import_anchor = "from app.receipt_ingestion.receipt_line_semantics import derive_receipt_line_semantics\n"
          import_line = "from app.receipt_ingestion.package_label_extraction import extract_package_from_label\n"
          if import_line not in main:
              if import_anchor not in main:
                  raise SystemExit('main import anchor not found')
              main = main.replace(import_anchor, import_anchor + import_line, 1)

          # 4. Extend the existing central receipt-line schema authority.
          schema_anchor = """            'line_role': 'TEXT',\n            'inventory_eligible': 'INTEGER',\n"""
          schema_repl = """            'line_role': 'TEXT',\n            'inventory_eligible': 'INTEGER',\n            'package_count': 'NUMERIC(12,3)',\n            'content_value': 'NUMERIC(12,3)',\n            'content_unit': 'TEXT',\n"""
          if schema_anchor not in main:
              raise SystemExit('central line additions anchor not found')
          main = main.replace(schema_anchor, schema_repl, 1)

          # Insert purchase-import schema additions into the same ensure function immediately after receipt line additions.
          loop_re = re.compile(r"(\n\s*for column_name, column_type in line_additions\.items\(\):\n\s+if column_name not in line_columns:\n\s+conn\.execute\(text\(f\"ALTER TABLE receipt_table_lines ADD COLUMN \{column_name\} \{column_type\}\"\)\)\n)")
          m = loop_re.search(main)
          if not m:
              raise SystemExit('central receipt line additions loop not found')
          purchase_schema = """\n        purchase_line_columns = {row['name'] for row in conn.execute(text('PRAGMA table_info(purchase_import_lines)')).mappings().all()}\n        purchase_line_additions = {\n            'package_count': 'NUMERIC(12,3)',\n            'content_value': 'NUMERIC(12,3)',\n            'content_unit': 'TEXT',\n        }\n        for column_name, column_type in purchase_line_additions.items():\n            if column_name not in purchase_line_columns:\n                conn.execute(text(f\"ALTER TABLE purchase_import_lines ADD COLUMN {column_name} {column_type}\"))\n"""
          if 'purchase_line_additions' not in main:
              main = main[:m.end()] + purchase_schema + main[m.end():]

          # 5. Kassa -> Uitpakken: select authoritative normalized name and package fields.
          select_anchor = """        SELECT id, line_index, logical_line_key,\n               COALESCE(corrected_raw_label, raw_label) AS raw_label,\n               normalized_label,\n               COALESCE(corrected_quantity, quantity) AS quantity,\n"""
          select_repl = """        SELECT id, line_index, logical_line_key,\n               COALESCE(corrected_raw_label, raw_label) AS raw_label,\n               COALESCE(corrected_raw_label, normalized_label, raw_label) AS article_name,\n               normalized_label,\n               package_count, content_value, content_unit,\n               COALESCE(corrected_quantity, quantity) AS quantity,\n"""
          if select_anchor not in main:
              raise SystemExit('sync select anchor not found')
          main = main.replace(select_anchor, select_repl, 1)

          # Add package backfill and use article_name instead of raw label.
          raw_anchor = """        raw_label = str(line.get('raw_label') or '').strip()\n        if not raw_label:\n            continue\n"""
          raw_repl = """        raw_label = str(line.get('raw_label') or '').strip()\n        article_name = str(line.get('article_name') or line.get('normalized_label') or raw_label).strip()\n        if not raw_label or not article_name:\n            continue\n\n        package_count = line.get('package_count')\n        content_value = line.get('content_value')\n        content_unit = line.get('content_unit')\n        if package_count is None or content_value is None or not content_unit:\n            package = extract_package_from_label(raw_label)\n            if package:\n                package_count = package.get('package_count')\n                content_value = package.get('package_quantity')\n                content_unit = package.get('package_unit')\n                conn.execute(\n                    text(\"UPDATE receipt_table_lines SET package_count = :package_count, content_value = :content_value, content_unit = :content_unit, updated_at = CURRENT_TIMESTAMP WHERE id = :id\"),\n                    {\n                        'id': line.get('id'),\n                        'package_count': package_count,\n                        'content_value': content_value,\n                        'content_unit': content_unit,\n                    },\n                )\n"""
          if raw_anchor not in main:
              raise SystemExit('sync raw label anchor not found')
          main = main.replace(raw_anchor, raw_repl, 1)

          # Existing and new purchase-import rows: use normalized name and persist package composition.
          main = main.replace("'article_name_raw': raw_label,", "'article_name_raw': article_name,", 2)

          update_cols = """                    quantity_raw = :quantity_raw,\n                    unit_raw = :unit_raw,\n                    line_price_raw = :line_price_raw,\n"""
          update_cols_repl = """                    quantity_raw = :quantity_raw,\n                    unit_raw = :unit_raw,\n                    package_count = :package_count,\n                    content_value = :content_value,\n                    content_unit = :content_unit,\n                    line_price_raw = :line_price_raw,\n"""
          if update_cols not in main:
              raise SystemExit('purchase import update columns anchor not found')
          main = main.replace(update_cols, update_cols_repl, 1)

          insert_cols = """                id, batch_id, external_line_ref, external_article_code, article_name_raw,\n                brand_raw, quantity_raw, unit_raw, line_price_raw, currency_code,\n"""
          insert_cols_repl = """                id, batch_id, external_line_ref, external_article_code, article_name_raw,\n                brand_raw, quantity_raw, unit_raw, package_count, content_value, content_unit, line_price_raw, currency_code,\n"""
          if insert_cols not in main:
              raise SystemExit('purchase import insert columns anchor not found')
          main = main.replace(insert_cols, insert_cols_repl, 1)

          insert_values = """                :id, :batch_id, :external_line_ref, :external_article_code, :article_name_raw,\n                :brand_raw, :quantity_raw, :unit_raw, :line_price_raw, :currency_code,\n"""
          insert_values_repl = """                :id, :batch_id, :external_line_ref, :external_article_code, :article_name_raw,\n                :brand_raw, :quantity_raw, :unit_raw, :package_count, :content_value, :content_unit, :line_price_raw, :currency_code,\n"""
          if insert_values not in main:
              raise SystemExit('purchase import insert values anchor not found')
          main = main.replace(insert_values, insert_values_repl, 1)

          # Add values to both existing-line update params and new-line insert params directly after unit_raw.
          param_anchor = """                    'quantity_raw': quantity_value,\n                    'unit_raw': line.get('unit') or '',\n                    'line_price_raw': line_price_value,\n"""
          param_repl = """                    'quantity_raw': quantity_value,\n                    'unit_raw': line.get('unit') or '',\n                    'package_count': package_count,\n                    'content_value': content_value,\n                    'content_unit': content_unit,\n                    'line_price_raw': line_price_value,\n"""
          if param_anchor not in main:
              raise SystemExit('purchase import existing params anchor not found')
          main = main.replace(param_anchor, param_repl, 1)

          new_param_anchor = """                'quantity_raw': quantity_value,\n                'unit_raw': line.get('unit') or '',\n                'line_price_raw': line_price_value,\n"""
          new_param_repl = """                'quantity_raw': quantity_value,\n                'unit_raw': line.get('unit') or '',\n                'package_count': package_count,\n                'content_value': content_value,\n                'content_unit': content_unit,\n                'line_price_raw': line_price_value,\n"""
          if new_param_anchor not in main:
              raise SystemExit('purchase import new params anchor not found')
          main = main.replace(new_param_anchor, new_param_repl, 1)

          main_path.write_text(main, encoding='utf-8')

          # 6. Permanent regression tests: positive/negative parsing plus wiring contract.
          test_path = root / 'backend/tests/test_product_package_normalization_contract.py'
          test_path.write_text('''from pathlib import Path\n\nfrom app.receipt_ingestion.package_label_extraction import (\n    apply_package_extraction_to_candidate,\n    extract_package_from_label,\n)\nfrom app.receipt_ingestion.product_name_normalization import normalize_product_name_label\n\n\ndef test_single_package_becomes_one_purchased_unit_with_content():\n    label, quantity, unit, metadata = apply_package_extraction_to_candidate('Lasagnebladen 500g')\n    assert label == 'Lasagnebladen'\n    assert quantity == 1\n    assert unit == 'stuk'\n    assert metadata['package_count'] == 1\n    assert metadata['package_quantity'] == 500\n    assert metadata['package_unit'] == 'g'\n\n\ndef test_purchase_count_is_not_overwritten_by_package_content():\n    label, quantity, metadata = normalize_product_name_label('2 x Volkoren pasta 500g')\n    assert label == 'Volkoren pasta 500g'\n    assert quantity == 2\n    label, quantity, unit, package = apply_package_extraction_to_candidate(label, quantity=quantity)\n    assert label == 'Volkoren pasta'\n    assert quantity == 2\n    assert unit is None\n    assert package['package_quantity'] == 500\n    assert package['package_unit'] == 'g'\n\n\ndef test_multipack_is_structured_without_leaking_into_name():\n    result = extract_package_from_label('Coca-Cola zero 4 x 1,5 liter')\n    assert result['article_label'] == 'Coca-Cola zero'\n    assert result['package_count'] == 4\n    assert result['package_quantity'] == 1.5\n    assert result['package_unit'] == 'l'\n\n\ndef test_variant_percent_and_technical_specs_are_not_package_content():\n    assert extract_package_from_label('Creme fraiche 30%') is None\n    assert extract_package_from_label('Goudse kaas 48+') is None\n    assert extract_package_from_label('Powerbank 10000 mAh') is None\n    assert extract_package_from_label('Schuurpapier K150') is None\n    assert extract_package_from_label('Paneel 280x28x1,8 cm') is None\n\n\ndef test_kassa_to_unpack_uses_normalized_name_and_persists_package_fields():\n    source = Path('backend/app/main.py').read_text(encoding='utf-8')\n    assert 'COALESCE(corrected_raw_label, normalized_label, raw_label) AS article_name' in source\n    assert "'article_name_raw': article_name" in source\n    assert "'package_count': package_count" in source\n    assert "'content_value': content_value" in source\n    assert "'content_unit': content_unit" in source\n    assert "'package_count': 'NUMERIC(12,3)'" in source\n    assert 'purchase_line_additions' in source\n''', encoding='utf-8')
          PY

          python -m compileall -q backend/app/receipt_ingestion backend/app/main.py backend/tests/test_product_package_normalization_contract.py
          python -m pip install -q pytest sqlalchemy fastapi pydantic
          PYTHONPATH=backend python -m pytest -q backend/tests/test_product_package_normalization_contract.py backend/tests/test_receipt_inventory_eligibility.py
          git diff --check

          # Temporary applicator must not survive in final diff.
          git rm .github/workflows/_temp-apply-product-package-normalization.yml
          git config user.name "Rezzerv Agent"
          git config user.email "rezzerv-agent@users.noreply.github.com"
          git add backend/app/main.py backend/app/receipt_ingestion/package_label_extraction.py backend/app/receipt_ingestion/product_candidate_gateway.py backend/app/receipt_ingestion/structured_product_gateway.py backend/tests/test_product_package_normalization_contract.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(receipts): normalize product names and package composition"
          git push origin HEAD:feature/generic-product-package-normalization
