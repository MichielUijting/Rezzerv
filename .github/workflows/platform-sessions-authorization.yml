name: Platform Sessions authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/platform_sessions_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/platform_session_management_service.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/tests/test_platform_sessions_route_authorization.py'
      - 'backend/tests/server_session_security_selftest.py'
      - 'frontend/src/features/platform/PlatformSessionsPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-sessions.frontend-regression.spec.js'
      - 'frontend/package.json'
      - '.github/workflows/platform-sessions-authorization.yml'

jobs:
  platform-sessions-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_platform_sessions_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_platform_sessions_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_platform_sessions_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_platform_sessions_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client, backend and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_platform_sessions_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_platform_sessions_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_platform_sessions_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Assert runtime role is DML-only
        working-directory: .
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_platform_sessions_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'PLATFORM_SESSIONS_RUNTIME_DML_ONLY_GREEN'

      - name: Compile platform Sessions boundary and tests
        run: |
          PYTHONPATH=. python -m py_compile \
            app/api/platform_sessions_routes.py \
            app/api/router.py \
            app/services/platform_session_management_service.py \
            tests/test_platform_sessions_route_authorization.py

      - name: Run platform Sessions authorization tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_platform_sessions_route_authorization.py

      - name: Run existing server-side session security selftest
        env:
          PYTHONPATH: .
          REZZERV_SESSION_COOKIE_SECURE: 'false'
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python tests/server_session_security_selftest.py
