name: Frontend cookie session authority

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cookie-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-cookie-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/server-side-session-foundation
          fetch-depth: 0
      - name: Migrate remaining Kassa auth transport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/features/receipts/KassaPage.jsx')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r"^\s*const token = localStorage\.getItem\('rezzerv_token'\)(?: \|\| '')?\s*\n", '', text, flags=re.MULTILINE)
          text = re.sub(r"^(\s*)headers: token \? \{ Authorization: `Bearer \$\{token\}` \} : \{\},\s*$", r"\1credentials: 'include',", text, flags=re.MULTILINE)
          text = re.sub(r"const household = await fetchJson\('/api/household', \{\s*credentials: 'include',\s*\}\)", "const household = await fetchJson('/api/household')", text)
          remaining = [term for term in ('rezzerv_token', 'Authorization', 'Bearer ') if term in text]
          if remaining:
              raise SystemExit(f'Legacy auth remains in KassaPage.jsx: {remaining}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit focused migration
        shell: bash
        run: |
          git config user.name 'rezzerv-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/receipts/KassaPage.jsx
          git commit -m 'Use cookie session in Kassa screen'
          git push origin HEAD:agent/server-side-session-foundation
