name: Frontend cookie session authority

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '!frontend/version.json'
      - '!frontend/public/version.json'
      - '!frontend/package.json'
      - '.github/workflows/frontend-cookie-session.yml'
  workflow_dispatch:

concurrency:
  group: frontend-cookie-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-cookie-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit cookie-only frontend session authority
        run: python frontend/tests/frontend_cookie_session_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
