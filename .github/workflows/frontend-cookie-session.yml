name: Frontend cookie session authority

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cookie-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-cookie-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/server-side-session-foundation
          fetch-depth: 0
      - name: Remove duplicate cookie option
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/receipts/KassaPage.jsx')
          text = path.read_text(encoding='utf-8')
          old = "        credentials: 'include',\n        credentials: 'include',\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one duplicate credentials block, found {text.count(old)}')
          path.write_text(text.replace(old, "        credentials: 'include',\n"), encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'rezzerv-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/features/receipts/KassaPage.jsx
          git commit -m 'Remove duplicate Kassa cookie option'
          git push origin HEAD:agent/server-side-session-foundation
