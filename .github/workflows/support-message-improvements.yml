name: Support message improvements

on:
  pull_request:
    paths:
      - 'backend/app/api/support_message_routes.py'
      - 'frontend/src/features/support/**'
      - 'frontend/tests/support_message_improvements_audit.py'
      - '.github/workflows/support-message-improvements.yml'
  workflow_dispatch:

jobs:
  support-message-improvements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit notification improvements
        run: python frontend/tests/support_message_improvements_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
