name: GPC NL import platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/product_inventory_group_routes.py'
      - 'backend/tests/test_gpc_nl_import_platform_authorization.py'
      - 'backend/tests/test_technical_schema_platform_route_authorization.py'
      - '.github/workflows/gpc-nl-import-platform-authorization.yml'

jobs:
  gpc-nl-import-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile GPC NL authorization boundary and tests
        run: |
          python -m py_compile \
            app/api/product_inventory_group_routes.py \
            tests/test_gpc_nl_import_platform_authorization.py \
            tests/test_technical_schema_platform_route_authorization.py

      - name: Run GPC NL permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_gpc_nl_import_platform_authorization.py \
            tests/test_technical_schema_platform_route_authorization.py
