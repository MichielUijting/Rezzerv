name: External recognition confirmation validation

on:
  pull_request:
    paths:
      - 'backend/app/services/external_recognition_confirmation.py'
      - 'backend/app/services/external_database_matchflow_evidence.py'
      - 'backend/app/api/system_routes.py'
      - 'backend/tests/test_external_recognition_confirmation.py'
      - 'frontend/src/features/externalDatabases/RecognitionConfirmationDetail.jsx'
      - 'frontend/src/features/externalDatabases/ReceiptItemsOverview.jsx'
      - 'frontend/tests/e2e/external-recognition-confirmation.frontend-regression.spec.js'
      - 'frontend/tests/e2e/auth.setup.js'
      - 'frontend/tests/e2e/helpers/**'
      - 'frontend/playwright.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
      - '.github/workflows/external-recognition-confirmation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-recognition-confirmation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recognition-contract:
    name: Recognition backend and Playwright contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174
      PLAYWRIGHT_API_URL: http://host.docker.internal:8011
      PLAYWRIGHT_TEST_ADMIN_EMAIL: test-admin@rezzerv.local
      PLAYWRIGHT_HOUSEHOLD_ID: '0'
      REZZERV_TEST_SUPERUSER_EMAIL: supergebruiker@rezzerv.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate temporary test credentials
        shell: bash
        run: |
          admin_password="Rt$(python - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          )"
          superuser_password="Rs$(python - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          )"
          echo "PLAYWRIGHT_TEST_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "REZZERV_TEST_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "REZZERV_TEST_ADMIN_EMAIL=test-admin@rezzerv.local" >> "$GITHUB_ENV"
          echo "REZZERV_TEST_SUPERUSER_PASSWORD=$superuser_password" >> "$GITHUB_ENV"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$superuser_password"

      - name: Build and start Rezzerv
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              docker compose logs --no-color --tail=80 backend
            fi
            sleep 2
          done
          echo "Backend werd niet gezond binnen 360 seconden."
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Validate recognition backend contract
        run: |
          docker compose exec -T \
            -e PYTHONPATH=/app \
            backend python /app/tests/test_external_recognition_confirmation.py

      - name: Validate confirmation API registration
        shell: bash
        run: |
          curl --fail --silent http://localhost:8011/openapi.json | python -c "import json,sys; data=json.load(sys.stdin); path='/api/external-databases/candidates/confirm-external'; assert path in data.get('paths', {}), f'{path} ontbreekt'; print('EXTERNAL_RECOGNITION_CONFIRMATION_ROUTE_GREEN')"

      - name: Provision temporary system superuser
        shell: bash
        run: |
          docker compose exec -T \
            -e REZZERV_SUPERGEBRUIKER_PASSWORD="$REZZERV_TEST_SUPERUSER_PASSWORD" \
            -e REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO='1' \
            backend python - <<'PY'
          from app.db import engine
          from app.services.system_superuser_session_provisioning import ensure_system_superuser_for_session_runtime

          with engine.begin() as conn:
              result = ensure_system_superuser_for_session_runtime(conn)

          print(
              "system_superuser_fixture: PASS; "
              f"email={result.email}; household={result.household_id}; "
              f"membership={result.membership_id}"
          )
          PY

      - name: Provision and validate temporary test admin
        run: |
          docker compose exec -T \
            -e REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO='1' \
            -e REZZERV_TEST_SUPERUSER_EMAIL="$REZZERV_TEST_SUPERUSER_EMAIL" \
            -e REZZERV_TEST_SUPERUSER_PASSWORD="$REZZERV_TEST_SUPERUSER_PASSWORD" \
            -e REZZERV_TEST_ADMIN_EMAIL="$REZZERV_TEST_ADMIN_EMAIL" \
            -e REZZERV_TEST_ADMIN_PASSWORD="$REZZERV_TEST_ADMIN_PASSWORD" \
            backend python /app/tests/authorization_role_matrix_selftest.py

      - name: Run targeted recognition Playwright test
        shell: bash
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_API_URL="$PLAYWRIGHT_API_URL" \
            -e PLAYWRIGHT_TEST_ADMIN_EMAIL="$PLAYWRIGHT_TEST_ADMIN_EMAIL" \
            -e PLAYWRIGHT_TEST_ADMIN_PASSWORD="$PLAYWRIGHT_TEST_ADMIN_PASSWORD" \
            -e PLAYWRIGHT_HOUSEHOLD_ID="$PLAYWRIGHT_HOUSEHOLD_ID" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "npm ci && ./node_modules/.bin/playwright test tests/e2e/external-recognition-confirmation.frontend-regression.spec.js"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-recognition-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color backend frontend

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
