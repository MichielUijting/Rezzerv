name: Temporary Slice 2B4 audit

on:
  push:
    branches:
      - feature/uitpakken-dagartikelen-release-b
    paths:
      - '.github/workflows/_temporary-slice2b4-audit.yml'

permissions:
  contents: read

jobs:
  audit-slice2b4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b
      - name: Audit identity-sensitive inventory code
        run: |
          echo '=== get_article_total_quantity callsites ==='
          rg -n -C 3 'get_article_total_quantity\(' backend/app/main.py || true
          echo '=== name-based inventory predicates ==='
          rg -n -C 3 '(inventory.*naam|lower\(trim\(naam\)\)|AND naam = :naam|i\.naam =|naam = :naam)' backend/app/main.py || true
          echo '=== inventory event article-name predicates ==='
          rg -n -C 3 '(inventory_events.*article_name|article_name\)\) =|lower\(trim\(article_name\)\))' backend/app/main.py || true
