name: Temporary Slice 2B4 audit

on:
  push:
    branches:
      - feature/uitpakken-dagartikelen-release-b
    paths:
      - '.github/workflows/_temporary-slice2b4-audit.yml'

permissions:
  contents: read

jobs:
  audit-slice2b4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b
      - name: Audit identity-sensitive inventory code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/main.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          patterns = {
              'get_article_total_quantity': re.compile(r'get_article_total_quantity\('),
              'name_based_inventory': re.compile(r'lower\(trim\(naam\)\)|AND naam = :naam|i\.naam\s*=|naam\s*=\s*:naam'),
              'name_based_history': re.compile(r'lower\(trim\(article_name\)\)|inventory_events[^\n]*article_name'),
          }
          for label, pattern in patterns.items():
              print(f'=== {label} ===')
              hits = 0
              for idx, line in enumerate(lines, start=1):
                  if not pattern.search(line):
                      continue
                  hits += 1
                  lo = max(1, idx - 3)
                  hi = min(len(lines), idx + 3)
                  print(f'--- hit {hits} at line {idx} ---')
                  for n in range(lo, hi + 1):
                      print(f'{n}: {lines[n-1]}')
              print(f'TOTAL {label}={hits}')
          PY
