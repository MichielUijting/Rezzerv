name: F3-03 install production object guard patch

on:
  push:
    branches:
      - codex/integral-test-foundation-phase-0
    paths:
      - '.github/workflows/f3-03-install-object-guard-patch.yml'

permissions:
  contents: write

jobs:
  patch-f3-03-object-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/integral-test-foundation-phase-0
          fetch-depth: 0

      - name: Install Uitpakken household object guard in production app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = 'import mimetypes\n'
          if source.count(import_anchor) != 1:
              raise SystemExit(f'Expected one mimetypes import anchor, found {source.count(import_anchor)}')
          source = source.replace(import_anchor, import_anchor + 'import sys\n', 1)

          service_anchor = 'from app.services.article_group_store import ensure_article_group_schema\n'
          service_import = 'from app.services.unpacking_household_object_guard import install_unpacking_household_object_guard\n'
          if service_import in source:
              raise SystemExit('Object guard import already present')
          if source.count(service_anchor) != 1:
              raise SystemExit(f'Expected one article-group import anchor, found {source.count(service_anchor)}')
          source = source.replace(service_anchor, service_anchor + service_import, 1)

          app_anchor = 'app = FastAPI()\n# Runtime schema validation is centralized; Alembic remains exclusive schema authority.\n'
          app_replacement = (
              'app = FastAPI()\n'
              'install_unpacking_household_object_guard(sys.modules[__name__])\n'
              '# Runtime schema validation is centralized; Alembic remains exclusive schema authority.\n'
          )
          if source.count(app_anchor) != 1:
              raise SystemExit(f'Expected one FastAPI app anchor, found {source.count(app_anchor)}')
          source = source.replace(app_anchor, app_replacement, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify and commit production guard installation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/app/main.py backend/app/services/unpacking_household_object_guard.py
          git config user.name 'rezzerv-ci'
          git config user.email 'rezzerv-ci@users.noreply.github.com'
          git add backend/app/main.py
          git diff --cached --check
          git diff --cached -- backend/app/main.py
          git commit -m 'Install Uitpakken household object guard in production app'
          git push origin HEAD:codex/integral-test-foundation-phase-0
