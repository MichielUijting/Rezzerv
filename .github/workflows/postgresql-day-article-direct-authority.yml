name: PostgreSQL day article Direct authority

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/20260829_12_day_article_direct_authority.py'
      - 'backend/app/services/day_article_service.py'
      - 'backend/tests/postgresql_day_article_direct_sql_authority_selftest.py'
      - 'backend/tests/postgresql_day_article_direct_dml_only_selftest.py'
      - '.github/workflows/postgresql-day-article-direct-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  day-article-direct-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://rezzerv_app:runtime-pass@127.0.0.1:5432/rezzerv
      MIGRATION_DATABASE_URL: postgresql://rezzerv_migrator:migration-pass@127.0.0.1:5432/rezzerv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure migration and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d rezzerv -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'migration-pass';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'runtime-pass';
          GRANT CONNECT ON DATABASE rezzerv TO rezzerv_migrator, rezzerv_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rezzerv_migrator;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Prove day article Direct runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_day_article_direct_sql_authority_selftest.py | tee /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_SQL_PORTABLE_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_RUNTIME_DDL_ABSENT_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_ALEMBIC_AUTHORITY_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/day-article-direct-static.log

      - name: Migrate through day article Direct authority revision
        working-directory: backend
        run: |
          python -m app.schema_migration_preflight | tee /tmp/day-article-direct-migration.log
          grep -F "'dialect': 'postgresql'" /tmp/day-article-direct-migration.log
          grep -F "'revision': '20260829_12'" /tmp/day-article-direct-migration.log

      - name: Prove day article Direct paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_day_article_direct_dml_only_selftest.py | tee /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_RUNTIME_CREATE_DENIED_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_CONSUMPTION_DML_ONLY_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_BOOLEAN_TIMESTAMP_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_DML_ONLY_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_AUTHORITY_SELFTEST_GREEN' /tmp/day-article-direct-dml-only.log
