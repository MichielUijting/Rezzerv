name: Temp apply article detail partial PATCH

on:
  push:
    branches:
      - fix/article-detail-mutation-contracts
    paths:
      - '.github/workflows/_temp-apply-article-detail-partial-patch.yml'

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/article-detail-mutation-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused backend PATCH semantics repair
        run: python tools/_temp_patch_article_detail_partial.py
      - name: Compile backend after focused patch
        run: python -m py_compile backend/app/main.py
      - name: Whitespace check
        run: git diff --check
      - name: Commit product code
        run: |
          if git diff --quiet -- backend/app/main.py; then
            echo 'No backend product-code change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'fix: preserve omitted article detail PATCH fields'
          git push origin HEAD:fix/article-detail-mutation-contracts

# retry after compile-safe patcher correction
