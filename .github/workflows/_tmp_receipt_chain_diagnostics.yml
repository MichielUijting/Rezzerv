name: Temporary receipt chain diagnostics

on:
  push:
    branches:
      - codex/postgresql-inventory-temporal-authority-cutover

permissions:
  contents: read

jobs:
  diagnose-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-chain dependencies
        run: |
          python -m pip install --quiet \
            fastapi==0.115.0 \
            sqlalchemy==2.0.36 \
            alembic==1.19.1 \
            pydantic==2.12.5 \
            python-multipart==0.0.20 \
            pypdf==5.4.0 \
            Pillow \
            beautifulsoup4==4.12.3 \
            opencv-python-headless
      - name: Expose batch rollback before consume assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/testing/receipt_inventory_production_chain.py')
          source = path.read_text(encoding='utf-8')
          needle = '        _apply_consume_event(main, ids, quantity_before=5, quantity_after=1)'
          diagnostic = "        with main.engine.begin() as conn:\n            diagnostic_lines = conn.execute(text(\"SELECT pil.id, pil.processing_status, pil.processing_error, pil.matched_household_article_id, pil.quantity_raw, pib.id AS batch_id, pib.import_status FROM purchase_import_lines pil JOIN purchase_import_batches pib ON pib.id = pil.batch_id WHERE pil.id IN ('chain-line-1', 'chain-line-2') ORDER BY pil.id\")).mappings().all()\n            diagnostic_events = conn.execute(text(\"SELECT id, event_type, source, effective_at, recorded_at, effective_at_precision, event_priority, source_reference, source_line_id FROM inventory_events WHERE household_id = '0' ORDER BY created_at, id\")).mappings().all()\n            diagnostic_inventory = conn.execute(text(\"SELECT id, household_article_id, aantal, space_id, sublocation_id, status FROM inventory WHERE household_id = '0' ORDER BY id\")).mappings().all()\n        print('CHAIN_DIAGNOSTIC_FIRST', first)\n        print('CHAIN_DIAGNOSTIC_SECOND', second)\n        print('CHAIN_DIAGNOSTIC_REPEAT', repeated)\n        print('CHAIN_DIAGNOSTIC_LINES', [dict(row) for row in diagnostic_lines])\n        print('CHAIN_DIAGNOSTIC_EVENTS', [dict(row) for row in diagnostic_events])\n        print('CHAIN_DIAGNOSTIC_INVENTORY', [dict(row) for row in diagnostic_inventory])\n        print('CHAIN_DIAGNOSTIC_COUNTS', quantity_after_first, quantity_after_second, quantity_after_repeat, event_count_after_second, event_count_after_repeat)\n        assert first['processed_count'] == 1, f'first import failed: {first!r}; lines={diagnostic_lines!r}'\n        assert quantity_after_first == 2, f'first inventory mismatch: {quantity_after_first}; lines={diagnostic_lines!r}'\n        assert second['processed_count'] == 1, f'second import failed: {second!r}; lines={diagnostic_lines!r}'\n        assert quantity_after_second == 5, f'second inventory mismatch: {quantity_after_second}; lines={diagnostic_lines!r}'\n" + needle
          if needle not in source:
              raise SystemExit('diagnostic insertion point not found')
          path.write_text(source.replace(needle, diagnostic, 1), encoding='utf-8')
          PY
      - name: Run diagnosed production chain
        env:
          PYTHONPATH: backend
          RECEIPT_STORAGE_ROOT: /tmp/rezzerv-receipts
        run: python backend/app/testing/receipt_inventory_production_chain.py
