name: Release A scanner boundary bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-boundary:
    if: github.head_ref == 'agent/release-a-external-receipt-scanner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact Release A production boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/receipt_service.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = "from app.services.receipt_status_baseline_service import STATUS_LABELS\n"
          scanner_import = (
              "from app.integrations.receipt_scanners.runtime import (\n"
              "    scan_receipt_content_via_gateway,\n"
              "    validate_receipt_scanner_configuration,\n"
              ")\n"
          )
          if scanner_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Release A import anchor not found')
              text = text.replace(import_anchor, import_anchor + scanner_import, 1)

          logger_anchor = "LOGGER = logging.getLogger(__name__)\n_PADDLE_OCR_INSTANCE = None\n"
          logger_replacement = (
              "LOGGER = logging.getLogger(__name__)\n"
              "validate_receipt_scanner_configuration()\n"
              "_PADDLE_OCR_INSTANCE = None\n"
          )
          if "validate_receipt_scanner_configuration()\n_PADDLE_OCR_INSTANCE" not in text:
              if logger_anchor not in text:
                  raise SystemExit('Release A startup validation anchor not found')
              text = text.replace(logger_anchor, logger_replacement, 1)

          replacements = {
              "parse_result = parse_receipt_content(file_bytes, filename, detected_mime)":
                  "parse_result = scan_receipt_content_via_gateway(file_bytes, filename, detected_mime)",
              "parse_result = parse_receipt_content(parse_bytes, parse_filename, parse_mime_type)":
                  "parse_result = scan_receipt_content_via_gateway(parse_bytes, parse_filename, parse_mime_type)",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Release A production call anchor not found: {old}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify only intended parser call sites remain
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          assert text.count('def parse_receipt_content(') == 1
          assert text.count('scan_receipt_content_via_gateway(') == 2
          ingest = text[text.index('def ingest_receipt('):text.index('\ndef _resolve_reparse_source_payload')]
          reparse = text[text.index('def reparse_receipt('):text.index('\ndef scan_receipt_source')]
          assert 'parse_receipt_content(' not in ingest
          assert 'parse_receipt_content(' not in reparse
          PY

      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/release-a-scanner-bootstrap.yml

      - name: Commit boundary change to release branch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Rezzerv Release A automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/receipt_service.py .github/workflows/release-a-scanner-bootstrap.yml
          git commit -m "Route receipt ingestion through scanner gateway"
          git push origin HEAD:${{ github.head_ref }}
