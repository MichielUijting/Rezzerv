name: PR337 SQLite account-status authority patch

on:
  push:
    branches:
      - codex/postgresql-core-request-path-authority-cutover

permissions:
  contents: write

jobs:
  patch-backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-core-request-path-authority-cutover
          fetch-depth: 0

      - name: Apply exact backend-only patch
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('backend/alembic/versions/20260829_06_onboarding_product_direct_location_authority.py')
          source = migration.read_text(encoding='utf-8')
          old = '''    # The immutable SQLite baseline already owns the account-status triggers.\n    # Do not rewrite those objects here: validate them below and preserve the\n    # byte-for-byte baseline contract when they are already canonical.\n    if bind.dialect.name == "sqlite":\n        return\n    raise RuntimeError(f"Unsupported Rezzerv migration dialect: {bind.dialect.name}")\n'''
          new = '''    if bind.dialect.name != "sqlite":\n        raise RuntimeError(f"Unsupported Rezzerv migration dialect: {bind.dialect.name}")\n\n    for trigger_name in (_ACCOUNT_INSERT_TRIGGER, _ACCOUNT_UPDATE_TRIGGER):\n        bind.exec_driver_sql(f'DROP TRIGGER IF EXISTS "{trigger_name}"')\n    bind.exec_driver_sql(f"""\n        CREATE TRIGGER {_ACCOUNT_INSERT_TRIGGER}\n        BEFORE INSERT ON app_users\n        FOR EACH ROW\n        WHEN NEW.account_status IS NULL\n          OR NEW.account_status NOT IN ('active', 'disabled', 'suspended')\n        BEGIN\n            SELECT RAISE(ABORT, 'invalid app_users.account_status');\n        END\n    """)\n    bind.exec_driver_sql(f"""\n        CREATE TRIGGER {_ACCOUNT_UPDATE_TRIGGER}\n        BEFORE UPDATE OF account_status ON app_users\n        FOR EACH ROW\n        WHEN NEW.account_status IS NULL\n          OR NEW.account_status NOT IN ('active', 'disabled', 'suspended')\n        BEGIN\n            SELECT RAISE(ABORT, 'invalid app_users.account_status');\n        END\n    """)\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one SQLite account-status block, got {source.count(old)}')
          migration.write_text(source.replace(old, new), encoding='utf-8')

          selftest = Path('backend/tests/migration_foundation_selftest.py')
          source = selftest.read_text(encoding='utf-8')
          anchor = '        "-- index: uq_inventory_active_locationless_household_article (table=inventory)",\n'
          addition = (
              anchor
              + '        "-- trigger: trg_app_users_account_status_insert (table=app_users)",\n'
              + '        "-- trigger: trg_app_users_account_status_update (table=app_users)",\n'
          )
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one migration-owned header anchor, got {source.count(anchor)}')
          if 'trg_app_users_account_status_insert (table=app_users)' in source:
              raise SystemExit('Account-status trigger exclusions already present')
          selftest.write_text(source.replace(anchor, addition), encoding='utf-8')
          PY
          python -m py_compile \
            backend/alembic/versions/20260829_06_onboarding_product_direct_location_authority.py \
            backend/tests/migration_foundation_selftest.py

      - name: Commit backend-only patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/alembic/versions/20260829_06_onboarding_product_direct_location_authority.py \
            backend/tests/migration_foundation_selftest.py
          git commit -m 'migrate: own SQLite account-status trigger cutover'
          git push origin HEAD:codex/postgresql-core-request-path-authority-cutover
