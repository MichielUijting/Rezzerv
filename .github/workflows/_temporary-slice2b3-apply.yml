name: Temporary Slice 2B3 guarded patch

on:
  push:
    branches:
      - feature/uitpakken-dagartikelen-release-b
    paths:
      - '.github/workflows/_temporary-slice2b3-apply.yml'

permissions:
  contents: write

jobs:
  apply-slice2b3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b
          fetch-depth: 0
      - name: Apply guarded source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')

          marker = '''def build_live_article_option_id(article_name: str) -> str:
              return f"live::{(article_name or '').strip()}"


          '''
          if marker not in text:
              raise SystemExit('build_live_article_option_id definition not found exactly once')
          if text.count(marker) != 1:
              raise SystemExit(f'build_live_article_option_id definition count={text.count(marker)}')
          text = text.replace(marker, '', 1)

          start = text.index('def resolve_household_article_selection_to_id(')
          end = text.index('def _decode_household_article_setting_value', start)
          selection_block = '''def resolve_household_article_selection_to_id(conn, household_id: str | None, article_selection_id: str | None, *, create_if_missing: bool = False) -> str | None:
              """Resolve only an existing canonical household_article_id in the same household.

              create_if_missing remains for call compatibility; identity is never created
              or reconstructed from a name or legacy live:: value.
              """
              normalized_selection = str(article_selection_id or '').strip()
              normalized_household_id = str(household_id or '').strip()
              if not normalized_selection or not normalized_household_id:
                  return None
              if normalized_selection.startswith('live::'):
                  return None
              direct_row = get_household_article_option_by_id(conn, normalized_selection, normalized_household_id)
              if not direct_row or not direct_row.get('id'):
                  return None
              return str(direct_row['id'])


          '''
          # Remove indentation introduced only to keep this heredoc readable.
          import textwrap
          selection_block = textwrap.dedent(selection_block)
          text = text[:start] + selection_block + text[end:]

          start = text.index('def get_store_review_article_options(')
          end = text.index('def utc_now_iso()', start)
          resolver_block = '''def get_store_review_article_options(conn, household_id: str | None = None):
              """Return only canonical household articles for one explicit household."""
              normalized_household_id = str(household_id or '').strip()
              if not normalized_household_id:
                  return []
              household_rows = conn.execute(
                  text(
                      """
                      SELECT id, naam AS article_name, consumable, brand_or_maker
                      FROM household_articles
                      WHERE household_id = :household_id
                        AND trim(COALESCE(naam, '')) <> ''
                      ORDER BY lower(naam) ASC, id ASC
                      """
                  ),
                  {"household_id": normalized_household_id},
              ).mappings().all()
              location_defaults_by_article = get_household_article_location_defaults(
                  conn, [str(row.get("id") or "") for row in household_rows]
              )
              items = []
              for row in household_rows:
                  article_id = str(row.get("id") or '').strip()
                  article_name = str(row.get("article_name") or '').strip()
                  if not article_id or not article_name:
                      continue
                  defaults = location_defaults_by_article.get(article_id, {})
                  items.append({
                      "id": article_id,
                      "household_article_id": article_id,
                      "name": article_name,
                      "brand": str(row.get("brand_or_maker") or '').strip(),
                      "consumable": bool(row["consumable"]) if row.get("consumable") is not None else infer_consumable_from_name(article_name),
                      "default_location_id": defaults.get("default_location_id") or "",
                      "default_sublocation_id": defaults.get("default_sublocation_id") or "",
                  })
              return items


          def find_generic_existing_article_match(conn, household_id: str | None, article_name: str | None) -> str | None:
              """Suggestion-only name match; its result is never an article identity."""
              normalized_name = normalize_household_article_name(article_name)
              normalized_household_id = str(household_id or '').strip()
              if not normalized_name or not normalized_household_id:
                  return None
              tokens = [part for part in normalized_name.lower().split() if part]
              if len(tokens) < 2:
                  return None
              generic_candidate = tokens[-1]
              if len(generic_candidate) < 4:
                  return None
              row = conn.execute(
                  text(
                      """
                      SELECT naam AS article_name
                      FROM household_articles
                      WHERE household_id = :household_id
                        AND lower(trim(naam)) = lower(trim(:article_name))
                      LIMIT 1
                      """
                  ),
                  {"household_id": normalized_household_id, "article_name": generic_candidate},
              ).mappings().first()
              if row and row.get("article_name"):
                  return str(row["article_name"]).strip()
              return None


          def resolve_processing_article(conn, household_id: str | None, article: dict | None) -> dict | None:
              """Return only an existing canonical household article in the same household."""
              if not article:
                  return None
              normalized_household_id = str(household_id or '').strip()
              article_id = str(article.get('id') or article.get('household_article_id') or '').strip()
              if not normalized_household_id or not article_id or article_id.startswith('live::'):
                  return None
              return get_household_article_option_by_id(conn, article_id, normalized_household_id)


          def resolve_review_article_option(conn, article_id: str | None, household_id: str | None = None):
              """Resolve a review selection strictly by canonical household_article_id."""
              normalized_article_id = str(article_id or '').strip()
              normalized_household_id = str(household_id or '').strip()
              if not normalized_article_id or not normalized_household_id:
                  return None
              if normalized_article_id.startswith('live::'):
                  return None
              return get_household_article_option_by_id(conn, normalized_article_id, normalized_household_id)


          '''
          resolver_block = textwrap.dedent(resolver_block)
          text = text[:start] + resolver_block + text[end:]

          old = "article_rows = get_store_review_article_options(conn)\n        valid_article_ids = {str(row['id']) for row in article_rows}"
          new = "article_rows = get_store_review_article_options(conn, effective_household_id)\n        valid_article_ids = {str(row['id']) for row in article_rows}"
          if text.count(old) != 1:
              raise SystemExit(f'household-scoped validation call count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'all_items = get_store_review_article_options(conn)'
          if text.count(old) != 1:
              raise SystemExit(f'legacy route call count={text.count(old)}')
          text = text.replace(old, 'all_items = []', 1)

          text = text.replace("build_live_article_option_id('Melk')", "ensure_household_article(conn, 'demo-household', 'Melk')")
          text = text.replace("build_live_article_option_id('Tomaten')", "ensure_household_article(conn, 'demo-household', 'Tomaten')")
          text = text.replace("build_live_article_option_id('Tuna')", "ensure_household_article(conn, 'demo-household', 'Tuna')")
          text = text.replace('str(article.get("id") or build_live_article_option_id(article_name)).strip()', 'str(article.get("id") or "").strip()')
          text = text.replace("build_live_article_option_id(article_name)", "ensure_household_article(conn, 'demo-household', article_name)")

          if 'build_live_article_option_id' in text:
              raise SystemExit('legacy live ID generator still present')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python -m py_compile backend/app/main.py
          if grep -q "build_live_article_option_id" backend/app/main.py; then exit 1; fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git commit -m "refactor: canonicalize household article resolvers slice 2B3"
          git push origin HEAD:feature/uitpakken-dagartikelen-release-b
