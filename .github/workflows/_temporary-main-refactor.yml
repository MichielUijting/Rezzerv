name: Temporary main.py legacy schema refactor

on:
  push:
    branches:
      - codex/postgresql-main-legacy-schema-retirement
    paths:
      - '.github/workflows/_temporary-main-refactor.yml'

permissions:
  contents: write

jobs:
  refactor-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/postgresql-main-legacy-schema-retirement
          fetch-depth: 0

      - name: Refactor main.py safely
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          root = Path('.')
          main_path = root / 'backend/app/main.py'
          source = main_path.read_text(encoding='utf-8')
          original_source = source
          tree = ast.parse(source)

          ddl_markers = (
              'CREATE TABLE',
              'ALTER TABLE',
              'CREATE INDEX',
              'DROP TABLE',
              'DROP INDEX',
              'PRAGMA ',
          )

          candidate_nodes = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              segment = ast.get_source_segment(source, node) or ''
              upper = segment.upper()
              if any(marker in upper for marker in ddl_markers):
                  candidate_nodes.append(node)

          candidate_names = {node.name for node in candidate_nodes}
          candidate_ranges = [
              (int(node.lineno), int(node.end_lineno or node.lineno))
              for node in candidate_nodes
          ]

          def line_is_in_candidate(line: int) -> bool:
              return any(start <= line <= end for start, end in candidate_ranges)

          references: dict[str, list[str]] = {name: [] for name in candidate_names}
          for py_path in (root / 'backend').rglob('*.py'):
              try:
                  py_source = py_path.read_text(encoding='utf-8')
                  py_tree = ast.parse(py_source)
              except Exception:
                  continue
              is_main = py_path == main_path
              for node in ast.walk(py_tree):
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load) and node.id in candidate_names:
                      if is_main and line_is_in_candidate(int(getattr(node, 'lineno', 0) or 0)):
                          continue
                      references[node.id].append(f'{py_path}:{getattr(node, "lineno", "?")}')
                  if isinstance(node, ast.ImportFrom):
                      for alias in node.names:
                          if alias.name in candidate_names:
                              references[alias.name].append(f'{py_path}:{getattr(node, "lineno", "?")} import')

          active_refs = {name: refs for name, refs in references.items() if refs}
          if active_refs:
              lines = ['Refusing to remove legacy schema functions that still have runtime/test references:']
              for name, refs in sorted(active_refs.items()):
                  lines.append(f'  {name}: {refs}')
              raise SystemExit('\n'.join(lines))

          source_lines = source.splitlines(keepends=True)
          remove_line_numbers: set[int] = set()
          for node in candidate_nodes:
              start = int(node.lineno)
              end = int(node.end_lineno or node.lineno)
              # Remove one immediately preceding blank line too, when present.
              if start > 1 and not source_lines[start - 2].strip():
                  start -= 1
              remove_line_numbers.update(range(start, end + 1))
          source = ''.join(
              line for number, line in enumerate(source_lines, start=1)
              if number not in remove_line_numbers
          )

          # Centralize schema validation instead of keeping it inline in the FastAPI entrypoint.
          source = source.replace(
              'from app.db import engine, get_runtime_datastore_info\n',
              'from app.db import engine\n'
              'from app.startup.runtime_initialization import run_runtime_initialization\n'
              'from app.startup.runtime_observability import log_runtime_datastore_configuration_event\n'
              'from app.startup.runtime_schema_validation import validate_runtime_schema\n',
              1,
          )
          source = source.replace(
              '    ensure_external_article_product_link_schema,\n',
              '',
              1,
          )
          inline_schema_validation = (
              'app = FastAPI()\n'
              '# Externe-databases-koppelingen: idempotente schema-initialisatie.\n'
              'with engine.begin() as schema_conn:\n'
              '    ensure_external_article_product_link_schema(schema_conn)\n'
          )
          if inline_schema_validation not in source:
              raise SystemExit('Expected inline runtime schema validation block not found')
          source = source.replace(
              inline_schema_validation,
              'app = FastAPI()\n'
              '# Runtime schema validation is centralized; Alembic remains exclusive schema authority.\n'
              'validate_runtime_schema(engine)\n',
              1,
          )

          # Move the startup observability handler to app.startup.
          parsed_after_ddl = ast.parse(source)
          startup_node = None
          for node in parsed_after_ddl.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == 'log_runtime_datastore_configuration':
                  startup_node = node
                  break
          if startup_node is None:
              raise SystemExit('Expected log_runtime_datastore_configuration startup handler not found')
          lines = source.splitlines(keepends=True)
          start = int(startup_node.lineno)
          if startup_node.decorator_list:
              start = min(start, *(int(item.lineno) for item in startup_node.decorator_list))
          end = int(startup_node.end_lineno or startup_node.lineno)
          replacement = 'app.add_event_handler("startup", log_runtime_datastore_configuration_event)\n'
          source = ''.join(lines[: start - 1] + [replacement] + lines[end:])

          # Centralize import-time runtime initialization while preserving the exact call order.
          old_runtime_init = '''with engine.begin() as external_link_cleanup_conn:\n    external_link_cleanup_count = (\n        deactivate_incomplete_confirmed_external_links(\n            external_link_cleanup_conn\n        )\n    )\n\nlogger.info(\n    "Incomplete kassabonartikelkoppelingen gedeactiveerd: %s",\n    external_link_cleanup_count,\n)\n\nbootstrap_auth_registry()\nwith engine.begin() as authorization_membership_backfill_conn:\n    migrate_legacy_household_memberships(authorization_membership_backfill_conn)\nrefresh_runtime_users_from_db()\nensure_receipt_storage_root()\nseed_store_providers()\nadmin_household = ensure_household("admin@rezzerv.local")\nadmin_household_id = str(admin_household.get("id") or "1")\nensure_default_receipt_sources(engine, RECEIPT_STORAGE_ROOT, admin_household_id)\ndedupe_receipts_for_household(engine, admin_household_id)\n'''
          if old_runtime_init not in source:
              raise SystemExit('Expected import-time runtime initialization block not found')
          source = source.replace(
              old_runtime_init,
              '''run_runtime_initialization(\n    engine=engine,\n    logger=logger,\n    deactivate_incomplete_confirmed_external_links=deactivate_incomplete_confirmed_external_links,\n    bootstrap_auth_registry=bootstrap_auth_registry,\n    migrate_legacy_household_memberships=migrate_legacy_household_memberships,\n    refresh_runtime_users_from_db=refresh_runtime_users_from_db,\n    ensure_receipt_storage_root=ensure_receipt_storage_root,\n    seed_store_providers=seed_store_providers,\n    ensure_household=ensure_household,\n    ensure_default_receipt_sources=ensure_default_receipt_sources,\n    dedupe_receipts_for_household=dedupe_receipts_for_household,\n    receipt_storage_root=RECEIPT_STORAGE_ROOT,\n)\n''',
              1,
          )

          upper_main = source.upper()
          residual = [marker for marker in ddl_markers if marker in upper_main]
          if residual:
              raise SystemExit(f'Legacy schema DDL still remains in main.py after safe removal: {residual}')

          # No top-level engine.begin side effects may remain in the entrypoint after centralization.
          final_tree = ast.parse(source)
          for node in final_tree.body:
              if isinstance(node, (ast.With, ast.AsyncWith)):
                  segment = ast.get_source_segment(source, node) or ''
                  if 'engine.begin()' in segment:
                      raise SystemExit('Top-level engine.begin() side effect remains in main.py')

          startup_dir = root / 'backend/app/startup'
          startup_dir.mkdir(parents=True, exist_ok=True)
          (startup_dir / '__init__.py').write_text(
              '"""Runtime startup orchestration and validation boundaries."""\n',
              encoding='utf-8',
          )
          (startup_dir / 'runtime_schema_validation.py').write_text(
              '''"""Runtime schema validation only; Alembic exclusively owns schema mutation."""\n\nfrom app.services.external_article_product_link_service import (\n    ensure_external_article_product_link_schema,\n)\n\n\ndef validate_runtime_schema(engine) -> None:\n    with engine.begin() as connection:\n        ensure_external_article_product_link_schema(connection)\n''',
              encoding='utf-8',
          )
          (startup_dir / 'runtime_observability.py').write_text(
              '''"""Startup observability for the configured runtime datastore."""\n\nimport logging\n\nfrom app.db import get_runtime_datastore_info\n\n\nlogger = logging.getLogger("rezzerv.api")\n\n\nasync def log_runtime_datastore_configuration_event() -> None:\n    datastore_info = get_runtime_datastore_info()\n    logger.info("Datastore: %s", datastore_info.get("datastore", "onbekend"))\n    logger.info(\n        "Database: %s",\n        datastore_info.get("database")\n        or datastore_info.get("database_url")\n        or "onbekend",\n    )\n    if datastore_info.get("storage"):\n        logger.info("Storage: %s", datastore_info["storage"])\n''',
              encoding='utf-8',
          )
          (startup_dir / 'runtime_initialization.py').write_text(
              '''"""Ordered DML/bootstrap initialization performed after migration preflight."""\n\nfrom __future__ import annotations\n\nfrom pathlib import Path\nfrom typing import Any, Callable\n\n\ndef run_runtime_initialization(\n    *,\n    engine,\n    logger,\n    deactivate_incomplete_confirmed_external_links: Callable[[Any], int],\n    bootstrap_auth_registry: Callable[[], None],\n    migrate_legacy_household_memberships: Callable[[Any], Any],\n    refresh_runtime_users_from_db: Callable[[], None],\n    ensure_receipt_storage_root: Callable[[], None],\n    seed_store_providers: Callable[[], None],\n    ensure_household: Callable[[str], dict[str, Any]],\n    ensure_default_receipt_sources: Callable[[Any, Path, str], Any],\n    dedupe_receipts_for_household: Callable[[Any, str], Any],\n    receipt_storage_root: Path,\n) -> None:\n    with engine.begin() as connection:\n        cleanup_count = deactivate_incomplete_confirmed_external_links(connection)\n    logger.info(\n        "Incomplete kassabonartikelkoppelingen gedeactiveerd: %s",\n        cleanup_count,\n    )\n\n    bootstrap_auth_registry()\n    with engine.begin() as connection:\n        migrate_legacy_household_memberships(connection)\n    refresh_runtime_users_from_db()\n    ensure_receipt_storage_root()\n    seed_store_providers()\n\n    admin_household = ensure_household("admin@rezzerv.local")\n    admin_household_id = str(admin_household.get("id") or "1")\n    ensure_default_receipt_sources(engine, receipt_storage_root, admin_household_id)\n    dedupe_receipts_for_household(engine, admin_household_id)\n''',
              encoding='utf-8',
          )

          test_path = root / 'backend/tests/postgresql_main_legacy_schema_retirement_selftest.py'
          test_path.write_text(
              '''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\nBACKEND_ROOT = Path(__file__).resolve().parents[1]\nMAIN_PATH = BACKEND_ROOT / "app" / "main.py"\nSTARTUP_ROOT = BACKEND_ROOT / "app" / "startup"\n\n\ndef main() -> None:\n    source = MAIN_PATH.read_text(encoding="utf-8")\n    upper = source.upper()\n    forbidden = (\n        "CREATE TABLE",\n        "ALTER TABLE",\n        "CREATE INDEX",\n        "DROP TABLE",\n        "DROP INDEX",\n        "PRAGMA ",\n    )\n    for marker in forbidden:\n        if marker in upper:\n            raise AssertionError(f"Legacy schema DDL remains in main.py: {marker}")\n\n    tree = ast.parse(source)\n    legacy_schema_functions = [\n        node.name\n        for node in tree.body\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))\n        and (node.name.startswith("ensure_release_") and node.name.endswith("_schema"))\n    ]\n    if legacy_schema_functions:\n        raise AssertionError(legacy_schema_functions)\n\n    for node in tree.body:\n        if isinstance(node, (ast.With, ast.AsyncWith)):\n            segment = ast.get_source_segment(source, node) or ""\n            if "engine.begin()" in segment:\n                raise AssertionError("Top-level database side effect remains in main.py")\n\n    required_modules = (\n        STARTUP_ROOT / "runtime_schema_validation.py",\n        STARTUP_ROOT / "runtime_observability.py",\n        STARTUP_ROOT / "runtime_initialization.py",\n    )\n    for path in required_modules:\n        if not path.exists():\n            raise AssertionError(f"Missing startup module: {path}")\n\n    if "validate_runtime_schema(engine)" not in source:\n        raise AssertionError("Runtime schema validation is not centralized")\n    if "run_runtime_initialization(" not in source:\n        raise AssertionError("Runtime initialization is not centralized")\n    if "app.add_event_handler(\"startup\", log_runtime_datastore_configuration_event)" not in source:\n        raise AssertionError("Startup observability is not registered through startup module")\n\n    print("POSTGRESQL_MAIN_LEGACY_DDL_ABSENT_GREEN")\n    print("POSTGRESQL_MAIN_TOP_LEVEL_DB_SIDE_EFFECTS_CENTRALIZED_GREEN")\n    print("POSTGRESQL_MAIN_STARTUP_STRUCTURE_GREEN")\n    print("POSTGRESQL_MAIN_LEGACY_SCHEMA_RETIREMENT_SELFTEST_GREEN")\n\n\nif __name__ == "__main__":\n    main()\n''',
              encoding='utf-8',
          )

          main_path.write_text(source, encoding='utf-8')
          removed_lines = len(original_source.splitlines()) - len(source.splitlines())
          print(f'Removed {len(candidate_nodes)} dead legacy schema functions')
          print(f'main.py line delta: {removed_lines}')
          PY

          python backend/tests/postgresql_main_legacy_schema_retirement_selftest.py

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py backend/app/startup backend/tests/postgresql_main_legacy_schema_retirement_selftest.py
          if git diff --cached --quiet; then
            echo 'No refactor changes to commit.'
            exit 0
          fi
          git commit -m 'Retire main.py legacy schema code and centralize startup'
          git push origin HEAD:codex/postgresql-main-legacy-schema-retirement
