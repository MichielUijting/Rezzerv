name: Authorization membership UI validation

on:
  pull_request:
    paths:
      - 'backend/app/api/authorization_membership_routes.py'
      - 'backend/app/api/legacy_household_member_creation_closure.py'
      - 'backend/app/api/router.py'
      - 'backend/tests/test_authorization_membership_routes.py'
      - 'backend/tests/household_zero_regression_fixture.py'
      - 'frontend/src/features/settings/SettingsAuthorizationPage.jsx'
      - 'frontend/src/features/settings/settingsAuthorization.css'
      - 'frontend/src/features/settings/services/authorizationMembershipService.js'
      - 'frontend/src/features/settings/SettingsHouseholdPage.jsx'
      - 'frontend/src/features/settings/SettingsPage.jsx'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/tests/e2e/settings-authorization.frontend-regression.spec.js'
      - 'frontend/tests/e2e/auth.setup.js'
      - 'docker-compose.postgresql.yml'
      - '.github/workflows/authorization-membership-ui-validation.yml'

jobs:
  authorization-membership-ui:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_TEST_ADMIN_EMAIL: test-admin@rezzerv.local
      PLAYWRIGHT_HOUSEHOLD_ID: '0'
      REZZERV_TEST_SUPERUSER_EMAIL: supergebruiker@rezzerv.local
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary test credentials
        shell: bash
        run: |
          admin_password="Rt$(python - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          )"
          superuser_password="Rs$(python - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          )"
          echo "PLAYWRIGHT_TEST_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "REZZERV_TEST_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "REZZERV_TEST_ADMIN_EMAIL=test-admin@rezzerv.local" >> "$GITHUB_ENV"
          echo "REZZERV_TEST_SUPERUSER_PASSWORD=$superuser_password" >> "$GITHUB_ENV"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$superuser_password"
      - name: Build and start PostgreSQL application stack
        run: docker compose up -d --build
      - name: Wait for backend health
        shell: bash
        run: |
          # Een schone CI-run kan PaddleOCR-modellen eenmalig in het lege
          # rezzerv_paddlex-volume moeten provisioneren. Dat hoort de
          # autorisatievalidatie niet na 120 seconden af te breken.
          for attempt in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8011/api/health >/dev/null; then
              echo "Backend is gezond na ${attempt} pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              echo "Backend start nog; tussenstatus na ${attempt} pogingen:"
              docker compose logs --no-color --tail=80 backend
            fi
            sleep 2
          done
          echo "Backend werd niet gezond binnen 360 seconden."
          docker compose logs --no-color --tail=500 backend
          exit 1
      - name: Validate legacy member create is closed in runtime
        shell: bash
        run: |
          status_code="$(curl --silent --show-error \
            --output /tmp/legacy-member-create.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"email":"legacy-bypass@example.com","password":"NeverCreateThisAccount","role":"admin"}' \
            http://127.0.0.1:8011/api/household/members)"
          cat /tmp/legacy-member-create.json
          test "$status_code" = '410'
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/legacy-member-create.json').read_text(encoding='utf-8'))
          detail = payload.get('detail') or {}
          assert detail.get('code') == 'legacy_household_member_creation_retired', payload
          assert detail.get('replacement') == '/api/household/invitations', payload
          print('legacy_member_create_runtime_closure: PASS')
          PY
      - name: Run authorization API contract
        run: |
          docker compose run --rm --no-deps --entrypoint sh backend -lc "pip install --quiet pytest && python -m pytest -q tests/test_authorization_membership_routes.py"
      - name: Provision authorization test session
        shell: bash
        run: |
          docker compose exec -T \
            -e REZZERV_SUPERGEBRUIKER_PASSWORD="$REZZERV_TEST_SUPERUSER_PASSWORD" \
            -e REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO='1' \
            backend python - <<'PY'
          from app.db import engine
          from app.services.system_superuser_session_provisioning import (
              ensure_system_superuser_for_session_runtime,
          )

          with engine.begin() as conn:
              result = ensure_system_superuser_for_session_runtime(conn)

          print(
              "system_superuser_fixture: PASS; "
              f"email={result.email}; household={result.household_id}; "
              f"membership={result.membership_id}"
          )
          PY

          docker compose exec -T \
            -e REZZERV_TEST_SUPERUSER_EMAIL="$REZZERV_TEST_SUPERUSER_EMAIL" \
            -e REZZERV_TEST_SUPERUSER_PASSWORD="$REZZERV_TEST_SUPERUSER_PASSWORD" \
            -e REZZERV_TEST_ADMIN_EMAIL="$REZZERV_TEST_ADMIN_EMAIL" \
            -e REZZERV_TEST_ADMIN_PASSWORD="$REZZERV_TEST_ADMIN_PASSWORD" \
            backend python /app/tests/authorization_role_matrix_selftest.py
      - name: Prepare household-zero fixtures
        run: docker compose exec -T backend python /app/tests/household_zero_regression_fixture.py prepare
      - name: Run authorization UI regression
        working-directory: frontend
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
          PLAYWRIGHT_API_URL: http://127.0.0.1:8011
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/settings-authorization.frontend-regression.spec.js --project=chromium
      - name: Print backend logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=500 backend
      - name: Cleanup household-zero fixtures
        if: always()
        run: docker compose exec -T backend python /app/tests/household_zero_regression_fixture.py cleanup || true
      - name: Stop application
        if: always()
        run: docker compose down --volumes
