name: Temporary Release B validation carryover patch

on:
  push:
    branches:
      - feature/receipt-lifecycle-release-b

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/receipt-lifecycle-release-b
          fetch-depth: 0
      - name: Patch Kassa validation carryover
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/app/services/receipt_service.py')
          text = path.read_text(encoding='utf-8')

          old = "from app.services.receipt_reimport_lineage_service import (\n    get_prior_processed_line_fact,\n    load_deleted_reimport_lineage,\n    resolve_reimport_logical_line_key,\n)\n"
          new = "from app.services.receipt_reimport_lineage_service import (\n    get_prior_processed_line_fact,\n    load_deleted_reimport_lineage,\n    resolve_reimport_logical_line_key,\n    was_prior_line_validated,\n)\n"
          if text.count(old) != 1:
              raise SystemExit(f'lineage import anchor={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "                    prior_processed = get_prior_processed_line_fact(\n                        conn, logical_line_key, current_receipt_table_id=receipt_table_id\n                    )\n                    conn.execute(\n"
          new = "                    prior_validated = was_prior_line_validated(reimport_lineage, index, line)\n                    prior_processed = get_prior_processed_line_fact(\n                        conn, logical_line_key, current_receipt_table_id=receipt_table_id\n                    )\n                    conn.execute(\n"
          if text.count(old) != 1:
              raise SystemExit(f'prior processed anchor={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "                            'is_validated': 1 if prior_processed else 0,\n"
          new = "                            'is_validated': 1 if (prior_validated or prior_processed) else 0,\n"
          if text.count(old) != 1:
              raise SystemExit(f'is_validated anchor={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Verify
        run: |
          python -m py_compile backend/app/services/receipt_service.py backend/app/services/receipt_reimport_lineage_service.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "Rezzerv CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/receipt_service.py
          if git diff --cached --quiet; then
            echo "No validation carryover patch left"
          else
            git commit -m "Preserve prior Kassa approvals on receipt reimport"
            git push origin HEAD:feature/receipt-lifecycle-release-b
          fi
