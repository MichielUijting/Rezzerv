name: Temporary remove legacy store review route

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b
      - name: Remove only legacy route decorator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          needle = '@app.get("/api/store-review-articles")\ndef get_store_review_articles(q: Optional[str] = Query(None)):'
          replacement = 'def get_store_review_articles(q: Optional[str] = Query(None)):'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Verwacht exact 1 legacy route decorator, gevonden: {count}')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          if '@app.get("/api/store-review-articles")' in text:
              raise SystemExit('Legacy route decorator resteert in main.py')
          PY
          git diff --check
          git diff -- backend/app/main.py
      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'fix(api): remove duplicate legacy store review route registration'
          git push origin HEAD:feature/uitpakken-dagartikelen-release-b
