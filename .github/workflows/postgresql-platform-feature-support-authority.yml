name: PostgreSQL platform feature/support authority

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/20260829_14_platform_feature_support_persistence_authority.py'
      - 'backend/app/services/platform_feature_flag_service.py'
      - 'backend/app/services/support_message_service.py'
      - 'backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py'
      - 'backend/tests/postgresql_platform_feature_support_dml_only_selftest.py'
      - '.github/workflows/postgresql-platform-feature-support-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-feature-support-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://rezzerv_app:runtime-pass@127.0.0.1:5432/rezzerv
      MIGRATION_DATABASE_URL: postgresql://rezzerv_migrator:migration-pass@127.0.0.1:5432/rezzerv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure migration and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d rezzerv -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'migration-pass';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'runtime-pass';
          GRANT CONNECT ON DATABASE rezzerv TO rezzerv_migrator, rezzerv_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rezzerv_migrator;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Prove platform feature/support runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py | tee /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_SQL_PORTABLE_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_RUNTIME_DDL_ABSENT_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_FLAG_FAIL_CLOSED_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_ALEMBIC_AUTHORITY_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/platform-feature-support-static.log

      - name: Migrate through platform feature/support authority revision
        working-directory: backend
        run: |
          python -m app.schema_migration_preflight | tee /tmp/platform-feature-support-migration.log
          grep -F "'dialect': 'postgresql'" /tmp/platform-feature-support-migration.log
          grep -F "'revision': '20260829_14'" /tmp/platform-feature-support-migration.log

      - name: Prove platform feature/support paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_platform_feature_support_dml_only_selftest.py | tee /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_RUNTIME_CREATE_DENIED_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_TYPES_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_FLAG_DML_ONLY_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_FLAG_SCHEMA_FAILURE_VISIBLE_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_SUPPORT_PERSISTENCE_DML_ONLY_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_SUPPORT_REPLY_ALLOWED_BOOLEAN_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_AUTHORITY_SELFTEST_GREEN' /tmp/platform-feature-support-dml-only.log
