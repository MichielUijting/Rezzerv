name: Lidl photo 13 production E2E

on:
  push:
    branches:
      - fix/receipt-scanner-legacy-equivalence-v01.12.85
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lidl-photo-13-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Controleer exacte PO-fixture
        run: |
          test -f backend/tests/fixtures/lidl_photo_13.jpeg
          echo "52a645b56b90037c34a54e61afc594c591874d5b8f9e5e3632332a80ecd5013b  backend/tests/fixtures/lidl_photo_13.jpeg" | sha256sum --check --strict

      - name: Bouw echte backend OCR-runtime
        run: docker build --no-cache -t rezzerv-lidl13-e2e -f backend/Dockerfile backend

      - name: Draai Lidl-13 productie-importketen
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            rezzerv-lidl13-e2e \
            python /app/tests/test_lidl_photo_13_e2e.py | tee lidl-photo-13-e2e.log

      - name: Bewaar diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidl-photo-13-e2e-diagnostic
          path: lidl-photo-13-e2e.log
          if-no-files-found: warn
          retention-days: 3
