name: F5-14 registry closure helper
# Trigger registry closure after green F5-14 proof

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/f5-14-registry-closure.yml'

permissions:
  contents: write

jobs:
  close-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Mark F5-14 covered and extend validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('quality/regression/historical_defect_registry.json')
          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          entry = next(item for item in payload['defect_classes'] if item['key'] == 'standard-api-error-feedback')
          entry['status'] = 'covered'
          entry['acceptance'] = [
              'actieve API-readfouten gebruiken de centrale AppFeedbackProvider/Melding error-overlay in plaats van losse inline rode alerts',
              'een kassabonnenlijst-API 500 toont serverdetail via de standaard foutoverlay en veroorzaakt geen valse leegstaat',
              'een artikelhistorie-API 503 gebruikt de standaard foutoverlay en rendert geen losse rz-article-detail-alert',
              'een inventory-preview API-fout gebruikt de standaard foutoverlay terwijl beschikbare fallback/demo-informatie bruikbaar blijft',
              'JSON detail, message of error van de inventory-API blijft beschikbaar als technische foutdetail achter de toggle terwijl de gebruiker een veilige Nederlandse hoofdtekst krijgt',
              '401/session-expiry blijft centraal afgehandeld door fetchJsonWithAuth/auth session en wordt niet gedupliceerd als generieke foutoverlay',
          ]
          entry['evidence'] = [
              'frontend/src/ui/AppFeedbackProvider.jsx',
              'frontend/src/features/articles/ArticlePage.jsx',
              'frontend/tests/f5-standard-api-error-feedback.contract.mjs',
              'frontend/tests/e2e/uitpakken-feedback.frontend-regression.spec.js',
              'frontend/tests/e2e/article-detail.frontend-regression.spec.js',
              '.github/workflows/f5-standard-api-error-feedback-regression.yml',
          ]
          entry['proof'] = {
              'workflow_run_id': 34153750412,
              'candidate_sha': '638e81e5308591981eb254dff4f34896b96e41f5',
              'conclusion': 'success',
          }
          registry_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator_path = Path('scripts/acceptance/validate_historical_defect_registry.py')
          text = validator_path.read_text(encoding='utf-8')
          anchor = '''    print("PASS conditional_locations_tab_is_covered_with_explicit_acceptance_and_evidence")\n    print("F5_HISTORICAL_DEFECT_REGISTRY_GREEN")\n'''
          assert text.count(anchor) == 1, 'validator print anchor mismatch'
          block = '''    standard_feedback_entry = next(item for item in classes if item["key"] == "standard-api-error-feedback")\n    assert standard_feedback_entry["status"] == "covered", standard_feedback_entry\n    assert len(standard_feedback_entry.get("acceptance") or []) >= 6, standard_feedback_entry\n    required_standard_feedback_evidence = {\n        "frontend/src/ui/AppFeedbackProvider.jsx",\n        "frontend/src/features/articles/ArticlePage.jsx",\n        "frontend/tests/f5-standard-api-error-feedback.contract.mjs",\n        "frontend/tests/e2e/article-detail.frontend-regression.spec.js",\n        ".github/workflows/f5-standard-api-error-feedback-regression.yml",\n    }\n    assert required_standard_feedback_evidence.issubset(set(standard_feedback_entry.get("evidence") or [])), standard_feedback_entry\n\n'''
          insert_anchor = '''    print("PASS historical_defect_registry_has_exact_14_required_classes")\n'''
          assert text.count(insert_anchor) == 1, 'validator assertion insertion anchor mismatch'
          text = text.replace(insert_anchor, block + insert_anchor, 1)
          text = text.replace(anchor, '''    print("PASS conditional_locations_tab_is_covered_with_explicit_acceptance_and_evidence")\n    print("PASS standard_api_error_feedback_is_covered_with_explicit_acceptance_and_evidence")\n    print("F5_HISTORICAL_DEFECT_REGISTRY_GREEN")\n''', 1)
          validator_path.write_text(text, encoding='utf-8')
          PY

          python scripts/acceptance/validate_historical_defect_registry.py
          git diff --check

      - name: Commit registry closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quality/regression/historical_defect_registry.json scripts/acceptance/validate_historical_defect_registry.py
          git commit -m 'Mark F5-14 standard API error feedback covered'
          git push origin HEAD:${{ github.head_ref }}
