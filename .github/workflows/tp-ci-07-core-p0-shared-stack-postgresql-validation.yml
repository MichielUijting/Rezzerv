name: TP-CI-07 Core P0 shared full-stack PostgreSQL validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/tests/e2e/p0-onboarding.fullstack.spec.js'
      - 'frontend/tests/e2e/p0-article-identity-history.fullstack.spec.js'
      - 'frontend/tests/e2e/p0-platform-authority.fullstack.spec.js'
      - 'frontend/tests/e2e/p0-unpacking.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'scripts/acceptance/l4_06_article_identity_history.py'
      - 'scripts/acceptance/l4_07_platform_browser_authority.py'
      - 'scripts/ci/shared_fullstack_plan.py'
      - 'scripts/ci/workflow_delta_gate.py'
      - 'quality/acceptance/**'
      - 'quality/ci/tp_ci_07_core_p0_shared_stack_paths.json'
      - 'docs/TEST_MATRIX.md'
      - 'docs/TEST_IMPLEMENTATION_BACKLOG.md'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
      - 'docker/postgresql/**'
      - '.github/workflows/p0-onboarding-fullstack-postgresql-validation.yml'
      - '.github/workflows/p0-article-identity-history-fullstack-postgresql-validation.yml'
      - '.github/workflows/p0-platform-authority-fullstack-postgresql-validation.yml'
      - '.github/workflows/p0-unpacking-fullstack-postgresql-validation.yml'
      - '.github/workflows/tp-ci-07-core-p0-shared-stack-postgresql-validation.yml'
  workflow_dispatch:
    inputs:
      authority:
        description: Authority to run on the shared Core P0 stack
        required: true
        default: both
        type: choice
        options:
          - both
          - p0-onboarding
          - p0-article-identity
          - p0-platform-authority
          - p0-unpacking

permissions:
  contents: read

concurrency:
  group: tp-ci-07-core-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Core P0 shared-stack authority plan
    runs-on: ubuntu-latest
    outputs:
      p0_onboarding: ${{ steps.plan.outputs.p0_onboarding }}
      p0_article_identity: ${{ steps.plan.outputs.p0_article_identity }}
      p0_platform_authority: ${{ steps.plan.outputs.p0_platform_authority }}
      p0_unpacking: ${{ steps.plan.outputs.p0_unpacking }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout exact candidate for authority planning
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select Core P0 authorities from current delta
        id: plan
        shell: bash
        env:
          INPUT_AUTHORITY: ${{ inputs.authority || 'both' }}
        run: |
          set -euo pipefail
          python scripts/ci/shared_fullstack_plan.py \
            --manifest quality/ci/tp_ci_07_core_p0_shared_stack_paths.json \
            --fallback-authorities p0_onboarding,p0_article_identity,p0_platform_authority,p0_unpacking \
            | tee tp-ci-07-core-p0-plan.log
          grep -E '^P0_ONBOARDING=(true|false)$' tp-ci-07-core-p0-plan.log
          grep -E '^P0_ARTICLE_IDENTITY=(true|false)$' tp-ci-07-core-p0-plan.log
          grep -E '^P0_PLATFORM_AUTHORITY=(true|false)$' tp-ci-07-core-p0-plan.log
          grep -E '^P0_UNPACKING=(true|false)$' tp-ci-07-core-p0-plan.log
          grep -E '^ANY=(true|false)$' tp-ci-07-core-p0-plan.log

  shared-core-p0-fullstack:
    name: Shared Core P0 Docker PostgreSQL Playwright authority runner
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      COMPOSE_PROJECT_NAME: tpci07corep0${{ github.run_id }}
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - name: Checkout exact candidate once
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Guard selected browser authorities against shortcuts
        shell: bash
        env:
          RUN_ONBOARDING: ${{ needs.plan.outputs.p0_onboarding }}
          RUN_ARTICLE_IDENTITY: ${{ needs.plan.outputs.p0_article_identity }}
          RUN_PLATFORM: ${{ needs.plan.outputs.p0_platform_authority }}
          RUN_UNPACKING: ${{ needs.plan.outputs.p0_unpacking }}
        run: |
          set -euo pipefail
          if [[ "$RUN_ONBOARDING" == 'true' ]]; then
            spec='frontend/tests/e2e/p0-onboarding.fullstack.spec.js'
            if grep -nE 'page\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
              echo 'L4-01 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
              exit 1
            fi
            grep -F 'P0_L4_01_ONBOARDING_BROWSER_GREEN' "$spec"
            echo 'TP_CI_07_ONBOARDING_NO_CORE_SHORTCUTS_GREEN'
          fi
          if [[ "$RUN_ARTICLE_IDENTITY" == 'true' ]]; then
            spec='frontend/tests/e2e/p0-article-identity-history.fullstack.spec.js'
            if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
              echo 'L4-06 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
              exit 1
            fi
            grep -F 'P0_L4_06_SAME_NAME_DIFFERENT_IDENTITY_GREEN' "$spec"
            grep -F 'P0_L4_06_DETAIL_HISTORY_IDENTITY_GREEN' "$spec"
            echo 'TP_CI_07_ARTICLE_IDENTITY_NO_CORE_SHORTCUTS_GREEN'
          fi
          if [[ "$RUN_PLATFORM" == 'true' ]]; then
            spec='frontend/tests/e2e/p0-platform-authority.fullstack.spec.js'
            if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
              echo 'L4-07 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
              exit 1
            fi
            grep -F 'home-tile-superuser' "$spec"
            grep -F 'Platformbeheerder toekennen' "$spec"
            grep -F 'Definitief toekennen' "$spec"
            echo 'TP_CI_07_PLATFORM_NO_CORE_SHORTCUTS_GREEN'
          fi
          if [[ "$RUN_UNPACKING" == 'true' ]]; then
            spec='frontend/tests/e2e/p0-unpacking.fullstack.spec.js'
            if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
              echo 'P0 Uitpakken authority mag kern-API niet mocken of via browserrequest-mutaties uitvoeren.' >&2
              exit 1
            fi
            grep -F "getByTestId('receipt-process-button')" "$spec"
            grep -F "toContainText('Direct')" "$spec"
            echo 'TP_CI_07_UNPACKING_NO_CORE_SHORTCUTS_GREEN'
          fi

      - name: Compile shared authority sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/tests/tp_ci_07_onboarding_verify.py \
            scripts/acceptance/l4_06_article_identity_history.py \
            scripts/acceptance/l4_07_platform_browser_authority.py
          node --check frontend/tests/e2e/p0-onboarding.fullstack.spec.js
          node --check frontend/tests/e2e/p0-article-identity-history.fullstack.spec.js
          node --check frontend/tests/e2e/p0-platform-authority.fullstack.spec.js
          node --check frontend/tests/e2e/p0-unpacking.fullstack.spec.js
          node --check frontend/playwright.fullstack.config.js
          echo 'TP_CI_07_AUTHORITY_SOURCES_COMPILE_GREEN'

      - name: Build application images once and prepare Playwright once
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          echo "TP_CI_07_SHARED_BUILD_STARTED=$start_epoch"
          timeout --signal=TERM --kill-after=30s 600s docker compose --progress plain build
          echo 'TP_CI_07_DOCKER_BUILD_ONCE_GREEN'
          docker pull "$PLAYWRIGHT_IMAGE"
          echo 'TP_CI_07_PLAYWRIGHT_PULL_ONCE_GREEN'
          docker run --rm \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc 'npm ci'
          echo 'TP_CI_07_NPM_CI_ONCE_GREEN'
          echo "TP_CI_07_SHARED_PREP_SECONDS=$(( $(date +%s) - start_epoch ))"

      - name: Run L4-01 Onboarding authority on shared images
        id: onboarding
        if: needs.plan.outputs.p0_onboarding == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            if (( rc != 0 )); then
              docker compose ps || true
              docker compose logs --no-color --tail=500 backend frontend postgres || true
            fi
            docker compose down --remove-orphans || true
            docker volume rm "${COMPOSE_PROJECT_NAME}_rezzerv_postgres" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          phase_start="$(date +%s)"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          email="l4-onboarding-${suffix}@example.com"
          password="L4-Onboarding-${suffix}-Pass!"
          household="L4 Wat Inhuis ${suffix}"
          echo "::add-mask::$password"

          docker compose up -d --no-build
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              break
            fi
            if (( attempt == 180 )); then
              echo 'Backend health timeout' >&2
              exit 1
            fi
            if (( attempt % 30 == 0 )); then docker compose logs --no-color --tail=100 backend; fi
            sleep 2
          done

          docker compose exec -T backend python -u /app/tests/tp_ci_07_onboarding_verify.py boundary \
            | tee p0-l4-01-postgresql-boundary.log
          grep -F 'P0_L4_01_POSTGRESQL_BOUNDARY_GREEN' p0-l4-01-postgresql-boundary.log

          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            rm -rf test-results playwright-report-fullstack
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_ONBOARDING_EMAIL="$email" \
            -e PLAYWRIGHT_L4_ONBOARDING_PASSWORD="$password" \
            -e PLAYWRIGHT_L4_ONBOARDING_HOUSEHOLD="$household" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-onboarding.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-l4-01-browser.log"
          grep -F 'P0_L4_01_ONBOARDING_BROWSER_GREEN' frontend/p0-l4-01-browser.log

          docker compose exec -T \
            -e L4_EMAIL="$email" \
            -e L4_HOUSEHOLD_NAME="$household" \
            backend python -u /app/tests/tp_ci_07_onboarding_verify.py verify \
            | tee p0-l4-01-postgresql-end-state.log
          grep -F 'P0_L4_01_POSTGRESQL_END_STATE_GREEN' p0-l4-01-postgresql-end-state.log
          echo 'P0_ONBOARDING_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_07_ONBOARDING_PHASE_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload L4-01 evidence from shared runner
        if: always() && needs.plan.outputs.p0_onboarding == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-01-onboarding-fullstack-evidence-shared-runner
          path: |
            p0-l4-01-postgresql-boundary.log
            p0-l4-01-postgresql-end-state.log
            frontend/p0-l4-01-browser.log
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Run L4-06 Article Identity authority on shared images
        id: article_identity
        if: needs.plan.outputs.p0_article_identity == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            if (( rc != 0 )); then
              docker compose ps || true
              docker compose logs --no-color --tail=500 backend frontend postgres || true
            fi
            docker compose down --remove-orphans || true
            docker volume rm "${COMPOSE_PROJECT_NAME}_rezzerv_postgres" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          phase_start="$(date +%s)"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          email="l4-article-identity-${suffix}@example.com"
          password="L4-Article-Identity-${suffix}-Pass!"
          household="L4 Article Identity Household ${suffix}"
          shared_name="L4 Gedeelde artikelnaam ${suffix}"
          echo "::add-mask::$password"

          docker compose up -d --no-build
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              break
            fi
            if (( attempt == 180 )); then
              echo 'Backend health timeout' >&2
              exit 1
            fi
            if (( attempt % 30 == 0 )); then docker compose logs --no-color --tail=100 backend; fi
            sleep 2
          done

          docker compose exec -T backend python -u - <<'PY' | tee p0-l4-06-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine
          assert engine.dialect.name == 'postgresql'
          with engine.begin() as conn:
              assert str(conn.execute(text('SELECT current_user')).scalar_one()) == 'rezzerv_app'
              assert bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one()) is False
          print('P0_L4_06_POSTGRESQL_BOUNDARY_GREEN')
          PY

          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            rm -rf test-results playwright-report-fullstack
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_06_EMAIL="$email" \
            -e PLAYWRIGHT_L4_06_PASSWORD="$password" \
            -e PLAYWRIGHT_L4_06_HOUSEHOLD="$household" \
            -e PLAYWRIGHT_L4_06_SHARED_NAME="$shared_name" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-article-identity-history.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack --grep prepare | tee /work/p0-l4-06-setup.log"
          household_id="$(jq -er '.householdId' frontend/p0-l4-06-setup.json)"
          docker compose exec -T -e LOCATIONLESS_TEST_HOUSEHOLD_ID="$household_id" backend \
            python -u /app/tests/locationless_unpacking_configuration_fixture.py
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_06_EMAIL="$email" \
            -e PLAYWRIGHT_L4_06_PASSWORD="$password" \
            -e PLAYWRIGHT_L4_06_HOUSEHOLD="$household" \
            -e PLAYWRIGHT_L4_06_SHARED_NAME="$shared_name" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-article-identity-history.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack --grep-invert prepare | tee /work/p0-l4-06-browser.log"
          grep -F 'P0_L4_06_SAME_NAME_DIFFERENT_IDENTITY_GREEN' frontend/p0-l4-06-browser.log
          grep -F 'P0_L4_06_RENAME_IDENTITY_GREEN' frontend/p0-l4-06-browser.log
          grep -F 'P0_L4_06_DETAIL_HISTORY_IDENTITY_GREEN' frontend/p0-l4-06-browser.log
          test -s frontend/p0-l4-06-browser-proof.json

          proof='frontend/p0-l4-06-browser-proof.json'
          household_id="$(jq -r '.householdId // empty' "$proof")"
          receipt_id="$(jq -r '.receiptId // empty' "$proof")"
          batch_id="$(jq -r '.batchId // empty' "$proof")"
          line_a_id="$(jq -r '.lineAId // empty' "$proof")"
          line_b_id="$(jq -r '.lineBId // empty' "$proof")"
          article_a_id="$(jq -r '.articleAId // empty' "$proof")"
          article_b_id="$(jq -r '.articleBId // empty' "$proof")"
          event_a_id="$(jq -r '.eventAId // empty' "$proof")"
          event_b_id="$(jq -r '.eventBId // empty' "$proof")"
          browser_shared_name="$(jq -r '.sharedArticleName // empty' "$proof")"
          for value in "$household_id" "$receipt_id" "$batch_id" "$line_a_id" "$line_b_id" "$article_a_id" "$article_b_id" "$event_a_id" "$event_b_id" "$browser_shared_name"; do
            test -n "$value"
          done

          cat scripts/acceptance/l4_06_article_identity_history.py | docker compose exec -T \
            -e L4_HOUSEHOLD_ID="$household_id" \
            -e L4_RECEIPT_ID="$receipt_id" \
            -e L4_BATCH_ID="$batch_id" \
            -e L4_LINE_A_ID="$line_a_id" \
            -e L4_LINE_B_ID="$line_b_id" \
            -e L4_ARTICLE_A_ID="$article_a_id" \
            -e L4_ARTICLE_B_ID="$article_b_id" \
            -e L4_EVENT_A_ID="$event_a_id" \
            -e L4_EVENT_B_ID="$event_b_id" \
            -e L4_SHARED_ARTICLE_NAME="$browser_shared_name" \
            backend python -u - 2>&1 | tee p0-l4-06-postgresql-end-state.log
          grep -F 'P0_L4_06_POSTGRESQL_END_STATE_GREEN' p0-l4-06-postgresql-end-state.log
          echo 'P0_ARTICLE_IDENTITY_HISTORY_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_07_ARTICLE_IDENTITY_PHASE_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload L4-06 evidence from shared runner
        if: always() && needs.plan.outputs.p0_article_identity == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-06-article-identity-history-evidence-shared-runner
          path: |
            frontend/p0-l4-06-browser.log
            frontend/p0-l4-06-setup.json
            frontend/p0-l4-06-setup.log
            frontend/p0-l4-06-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
            p0-l4-06-postgresql-boundary.log
            p0-l4-06-postgresql-end-state.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run L4-07 Platform Authority on shared images
        id: platform_authority
        if: needs.plan.outputs.p0_platform_authority == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            if (( rc != 0 )); then
              docker compose ps || true
              docker compose logs --no-color --tail=500 backend frontend postgres || true
            fi
            docker compose down --remove-orphans || true
            docker volume rm "${COMPOSE_PROJECT_NAME}_rezzerv_postgres" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          phase_start="$(date +%s)"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          platform_user_id="l4-platform-admin-${suffix}"
          platform_email="l4-platform-admin-${suffix}@example.com"
          platform_password="L4-Platform-${suffix}-Pass!"
          superuser_user_id="l4-superuser-${suffix}"
          superuser_email="l4-superuser-${suffix}@example.com"
          superuser_password="L4-Superuser-${suffix}-Pass!"
          ip_owner_user_id="l4-ip-owner-${suffix}"
          ip_owner_email="l4-ip-owner-${suffix}@example.com"
          ip_owner_password="L4-IpOwner-${suffix}-Pass!"
          standalone_user_id="l4-standalone-${suffix}"
          standalone_email="l4-standalone-${suffix}@example.com"
          standalone_password="L4-Standalone-${suffix}-Pass!"
          target_email="l4-household-admin-${suffix}@example.com"
          target_password="L4-Household-${suffix}-Pass!"
          target_household="L4 Platform target household ${suffix}"
          for secret in "$platform_password" "$superuser_password" "$ip_owner_password" "$standalone_password" "$target_password"; do echo "::add-mask::$secret"; done

          docker compose up -d --no-build
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              break
            fi
            if (( attempt == 180 )); then
              echo 'Backend health timeout' >&2
              exit 1
            fi
            if (( attempt % 30 == 0 )); then docker compose logs --no-color --tail=100 backend; fi
            sleep 2
          done

          cat scripts/acceptance/l4_07_platform_browser_authority.py | docker compose exec -T \
            -e L4_PLATFORM_USER_ID="$platform_user_id" -e L4_PLATFORM_EMAIL="$platform_email" -e L4_PLATFORM_PASSWORD="$platform_password" \
            -e L4_SUPERUSER_USER_ID="$superuser_user_id" -e L4_SUPERUSER_EMAIL="$superuser_email" -e L4_SUPERUSER_PASSWORD="$superuser_password" \
            -e L4_IP_OWNER_USER_ID="$ip_owner_user_id" -e L4_IP_OWNER_EMAIL="$ip_owner_email" -e L4_IP_OWNER_PASSWORD="$ip_owner_password" \
            -e L4_STANDALONE_USER_ID="$standalone_user_id" -e L4_STANDALONE_EMAIL="$standalone_email" -e L4_STANDALONE_PASSWORD="$standalone_password" \
            backend python -u - setup 2>&1 | tee p0-l4-07-platform-setup.log
          grep -F 'P0_L4_07_PLATFORM_FIXTURE_GREEN' p0-l4-07-platform-setup.log
          grep -F 'P0_L4_07_SUPERUSER_FIXTURE_GREEN' p0-l4-07-platform-setup.log
          grep -F 'P0_L4_07_IP_OWNER_FIXTURE_GREEN' p0-l4-07-platform-setup.log
          grep -F 'P0_L4_07_POSTGRESQL_BOUNDARY_GREEN' p0-l4-07-platform-setup.log

          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            rm -rf test-results playwright-report-fullstack
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_07_PLATFORM_EMAIL="$platform_email" \
            -e PLAYWRIGHT_L4_07_PLATFORM_PASSWORD="$platform_password" \
            -e PLAYWRIGHT_L4_07_SUPERUSER_EMAIL="$superuser_email" \
            -e PLAYWRIGHT_L4_07_SUPERUSER_PASSWORD="$superuser_password" \
            -e PLAYWRIGHT_L4_07_IP_OWNER_EMAIL="$ip_owner_email" \
            -e PLAYWRIGHT_L4_07_IP_OWNER_PASSWORD="$ip_owner_password" \
            -e PLAYWRIGHT_L4_07_IP_OWNER_USER_ID="$ip_owner_user_id" \
            -e PLAYWRIGHT_L4_07_STANDALONE_EMAIL="$standalone_email" \
            -e PLAYWRIGHT_L4_07_STANDALONE_USER_ID="$standalone_user_id" \
            -e PLAYWRIGHT_L4_07_TARGET_EMAIL="$target_email" \
            -e PLAYWRIGHT_L4_07_TARGET_PASSWORD="$target_password" \
            -e PLAYWRIGHT_L4_07_TARGET_HOUSEHOLD="$target_household" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-platform-authority.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-l4-07-browser.log"
          grep -F 'P0_L4_07_PLATFORM_LOGIN_NONE_CONTEXT_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_SESSION_REVOKE_THROUGH_UI_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_REVOKED_TARGET_SESSION_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_NO_HOUSEHOLD_PRIVILEGE_ESCALATION_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_SUPERUSER_SYSTEM_CONTEXT_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_SUPERUSER_READ_ONLY_BROWSER_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_SUPERUSER_NO_IP_OWNER_AUTHORITY_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_IP_OWNER_SYSTEM_CONTEXT_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_IP_OWNER_PROTECTED_BROWSER_GREEN' frontend/p0-l4-07-browser.log
          grep -F 'P0_L4_07_IP_OWNER_ROLE_GRANT_THROUGH_UI_GREEN' frontend/p0-l4-07-browser.log
          test -s frontend/p0-l4-07-browser-proof.json
          test -s frontend/p0-l4-07-superuser-browser-proof.json
          test -s frontend/p0-l4-07-ip-owner-browser-proof.json

          proof='frontend/p0-l4-07-browser-proof.json'
          target_household_id="$(jq -r '.targetHouseholdId // empty' "$proof")"
          revoked_session_id="$(jq -r '.revokedSessionId // empty' "$proof")"
          test -n "$target_household_id"
          test -n "$revoked_session_id"

          cat scripts/acceptance/l4_07_platform_browser_authority.py | docker compose exec -T \
            -e L4_PLATFORM_USER_ID="$platform_user_id" -e L4_PLATFORM_EMAIL="$platform_email" \
            -e L4_SUPERUSER_USER_ID="$superuser_user_id" -e L4_SUPERUSER_EMAIL="$superuser_email" \
            -e L4_IP_OWNER_USER_ID="$ip_owner_user_id" -e L4_IP_OWNER_EMAIL="$ip_owner_email" \
            -e L4_STANDALONE_USER_ID="$standalone_user_id" -e L4_STANDALONE_EMAIL="$standalone_email" \
            -e L4_TARGET_EMAIL="$target_email" -e L4_TARGET_HOUSEHOLD_ID="$target_household_id" -e L4_REVOKED_SESSION_ID="$revoked_session_id" \
            backend python -u - verify 2>&1 | tee p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_PLATFORM_ROLE_WITHOUT_HOUSEHOLD_MEMBERSHIP_GREEN' p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_TARGET_SESSION_REVOKED_GREEN' p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_PLATFORM_SESSION_REMAINS_ACTIVE_GREEN' p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_SUPERUSER_ROLE_BOUNDARY_GREEN' p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_IP_OWNER_ROLE_GRANT_AUDIT_GREEN' p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_STANDALONE_TARGET_NO_HOUSEHOLD_GREEN' p0-l4-07-postgresql-end-state.log
          grep -F 'P0_L4_07_POSTGRESQL_END_STATE_GREEN' p0-l4-07-postgresql-end-state.log
          echo 'P0_PLATFORM_AUTHORITY_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_07_PLATFORM_PHASE_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload L4-07 evidence from shared runner
        if: always() && needs.plan.outputs.p0_platform_authority == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-07-platform-authority-evidence-shared-runner
          path: |
            frontend/p0-l4-07-browser.log
            frontend/p0-l4-07-browser-proof.json
            frontend/p0-l4-07-superuser-browser-proof.json
            frontend/p0-l4-07-ip-owner-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
            p0-l4-07-platform-setup.log
            p0-l4-07-postgresql-end-state.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run P0 Unpacking authority on shared images
        id: unpacking
        if: needs.plan.outputs.p0_unpacking == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            if (( rc != 0 )); then
              docker compose ps || true
              docker compose logs --no-color --tail=500 backend || true
              docker compose logs --no-color --tail=200 frontend || true
            fi
            docker compose down --remove-orphans || true
            docker volume rm "${COMPOSE_PROJECT_NAME}_rezzerv_postgres" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          phase_start="$(date +%s)"
          docker compose up -d --no-build
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              break
            fi
            if (( attempt == 180 )); then
              echo 'Backend health timeout' >&2
              exit 1
            fi
            if (( attempt % 30 == 0 )); then docker compose logs --no-color --tail=100 backend; fi
            sleep 2
          done

          docker compose exec -T backend python -u - <<'PY' | tee p0-unpacking-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine
          assert engine.dialect.name == 'postgresql', engine.dialect.name
          with engine.begin() as conn:
              current_user = str(conn.execute(text('SELECT current_user')).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
              alembic_head = str(conn.execute(text('SELECT version_num FROM public.alembic_version')).scalar_one())
          assert current_user == 'rezzerv_app', current_user
          assert runtime_create is False
          assert alembic_head
          print(f'runtime_user={current_user}')
          print(f'alembic_head={alembic_head}')
          print('P0_UNPACKING_POSTGRESQL_BOUNDARY_GREEN')
          PY

          docker compose exec -T backend mkdir -p /quality/acceptance
          docker compose cp quality/acceptance/canonical_scenario_catalog.json backend:/quality/acceptance/canonical_scenario_catalog.json
          docker compose exec -T backend test -s /quality/acceptance/canonical_scenario_catalog.json
          echo 'P0_UNPACKING_CANONICAL_FIXTURE_STAGED_GREEN'

          docker compose exec -T backend python /app/tests/p0_unpacking_fixture.py prepare | tee p0-unpacking-fixture.log
          grep -F 'P0_UNPACKING_FIXTURE_GREEN' p0-unpacking-fixture.log
          docker compose exec -T -e PYTHONPATH=/app backend python /app/tests/p0_unpacking_receipt_bridge.py | tee p0-unpacking-receipt-bridge.log
          grep -F 'P0_UNPACKING_RECEIPT_BRIDGE_GREEN' p0-unpacking-receipt-bridge.log
          fixture_json="$(grep '^P0_UNPACKING_FIXTURE=' p0-unpacking-fixture.log | tail -1 | cut -d= -f2-)"
          test -n "$fixture_json"
          email="$(jq -r '.email' <<<"$fixture_json")"
          password="$(jq -r '.password' <<<"$fixture_json")"
          batch_id="$(jq -r '.batch_id' <<<"$fixture_json")"
          line_id="$(jq -r '.line_id' <<<"$fixture_json")"
          article_name="$(jq -r '.article_name' <<<"$fixture_json")"
          echo "::add-mask::$password"

          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            rm -rf test-results playwright-report-fullstack
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_P0_UNPACKING_EMAIL="$email" \
            -e PLAYWRIGHT_P0_UNPACKING_PASSWORD="$password" \
            -e PLAYWRIGHT_P0_UNPACKING_BATCH_ID="$batch_id" \
            -e PLAYWRIGHT_P0_UNPACKING_LINE_ID="$line_id" \
            -e PLAYWRIGHT_P0_UNPACKING_ARTICLE_NAME="$article_name" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-unpacking.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-unpacking-browser.log"

          docker compose exec -T \
            -e P0_UNPACKING_BATCH_ID="$batch_id" \
            -e P0_UNPACKING_LINE_ID="$line_id" \
            backend python /app/tests/p0_unpacking_fixture.py verify | tee p0-unpacking-postgresql-proof.log
          grep -F 'P0_UNPACKING_POSTGRESQL_GREEN' p0-unpacking-postgresql-proof.log
          grep -F 'P0_UNPACKING_DAY_ARTICLE_BROWSER_GREEN' frontend/p0-unpacking-browser.log
          grep -F 'P0_UNPACKING_DIRECT_CONSUMPTION_BROWSER_GREEN' frontend/p0-unpacking-browser.log
          test -s frontend/p0-unpacking-browser-proof.json
          echo 'P0_UNPACKING_BROWSER_PROOF_GREEN'
          echo 'P0_UNPACKING_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_07_UNPACKING_PHASE_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload P0 Unpacking evidence from shared runner
        if: always() && needs.plan.outputs.p0_unpacking == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-unpacking-postgresql-evidence-shared-runner
          path: |
            p0-unpacking-postgresql-boundary.log
            p0-unpacking-fixture.log
            p0-unpacking-receipt-bridge.log
            p0-unpacking-postgresql-proof.log
            frontend/p0-unpacking-browser.log
            frontend/p0-unpacking-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce selected Core P0 authorities and shared-stack gate
        if: always()
        shell: bash
        env:
          RUN_ONBOARDING: ${{ needs.plan.outputs.p0_onboarding }}
          RUN_ARTICLE_IDENTITY: ${{ needs.plan.outputs.p0_article_identity }}
          RUN_PLATFORM: ${{ needs.plan.outputs.p0_platform_authority }}
          RUN_UNPACKING: ${{ needs.plan.outputs.p0_unpacking }}
          ONBOARDING_OUTCOME: ${{ steps.onboarding.outcome }}
          ARTICLE_IDENTITY_OUTCOME: ${{ steps.article_identity.outcome }}
          PLATFORM_OUTCOME: ${{ steps.platform_authority.outcome }}
          UNPACKING_OUTCOME: ${{ steps.unpacking.outcome }}
        run: |
          set -euo pipefail
          cleanup_all() { docker compose down -v --remove-orphans || true; }
          trap cleanup_all EXIT
          echo "run_onboarding=$RUN_ONBOARDING outcome_onboarding=$ONBOARDING_OUTCOME"
          echo "run_article_identity=$RUN_ARTICLE_IDENTITY outcome_article_identity=$ARTICLE_IDENTITY_OUTCOME"
          echo "run_platform=$RUN_PLATFORM outcome_platform=$PLATFORM_OUTCOME"
          echo "run_unpacking=$RUN_UNPACKING outcome_unpacking=$UNPACKING_OUTCOME"
          if [[ "$RUN_ONBOARDING" == 'true' && "$ONBOARDING_OUTCOME" != 'success' ]]; then
            echo 'Selected P0 Onboarding authority failed.' >&2
            exit 1
          fi
          if [[ "$RUN_ARTICLE_IDENTITY" == 'true' && "$ARTICLE_IDENTITY_OUTCOME" != 'success' ]]; then
            echo 'Selected P0 Article Identity authority failed.' >&2
            exit 1
          fi
          if [[ "$RUN_PLATFORM" == 'true' && "$PLATFORM_OUTCOME" != 'success' ]]; then
            echo 'Selected P0 Platform Authority failed.' >&2
            exit 1
          fi
          if [[ "$RUN_UNPACKING" == 'true' && "$UNPACKING_OUTCOME" != 'success' ]]; then
            echo 'Selected P0 Unpacking authority failed.' >&2
            exit 1
          fi
          echo 'TP_CI_07_CORE_P0_SHARED_STACK_GREEN'
