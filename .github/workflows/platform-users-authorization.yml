name: Platform Users authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/platform_users_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/services/platform_user_suspension_service.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/consumer_account_provisioning.py'
      - 'backend/tests/test_platform_users_route_authorization.py'
      - 'backend/tests/server_session_security_selftest.py'
      - 'frontend/src/features/platform/PlatformUsersPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-users.frontend-regression.spec.js'
      - 'frontend/package.json'
      - '.github/workflows/platform-users-authorization.yml'

jobs:
  platform-users-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile platform Users boundary and tests
        run: |
          PYTHONPATH=. python -m py_compile \
            app/api/platform_users_routes.py \
            app/api/router.py \
            app/services/platform_user_suspension_service.py \
            tests/test_platform_users_route_authorization.py

      - name: Run platform Users authorization tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m pytest -q tests/test_platform_users_route_authorization.py

      - name: Run existing server-side session security selftest
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/rezzerv-platform-users-security.db
          REZZERV_SESSION_COOKIE_SECURE: 'false'
        run: python tests/server_session_security_selftest.py
