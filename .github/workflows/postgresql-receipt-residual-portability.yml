name: PostgreSQL receipt residual portability

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/20260829_15_receipt_store_chain_schema_authority.py'
      - 'backend/app/services/receipt_inventory_lifecycle_service.py'
      - 'backend/app/services/receipt_status_sync.py'
      - 'backend/app/services/receipt_reimport_lineage_service.py'
      - 'backend/app/services/receipt_source_helper_service.py'
      - 'backend/app/services/receipt_status_baseline_service.py'
      - 'backend/tests/postgresql_receipt_residual_portability_selftest.py'
      - 'backend/tests/postgresql_receipt_residual_dml_only_selftest.py'
      - '.github/workflows/postgresql-receipt-residual-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-residual-portability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://rezzerv_app:runtime-pass@127.0.0.1:5432/rezzerv
      MIGRATION_DATABASE_URL: postgresql://rezzerv_migrator:migration-pass@127.0.0.1:5432/rezzerv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure migration and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d rezzerv -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'migration-pass';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'runtime-pass';
          GRANT CONNECT ON DATABASE rezzerv TO rezzerv_migrator, rezzerv_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rezzerv_migrator;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Prove receipt residual SQL is schema-free and PostgreSQL portable
        run: |
          python backend/tests/postgresql_receipt_residual_portability_selftest.py | tee /tmp/receipt-residual-static.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_SQL_PORTABLE_GREEN' /tmp/receipt-residual-static.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_RUNTIME_DDL_ABSENT_GREEN' /tmp/receipt-residual-static.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_BOOLEAN_SQL_GREEN' /tmp/receipt-residual-static.log
          grep -F 'POSTGRESQL_RECEIPT_STORE_CHAIN_ALEMBIC_AUTHORITY_GREEN' /tmp/receipt-residual-static.log
          grep -F 'POSTGRESQL_RECEIPT_STATUS_VALIDATION_ONLY_GREEN' /tmp/receipt-residual-static.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_STATIC_SELFTEST_GREEN' /tmp/receipt-residual-static.log

      - name: Migrate through current canonical Alembic head
        working-directory: backend
        run: |
          python -m app.schema_migration_preflight | tee /tmp/receipt-residual-migration.log
          grep -F "'dialect': 'postgresql'" /tmp/receipt-residual-migration.log
          grep -F "'revision': '20260902_01'" /tmp/receipt-residual-migration.log

      - name: Prove receipt residual paths with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_receipt_residual_dml_only_selftest.py | tee /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_RUNTIME_CREATE_DENIED_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_SCHEMA_CONTRACT_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_BOOLEAN_TYPES_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_APPROVE_NULLABLE_STRING_BIND_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_INVENTORY_RETIME_DML_ONLY_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_REIMPORT_LINEAGE_DML_ONLY_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_SOURCE_BOOLEAN_DML_ONLY_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_STATUS_BASELINE_DML_ONLY_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_STATUS_SYNC_DML_ONLY_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_SCHEMA_UNCHANGED_GREEN' /tmp/receipt-residual-dml-only.log
          grep -F 'POSTGRESQL_RECEIPT_RESIDUAL_DML_ONLY_SELFTEST_GREEN' /tmp/receipt-residual-dml-only.log
