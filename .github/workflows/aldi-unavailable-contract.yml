name: Aldi unavailable store-connection contract

on:
  pull_request:
    paths:
      - 'frontend/src/features/storeConnections/StoreConnectionsPage.jsx'
      - 'frontend/src/features/storeConnections/storeConnectionsModel.js'
      - 'frontend/tests/store-connections.contract.mjs'
      - '.github/workflows/aldi-unavailable-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aldi-unavailable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Aldi unavailable and AH/Lidl unaffected
        run: node frontend/tests/store-connections.contract.mjs
