name: Platform Feature Flags authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/platform_feature_flags_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/platform_feature_flag_service.py'
      - 'backend/app/services/external_database_route_authorization.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_platform_feature_flags_route_authorization.py'
      - 'backend/tests/test_external_database_route_authorization.py'
      - 'frontend/src/features/platform/PlatformFeatureFlagsPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-feature-flags.frontend-regression.spec.js'
      - 'frontend/package.json'
      - '.github/workflows/platform-feature-flags-authorization.yml'

jobs:
  platform-feature-flags-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile platform Featureflags boundary and tests
        run: |
          python -m py_compile \
            app/api/platform_feature_flags_routes.py \
            app/api/router.py \
            app/services/platform_feature_flag_service.py \
            app/services/external_database_route_authorization.py \
            tests/test_platform_feature_flags_route_authorization.py \
            tests/test_external_database_route_authorization.py

      - name: Run platform Featureflags authorization and runtime tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest -q tests/test_platform_feature_flags_route_authorization.py tests/test_external_database_route_authorization.py
