name: PostgreSQL residual runtime SQL audit

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/tests/postgresql_residual_runtime_sql_selftest.py'
      - '.github/workflows/postgresql-residual-runtime-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-runtime-sql-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove production runtime SQL has no hard PostgreSQL blockers
        run: |
          python backend/tests/postgresql_residual_runtime_sql_selftest.py | tee /tmp/postgresql-residual-runtime-sql.log
          grep -F 'POSTGRESQL_RESIDUAL_RUNTIME_SQL_HARD_BLOCKERS_ABSENT_GREEN' /tmp/postgresql-residual-runtime-sql.log
          grep -F 'POSTGRESQL_RESIDUAL_RUNTIME_SQL_SELFTEST_GREEN' /tmp/postgresql-residual-runtime-sql.log
