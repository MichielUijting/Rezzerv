name: Picnic read-only API protocol contract

on:
  pull_request:
    paths:
      - 'backend/app/integrations/picnic_readonly_probe.py'
      - 'backend/tests/test_picnic_readonly_probe.py'
      - '.github/workflows/picnic-readonly-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picnic-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run synthetic Picnic read-only contract
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_picnic_readonly_probe.py
