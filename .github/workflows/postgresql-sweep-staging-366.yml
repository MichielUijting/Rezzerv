name: PostgreSQL portability sweep staging 366

on:
  push:
    branches:
      - codex/postgresql-sweep-staging-366

permissions:
  contents: write

jobs:
  apply-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact PostgreSQL portability sweep
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          ROOT = Path('.')

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              target = ROOT / path
              data = target.read_text(encoding='utf-8')
              actual = data.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {actual}: {old!r}')
              target.write_text(data.replace(old, new), encoding='utf-8')
              print(f'PATCHED {path}: {actual} x {old[:80]!r}')

          main = 'backend/app/main.py'
          replacements = [
              ("ORDER BY datetime(COALESCE(last_lookup_at, fetched_at, '1970-01-01')) DESC, id DESC", "ORDER BY COALESCE(last_lookup_at, fetched_at, TIMESTAMPTZ '1970-01-01 00:00:00+00') DESC, id DESC", 1),
              ("ORDER BY datetime(COALESCE(last_lookup_at, fetched_at, '1970-01-01')) DESC,\n                     CASE", "ORDER BY COALESCE(last_lookup_at, fetched_at, TIMESTAMPTZ '1970-01-01 00:00:00+00') DESC,\n                     CASE", 1),
              ("datetime(COALESCE(updated_at, created_at, '1970-01-01')) DESC,", "COALESCE(updated_at, created_at, TIMESTAMPTZ '1970-01-01 00:00:00+00') DESC,", 1),
              ("ORDER BY datetime(COALESCE(i.updated_at, i.created_at)) DESC, i.id ASC", "ORDER BY COALESCE(i.updated_at, i.created_at) DESC, i.id ASC", 1),
              ("ORDER BY datetime(COALESCE(purchase_date, created_at)) ASC, created_at ASC, id ASC", "ORDER BY COALESCE(CAST(purchase_date AS TIMESTAMPTZ), created_at) ASC, created_at ASC, id ASC", 2),
              ("ORDER BY CASE WHEN pi.is_primary THEN 0 ELSE 1 END, datetime(pi.updated_at) DESC, pi.id DESC", "ORDER BY CASE WHEN pi.is_primary THEN 0 ELSE 1 END, pi.updated_at DESC, pi.id DESC", 1),
              ("                datetime(updated_at) DESC,", "                updated_at DESC,", 1),
              ("              datetime(ha.created_at) ASC,\n              datetime(ha.updated_at) DESC,", "              ha.created_at ASC,\n              ha.updated_at DESC,", 2),
              ('query += " ORDER BY datetime(pil.created_at) ASC, pil.id ASC"', 'query += " ORDER BY pil.created_at ASC, pil.id ASC"', 1),
              ("ORDER BY CASE WHEN lookup_status = 'found' THEN 0 ELSE 1 END, datetime(fetched_at) DESC, id DESC", "ORDER BY CASE WHEN lookup_status = 'found' THEN 0 ELSE 1 END, fetched_at DESC, id DESC", 1),
              ("SELECT source_name, GROUP_CONCAT(id) AS ids", "SELECT source_name, STRING_AGG(CAST(id AS TEXT), ',') AS ids", 1),
              ("lower(hex(randomblob(16)))", "replace(gen_random_uuid()::text, '-', '')", 32),
              ("normalized_allowed = 1 if bool(member_allowed) else 0", "normalized_allowed = bool(member_allowed)", 1),
              ("UPDATE product_identities SET is_primary = 0, updated_at = CURRENT_TIMESTAMP", "UPDATE product_identities SET is_primary = FALSE, updated_at = CURRENT_TIMESTAMP", 1),
              ("'is_primary': 1 if is_primary else 0", "'is_primary': bool(is_primary)", 2),
              ("'is_active': 1 if payload.is_active else 0", "'is_active': bool(payload.is_active)", 1),
              ("'is_auto_prefilled': 1,", "'is_auto_prefilled': True,", 1),
              ("'is_auto_prefilled': 0,", "'is_auto_prefilled': False,", 1),
              ("                    is_auto_prefilled = 1,", "                    is_auto_prefilled = TRUE,", 1),
              ("                    is_auto_prefilled = 0,", "                    is_auto_prefilled = FALSE,", 1),
          ]
          for old, new, expected in replacements:
              replace_exact(main, old, new, expected)

          replace_exact(
              'backend/app/api/receipt_diagnosis_routes.py',
              'ORDER BY datetime(rt.created_at) DESC, rt.id DESC',
              'ORDER BY rt.created_at DESC, rt.id DESC',
              1,
          )
          replace_exact(
              'backend/app/api/superuser_routes.py',
              'WHERE datetime(created_at) <= datetime(:end)\n                  AND (closed_at IS NULL OR datetime(closed_at) > datetime(:end))',
              'WHERE created_at <= CAST(:end AS TIMESTAMPTZ)\n                  AND (closed_at IS NULL OR closed_at > CAST(:end AS TIMESTAMPTZ))',
              1,
          )
          replace_exact(
              'backend/app/services/kassa_line_normalization_report_service.py',
              'ORDER BY datetime(rt.created_at) DESC, rt.id DESC',
              'ORDER BY rt.created_at DESC, rt.id DESC',
              1,
          )
          replace_exact(
              'backend/app/services/kassa_parse_quality_report_service.py',
              'ORDER BY datetime(rt.created_at) DESC, rt.id DESC',
              'ORDER BY rt.created_at DESC, rt.id DESC',
              1,
          )

          for path in [
              'backend/app/api/routes/debug.py',
              'backend/app/receipt_ingestion/debug_artifact_store.py',
          ]:
              replace_exact(path, 'COALESCE(is_deleted, 0) AS is_deleted', 'COALESCE(is_deleted, FALSE) AS is_deleted', 1)
              replace_exact(path, 'COALESCE(is_validated, 0) AS is_validated', 'COALESCE(is_validated, FALSE) AS is_validated', 1)

          replace_exact(
              'backend/app/services/product_taxonomy_store.py',
              'COALESCE(is_active, 1) = 1',
              'COALESCE(is_active, TRUE) = TRUE',
              3,
          )
          replace_exact(
              'backend/app/services/product_inventory_group_store.py',
              ':default_base_unit, 1, :created_at, :updated_at',
              ':default_base_unit, TRUE, :created_at, :updated_at',
              1,
          )
          replace_exact(
              'backend/app/services/product_inventory_group_store.py',
              'is_active = COALESCE(is_active, 1)',
              'is_active = COALESCE(is_active, TRUE)',
              1,
          )
          replace_exact(
              'backend/app/services/receipt_resend_inbound_source_household_guard.py',
              'COALESCE(rs.is_active, 0) = 1',
              'COALESCE(rs.is_active, FALSE) = TRUE',
              1,
          )
          replace_exact(
              'backend/app/services/receipt_service.py',
              "'is_validated': 1 if (prior_validated or prior_processed) else 0,",
              "'is_validated': bool(prior_validated or prior_processed),",
              1,
          )

          guard = 'backend/tests/postgresql_zero_residual_selftest.py'
          replace_exact(
              guard,
              '    "active",\n    "is_active",',
              '    "is_active",',
              1,
          )
          replace_exact(
              guard,
              '"PRAGMA": re.compile(r"\\bPRAGMA\\b", re.IGNORECASE),',
              '"PRAGMA": re.compile(r"^\\s*PRAGMA\\b", re.IGNORECASE),',
              1,
          )
          replace_exact(
              guard,
              '    "SQLite randomblob()": re.compile(r"\\brandomblob\\s*\\(", re.IGNORECASE),\n',
              '    "SQLite randomblob()": re.compile(r"\\brandomblob\\s*\\(", re.IGNORECASE),\n    "SQLite hex()": re.compile(r"\\bhex\\s*\\(", re.IGNORECASE),\n',
              1,
          )
          replace_exact(
              guard,
              '    r"JOIN|SET|VALUES|CREATE|ALTER|DROP|PRAGMA|ON\\s+CONFLICT)\\b",',
              '    r"JOIN|SET|VALUES|CREATE|ALTER|DROP|PRAGMA|ON\\s+CONFLICT|datetime|strftime|"\n    r"julianday|unixepoch|GROUP_CONCAT|IFNULL|IIF|changes|randomblob|zeroblob|typeof|hex)\\b",',
              1,
          )

          for path in [
              'backend/app/main.py',
              'backend/app/api/receipt_diagnosis_routes.py',
              'backend/app/api/superuser_routes.py',
              'backend/app/services/kassa_line_normalization_report_service.py',
              'backend/app/services/kassa_parse_quality_report_service.py',
              'backend/app/api/routes/debug.py',
              'backend/app/receipt_ingestion/debug_artifact_store.py',
              'backend/app/services/product_taxonomy_store.py',
              'backend/app/services/product_inventory_group_store.py',
              'backend/app/services/receipt_resend_inbound_source_household_guard.py',
              'backend/app/services/receipt_service.py',
              'backend/tests/postgresql_zero_residual_selftest.py',
          ]:
              ast.parse((ROOT / path).read_text(encoding='utf-8'), filename=path)
          print('POSTGRESQL_SWEEP_PATCH_AST_GREEN')
          PY

          python backend/tests/postgresql_zero_residual_selftest.py | tee /tmp/postgresql-sweep.log
          grep -F 'POSTGRESQL_ZERO_RESIDUAL_GATE_GREEN' /tmp/postgresql-sweep.log
          git diff --check

      - name: Commit clean staged sweep
        shell: bash
        run: |
          rm -f .github/workflows/postgresql-sweep-staging-366.yml
          git config user.name 'Michiel Uijting'
          git config user.email '169062718+MichielUijting@users.noreply.github.com'
          git add -A
          git commit -m 'Sweep PostgreSQL SQL portability residues'
          git push origin HEAD:codex/postgresql-sweep-staging-366
