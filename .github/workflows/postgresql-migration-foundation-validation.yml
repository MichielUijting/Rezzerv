name: PostgreSQL migration foundation validation

on:
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'backend/alembic.ini'
      - 'backend/alembic/**'
      - 'backend/app/api/**'
      - 'backend/app/db.py'
      - 'backend/app/main.py'
      - 'backend/app/migration_db.py'
      - 'backend/app/models/**'
      - 'backend/app/runtime_preflight.py'
      - 'backend/app/schema_migration_preflight.py'
      - 'backend/app/services/**'
      - 'backend/app/testing/**'
      - 'backend/requirements.txt'
      - 'backend/tests/capture_schema_baseline.py'
      - 'backend/tests/migration_foundation_core_selftest.py'
      - 'backend/tests/migration_foundation_selftest.py'
      - 'backend/tests/migration_foundation_head_selftest.py'
      - 'backend/tests/password_reset_security_selftest.py'
      - 'backend/tests/postgresql_*'
      - 'backend/tests/receipt_lifecycle_schema_authority_selftest.py'
      - 'backend/tests/schema_authority_cutover_selftest.py'
      - 'backend/tests/server_session_schema_authority_selftest.py'
      - 'docs/technical/POSTGRESQL-MIGRATIONS.md'
      - 'docs/technical/POSTGRESQL-SCHEMA-AUTHORITY-CUTOVER.md'
      - '.github/workflows/postgresql-migration-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-fresh-baseline:
    name: Fresh SQLite from immutable baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)"

      - name: Build and validate SQLite Alembic head
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:////tmp/rezzerv-migration-baseline.sqlite
          REZZERV_EXPECT_MIGRATION_MODE: sqlite-baseline
        run: |
          rm -f /tmp/rezzerv-migration-baseline.sqlite
          python -m alembic -c backend/alembic.ini upgrade head
          python backend/tests/migration_foundation_head_selftest.py | tee /tmp/migration-sqlite.log
          grep -F 'MIGRATION_SQLITE_SCHEMA_CONTRACT_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_EXTERNAL_CATALOG_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_GPC_BARCODE_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_GPC_RESIDUAL_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_DAY_ARTICLE_DIRECT_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_HOUSEHOLD_INVITATION_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_PLATFORM_FEATURE_SUPPORT_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_ZERO_RESIDUAL_RUNTIME_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_RECEIPT_HOUSEHOLD_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'SQLITE_PASSWORD_RESET_SCHEMA_AUTHORITY_GREEN' /tmp/migration-sqlite.log
          grep -F 'MIGRATION_FOUNDATION_SELFTEST_GREEN' /tmp/migration-sqlite.log
          grep -F 'MIGRATION_FOUNDATION_REVISION_20260902_01_GREEN' /tmp/migration-sqlite.log
          python backend/tests/password_reset_security_selftest.py | tee /tmp/password-reset-security.log
          grep -F 'PASSWORD_RESET_SECURITY_GREEN' /tmp/password-reset-security.log
          python backend/tests/postgresql_zero_residual_selftest.py | tee /tmp/zero-residual.log
          grep -F 'POSTGRESQL_ZERO_RESIDUAL_GATE_GREEN' /tmp/zero-residual.log
          python backend/tests/postgresql_authorization_sql_portability_selftest.py
          python backend/tests/postgresql_gpc_barcode_sql_authority_selftest.py
          python backend/tests/postgresql_gpc_residual_sql_authority_selftest.py
          python backend/tests/postgresql_day_article_direct_sql_authority_selftest.py
          python backend/tests/postgresql_household_invitation_sql_authority_selftest.py
          python backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py
          python backend/tests/schema_authority_cutover_selftest.py
          python backend/tests/server_session_schema_authority_selftest.py
          python backend/tests/receipt_lifecycle_schema_authority_selftest.py
          python -m app.testing.external_article_product_link_contract
          python -m alembic -c backend/alembic.ini current | tee /tmp/sqlite-current.log
          grep -F '20260902_01' /tmp/sqlite-current.log
          python -m alembic -c backend/alembic.ini heads | tee /tmp/sqlite-heads.log
          grep -F '20260902_01' /tmp/sqlite-heads.log

  sqlite-existing-adoption:
    name: Existing SQLite baseline is validated and adopted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build exact current backend image
        run: docker build -t rezzerv-migration-runtime ./backend

      - name: Prepare existing unversioned SQLite baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rezzerv-schema"
          TARGET_DB="$RUNNER_TEMP/rezzerv-schema/current-runtime.sqlite" python - <<'PY'
          import gzip
          import os
          import sqlite3
          from pathlib import Path

          target = Path(os.environ['TARGET_DB'])
          target.unlink(missing_ok=True)
          with gzip.open('backend/alembic/baseline_sqlite.sql.gz', 'rt', encoding='utf-8') as handle:
              baseline = handle.read()
          connection = sqlite3.connect(str(target))
          try:
              connection.executescript(baseline)
              connection.commit()
          finally:
              connection.close()
          PY

      - name: Validate, adopt and start existing SQLite runtime
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:////capture/current-runtime.sqlite \
            -e REZZERV_RECEIPT_STARTUP_REMBG_WARMUP=false \
            -e REZZERV_RECEIPT_STARTUP_PADDLE_WARMUP=false \
            -e REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO=true \
            -e REZZERV_SUPERGEBRUIKER_PASSWORD='MigrationContractOnly123!' \
            -e REZZERV_EXPECT_MIGRATION_MODE=sqlite-stamped-runtime \
            -v "$RUNNER_TEMP/rezzerv-schema:/capture" \
            rezzerv-migration-runtime \
            sh -lc 'python -m app.schema_migration_preflight && python -c "import app.session_entrypoint" && python tests/capture_schema_baseline.py /capture/current-runtime.sqlite > /capture/current-schema.sql && python tests/migration_foundation_head_selftest.py > /capture/migration-adoption.log && python -m alembic -c alembic.ini current > /capture/alembic-current.log && chmod 666 /capture/current-runtime.sqlite /capture/current-schema.sql /capture/migration-adoption.log /capture/alembic-current.log'

      - name: Prove adopted SQLite owns residual runtime schema through Alembic
        run: |
          gzip -dc backend/alembic/baseline_sqlite.sql.gz > "$RUNNER_TEMP/rezzerv-schema/baseline.sql"
          test "$(sha256sum "$RUNNER_TEMP/rezzerv-schema/baseline.sql" | cut -d' ' -f1)" = 'e75cb2c16e41cd69fa42d2ffdf98dad7f3af67147ed07289edc9caa6ad4fc8b7'
          grep -F -- '-- table: server_sessions (table=server_sessions)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- table: day_article_processing_events (table=day_article_processing_events)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- table: household_invitations (table=household_invitations)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- table: platform_feature_flags (table=platform_feature_flags)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- table: purchase_import_line_inventory_handling_overrides (table=purchase_import_line_inventory_handling_overrides)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- table: receipt_webhook_deliveries (table=receipt_webhook_deliveries)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- table: account_password_reset_tokens (table=account_password_reset_tokens)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F 'SQLITE_ZERO_RESIDUAL_RUNTIME_SCHEMA_AUTHORITY_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F 'SQLITE_RECEIPT_HOUSEHOLD_AUTHORITY_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F 'SQLITE_PASSWORD_RESET_SCHEMA_AUTHORITY_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F 'MIGRATION_FOUNDATION_REVISION_20260902_01_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F 'MIGRATION_FOUNDATION_SELFTEST_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F '20260902_01' "$RUNNER_TEMP/rezzerv-schema/alembic-current.log"

  postgresql-lineage:
    name: PostgreSQL 17 migration lineage and authority
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rezzerv_migrations
          POSTGRES_USER: rezzerv
          POSTGRES_PASSWORD: rezzerv-ci-migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv -d rezzerv_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)" \
            "$(grep '^psycopg\[binary\]==' backend/requirements.txt)"

      - name: Validate PostgreSQL lineage, authority and zero-residual contract
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://rezzerv:rezzerv-ci-migrations@127.0.0.1:5432/rezzerv_migrations
          MIGRATION_DATABASE_URL: postgresql://rezzerv:rezzerv-ci-migrations@127.0.0.1:5432/rezzerv_migrations
          REZZERV_EXPECT_MIGRATION_MODE: postgresql-lineage
          DATABASE_CONNECT_TIMEOUT_SECONDS: '5'
          DATABASE_POOL_SIZE: '2'
          DATABASE_MAX_OVERFLOW: '1'
          DATABASE_POOL_TIMEOUT_SECONDS: '10'
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python backend/tests/migration_foundation_head_selftest.py | tee /tmp/migration-postgresql.log
          grep -F 'MIGRATION_POSTGRESQL_LINEAGE_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_GPC_BARCODE_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_AUTHORIZATION_BOOLEAN_SCHEMA_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_ZERO_RESIDUAL_RUNTIME_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_RECEIPT_HOUSEHOLD_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_SCHEMA_AUTHORITY_GREEN' /tmp/migration-postgresql.log
          grep -F 'MIGRATION_FOUNDATION_SELFTEST_GREEN' /tmp/migration-postgresql.log
          grep -F 'MIGRATION_FOUNDATION_REVISION_20260902_01_GREEN' /tmp/migration-postgresql.log
          python backend/tests/password_reset_security_selftest.py | tee /tmp/password-reset-security.log
          grep -F 'PASSWORD_RESET_SECURITY_GREEN' /tmp/password-reset-security.log
          python backend/tests/postgresql_zero_residual_selftest.py | tee /tmp/zero-residual.log
          grep -F 'POSTGRESQL_ZERO_RESIDUAL_GATE_GREEN' /tmp/zero-residual.log
          python backend/tests/postgresql_authorization_sql_portability_selftest.py
          python backend/tests/postgresql_gpc_barcode_sql_authority_selftest.py
          python backend/tests/postgresql_gpc_residual_sql_authority_selftest.py
          python backend/tests/postgresql_day_article_direct_sql_authority_selftest.py
          python backend/tests/postgresql_household_invitation_sql_authority_selftest.py
          python backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py
          python backend/tests/postgresql_inventory_writer_selftest.py
          python backend/tests/schema_authority_cutover_selftest.py
          python - <<'PY'
          import sqlalchemy as sa
          from sqlalchemy import inspect
          from app.db import engine

          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          for table_name in (
              'purchase_import_line_inventory_handling_overrides',
              'receipt_webhook_deliveries',
              'account_password_reset_tokens',
          ):
              assert table_name in tables, table_name

          line_columns = {
              item['name']: item
              for item in inspector.get_columns('purchase_import_line_inventory_handling_overrides')
          }
          delivery_columns = {
              item['name']: item
              for item in inspector.get_columns('receipt_webhook_deliveries')
          }
          reset_columns = {
              item['name']: item
              for item in inspector.get_columns('account_password_reset_tokens')
          }
          for column in (
              line_columns['updated_at'],
              delivery_columns['created_at'],
              delivery_columns['updated_at'],
              reset_columns['requested_at'],
              reset_columns['expires_at'],
              reset_columns['used_at'],
              reset_columns['invalidated_at'],
          ):
              assert isinstance(column['type'], sa.DateTime), column
              assert bool(getattr(column['type'], 'timezone', False)), column
          print('POSTGRESQL_ZERO_RESIDUAL_MIGRATION_AUTHORITY_GREEN')
          print('POSTGRESQL_PASSWORD_RESET_MIGRATION_AUTHORITY_GREEN')
          PY
          python -m alembic -c backend/alembic.ini current | tee /tmp/postgresql-current.log
          grep -F '20260902_01' /tmp/postgresql-current.log
          python -m alembic -c backend/alembic.ini heads | tee /tmp/postgresql-heads.log
          grep -F '20260902_01' /tmp/postgresql-heads.log
