name: PostgreSQL migration foundation validation

on:
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'backend/alembic.ini'
      - 'backend/alembic/**'
      - 'backend/app/db.py'
      - 'backend/app/main.py'
      - 'backend/app/models/**'
      - 'backend/app/runtime_preflight.py'
      - 'backend/app/schema_migration_preflight.py'
      - 'backend/app/services/**'
      - 'backend/app/testing/external_article_product_link_contract.py'
      - 'backend/app/testing/receipt_lifecycle_contract.py'
      - 'backend/requirements.txt'
      - 'backend/tests/capture_schema_baseline.py'
      - 'backend/tests/migration_foundation_selftest.py'
      - 'backend/tests/receipt_lifecycle_schema_authority_selftest.py'
      - 'backend/tests/schema_authority_cutover_selftest.py'
      - 'backend/tests/server_session_schema_authority_selftest.py'
      - 'docs/technical/POSTGRESQL-MIGRATIONS.md'
      - 'docs/technical/POSTGRESQL-SCHEMA-AUTHORITY-CUTOVER.md'
      - '.github/workflows/postgresql-migration-foundation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-fresh-baseline:
    name: Fresh SQLite from immutable baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)"

      - name: Build fresh SQLite schema through Alembic
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:////tmp/rezzerv-migration-baseline.sqlite
          REZZERV_EXPECT_MIGRATION_MODE: sqlite-baseline
        run: |
          rm -f /tmp/rezzerv-migration-baseline.sqlite
          python -m alembic -c backend/alembic.ini upgrade head
          python backend/tests/migration_foundation_selftest.py | tee /tmp/migration-sqlite.log
          grep -F 'MIGRATION_SQLITE_SCHEMA_CONTRACT_GREEN' /tmp/migration-sqlite.log
          grep -F 'MIGRATION_FOUNDATION_SELFTEST_GREEN' /tmp/migration-sqlite.log
          python backend/tests/schema_authority_cutover_selftest.py | tee /tmp/schema-authority.log
          grep -F 'SCHEMA_AUTHORITY_CUTOVER_SELFTEST_GREEN' /tmp/schema-authority.log
          grep -F 'SERVER_SESSION_RUNTIME_DDL_REMOVED_GREEN' /tmp/schema-authority.log
          grep -F 'RECEIPT_LIFECYCLE_RUNTIME_DDL_REMOVED_GREEN' /tmp/schema-authority.log
          python backend/tests/server_session_schema_authority_selftest.py | tee /tmp/server-session-authority.log
          grep -F 'SERVER_SESSION_FRESH_SQLITE_MIGRATION_GREEN' /tmp/server-session-authority.log
          grep -F 'SERVER_SESSION_LEGACY_SQLITE_MIGRATION_GREEN' /tmp/server-session-authority.log
          grep -F 'SERVER_SESSION_MALFORMED_SQLITE_REJECTED_GREEN' /tmp/server-session-authority.log
          grep -F 'SERVER_SESSION_SCHEMA_AUTHORITY_SELFTEST_GREEN' /tmp/server-session-authority.log
          python backend/tests/receipt_lifecycle_schema_authority_selftest.py | tee /tmp/receipt-lifecycle-authority.log
          grep -F 'RECEIPT_LIFECYCLE_CANONICAL_SQLITE_VALIDATION_GREEN' /tmp/receipt-lifecycle-authority.log
          grep -F 'RECEIPT_LIFECYCLE_MALFORMED_INDEX_REJECTED_GREEN' /tmp/receipt-lifecycle-authority.log
          grep -F 'RECEIPT_LIFECYCLE_MALFORMED_TRIGGER_REJECTED_GREEN' /tmp/receipt-lifecycle-authority.log
          grep -F 'RECEIPT_LIFECYCLE_SCHEMA_AUTHORITY_SELFTEST_GREEN' /tmp/receipt-lifecycle-authority.log
          python -m app.testing.external_article_product_link_contract | tee /tmp/external-link-contract.log
          grep -F 'EXTERNAL_ARTICLE_PRODUCT_LINK_CONTRACT=GREEN' /tmp/external-link-contract.log
          python -m alembic -c backend/alembic.ini current
          python -m alembic -c backend/alembic.ini heads

  sqlite-existing-adoption:
    name: Existing SQLite baseline is validated and adopted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)"

      - name: Build exact current backend image
        run: docker build -t rezzerv-migration-runtime ./backend

      - name: Prepare existing unversioned SQLite baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rezzerv-schema"
          TARGET_DB="$RUNNER_TEMP/rezzerv-schema/current-runtime.sqlite" python - <<'PY'
          import gzip
          import os
          import sqlite3
          from pathlib import Path

          target = Path(os.environ['TARGET_DB'])
          target.unlink(missing_ok=True)
          with gzip.open('backend/alembic/baseline_sqlite.sql.gz', 'rt', encoding='utf-8') as handle:
              baseline = handle.read()
          connection = sqlite3.connect(str(target))
          try:
              connection.executescript(baseline)
              connection.commit()
          finally:
              connection.close()
          PY

      - name: Validate, adopt and start existing SQLite runtime
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:////capture/current-runtime.sqlite \
            -e REZZERV_RECEIPT_STARTUP_REMBG_WARMUP=false \
            -e REZZERV_RECEIPT_STARTUP_PADDLE_WARMUP=false \
            -e REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO=true \
            -e REZZERV_SUPERGEBRUIKER_PASSWORD='MigrationContractOnly123!' \
            -e REZZERV_EXPECT_MIGRATION_MODE=sqlite-stamped-runtime \
            -v "$RUNNER_TEMP/rezzerv-schema:/capture" \
            rezzerv-migration-runtime \
            sh -lc 'python -m app.schema_migration_preflight && python -c "import app.session_entrypoint" && python tests/capture_schema_baseline.py /capture/current-runtime.sqlite > /capture/current-schema.sql && python tests/migration_foundation_selftest.py > /capture/migration-adoption.log && python -m alembic -c alembic.ini current > /capture/alembic-current.log && chmod 666 /capture/current-runtime.sqlite /capture/current-schema.sql /capture/migration-adoption.log /capture/alembic-current.log'

      - name: Prove adoption preserved immutable baseline plus migration-owned session schema
        run: |
          gzip -dc backend/alembic/baseline_sqlite.sql.gz > "$RUNNER_TEMP/rezzerv-schema/baseline.sql"
          sha256sum "$RUNNER_TEMP/rezzerv-schema/baseline.sql" "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          test "$(sha256sum "$RUNNER_TEMP/rezzerv-schema/baseline.sql" | cut -d' ' -f1)" = 'e75cb2c16e41cd69fa42d2ffdf98dad7f3af67147ed07289edc9caa6ad4fc8b7'
          grep -F -- '-- table: server_sessions (table=server_sessions)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F -- '-- index: idx_server_sessions_user_active (table=server_sessions)' "$RUNNER_TEMP/rezzerv-schema/current-schema.sql"
          grep -F 'MIGRATION_SQLITE_SCHEMA_CONTRACT_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F 'MIGRATION_FOUNDATION_SELFTEST_GREEN' "$RUNNER_TEMP/rezzerv-schema/migration-adoption.log"
          grep -F '20260828_03' "$RUNNER_TEMP/rezzerv-schema/alembic-current.log"

  postgresql-lineage:
    name: PostgreSQL 17 migration lineage and authority
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rezzerv_migrations
          POSTGRES_USER: rezzerv
          POSTGRES_PASSWORD: rezzerv-ci-migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv -d rezzerv_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)" \
            "$(grep '^psycopg\[binary\]==' backend/requirements.txt)"

      - name: Validate PostgreSQL lineage and schema authority
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://rezzerv:rezzerv-ci-migrations@127.0.0.1:5432/rezzerv_migrations
          REZZERV_EXPECT_MIGRATION_MODE: postgresql-lineage
          DATABASE_CONNECT_TIMEOUT_SECONDS: '5'
          DATABASE_POOL_SIZE: '2'
          DATABASE_MAX_OVERFLOW: '1'
          DATABASE_POOL_TIMEOUT_SECONDS: '10'
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python backend/tests/migration_foundation_selftest.py | tee /tmp/migration-postgresql.log
          grep -F 'MIGRATION_POSTGRESQL_LINEAGE_GREEN' /tmp/migration-postgresql.log
          grep -F 'MIGRATION_FOUNDATION_SELFTEST_GREEN' /tmp/migration-postgresql.log
          python backend/tests/schema_authority_cutover_selftest.py | tee /tmp/schema-authority-postgresql.log
          grep -F 'EXTERNAL_LINK_RUNTIME_DDL_REMOVED_GREEN' /tmp/schema-authority-postgresql.log
          grep -F 'SERVER_SESSION_RUNTIME_DDL_REMOVED_GREEN' /tmp/schema-authority-postgresql.log
          grep -F 'RECEIPT_LIFECYCLE_RUNTIME_DDL_REMOVED_GREEN' /tmp/schema-authority-postgresql.log
          python - <<'PY'
          from sqlalchemy import inspect, text
          from app.db import engine

          inspector = inspect(engine)
          assert 'external_article_product_links' in inspector.get_table_names()
          indexes = {
              item['name']
              for item in inspector.get_indexes('external_article_product_links')
          }
          expected = {
              'idx_external_article_product_links_product',
              'idx_external_article_product_links_candidate',
              'uq_external_article_product_links_code_confirmed',
              'uq_external_article_product_links_text_confirmed',
          }
          missing = expected - indexes
          assert not missing, f'PostgreSQL external-link indexes ontbreken: {sorted(missing)}'

          assert 'server_sessions' in inspector.get_table_names()
          session_indexes = {
              item['name']: tuple(item.get('column_names') or ())
              for item in inspector.get_indexes('server_sessions')
          }
          assert session_indexes.get('idx_server_sessions_user_active') == (
              'user_id', 'revoked_at', 'expires_at'
          )
          active_household = next(
              item
              for item in inspector.get_columns('server_sessions')
              if item['name'] == 'active_household_id'
          )
          assert active_household['nullable'] is True

          receipt_indexes = {
              item['name']
              for table_name in ('raw_receipts', 'receipt_tables', 'receipt_table_lines')
              for item in inspector.get_indexes(table_name)
          }
          for required in (
              'uq_raw_receipts_household_hash',
              'idx_receipt_tables_logical_receipt_key',
              'idx_receipt_tables_workflow_state',
              'idx_receipt_table_lines_logical_line_key',
          ):
              assert required in receipt_indexes, f'PostgreSQL receipt lifecycle index ontbreekt: {required}'
          with engine.connect() as connection:
              triggers = {
                  str(row[0])
                  for row in connection.execute(text("""
                      SELECT t.tgname
                      FROM pg_trigger t
                      JOIN pg_class c ON c.oid = t.tgrelid
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                      WHERE n.nspname = current_schema()
                        AND c.relname = 'receipt_tables'
                        AND NOT t.tgisinternal
                  """)).all()
              }
          assert triggers == {'trg_receipt_tables_preserve_explicit_approval'}
          print('POSTGRESQL_EXTERNAL_LINK_SCHEMA_AUTHORITY_GREEN')
          print('POSTGRESQL_SERVER_SESSION_SCHEMA_AUTHORITY_GREEN')
          print('POSTGRESQL_RECEIPT_LIFECYCLE_SCHEMA_AUTHORITY_GREEN')
          PY
          python -m alembic -c backend/alembic.ini current
          python -m alembic -c backend/alembic.ini heads
