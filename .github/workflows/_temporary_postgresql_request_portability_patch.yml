name: Temporary PostgreSQL request portability patch

on:
  push:
    branches:
      - codex/postgresql-production-only-cutover
    paths:
      - .github/workflows/_temporary_postgresql_request_portability_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-production-only-cutover
          fetch-depth: 0

      - name: Apply scoped PostgreSQL portability replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/main.py')
          source = path.read_text(encoding='utf-8')
          original = source

          # Boolean columns are canonical PostgreSQL BOOLEAN. TRUE/FALSE stay
          # valid in explicit SQLite compatibility tests as well.
          source, active_cmp = re.subn(
              r"COALESCE\(((?:[A-Za-z_][A-Za-z0-9_]*\.)?active),\s*1\)\s*=\s*1",
              r"COALESCE(\1, TRUE) = TRUE",
              source,
              flags=re.IGNORECASE,
          )
          source, active_coalesce = re.subn(
              r"COALESCE\(((?:[A-Za-z_][A-Za-z0-9_]*\.)?active),\s*1\)",
              r"COALESCE(\1, TRUE)",
              source,
              flags=re.IGNORECASE,
          )
          source, deleted_cmp = re.subn(
              r"COALESCE\(((?:[A-Za-z_][A-Za-z0-9_]*\.)?is_deleted),\s*0\)\s*=\s*0",
              r"COALESCE(\1, FALSE) = FALSE",
              source,
              flags=re.IGNORECASE,
          )
          source, deleted_coalesce = re.subn(
              r"COALESCE\(((?:[A-Za-z_][A-Za-z0-9_]*\.)?is_deleted),\s*0\)",
              r"COALESCE(\1, FALSE)",
              source,
              flags=re.IGNORECASE,
          )
          source, direct_active = re.subn(
              r"\bactive\s*=\s*1\b",
              "active = TRUE",
              source,
              flags=re.IGNORECASE,
          )

          source, active_params = re.subn(
              r'([\"\']active[\"\']\s*:\s*)1 if ([^,\n]+?) else 0',
              lambda match: f"{match.group(1)}bool({match.group(2).strip()})",
              source,
          )

          old_space_values = "VALUES (lower(hex(randomblob(16))), :naam, :household_id, :active)"
          new_space_values = "VALUES (:id, :naam, :household_id, :active)"
          space_values = source.count(old_space_values)
          source = source.replace(old_space_values, new_space_values)
          old_space_params = '{"naam": payload.naam, "household_id": household_id, "active": bool(payload.active)}'
          new_space_params = '{"id": uuid.uuid4().hex, "naam": payload.naam, "household_id": household_id, "active": bool(payload.active)}'
          space_params = source.count(old_space_params)
          source = source.replace(old_space_params, new_space_params)

          old_sub_values = "VALUES (lower(hex(randomblob(16))), :naam, :space_id, :active)"
          new_sub_values = "VALUES (:id, :naam, :space_id, :active)"
          sub_values = source.count(old_sub_values)
          source = source.replace(old_sub_values, new_sub_values)
          old_sub_params = '{"naam": payload.naam, "space_id": payload.space_id, "active": bool(payload.active)}'
          new_sub_params = '{"id": uuid.uuid4().hex, "naam": payload.naam, "space_id": payload.space_id, "active": bool(payload.active)}'
          sub_params = source.count(old_sub_params)
          source = source.replace(old_sub_params, new_sub_params)

          counts = {
              'active_comparisons': active_cmp,
              'active_coalesces': active_coalesce,
              'deleted_comparisons': deleted_cmp,
              'deleted_coalesces': deleted_coalesce,
              'direct_active': direct_active,
              'active_params': active_params,
              'space_values': space_values,
              'space_params': space_params,
              'sublocation_values': sub_values,
              'sublocation_params': sub_params,
          }
          print(counts)

          assert active_cmp >= 1, counts
          assert active_coalesce >= 1, counts
          assert deleted_cmp >= 1, counts
          assert active_params >= 2, counts
          assert space_values == 1, counts
          assert space_params == 1, counts
          assert sub_values == 1, counts
          assert sub_params == 1, counts
          assert source != original

          # The exact request-path forms that failed under PostgreSQL must be gone.
          assert "VALUES (lower(hex(randomblob(16))), :naam, :household_id, :active)" not in source
          assert "VALUES (lower(hex(randomblob(16))), :naam, :space_id, :active)" not in source
          assert not re.search(r"COALESCE\((?:[A-Za-z_][A-Za-z0-9_]*\.)?is_deleted,\s*0\)\s*=\s*0", source, re.I)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit production SQL fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_temporary_postgresql_request_portability_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py .github/workflows/_temporary_postgresql_request_portability_patch.yml
          git diff --cached --check
          git commit -m "fix: make location and receipt request SQL PostgreSQL portable"
          git push origin HEAD:codex/postgresql-production-only-cutover
