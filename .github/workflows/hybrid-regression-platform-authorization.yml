name: Hybrid regression platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/hybrid_regression_route_authorization.py'
      - 'backend/app/services/platform_admin_route_guard.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/receipt_admin_household_guard_contract.py'
      - 'backend/tests/server_session_route_guard_audit.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - 'backend/tests/test_fixture_lifecycle_platform_authorization.py'
      - 'backend/tests/test_receipt_export_fixture_platform_authorization.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - '.github/workflows/hybrid-regression-platform-authorization.yml'

jobs:
  hybrid-regression-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile hybrid authorization boundary and tests
        run: |
          python -m py_compile \
            app/session_entrypoint.py \
            app/services/hybrid_regression_route_authorization.py \
            app/services/platform_admin_route_guard.py \
            app/services/session_request_context.py \
            tests/server_session_route_guard_audit.py \
            tests/test_hybrid_regression_platform_authorization.py \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run hybrid permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_hybrid_regression_platform_authorization.py \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run server session route guard audit
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python tests/server_session_route_guard_audit.py

      - name: Run legacy platform guard contract
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m app.testing.receipt_admin_household_guard_contract
