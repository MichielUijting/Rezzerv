name: Apply receipt pagination integration

on:
  push:
    branches:
      - feature/external-databases-barcode-input
    paths:
      - backend/scripts/apply_receipt_pagination_integration.py
      - .github/workflows/apply-receipt-pagination-integration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/external-databases-barcode-input
          fetch-depth: 0

      - name: Apply integration patch
        run: python backend/scripts/apply_receipt_pagination_integration.py

      - name: Compile backend
        run: |
          python -m py_compile \
            backend/app/services/external_receipt_item_read_service.py \
            backend/app/api/system_routes.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit integrated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sluit bonartikelen aan op serverpaginering"
          git push origin HEAD:feature/external-databases-barcode-input
