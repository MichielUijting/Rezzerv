name: Article detail write guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-article-detail-write-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installeer minimale backend-afhankelijkheden
        run: |
          python -m pip install --quiet \
            fastapi==0.115.0 \
            httpx==0.27.2

      - name: Compileer gewijzigde modules
        run: |
          python -m py_compile \
            backend/app/services/article_detail_write_guard.py \
            backend/app/services/product_enrichment_write_guard.py \
            backend/app/testing/article_detail_write_guard_contract.py \
            backend/tests/test_article_detail_mutation_contract.py

      - name: Voer artikeldetail-schrijfcontract uit
        env:
          PYTHONPATH: backend
        run: |
          python -m app.testing.article_detail_write_guard_contract | tee article-detail-write-guard.log
          grep -F 'ARTICLE_DETAIL_WRITE_GUARD_GREEN' article-detail-write-guard.log

      - name: Bewaak mutatie-eigenaars en UI-rolgrenzen
        run: |
          python backend/tests/test_article_detail_mutation_contract.py | tee article-detail-mutation-contract.log
          grep -F 'ARTICLE_DETAIL_MUTATION_CONTRACT_GREEN' article-detail-mutation-contract.log

      - name: Bouw gewijzigde frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Valideer exacte frontendcommit in Docker-runtime
        env:
          EXPECTED_VERSION: Rezzerv-MVP-v01.12.96
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build \
            --build-arg REZZERV_VERSION="$EXPECTED_VERSION" \
            --build-arg REZZERV_COMMIT="$EXPECTED_COMMIT" \
            -t rezzerv-pr251-frontend-marker frontend
          container_id=$(docker run -d -p 18080:80 rezzerv-pr251-frontend-marker)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/version.json > /tmp/rezzerv-runtime-version.json; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/rezzerv-runtime-version.json').read_text(encoding='utf-8'))
          expected_version = os.environ['EXPECTED_VERSION']
          expected_commit = os.environ['EXPECTED_COMMIT']
          assert payload.get('version') == expected_version, (payload, expected_version)
          assert payload.get('commit') == expected_commit, (payload, expected_commit)
          print('ARTICLE_DETAIL_RUNTIME_COMMIT_GREEN')
          PY

      - name: Open Artikeldetail echt als Eigenaar Admin en Kijker
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
        run: |
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/rezzerv-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill $vite_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/version.json >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              cat /tmp/rezzerv-vite.log
              exit 1
            fi
            sleep 1
          done
          node tests/e2e/article-detail-owner-mutation.smoke.mjs | tee /tmp/article-detail-owner-smoke.log
          grep -F 'ARTICLE_DETAIL_OWNER_MUTATION_BROWSER_GREEN' /tmp/article-detail-owner-smoke.log
