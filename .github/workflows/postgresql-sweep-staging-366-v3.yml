name: PostgreSQL portability sweep staging 366 v3

on:
  push:
    branches:
      - codex/postgresql-sweep-staging-366

permissions:
  contents: write

jobs:
  apply-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply classified PostgreSQL portability sweep
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          original = Path('.github/workflows/postgresql-sweep-staging-366.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          python backend/tests/postgresql_zero_residual_selftest.py"
          start = original.index(start_marker) + len(start_marker)
          end = original.index(end_marker, start)
          code = textwrap.dedent(original[start:end])
          old = "ast.parse((ROOT / path).read_text(encoding='utf-8'), filename=path)"
          new = "ast.parse((ROOT / path).read_text(encoding='utf-8-sig'), filename=path)"
          if code.count(old) != 1:
              raise SystemExit(f'BOM-safe AST replacement expected once, found {code.count(old)}')
          exec(compile(code.replace(old, new), '<postgresql-sweep-staging-366>', 'exec'))

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              data = target.read_text(encoding='utf-8')
              actual = data.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {actual}: {old!r}')
              target.write_text(data.replace(old, new), encoding='utf-8')
              print(f'PATCHED_FINAL {path}: {actual} x {old[:80]!r}')

          replace_exact(
              'backend/app/api/superuser_routes.py',
              'clauses = [f"datetime({created_column}) <= datetime(:end)", *extra_clauses]',
              'clauses = [f"{created_column} <= CAST(:end AS TIMESTAMPTZ)", *extra_clauses]',
              1,
          )
          replace_exact(
              'backend/app/api/superuser_routes.py',
              'clauses.append(f"({deleted_column} IS NULL OR datetime({deleted_column}) > datetime(:end))")',
              'clauses.append(f"({deleted_column} IS NULL OR {deleted_column} > CAST(:end AS TIMESTAMPTZ))")',
              1,
          )
          replace_exact(
              'backend/app/api/superuser_routes.py',
              'clauses.append("COALESCE(is_deleted, 0) = 0")',
              'clauses.append("COALESCE(is_deleted, FALSE) = FALSE")',
              1,
          )

          guard = 'backend/tests/postgresql_zero_residual_selftest.py'
          replace_exact(
              guard,
              '"PRAGMA": re.compile(r"^\\s*PRAGMA\\b", re.IGNORECASE),',
              '"PRAGMA": re.compile(r"^\\s*PRAGMA\\s+\\w+", re.IGNORECASE),',
              1,
          )
          replace_exact(
              guard,
              'def _string_literals(node: ast.AST):\n    for candidate in ast.walk(node):\n        if isinstance(candidate, ast.Constant) and isinstance(candidate.value, str):\n            yield candidate\n\n\n',
              'def _string_literals(node: ast.AST):\n    for candidate in ast.walk(node):\n        if isinstance(candidate, ast.Constant) and isinstance(candidate.value, str):\n            yield candidate\n\n\ndef _docstring_ids(tree: ast.AST) -> set[int]:\n    ids: set[int] = set()\n    for candidate in ast.walk(tree):\n        if not isinstance(candidate, (ast.Module, ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):\n            continue\n        body = getattr(candidate, "body", None) or []\n        if not body or not isinstance(body[0], ast.Expr):\n            continue\n        value = body[0].value\n        if isinstance(value, ast.Constant) and isinstance(value.value, str):\n            ids.add(id(value))\n    return ids\n\n\n',
              1,
          )
          replace_exact(
              guard,
              '        integer_boolean_names = _integer_boolean_names(tree)\n\n        # Scan every SQL-looking literal, not only literals nested directly in',
              '        integer_boolean_names = _integer_boolean_names(tree)\n        docstring_ids = _docstring_ids(tree)\n\n        # Scan every SQL-looking literal, not only literals nested directly in',
              1,
          )
          replace_exact(
              guard,
              '        for string_node in _string_literals(tree):\n            value = string_node.value',
              '        for string_node in _string_literals(tree):\n            if id(string_node) in docstring_ids:\n                continue\n            value = string_node.value',
              1,
          )
          PY

          python backend/tests/postgresql_zero_residual_selftest.py | tee /tmp/postgresql-sweep.log
          grep -F 'POSTGRESQL_ZERO_RESIDUAL_GATE_GREEN' /tmp/postgresql-sweep.log
          python -m compileall -q backend/app backend/tests/postgresql_zero_residual_selftest.py
          git diff --check

      - name: Commit clean staged sweep
        shell: bash
        run: |
          rm -f .github/workflows/postgresql-sweep-staging-366.yml
          rm -f .github/workflows/postgresql-sweep-staging-366-v2.yml
          rm -f .github/workflows/postgresql-sweep-staging-366-v3.yml
          git config user.name 'Michiel Uijting'
          git config user.email '169062718+MichielUijting@users.noreply.github.com'
          git add -A
          git commit -m 'Sweep PostgreSQL SQL portability residues'
          git push origin HEAD:codex/postgresql-sweep-staging-366
