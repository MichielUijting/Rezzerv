name: Inventory location household isolation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - 'backend/app/testing/postgresql_acceptance_foundation.py'
      - 'backend/app/services/inventory_location_household_patch.py'
      - 'backend/app/services/inventory_location_policy_service.py'
      - 'backend/app/services/inventory_location_event_policy_patch.py'
      - 'backend/app/services/purchase_import_location_policy_patch.py'
      - 'backend/app/services/canonical_inventory_identity_service.py'
      - 'backend/app/schemas/inventory.py'
      - 'backend/app/testing/inventory_location_household_isolation_contract.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/app/api/**/*inventory*'
      - 'backend/tests/**/*inventory*'
      - 'backend/tests/test_purchase_import_location_policy_patch.py'
      - '.github/workflows/inventory-location-household-isolation.yml'
  workflow_dispatch:

concurrency:
  group: inventory-location-household-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-inventory-location-household-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_inventory_identity_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_inventory_identity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_inventory_identity_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_inventory_identity_ci
      TEST_SCHEMA_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_inventory_identity_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Prepare shared PostgreSQL role boundary before focused schema guard
        uses: ./.github/actions/postgresql-acceptance-foundation
        with:
          database-name: rezzerv_inventory_identity_ci
          bootstrap-user: rezzerv_bootstrap
          bootstrap-password: rezzerv_bootstrap_ci
          port: '55432'
          migration-mode: none
          evidence-file: inventory-postgresql-foundation-pre-migration.log

      - name: Prove focused locationless identity guard with migrator-owned test schema
        run: |
          python -m pytest -q backend/tests/test_locationless_inventory_identity_guard.py
          echo 'INVENTORY_IDENTITY_POSTGRESQL_RUNTIME_DML_ONLY_GREEN'

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Revalidate shared PostgreSQL foundation at canonical Alembic head
        run: |
          python -m app.testing.postgresql_acceptance_foundation | tee inventory-postgresql-foundation.log
          grep -F 'POSTGRESQL_ACCEPTANCE_FOUNDATION_GREEN' inventory-postgresql-foundation.log

      - name: Compile inventory location contract and tests
        run: |
          python -m py_compile \
            backend/app/schemas/inventory.py \
            backend/app/services/inventory_location_household_patch.py \
            backend/app/services/inventory_location_policy_service.py \
            backend/app/services/inventory_location_event_policy_patch.py \
            backend/app/services/purchase_import_location_policy_patch.py \
            backend/app/services/canonical_inventory_identity_service.py \
            backend/app/testing/postgresql_acceptance_foundation.py \
            backend/app/testing/postgresql_onboarding_selftest_fixture.py \
            backend/app/testing/inventory_location_household_isolation_contract.py \
            backend/tests/test_inventory_location_policy_service.py \
            backend/tests/test_inventory_location_event_policy_patch.py \
            backend/tests/test_purchase_import_location_policy_patch.py \
            backend/tests/test_household_article_identity_slice2b4_inventory_contract.py

      - name: Run A-B location isolation contract on PostgreSQL
        run: |
          python -m app.testing.inventory_location_household_isolation_contract | tee inventory-location-isolation.log
          grep -F 'INVENTORY_LOCATION_HOUSEHOLD_ISOLATION_POSTGRESQL_GREEN' inventory-location-isolation.log
          grep -F 'INVENTORY_LOCATION_HOUSEHOLD_ISOLATION_GREEN' inventory-location-isolation.log

      - name: Run location policy and purchase adapter tests on PostgreSQL
        run: |
          python -m pytest -q \
            backend/tests/test_inventory_location_policy_service.py \
            backend/tests/test_inventory_location_event_policy_patch.py \
            backend/tests/test_purchase_import_location_policy_patch.py

      - name: Run household article inventory identity contract on PostgreSQL
        run: |
          python backend/tests/test_household_article_identity_slice2b4_inventory_contract.py | tee household-article-identity.log
          grep -F 'HOUSEHOLD_ARTICLE_IDENTITY_SLICE2B4_INVENTORY_POSTGRESQL_GREEN' household-article-identity.log
          grep -F 'HOUSEHOLD_ARTICLE_IDENTITY_SLICE2B4_INVENTORY_GREEN' household-article-identity.log

      - name: Upload shared foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-shared-postgresql-foundation
          path: |
            inventory-postgresql-foundation-pre-migration.log
            inventory-postgresql-foundation.log
          if-no-files-found: error
          retention-days: 7
