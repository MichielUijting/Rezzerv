name: F3-04 Kassa PostgreSQL boolean patch

on:
  push:
    branches:
      - codex/integral-test-foundation-phase-0
    paths:
      - '.github/workflows/f3-04-kassa-boolean-patch.yml'

permissions:
  contents: write

jobs:
  patch-kassa-booleans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/integral-test-foundation-phase-0
          fetch-depth: 0

      - name: Make Kassa boolean SQL PostgreSQL-native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('COALESCE(is_validated, 0)', 'COALESCE(is_validated, FALSE)', 3),
              ("COALESCE({alias}.is_deleted, 0) = 0", "COALESCE({alias}.is_deleted, FALSE) = FALSE", 1),
              ('COALESCE(totals_overridden, 0)', 'COALESCE(totals_overridden, FALSE)', 1),
              ('totals_overridden = 0,', 'totals_overridden = FALSE,', 1),
              ("'is_deleted': int(bool(row.get('is_deleted'))) if payload.is_deleted is None else int(bool(payload.is_deleted)),", "'is_deleted': bool(row.get('is_deleted')) if payload.is_deleted is None else bool(payload.is_deleted),", 1),
              ("'is_validated': int(bool(row.get('is_validated'))) if payload.is_validated is None else int(bool(payload.is_validated)),", "'is_validated': bool(row.get('is_validated')) if payload.is_validated is None else bool(payload.is_validated),", 1),
              (':confidence_score, 0, :is_validated, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP', ':confidence_score, FALSE, :is_validated, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP', 1),
              ("'is_validated': int(bool(payload.is_validated)),", "'is_validated': bool(payload.is_validated),", 1),
              (':totals_overridden = 1', ':totals_overridden IS TRUE', 2),
              ("'totals_overridden': 0 if totals_match else 1,", "'totals_overridden': not totals_match,", 1),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {actual}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile backend/app/main.py
          git diff --check
          git diff -- backend/app/main.py

      - name: Commit product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rezzerv-ci'
          git config user.email 'rezzerv-ci@users.noreply.github.com'
          git add backend/app/main.py
          git diff --cached --check
          git commit -m 'Make Kassa boolean handling PostgreSQL-native'
          git push origin HEAD:codex/integral-test-foundation-phase-0
