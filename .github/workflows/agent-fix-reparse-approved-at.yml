name: Agent fix reparse approved_at

on:
  push:
    branches:
      - agent/chronological-inventory-processing
    paths:
      - .github/agent-patches/fix_reparse_approved_at.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chronological-inventory-processing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python .github/agent-patches/fix_reparse_approved_at.py
      - name: Validate
        run: |
          python -m py_compile backend/app/main.py
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/main.py').read_text(encoding='utf-8')
          route = source.split('@app.post("/api/receipts/{receipt_table_id}/reparse")', 1)[1].split('@app.post("/api/receipts/reparse-suspicious")', 1)[0]
          assert 'approved_at, currency' in route
          assert 'ensure_unpack_batch_for_receipt(' in route
          print('reparse approval preservation guard: OK')
          PY
          git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/tests/test_receipt_inventory_lifecycle_route_wiring.py
          git commit -m "fix: preserve approval when rebuilding receipt unpack batch"
          git push origin HEAD:agent/chronological-inventory-processing
