name: Household invitation acceptance validation

on:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/app/api/household_invitation_acceptance_routes.py'
      - 'backend/app/api/session_household_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/household_invitation_acceptance_service.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/household_invitation_migrated_fixture.py'
      - 'backend/tests/household_invitation_acceptance_selftest.py'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/src/features/auth/InvitationAcceptancePage.jsx'
      - 'frontend/src/ui/Header.jsx'
      - 'frontend/tests/invitation-acceptance.contract.mjs'
      - 'frontend/tests/e2e/invitation-acceptance.frontend-regression.spec.js'
      - '.github/workflows/household-invitation-acceptance-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_invitation_acceptance_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_invitation_acceptance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_invitation_acceptance_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_invitation_acceptance_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client and backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -r requirements.txt

      - name: Bootstrap PostgreSQL migration and runtime roles
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_invitation_acceptance_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_invitation_acceptance_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_invitation_acceptance_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_invitation_acceptance_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"

      - name: Compile invitation acceptance
        working-directory: backend
        run: |
          python -m py_compile app/api/household_invitation_acceptance_routes.py
          python -m py_compile app/api/session_household_routes.py
          python -m py_compile app/services/household_invitation_acceptance_service.py
          python -m py_compile tests/household_invitation_acceptance_selftest.py

      - name: Validate invitation acceptance transaction contract
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/household_invitation_acceptance_selftest.py | tee /tmp/invitation-acceptance.log
          grep -F 'HOUSEHOLD_INVITATION_ACCEPTANCE_GREEN' /tmp/invitation-acceptance.log

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate invitation frontend contract
        working-directory: frontend
        run: |
          node tests/invitation-acceptance.contract.mjs | tee /tmp/invitation-acceptance-frontend.log
          grep -F 'INVITATION_ACCEPTANCE_FRONTEND_CONTRACT_GREEN' /tmp/invitation-acceptance-frontend.log

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Invitation acceptance gate marker
        run: echo 'ONBOARDING_V2_I2_INVITATION_ACCEPTANCE_GREEN'
