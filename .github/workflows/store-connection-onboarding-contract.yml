name: Winkelkoppelingen onboarding en AH auto-import contract

on:
  pull_request:
    paths:
      - 'backend/app/services/ah_receipt_background_sync.py'
      - 'backend/tests/test_ah_receipt_background_sync.py'
      - 'backend/app/api/retailer_receipt_routes.py'
      - 'backend/app/services/retailer_receipt_import_dates.py'
      - 'backend/tests/test_retailer_receipt_import_dates.py'
      - 'backend/app/main.py'
      - 'frontend/src/features/storeConnections/receiptConnectionOverviewModel.js'
      - 'frontend/src/features/storeConnections/StoreConnectionsPage.jsx'
      - 'frontend/src/features/kassa/KassaPage.jsx'
      - 'frontend/tests/receipt-connection-overview.contract.mjs'
      - 'frontend/tests/store-connections.contract.mjs'
      - '.github/workflows/store-connection-onboarding-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-onboarding-contract:
    name: Digital receipt overview and guarded AH background sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify honest retailer capability model and UI source
        run: |
          node frontend/tests/receipt-connection-overview.contract.mjs
          node frontend/tests/store-connections.contract.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated worker unit test dependencies
        run: python -m pip install --quiet pytest sqlalchemy alembic fastapi==0.115.0 httpx==0.28.1 cryptography==46.0.3 pydantic==2.12.5 'Pillow>=10,<13' 'psycopg[binary]==3.3.4'
      - name: Verify safe AH worker scheduling, locks and maintenance admission
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg://ci_dummy:ci_dummy@127.0.0.1/ci_unreachable
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: |
          python -m py_compile backend/app/services/ah_receipt_background_sync.py backend/app/services/retailer_receipt_import_dates.py backend/tests/test_ah_receipt_background_sync.py backend/tests/test_retailer_receipt_import_dates.py
          python -m pytest -q backend/tests/test_ah_receipt_background_sync.py backend/tests/test_retailer_receipt_import_dates.py
