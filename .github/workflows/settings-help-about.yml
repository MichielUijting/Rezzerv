name: Settings Help & About validation

on:
  pull_request:
    paths:
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/src/features/settings/SettingsHelpAboutPage.jsx'
      - 'frontend/src/features/settings/settingsNavigation.js'
      - 'frontend/src/ui/version.js'
      - 'frontend/tests/dynamic-settings-navigation.contract.mjs'
      - 'frontend/tests/settings-v2-information-architecture.contract.mjs'
      - 'frontend/tests/e2e/dynamic-settings.frontend-regression.spec.js'
      - 'frontend/tests/e2e/settings-help-about.frontend-regression.spec.js'
      - 'frontend/package.json'
      - '.github/workflows/settings-help-about.yml'
  workflow_dispatch:

concurrency:
  group: settings-help-about-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Settings v2 information architecture
        run: |
          node frontend/tests/settings-v2-information-architecture.contract.mjs | tee /tmp/settings-v2.log
          grep -F 'SETTINGS_V2_INFORMATION_ARCHITECTURE_CONTRACT_GREEN' /tmp/settings-v2.log

      - name: Validate dynamic Settings matrix
        run: |
          node frontend/tests/dynamic-settings-navigation.contract.mjs | tee /tmp/dynamic-settings.log
          grep -F 'DYNAMIC_SETTINGS_NAVIGATION_CONTRACT_GREEN' /tmp/dynamic-settings.log

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Help & About gate marker
        run: echo 'SETTINGS_HELP_ABOUT_VALIDATION_GREEN'
