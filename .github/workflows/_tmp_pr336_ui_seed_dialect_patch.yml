name: Temporary PR336 UI seed dialect patch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  patch-ui-seed-dialect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded cross-dialect UI seed patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''            return conn.execute(\n                text("INSERT INTO spaces (id, naam, household_id) VALUES (lower(hex(randomblob(16))), :naam, :household_id) RETURNING id"),\n                {"naam": name, "household_id": household_id},\n            ).scalar_one()\n''',
                  '''            space_id = str(uuid.uuid4())\n            return conn.execute(\n                text("INSERT INTO spaces (id, naam, household_id) VALUES (:id, :naam, :household_id) RETURNING id"),\n                {"id": space_id, "naam": name, "household_id": household_id},\n            ).scalar_one()\n''',
              ),
              (
                  '''            return conn.execute(\n                text("INSERT INTO sublocations (id, naam, space_id) VALUES (lower(hex(randomblob(16))), :naam, :space_id) RETURNING id"),\n                {"naam": name, "space_id": space_id},\n            ).scalar_one()\n''',
                  '''            sublocation_id = str(uuid.uuid4())\n            return conn.execute(\n                text("INSERT INTO sublocations (id, naam, space_id) VALUES (:id, :naam, :space_id) RETURNING id"),\n                {"id": sublocation_id, "naam": name, "space_id": space_id},\n            ).scalar_one()\n''',
              ),
              (
                  '''                return conn.execute(\n                    text("""\n                    INSERT INTO household_store_connections (\n                        id, household_id, store_provider_id, connection_status, external_account_ref, linked_at, created_at, updated_at\n                    ) VALUES (\n                        lower(hex(randomblob(16))), :household_id, :store_provider_id, 'active', :external_account_ref, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP\n                    ) RETURNING id\n                    """),\n                    {"household_id": household_id, "store_provider_id": provider['id'], "external_account_ref": external_ref},\n                ).scalar_one()\n''',
                  '''                connection_id = str(uuid.uuid4())\n                return conn.execute(\n                    text("""\n                    INSERT INTO household_store_connections (\n                        id, household_id, store_provider_id, connection_status, external_account_ref, linked_at, created_at, updated_at\n                    ) VALUES (\n                        :id, :household_id, :store_provider_id, 'active', :external_account_ref, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP\n                    ) RETURNING id\n                    """),\n                    {"id": connection_id, "household_id": household_id, "store_provider_id": provider['id'], "external_account_ref": external_ref},\n                ).scalar_one()\n''',
              ),
              (
                  '''                for index, line in enumerate(lines, start=1):\n                    conn.execute(\n''',
                  '''                for index, line in enumerate(lines, start=1):\n                    line_id = str(uuid.uuid4())\n                    conn.execute(\n''',
              ),
              (
                  '''                        ) VALUES (\n                            lower(hex(randomblob(16))), :batch_id, :external_line_ref, :external_article_code, :article_name_raw, :brand_raw, :quantity_raw, :unit_raw, :line_price_raw, :currency_code,\n''',
                  '''                        ) VALUES (\n                            :id, :batch_id, :external_line_ref, :external_article_code, :article_name_raw, :brand_raw, :quantity_raw, :unit_raw, :line_price_raw, :currency_code,\n''',
              ),
              (
                  '''                        {\n                            'batch_id': batch_id,\n''',
                  '''                        {\n                            'id': line_id,\n                            'batch_id': batch_id,\n''',
              ),
              (
                  '''                            'is_auto_prefilled': line.get('is_auto_prefilled', 0),\n''',
                  '''                            'is_auto_prefilled': bool(line.get('is_auto_prefilled', False)),\n''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed for UI seed replacement: expected 1 occurrence, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          start = source.index('def ensure_ui_test_seed_data():')
          end = source.index('\nensure_ui_test_seed_data()', start)
          contract = source[start:end]
          if 'randomblob(' in contract:
              raise SystemExit('SQLite randomblob remains in ensure_ui_test_seed_data')
          path.write_text(source, encoding='utf-8')
          print('PR336_UI_SEED_DIALECT_PATCH_APPLIED')
          PY
      - name: Validate UI seed DML contract
        run: |
          python -m py_compile backend/app/main.py
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/main.py').read_text(encoding='utf-8')
          start = source.index('def ensure_ui_test_seed_data():')
          end = source.index('\nensure_ui_test_seed_data()', start)
          contract = source[start:end]
          assert 'randomblob(' not in contract
          assert contract.count('str(uuid.uuid4())') >= 5
          assert "'is_auto_prefilled': bool(line.get('is_auto_prefilled', False))" in contract
          print('PR336_UI_SEED_DIALECT_CONTRACT_GREEN')
          PY
          git diff --check
      - name: Commit UI seed dialect fix
        run: |
          git config user.name rezzerv-ci-bot
          git config user.email 169062718+MichielUijting@users.noreply.github.com
          git add -- backend/app/main.py
          git commit -m 'Make UI startup seed PostgreSQL safe'
          git push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
