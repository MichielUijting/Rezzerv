name: CBS official complete appendix import
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/inhuis_cbs_official_appendix_import.py'
      - 'tools/test_cbs_official_appendix_import.py'
      - '.github/workflows/cbs-official-appendix-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-extract-official-appendix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate four-tab extractor with synthetic fixture
        env:
          PYTHONPATH: tools
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tools/test_cbs_official_appendix_import.py
      - name: Download pinned CBS original Excel (fail closed)
        run: |
          mkdir -p /tmp/cbs-2026
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            'https://www.cbs.nl/-/media/_excel/2026/04/bijlageecoicopv2indeling.xlsx' \
            --output /tmp/cbs-2026/original.xlsx
          echo '6871458274be87aa0126eab1bf334365502438f5e976845df8e5c28cdf95858f  /tmp/cbs-2026/original.xlsx' | sha256sum --check
      - name: Extract complete official source, all four tabs
        run: |
          python tools/inhuis_cbs_official_appendix_import.py \
            --xlsx /tmp/cbs-2026/original.xlsx \
            --out /tmp/cbs-2026/cbs_ecoicopv2_complete_source.json
      - name: Save verified original and full extracted source
        uses: actions/upload-artifact@v4
        with:
          name: cbs-ecoicopv2-official-full-appendix
          path: |
            /tmp/cbs-2026/original.xlsx
            /tmp/cbs-2026/cbs_ecoicopv2_complete_source.json
          retention-days: 30
          if-no-files-found: error
