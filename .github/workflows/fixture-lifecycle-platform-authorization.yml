name: Fixture lifecycle platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/fixture_lifecycle_route_authorization.py'
      - 'backend/app/services/purchase_import_batch_diagnostics_route_authorization.py'
      - 'backend/app/services/receipt_export_fixture_route_authorization.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/testing_status_route_authorization.py'
      - 'backend/tests/server_session_route_guard_audit.py'
      - 'backend/tests/test_fixture_lifecycle_platform_authorization.py'
      - 'backend/tests/test_purchase_import_batch_diagnostics_platform_authorization.py'
      - 'backend/tests/test_receipt_export_fixture_platform_authorization.py'
      - 'backend/tests/test_testing_status_platform_authorization.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - 'frontend/src/features/platform/PlatformTestFixturesPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-test-fixtures.frontend-regression.spec.js'
      - '.github/workflows/fixture-lifecycle-platform-authorization.yml'

jobs:
  fixture-lifecycle-platform-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_fixture_lifecycle_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_fixture_lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy alembic httpx 'psycopg[binary]==3.3.4'

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_fixture_lifecycle_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_fixture_lifecycle_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_fixture_lifecycle_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema for migrated authorization contract
        env:
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_fixture_lifecycle_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_fixture_lifecycle_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: python -m alembic upgrade head

      - name: Compile fixture authorization boundary and tests
        run: |
          python -m py_compile \
            app/session_entrypoint.py \
            app/services/fixture_lifecycle_route_authorization.py \
            app/services/purchase_import_batch_diagnostics_route_authorization.py \
            app/services/receipt_export_fixture_route_authorization.py \
            app/services/session_request_context.py \
            app/services/testing_status_route_authorization.py \
            tests/server_session_route_guard_audit.py \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_purchase_import_batch_diagnostics_platform_authorization.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_testing_status_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run focused fixture and testing diagnostics permission tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_purchase_import_batch_diagnostics_platform_authorization.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_testing_status_platform_authorization.py

      - name: Run migrated test orchestration authorization contract on PostgreSQL
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_fixture_lifecycle_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_fixture_lifecycle_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: pytest -q tests/test_test_orchestration_platform_route_authorization.py

      - name: Run server session route guard audit
        env:
          PYTHONPATH: .
        run: python tests/server_session_route_guard_audit.py
