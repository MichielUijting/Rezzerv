name: Fixture lifecycle platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/fixture_lifecycle_route_authorization.py'
      - 'backend/app/services/purchase_import_batch_diagnostics_route_authorization.py'
      - 'backend/app/services/receipt_export_fixture_route_authorization.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/testing_status_route_authorization.py'
      - 'backend/tests/server_session_route_guard_audit.py'
      - 'backend/tests/test_fixture_lifecycle_platform_authorization.py'
      - 'backend/tests/test_purchase_import_batch_diagnostics_platform_authorization.py'
      - 'backend/tests/test_receipt_export_fixture_platform_authorization.py'
      - 'backend/tests/test_testing_status_platform_authorization.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - 'frontend/src/features/platform/PlatformTestFixturesPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-test-fixtures.frontend-regression.spec.js'
      - '.github/workflows/fixture-lifecycle-platform-authorization.yml'

jobs:
  fixture-lifecycle-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile fixture authorization boundary and tests
        run: |
          python -m py_compile \
            app/session_entrypoint.py \
            app/services/fixture_lifecycle_route_authorization.py \
            app/services/purchase_import_batch_diagnostics_route_authorization.py \
            app/services/receipt_export_fixture_route_authorization.py \
            app/services/session_request_context.py \
            app/services/testing_status_route_authorization.py \
            tests/server_session_route_guard_audit.py \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_purchase_import_batch_diagnostics_platform_authorization.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_testing_status_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run fixture and testing diagnostics permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_purchase_import_batch_diagnostics_platform_authorization.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_testing_status_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run server session route guard audit
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python tests/server_session_route_guard_audit.py
