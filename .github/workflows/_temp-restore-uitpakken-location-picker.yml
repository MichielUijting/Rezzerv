name: TEMP apply Uitpakken location option race fix

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create
    paths:
      - '.github/workflows/_temp-restore-uitpakken-location-picker.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply scoped race fix
        run: python scripts/_temp_restore_uitpakken_location_picker.py

      - name: Run source contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/test_uitpakken_location_admin_contract.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit race fix
        run: |
          git config user.name "Rezzerv CI"
          git config user.email "actions@rezzerv.local"
          git add frontend/src/features/stores/StoreBatchDetailPage.jsx backend/tests/test_uitpakken_location_admin_contract.py
          git commit -m "fix(uitpakken): use refreshed locations after inline create"
          git push origin HEAD:fix/uitpakken-admin-location-create
