name: Auto-consume product-day branch bootstrap

on:
  push:
    branches:
      - codex/auto-consume-product-day-grouping
    paths:
      - '.github/workflows/auto-consume-product-day-bootstrap.yml'

permissions:
  contents: write

jobs:
  wire-product-day-rule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/auto-consume-product-day-grouping
          fetch-depth: 0

      - name: Wire product-day decision into store import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = '''from app.services.canonical_inventory_identity_service import (
              apply_inventory_purchase_by_identity,
              get_inventory_total_by_household_article,
          )
          '''
          import_replacement = import_anchor + '''from app.services.product_day_auto_consume_service import compute_product_day_auto_deduction
          '''

          signature_old = '''def determine_auto_consume_decision(conn, household_id: str, article_id: str, article_name: str, pre_purchase_total: float, purchased_quantity: float):
          '''
          signature_new = '''def determine_auto_consume_decision(
              conn,
              household_id: str,
              article_id: str,
              article_name: str,
              pre_purchase_total: float,
              purchased_quantity: float,
              purchase_date: str | None = None,
          ):
          '''

          deduction_old = '''    effective_mode = resolve_auto_consume_effective_mode(household_mode, article_override, consumable)
              requested_deduction_quantity = compute_auto_deduction_quantity(effective_mode, pre_purchase_total, purchased_quantity)
              should_auto_consume = requested_deduction_quantity > 0
          '''
          deduction_new = '''    effective_mode = resolve_auto_consume_effective_mode(household_mode, article_override, consumable)
              product_day_decision = compute_product_day_auto_deduction(
                  conn,
                  household_id=str(household_id),
                  household_article_id=str(article_id),
                  purchase_date=purchase_date,
                  mode=effective_mode,
                  pre_purchase_total=pre_purchase_total,
                  purchased_quantity=purchased_quantity,
              )
              requested_deduction_quantity = int(product_day_decision["requested_deduction_quantity"])
              should_auto_consume = requested_deduction_quantity > 0
          '''

          return_old = '''        'requested_deduction_quantity': requested_deduction_quantity,
                  'should_auto_consume': should_auto_consume,
                  'decision_reason': decision_reason,
              }
          '''
          return_new = '''        'requested_deduction_quantity': requested_deduction_quantity,
                  'should_auto_consume': should_auto_consume,
                  'decision_reason': decision_reason,
                  'product_day_applied': bool(product_day_decision.get("product_day_applied")),
                  'product_day': product_day_decision.get("purchase_day"),
                  'product_day_start_stock': int(product_day_decision.get("day_start_stock") or 0),
                  'product_day_prior_purchased_quantity': int(product_day_decision.get("prior_day_purchased_quantity") or 0),
                  'product_day_prior_auto_consumed_quantity': int(product_day_decision.get("prior_day_auto_consumed_quantity") or 0),
                  'product_day_cumulative_purchased_quantity': int(product_day_decision.get("cumulative_day_purchased_quantity") or 0),
              }
          '''

          call_old = '''                    article_name,
                      pre_purchase_total,
                      quantity,
                  )
          '''
          call_new = '''                    article_name,
                      pre_purchase_total,
                      quantity,
                      purchase_date=purchase_date,
                  )
          '''

          replacements = [
              ('import', import_anchor, import_replacement),
              ('signature', signature_old, signature_new),
              ('deduction', deduction_old, deduction_new),
              ('return', return_old, return_new),
              ('call', call_old, call_new),
          ]
          for label, old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count expected 1, got {count}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile \
            backend/app/main.py \
            backend/app/services/product_day_auto_consume_service.py \
            backend/tests/test_product_day_auto_consume_service.py \
            backend/tests/test_product_day_auto_consume_integration_contract.py

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check 'sqlalchemy>=2,<3' pytest

      - name: Run focused product-day regressions
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_product_day_auto_consume_service.py backend/tests/test_product_day_auto_consume_integration_contract.py

      - name: Commit wired production code
        shell: bash
        run: |
          if git diff --quiet -- backend/app/main.py; then
            echo 'No production wiring diff was produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'feat(inventory): group auto-consume by product day'
          git push origin HEAD:codex/auto-consume-product-day-grouping
