name: Temporary PR336 authorization authority patch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  patch-authorization-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply authorization foundation cutover
        run: python backend/tests/_tmp_pr336_authorization_foundation_patch.py
      - name: Prove authorization ensure has no DDL literals
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('backend/app/services/authorization_foundation_service.py')
          module = ast.parse(path.read_text(encoding='utf-8'))
          functions = {node.name: node for node in module.body if isinstance(node, ast.FunctionDef)}
          reachable = {'ensure_authorization_foundation', 'validate_authorization_foundation_schema', '_seed_registry'}
          forbidden = ('CREATE TABLE', 'ALTER TABLE', 'CREATE INDEX', 'DROP TABLE', 'DROP INDEX', 'PRAGMA table_info')
          for name in reachable:
              node = functions[name]
              literals = [str(item.value) for item in ast.walk(node) if isinstance(item, ast.Constant) and isinstance(item.value, str)]
              hits = [token for token in forbidden if any(token.lower() in literal.lower() for literal in literals)]
              assert not hits, (name, hits)
          print('AUTHORIZATION_FOUNDATION_RUNTIME_DDL_REMOVED_GREEN')
          PY
      - name: Compile and whitespace check
        run: |
          python -m py_compile backend/app/services/authorization_foundation_service.py
          git diff --check
      - name: Remove temporary script and commit production fix
        run: |
          rm backend/tests/_tmp_pr336_authorization_foundation_patch.py
          git config user.name rezzerv-ci-bot
          git config user.email 169062718+MichielUijting@users.noreply.github.com
          git add -- backend/app/services/authorization_foundation_service.py backend/tests/_tmp_pr336_authorization_foundation_patch.py
          git commit -m 'Make authorization foundation runtime validation-only'
          git push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
