name: Temporary PR336 invitation fixture batch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  migrate-invitation-selftest-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      REZZERV_EMAIL_ENABLED: 'false'
      REZZERV_SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Apply guarded invitation fixture migration
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('tests/household_invitation_foundation_selftest.py'),
              Path('tests/household_invitation_acceptance_selftest.py'),
              Path('tests/household_invitation_delivery_selftest.py'),
          ]
          foundation_import = 'from app.services.authorization_foundation_service import ensure_authorization_foundation\n'
          fixture_import = 'from app.testing.authorization_schema_fixture import install_authorization_schema\n'
          ensure_line = '        ensure_authorization_foundation(conn)\n'
          replacement = '        install_authorization_schema(conn)\n        ensure_authorization_foundation(conn)\n'

          for path in files:
              source = path.read_text(encoding='utf-8')
              if source.count(foundation_import) != 1:
                  raise SystemExit(f'{path}: expected one foundation import, found {source.count(foundation_import)}')
              if fixture_import in source:
                  raise SystemExit(f'{path}: fixture import already present')
              if source.count(ensure_line) != 1:
                  raise SystemExit(f'{path}: expected one foundation seed call, found {source.count(ensure_line)}')
              source = source.replace(foundation_import, foundation_import + fixture_import, 1)
              source = source.replace(ensure_line, replacement, 1)
              path.write_text(source, encoding='utf-8')
              print(f'PATCHED {path}')
          PY
      - name: Validate I.1-I.4 backend invitation closure
        run: |
          python -m py_compile \
            tests/household_invitation_foundation_selftest.py \
            tests/household_invitation_target_policy_selftest.py \
            tests/household_invitation_acceptance_selftest.py \
            tests/household_invitation_delivery_selftest.py \
            tests/household_invitation_delivery_redaction_selftest.py \
            tests/household_member_legacy_closure_selftest.py
          PYTHONPATH=. python tests/household_invitation_foundation_selftest.py
          PYTHONPATH=. python tests/household_invitation_target_policy_selftest.py
          PYTHONPATH=. python tests/household_invitation_acceptance_selftest.py
          PYTHONPATH=. python tests/household_invitation_delivery_selftest.py
          PYTHONPATH=. python tests/household_invitation_delivery_redaction_selftest.py
          PYTHONPATH=. python tests/household_member_legacy_closure_selftest.py
          git -C .. diff --check
          echo PR336_INVITATION_I1_I4_SELFTESTS_GREEN
      - name: Commit invitation fixture migration
        run: |
          git -C .. config user.name rezzerv-ci-bot
          git -C .. config user.email 169062718+MichielUijting@users.noreply.github.com
          git -C .. add -- \
            backend/tests/household_invitation_foundation_selftest.py \
            backend/tests/household_invitation_acceptance_selftest.py \
            backend/tests/household_invitation_delivery_selftest.py
          git -C .. commit -m 'Use authorization fixture in invitation selftests'
          git -C .. push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
