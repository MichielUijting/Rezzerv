name: GPC translation validation

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/services/gpc_translation_service.py"
      - "backend/app/services/gpc_official_translation_source.py"
      - "backend/app/cli/import_gpc_translations.py"
      - "backend/app/cli/download_gpc_translation.py"
      - "backend/tests/test_gpc_translation_service.py"
      - "backend/tests/test_gpc_official_translation_source.py"
      - "backend/tests/test_gpc_catalog_service.py"
      - ".github/workflows/gpc-translation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gpc-translations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_gpc_translation_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_gpc_translation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_gpc_translation_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_gpc_translation_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Bootstrap PostgreSQL migration and runtime roles
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_gpc_translation_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_gpc_translation_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_gpc_translation_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        working-directory: .
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_gpc_translation_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'GPC_TRANSLATION_RUNTIME_DML_ONLY_GREEN'

      - name: Compile translation modules
        run: |
          python -m py_compile app/services/gpc_translation_service.py
          python -m py_compile app/services/gpc_official_translation_source.py
          python -m py_compile app/cli/import_gpc_translations.py
          python -m py_compile app/cli/download_gpc_translation.py
          python -m py_compile tests/test_gpc_translation_service.py
          python -m py_compile tests/test_gpc_official_translation_source.py
          python -m py_compile tests/test_gpc_catalog_service.py

      - name: Validate multilingual overlay and official source adapter on PostgreSQL
        run: python -m pytest -q tests/test_gpc_translation_service.py tests/test_gpc_official_translation_source.py tests/test_gpc_catalog_service.py
