name: TP-CI-05 Receipt shared full-stack PostgreSQL validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/alembic/**'
      - 'backend/app/db.py'
      - 'backend/app/main.py'
      - 'backend/app/receipt_ingestion/**'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'backend/app/services/f6_failure_injection.py'
      - 'backend/app/testing/receipt_parsing/**'
      - 'backend/tests/tp_ci_05_receipt_shared_verify.py'
      - 'frontend/src/app/router/**'
      - 'frontend/src/features/kassa/**'
      - 'frontend/src/features/receipts/**'
      - 'frontend/src/features/stores/**'
      - 'frontend/src/features/onboarding/**'
      - 'frontend/src/features/articles/**'
      - 'frontend/src/features/almostOut/**'
      - 'frontend/src/pages/Voorraad.jsx'
      - 'frontend/tests/e2e/p0-receipt-inventory.fullstack.spec.js'
      - 'frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js'
      - 'frontend/tests/e2e/p0-receipt-inventory-idempotency.fullstack.spec.js'
      - 'frontend/tests/e2e/p0-receipt-nonphysical.fullstack.spec.js'
      - 'frontend/tests/e2e/f6-receipt-controlled-5xx.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'scripts/ci/shared_fullstack_plan.py'
      - 'quality/ci/tp_ci_05_receipt_shared_stack_paths.json'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
      - 'docker/postgresql/**'
      - '.github/workflows/p0-receipt-inventory-fullstack-postgresql-validation.yml'
      - '.github/workflows/p0-receipt-inventory-locations-off-fullstack-postgresql-validation.yml'
      - '.github/workflows/p0-receipt-inventory-idempotency-fullstack-postgresql-validation.yml'
      - '.github/workflows/p0-receipt-nonphysical-fullstack-postgresql-validation.yml'
      - '.github/workflows/f6-receipt-controlled-5xx-postgresql-validation.yml'
      - '.github/workflows/tp-ci-05-receipt-shared-stack-postgresql-validation.yml'
  workflow_dispatch:
    inputs:
      authority:
        description: Receipt authority to run on the shared stack
        required: true
        default: both
        type: choice
        options:
          - both
          - p0-receipt-inventory
          - p0-receipt-locations-off
          - p0-receipt-idempotency
          - p0-receipt-nonphysical
          - f6-receipt

permissions:
  contents: read

concurrency:
  group: tp-ci-05-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Receipt shared-stack authority plan
    runs-on: ubuntu-latest
    outputs:
      p0_receipt_inventory: ${{ steps.plan.outputs.p0_receipt_inventory }}
      p0_receipt_locations_off: ${{ steps.plan.outputs.p0_receipt_locations_off }}
      p0_receipt_idempotency: ${{ steps.plan.outputs.p0_receipt_idempotency }}
      p0_receipt_nonphysical: ${{ steps.plan.outputs.p0_receipt_nonphysical }}
      f6_receipt: ${{ steps.plan.outputs.f6_receipt }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout exact candidate for authority planning
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select Receipt authorities from current delta
        id: plan
        shell: bash
        env:
          INPUT_AUTHORITY: ${{ inputs.authority || 'both' }}
        run: |
          set -euo pipefail
          python scripts/ci/shared_fullstack_plan.py \
            --manifest quality/ci/tp_ci_05_receipt_shared_stack_paths.json \
            --fallback-authorities p0_receipt_inventory,p0_receipt_locations_off,p0_receipt_idempotency,p0_receipt_nonphysical,f6_receipt \
            | tee tp-ci-05-receipt-plan.log
          grep -E '^P0_RECEIPT_INVENTORY=(true|false)$' tp-ci-05-receipt-plan.log
          grep -E '^P0_RECEIPT_LOCATIONS_OFF=(true|false)$' tp-ci-05-receipt-plan.log
          grep -E '^P0_RECEIPT_IDEMPOTENCY=(true|false)$' tp-ci-05-receipt-plan.log
          grep -E '^P0_RECEIPT_NONPHYSICAL=(true|false)$' tp-ci-05-receipt-plan.log
          grep -E '^F6_RECEIPT=(true|false)$' tp-ci-05-receipt-plan.log
          grep -E '^ANY=(true|false)$' tp-ci-05-receipt-plan.log

  shared-receipt-fullstack:
    name: Shared Receipt Docker PostgreSQL Playwright authority runner
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - name: Checkout exact candidate once
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare deterministic Receipt identities once
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          l403_password="L4-Receipt-${suffix}-Pass!"
          l404_password="L4-Locations-Off-${suffix}-Pass!"
          l405_password="L4-Idempotency-${suffix}-Pass!"
          nonphysical_password="P0-Nonphysical-${suffix}-Pass!"
          f6_password="F6-Receipt-${suffix}-Pass!"
          {
            echo "PLAYWRIGHT_L4_RECEIPT_EMAIL=l4-receipt-${suffix}@example.com"
            echo "PLAYWRIGHT_L4_RECEIPT_PASSWORD=$l403_password"
            echo "PLAYWRIGHT_L4_RECEIPT_HOUSEHOLD=L4 Receipt Household ${suffix}"
            echo "PLAYWRIGHT_L4_RECEIPT_LOCATION=L4 Voorraad ${suffix}"
            echo "PLAYWRIGHT_L4_04_EMAIL=l4-locations-off-${suffix}@example.com"
            echo "PLAYWRIGHT_L4_04_PASSWORD=$l404_password"
            echo "PLAYWRIGHT_L4_04_HOUSEHOLD=L4 Locations Off ${suffix}"
            echo "PLAYWRIGHT_L4_IDEMPOTENCY_EMAIL=l4-idempotency-${suffix}@example.com"
            echo "PLAYWRIGHT_L4_IDEMPOTENCY_PASSWORD=$l405_password"
            echo "PLAYWRIGHT_L4_IDEMPOTENCY_HOUSEHOLD=L4 Idempotency Household ${suffix}"
            echo "PLAYWRIGHT_L4_IDEMPOTENCY_LOCATION=L4 Idempotency Voorraad ${suffix}"
            echo "PLAYWRIGHT_P0_NONPHYSICAL_EMAIL=p0-nonphysical-${suffix}@example.com"
            echo "PLAYWRIGHT_P0_NONPHYSICAL_PASSWORD=$nonphysical_password"
            echo "PLAYWRIGHT_P0_NONPHYSICAL_HOUSEHOLD=P0 Nonphysical ${suffix}"
            echo "PLAYWRIGHT_F6_RECEIPT_EMAIL=f6-receipt-${suffix}@example.com"
            echo "PLAYWRIGHT_F6_RECEIPT_PASSWORD=$f6_password"
            echo "PLAYWRIGHT_F6_RECEIPT_HOUSEHOLD=F6 Receipt Household ${suffix}"
            echo "PLAYWRIGHT_F6_RECEIPT_LOCATION=F6 Receipt Location ${suffix}"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$l403_password"
          echo "::add-mask::$l404_password"
          echo "::add-mask::$l405_password"
          echo "::add-mask::$nonphysical_password"
          echo "::add-mask::$f6_password"
          echo 'TP_CI_05_RECEIPT_IDENTITIES_PREPARED_GREEN'

      - name: Guard selected Receipt browser authorities against shortcuts
        shell: bash
        env:
          RUN_L403: ${{ needs.plan.outputs.p0_receipt_inventory }}
          RUN_L404: ${{ needs.plan.outputs.p0_receipt_locations_off }}
          RUN_L405: ${{ needs.plan.outputs.p0_receipt_idempotency }}
          RUN_NONPHYSICAL: ${{ needs.plan.outputs.p0_receipt_nonphysical }}
          RUN_F6: ${{ needs.plan.outputs.f6_receipt }}
        run: |
          set -euo pipefail
          guard() {
            local spec="$1"
            if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
              echo "Receipt authority mag kern-API niet mocken of via browserrequest-mutaties uitvoeren: $spec" >&2
              exit 1
            fi
          }
          [[ "$RUN_L403" != true ]] || guard frontend/tests/e2e/p0-receipt-inventory.fullstack.spec.js
          [[ "$RUN_L404" != true ]] || guard frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js
          [[ "$RUN_L405" != true ]] || guard frontend/tests/e2e/p0-receipt-inventory-idempotency.fullstack.spec.js
          if [[ "$RUN_NONPHYSICAL" == true ]]; then
            spec=frontend/tests/e2e/p0-receipt-nonphysical.fullstack.spec.js
            guard "$spec"
            grep -F 'setInputFiles(path)' "$spec"
            grep -F "getByTestId('receipt-process-button').click()" "$spec"
            grep -F 'not.toContainText(/KOOPZEGELS/i)' "$spec"
          fi
          if [[ "$RUN_F6" == true ]]; then
            spec=frontend/tests/e2e/f6-receipt-controlled-5xx.fullstack.spec.js
            guard "$spec"
            grep -F "getByTestId('receipt-process-button').click()" "$spec"
            grep -F 'expect(processResponse.status()).toBe(500)' "$spec"
            grep -F 'F6_RECEIPT_BROWSER_ROLLBACK_GREEN' "$spec"
          fi
          echo 'TP_CI_05_RECEIPT_NO_CORE_SHORTCUTS_GREEN'

      - name: Compile shared Receipt authority sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/tests/tp_ci_05_receipt_shared_verify.py backend/app/services/f6_failure_injection.py
          node --check frontend/tests/e2e/p0-receipt-inventory.fullstack.spec.js
          node --check frontend/tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js
          node --check frontend/tests/e2e/p0-receipt-inventory-idempotency.fullstack.spec.js
          node --check frontend/tests/e2e/p0-receipt-nonphysical.fullstack.spec.js
          node --check frontend/tests/e2e/f6-receipt-controlled-5xx.fullstack.spec.js
          echo 'TP_CI_05_RECEIPT_AUTHORITY_COMPILE_GREEN'

      - name: Build application images once and prepare Playwright once
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          timeout --signal=TERM --kill-after=30s 600s docker compose --progress plain build
          echo 'TP_CI_05_DOCKER_BUILD_ONCE_GREEN'
          docker pull "$PLAYWRIGHT_IMAGE"
          echo 'TP_CI_05_PLAYWRIGHT_PULL_ONCE_GREEN'
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" bash -lc 'npm ci'
          echo 'TP_CI_05_NPM_CI_ONCE_GREEN'
          echo "TP_CI_05_SHARED_PREP_SECONDS=$(( $(date +%s) - start_epoch ))"

      - name: Run L4-03 Receipt inventory authority on shared images
        id: l403
        if: needs.plan.outputs.p0_receipt_inventory == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rc=$?; if (( rc != 0 )); then docker compose ps || true; docker compose logs --no-color --tail=500 backend frontend postgres || true; fi; docker compose down -v --remove-orphans || true; exit "$rc"; }
          trap cleanup EXIT
          phase_start="$(date +%s)"
          docker compose up -d --no-build
          for attempt in $(seq 1 180); do curl --fail --silent http://localhost:8011/api/health >/dev/null && break; (( attempt < 180 )) || exit 1; sleep 2; done
          docker compose exec -T backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py boundary-l4-03 | tee p0-l4-03-postgresql-boundary.log
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" rm -rf test-results playwright-report-fullstack
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_RECEIPT_EMAIL="$PLAYWRIGHT_L4_RECEIPT_EMAIL" \
            -e PLAYWRIGHT_L4_RECEIPT_PASSWORD="$PLAYWRIGHT_L4_RECEIPT_PASSWORD" \
            -e PLAYWRIGHT_L4_RECEIPT_HOUSEHOLD="$PLAYWRIGHT_L4_RECEIPT_HOUSEHOLD" \
            -e PLAYWRIGHT_L4_RECEIPT_LOCATION="$PLAYWRIGHT_L4_RECEIPT_LOCATION" \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-receipt-inventory.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-l4-03-browser.log"
          grep -F 'P0_L4_03_RECEIPT_INVENTORY_BROWSER_GREEN' frontend/p0-l4-03-browser.log
          grep -F 'P0_L4_03_ALMOST_OUT_TRANSITION_BROWSER_GREEN' frontend/p0-l4-03-browser.log
          test -s frontend/p0-l4-03-browser-proof.json
          proof_json="$(cat frontend/p0-l4-03-browser-proof.json)"
          docker compose exec -T -e TP_CI_05_EMAIL="$PLAYWRIGHT_L4_RECEIPT_EMAIL" -e TP_CI_05_PROOF_JSON="$proof_json" backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py verify-l4-03 | tee p0-l4-03-postgresql-end-state.log
          echo 'P0_RECEIPT_INVENTORY_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_05_L403_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload L4-03 evidence from shared runner
        if: always() && needs.plan.outputs.p0_receipt_inventory == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-03-receipt-inventory-evidence-shared-runner
          path: |
            p0-l4-03-postgresql-boundary.log
            p0-l4-03-postgresql-end-state.log
            frontend/p0-l4-03-browser.log
            frontend/p0-l4-03-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Run L4-04 Receipt locations-off authority on shared images
        id: l404
        if: needs.plan.outputs.p0_receipt_locations_off == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rc=$?; if (( rc != 0 )); then docker compose ps || true; docker compose logs --no-color --tail=500 backend frontend postgres || true; fi; docker compose down -v --remove-orphans || true; exit "$rc"; }
          trap cleanup EXIT
          phase_start="$(date +%s)"
          docker compose up -d --no-build
          for attempt in $(seq 1 180); do curl --fail --silent http://localhost:8011/api/health >/dev/null && break; (( attempt < 180 )) || exit 1; sleep 2; done
          docker compose exec -T backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py boundary-l4-04 | tee p0-l4-04-postgresql-boundary.log
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" rm -rf test-results playwright-report-fullstack
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_04_EMAIL="$PLAYWRIGHT_L4_04_EMAIL" \
            -e PLAYWRIGHT_L4_04_PASSWORD="$PLAYWRIGHT_L4_04_PASSWORD" \
            -e PLAYWRIGHT_L4_04_HOUSEHOLD="$PLAYWRIGHT_L4_04_HOUSEHOLD" \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-receipt-inventory-locations-off.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-l4-04-browser.log"
          grep -F 'P0_L4_04_LOCATIONS_OFF_BROWSER_GREEN' frontend/p0-l4-04-browser.log
          grep -F 'P0_L4_04_LOCATIONLESS_INVENTORY_BROWSER_GREEN' frontend/p0-l4-04-browser.log
          test -s frontend/p0-l4-04-browser-proof.json
          proof_json="$(cat frontend/p0-l4-04-browser-proof.json)"
          docker compose exec -T -e TP_CI_05_EMAIL="$PLAYWRIGHT_L4_04_EMAIL" -e TP_CI_05_PROOF_JSON="$proof_json" backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py verify-l4-04 | tee p0-l4-04-postgresql-end-state.log
          echo 'P0_RECEIPT_LOCATIONS_OFF_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_05_L404_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload L4-04 evidence from shared runner
        if: always() && needs.plan.outputs.p0_receipt_locations_off == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-04-locations-off-evidence-shared-runner
          path: |
            p0-l4-04-postgresql-boundary.log
            p0-l4-04-postgresql-end-state.log
            frontend/p0-l4-04-browser.log
            frontend/p0-l4-04-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Run L4-05 Receipt idempotency authority on shared images
        id: l405
        if: needs.plan.outputs.p0_receipt_idempotency == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rc=$?; if (( rc != 0 )); then docker compose ps || true; docker compose logs --no-color --tail=500 backend frontend postgres || true; fi; docker compose down -v --remove-orphans || true; exit "$rc"; }
          trap cleanup EXIT
          phase_start="$(date +%s)"
          docker compose up -d --no-build
          for attempt in $(seq 1 180); do curl --fail --silent http://localhost:8011/api/health >/dev/null && break; (( attempt < 180 )) || exit 1; sleep 2; done
          docker compose exec -T backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py boundary-l4-05 | tee p0-l4-05-postgresql-boundary.log
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" rm -rf test-results playwright-report-fullstack
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_IDEMPOTENCY_EMAIL="$PLAYWRIGHT_L4_IDEMPOTENCY_EMAIL" \
            -e PLAYWRIGHT_L4_IDEMPOTENCY_PASSWORD="$PLAYWRIGHT_L4_IDEMPOTENCY_PASSWORD" \
            -e PLAYWRIGHT_L4_IDEMPOTENCY_HOUSEHOLD="$PLAYWRIGHT_L4_IDEMPOTENCY_HOUSEHOLD" \
            -e PLAYWRIGHT_L4_IDEMPOTENCY_LOCATION="$PLAYWRIGHT_L4_IDEMPOTENCY_LOCATION" \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-receipt-inventory-idempotency.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-l4-05-browser.log"
          grep -F 'P0_L4_05_BROWSER_IDEMPOTENCY_GREEN' frontend/p0-l4-05-browser.log
          test -s frontend/p0-l4-05-browser-proof.json
          proof_json="$(cat frontend/p0-l4-05-browser-proof.json)"
          docker compose exec -T -e TP_CI_05_PROOF_JSON="$proof_json" backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py verify-l4-05 | tee p0-l4-05-postgresql-end-state.log
          echo 'P0_RECEIPT_IDEMPOTENCY_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_05_L405_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload L4-05 evidence from shared runner
        if: always() && needs.plan.outputs.p0_receipt_idempotency == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-05-idempotency-evidence-shared-runner
          path: |
            p0-l4-05-postgresql-boundary.log
            p0-l4-05-postgresql-end-state.log
            frontend/p0-l4-05-browser.log
            frontend/p0-l4-05-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Run P0 nonphysical Receipt authority on shared images
        id: nonphysical
        if: needs.plan.outputs.p0_receipt_nonphysical == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rc=$?; if (( rc != 0 )); then docker compose ps || true; docker compose logs --no-color --tail=500 backend frontend postgres || true; fi; docker compose down -v --remove-orphans || true; exit "$rc"; }
          trap cleanup EXIT
          phase_start="$(date +%s)"
          docker compose up -d --no-build
          for attempt in $(seq 1 180); do curl --fail --silent http://localhost:8011/api/health >/dev/null && break; (( attempt < 180 )) || exit 1; sleep 2; done
          docker compose exec -T backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py boundary-nonphysical | tee p0-nonphysical-postgresql-boundary.log
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" rm -rf test-results playwright-report-fullstack
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_P0_NONPHYSICAL_EMAIL="$PLAYWRIGHT_P0_NONPHYSICAL_EMAIL" \
            -e PLAYWRIGHT_P0_NONPHYSICAL_PASSWORD="$PLAYWRIGHT_P0_NONPHYSICAL_PASSWORD" \
            -e PLAYWRIGHT_P0_NONPHYSICAL_HOUSEHOLD="$PLAYWRIGHT_P0_NONPHYSICAL_HOUSEHOLD" \
            -e PLAYWRIGHT_P0_NONPHYSICAL_FIXTURE=/fixtures/Jumbo_koopzegels.txt \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -v "$GITHUB_WORKSPACE/backend/app/testing/receipt_parsing/raw:/fixtures:ro" \
            -w /work "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/p0-receipt-nonphysical.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-nonphysical-browser.log"
          grep -F 'P0_NONPHYSICAL_RECEIPT_BROWSER_GREEN' frontend/p0-nonphysical-browser.log
          grep -F 'P0_NONPHYSICAL_NO_INVENTORY_MUTATION_BROWSER_GREEN' frontend/p0-nonphysical-browser.log
          test -s frontend/p0-nonphysical-browser-proof.json
          proof_json="$(cat frontend/p0-nonphysical-browser-proof.json)"
          docker compose exec -T -e TP_CI_05_PROOF_JSON="$proof_json" backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py verify-nonphysical | tee p0-nonphysical-postgresql-end-state.log
          echo 'P0_RECEIPT_NONPHYSICAL_FULLSTACK_POSTGRESQL_GREEN'
          echo "TP_CI_05_NONPHYSICAL_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload nonphysical evidence from shared runner
        if: always() && needs.plan.outputs.p0_receipt_nonphysical == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p0-receipt-nonphysical-evidence-shared-runner
          path: |
            p0-nonphysical-postgresql-boundary.log
            p0-nonphysical-postgresql-end-state.log
            frontend/p0-nonphysical-browser.log
            frontend/p0-nonphysical-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Run F6 Receipt controlled-5xx authority on shared images
        id: f6
        if: needs.plan.outputs.f6_receipt == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > f6-receipt-compose.override.yml <<'YAML'
          services:
            backend:
              environment:
                REZZERV_TEST_ONLY_F6_SQL_FAILURE_INJECTION: "1"
                REZZERV_TEST_ONLY_F6_RECEIPT_FINALIZATION_FAILURE: "1"
          YAML
          export COMPOSE_FILE="docker-compose.yml:docker-compose.postgresql.yml:f6-receipt-compose.override.yml"
          cleanup() { rc=$?; if (( rc != 0 )); then docker compose ps || true; docker compose logs --no-color --tail=500 backend frontend postgres || true; fi; docker compose down -v --remove-orphans || true; exit "$rc"; }
          trap cleanup EXIT
          phase_start="$(date +%s)"
          docker compose up -d --no-build
          for attempt in $(seq 1 180); do curl --fail --silent http://localhost:8011/api/health >/dev/null && break; (( attempt < 180 )) || exit 1; sleep 2; done
          docker compose exec -T backend python -u - <<'PY' | tee f6-receipt-runtime-boundary.log
          from sqlalchemy import text
          from app.db import engine
          from app.services.f6_failure_injection import _enabled, _receipt_finalization_enabled
          assert engine.dialect.name == 'postgresql'
          assert _enabled() is True
          assert _receipt_finalization_enabled() is True
          with engine.begin() as conn:
              user = str(conn.execute(text('SELECT current_user')).scalar_one())
              create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
          assert user == 'rezzerv_app' and create is False
          print('F6_RECEIPT_FAILURE_HOOK_ENABLED_GREEN')
          print('F6_RECEIPT_POSTGRESQL_RUNTIME_GREEN')
          PY
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" rm -rf test-results playwright-report-fullstack
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_F6_RECEIPT_EMAIL="$PLAYWRIGHT_F6_RECEIPT_EMAIL" \
            -e PLAYWRIGHT_F6_RECEIPT_PASSWORD="$PLAYWRIGHT_F6_RECEIPT_PASSWORD" \
            -e PLAYWRIGHT_F6_RECEIPT_HOUSEHOLD="$PLAYWRIGHT_F6_RECEIPT_HOUSEHOLD" \
            -e PLAYWRIGHT_F6_RECEIPT_LOCATION="$PLAYWRIGHT_F6_RECEIPT_LOCATION" \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work "$PLAYWRIGHT_IMAGE" \
            bash -lc "set -o pipefail; npx playwright test tests/e2e/f6-receipt-controlled-5xx.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/f6-receipt-controlled-5xx-browser.log"
          grep -F 'F6_RECEIPT_REAL_500_FEEDBACK_GREEN' frontend/f6-receipt-controlled-5xx-browser.log
          grep -F 'F6_RECEIPT_BROWSER_ROLLBACK_GREEN' frontend/f6-receipt-controlled-5xx-browser.log
          grep -F 'F6_RECEIPT_ALMOST_OUT_UNCHANGED_GREEN' frontend/f6-receipt-controlled-5xx-browser.log
          test -s frontend/f6-receipt-controlled-5xx-browser-proof.json
          proof_json="$(cat frontend/f6-receipt-controlled-5xx-browser-proof.json)"
          docker compose exec -T -e TP_CI_05_EMAIL="$PLAYWRIGHT_F6_RECEIPT_EMAIL" -e TP_CI_05_PROOF_JSON="$proof_json" backend python -u /app/tests/tp_ci_05_receipt_shared_verify.py verify-f6 | tee f6-receipt-postgresql-rollback.log
          docker compose logs --no-color backend > f6-receipt-backend.log
          grep -F 'F6-01-RECEIPT-CONTROLLED-500: injected controlled receipt finalization failure' f6-receipt-backend.log
          echo 'F6_RECEIPT_SERVER_INJECTION_PROVEN_GREEN'
          echo 'F6_RECEIPT_CONTROLLED_5XX_POSTGRESQL_ROLLBACK_GREEN'
          echo "TP_CI_05_F6_SECONDS=$(( $(date +%s) - phase_start ))"

      - name: Upload F6 Receipt evidence from shared runner
        if: always() && needs.plan.outputs.f6_receipt == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f6-receipt-controlled-5xx-evidence-shared-runner
          path: |
            f6-receipt-runtime-boundary.log
            f6-receipt-postgresql-rollback.log
            f6-receipt-backend.log
            frontend/f6-receipt-controlled-5xx-browser.log
            frontend/f6-receipt-controlled-5xx-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce selected Receipt authorities and shared-stack gate
        if: always()
        shell: bash
        env:
          RUN_L403: ${{ needs.plan.outputs.p0_receipt_inventory }}
          RUN_L404: ${{ needs.plan.outputs.p0_receipt_locations_off }}
          RUN_L405: ${{ needs.plan.outputs.p0_receipt_idempotency }}
          RUN_NONPHYSICAL: ${{ needs.plan.outputs.p0_receipt_nonphysical }}
          RUN_F6: ${{ needs.plan.outputs.f6_receipt }}
          L403_OUTCOME: ${{ steps.l403.outcome }}
          L404_OUTCOME: ${{ steps.l404.outcome }}
          L405_OUTCOME: ${{ steps.l405.outcome }}
          NONPHYSICAL_OUTCOME: ${{ steps.nonphysical.outcome }}
          F6_OUTCOME: ${{ steps.f6.outcome }}
        run: |
          set -euo pipefail
          echo "run_l403=$RUN_L403 outcome_l403=$L403_OUTCOME"
          echo "run_l404=$RUN_L404 outcome_l404=$L404_OUTCOME"
          echo "run_l405=$RUN_L405 outcome_l405=$L405_OUTCOME"
          echo "run_nonphysical=$RUN_NONPHYSICAL outcome_nonphysical=$NONPHYSICAL_OUTCOME"
          echo "run_f6=$RUN_F6 outcome_f6=$F6_OUTCOME"
          [[ "$RUN_L403" != true || "$L403_OUTCOME" == success ]] || exit 1
          [[ "$RUN_L404" != true || "$L404_OUTCOME" == success ]] || exit 1
          [[ "$RUN_L405" != true || "$L405_OUTCOME" == success ]] || exit 1
          [[ "$RUN_NONPHYSICAL" != true || "$NONPHYSICAL_OUTCOME" == success ]] || exit 1
          [[ "$RUN_F6" != true || "$F6_OUTCOME" == success ]] || exit 1
          echo 'TP_CI_05_RECEIPT_SHARED_STACK_GREEN'
