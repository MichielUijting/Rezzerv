name: TEMP fix Uitpakken admin session authority

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create
    paths:
      - '.github/workflows/_temp-fix-uitpakken-admin-session-ssot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create
          fetch-depth: 0

      - name: Patch product and contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          product = Path('frontend/src/features/stores/StoreBatchDetailPage.jsx')
          text = product.read_text(encoding='utf-8')
          old = '  const canManageLocations = isHouseholdAdminFromContext(household)'
          new = '  const canManageLocations = isHouseholdAdminFromContext()'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'STOP: product admin authority anchor count={count}, expected 1')
          product.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          contract = Path('backend/tests/test_uitpakken_location_admin_contract.py')
          ctext = contract.read_text(encoding='utf-8')
          oldc = '    assert "const canManageLocations = isHouseholdAdminFromContext(household)" in text\n'
          newc = '    assert "const canManageLocations = isHouseholdAdminFromContext()" in text\n    assert "const canManageLocations = isHouseholdAdminFromContext(household)" not in text\n'
          countc = ctext.count(oldc)
          if countc != 1:
              raise SystemExit(f'STOP: contract admin authority anchor count={countc}, expected 1')
          contract.write_text(ctext.replace(oldc, newc, 1), encoding='utf-8', newline='\n')

          print('PASS: Uitpakken Admin authority now uses session SSOT')
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/test_uitpakken_location_admin_contract.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/stores/StoreBatchDetailPage.jsx backend/tests/test_uitpakken_location_admin_contract.py
          git commit -m 'fix(uitpakken): use session authority for admin location actions'
          git push origin HEAD:fix/uitpakken-admin-location-create
