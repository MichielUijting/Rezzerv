name: Receipt scanner boundary validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/integrations/receipt_scanners/**'
      - 'backend/app/services/receipt_service.py'
      - 'backend/tests/test_receipt_scanner_**'
      - 'backend/tests/test_pr245_status_and_loyalty_contract.py'
      - '.github/workflows/receipt-scanner-boundary-validation.yml'
  workflow_dispatch:

concurrency:
  group: receipt-scanner-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-a-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal backend dependencies
        run: |
          python -m pip install --quiet \
            pytest \
            pydantic==2.12.5 \
            sqlalchemy

      - name: Compile scanner boundary
        run: |
          python -m compileall -q backend/app/integrations/receipt_scanners

      - name: Run Release A contract, gateway and persistence compatibility tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_receipt_scanner_release_a.py \
            backend/tests/test_receipt_scanner_persistence_compat.py \
            backend/tests/test_receipt_scanner_line_count_equivalence.py \
            backend/tests/test_pr245_status_and_loyalty_contract.py

      - name: Assert no scanner-specific dependency leaks into gateway
        run: |
          ! grep -R -E 'paddleocr|tesseract|ocrmypdf|profiles\.' backend/app/integrations/receipt_scanners/gateway.py

      - name: Assert legacy adapter is the only production parser caller behind boundary
        run: |
          grep -F 'from app.services.receipt_service import parse_receipt_content' backend/app/integrations/receipt_scanners/adapters/rezzerv_legacy.py
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          assert text.count('scan_receipt_content_via_gateway(') == 2
          PY
