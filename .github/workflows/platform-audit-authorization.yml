name: Platform Audit authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/platform_audit_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_platform_audit_route_authorization.py'
      - '.github/workflows/platform-audit-authorization.yml'

jobs:
  platform-audit-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile platform Audit boundary and tests
        run: |
          python -m py_compile \
            app/api/platform_audit_routes.py \
            app/api/router.py \
            tests/test_platform_audit_route_authorization.py

      - name: Run platform Audit authorization tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest -q tests/test_platform_audit_route_authorization.py
