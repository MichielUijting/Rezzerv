name: F6-05 temporary audit closure helper

on:
  push:
    branches:
      - codex/f6-05-authorization-functional-4xx-closure
    paths:
      - '.github/workflows/f6-05-audit-closure-helper.yml'

permissions:
  contents: write

jobs:
  close-f6-05-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/f6-05-authorization-functional-4xx-closure
          fetch-depth: 0

      - name: Close exact F6-05 audit scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path('quality/acceptance/f6_failure_recovery_gap_audit.json')
          validator_path = Path('scripts/acceptance/validate_f6_failure_recovery_gap_audit.py')

          proof_run = '34634787635'
          proof_job = '103379928634'
          proof_sha = 'f611837dbf25e6bf69f32d1d623d6ef7a8ef7d88'
          workflow = '.github/workflows/f6-05-authorization-functional-4xx-validation.yml'
          verifier = 'backend/tests/f6_05_authorization_functional_4xx_verify.py'
          reused = 'backend/tests/test_authorization_membership_routes.py'

          notes = {
              'P0-ACCOUNT-SESSION': (
                  'F6-05 bewijst via de echte /api/auth/register-route dat dubbele registratie functioneel met HTTP 409 wordt afgewezen; '
                  'de directe PostgreSQL-eindcontrole bewijst exact één account, membership en sessie zonder duplicate-vervuiling; '
                  f'proof run {proof_run}, job {proof_job} op candidate {proof_sha}.'
              ),
              'P0-HOUSEHOLD-MEMBERSHIP': (
                  'F6-05 herbewijst de productiegerichte membership-route: demotie van de laatste beheerder wordt functioneel met HTTP 409 afgewezen; '
                  f'proof run {proof_run}, job {proof_job} op candidate {proof_sha}.'
              ),
              'P0-AUTHORIZATION-ISOLATION': (
                  'F6-05 herbewijst de productiegerichte authorization-route: een platformpermission in household-scope wordt functioneel met HTTP 400 afgewezen; '
                  f'proof run {proof_run}, job {proof_job} op candidate {proof_sha}.'
              ),
              'P0-PLATFORM-AUTHORITY': (
                  'F6-05 bewijst via echte IP-owner login en platform-authorizations route dat een role-grant naar een niet-bestaande target functioneel HTTP 404 Gebruiker niet gevonden levert; '
                  'de directe PostgreSQL-eindcontrole bewijst nul target-user-, platformrol- en auditvervuiling; '
                  f'proof run {proof_run}, job {proof_job} op candidate {proof_sha}.'
              ),
          }
          scope = set(notes)

          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          rows = {row['id']: row for row in audit['scenarios']}
          assert scope <= rows.keys()
          for scenario_id in scope:
              row = rows[scenario_id]
              assert row['assessments']['functional_4xx'] == 'partial', (scenario_id, row['assessments']['functional_4xx'])
              row['assessments']['functional_4xx'] = 'covered'
              evidence = row.setdefault('evidence', [])
              if workflow not in evidence:
                  evidence.append(workflow)
              if scenario_id in {'P0-ACCOUNT-SESSION', 'P0-PLATFORM-AUTHORITY'} and verifier not in evidence:
                  evidence.append(verifier)
              if scenario_id in {'P0-HOUSEHOLD-MEMBERSHIP', 'P0-AUTHORIZATION-ISOLATION'}:
                  assert reused in evidence
              row.setdefault('notes', {})['functional_4xx'] = notes[scenario_id]

          summary = audit['summary']
          assert (summary['covered'], summary['partial'], summary['gap'], summary['na']) == (39, 52, 26, 23)
          summary['covered'] = 43
          summary['partial'] = 48
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          text = validator_path.read_text(encoding='utf-8')
          old_counts = 'EXPECTED_COUNTS = {"covered": 39, "partial": 52, "gap": 26, "na": 23}'
          new_counts = 'EXPECTED_COUNTS = {"covered": 43, "partial": 48, "gap": 26, "na": 23}'
          assert text.count(old_counts) == 1
          text = text.replace(old_counts, new_counts)

          const_anchor = 'F6_04_PROOF_SHA = "da0d94c74cd02b3dbc658ab9713ddf18bdd6f7ce"\n'
          assert text.count(const_anchor) == 1
          constants = const_anchor + (
              'F6_05_VERIFY = "backend/tests/f6_05_authorization_functional_4xx_verify.py"\n'
              'F6_05_WORKFLOW = ".github/workflows/f6-05-authorization-functional-4xx-validation.yml"\n'
              f'F6_05_PROOF_RUN = "{proof_run}"\n'
              f'F6_05_PROOF_JOB = "{proof_job}"\n'
              f'F6_05_PROOF_SHA = "{proof_sha}"\n'
          )
          text = text.replace(const_anchor, constants)

          anchor = '    account = next(row for row in scenarios if row["id"] == "P0-ACCOUNT-SESSION")\n'
          assert text.count(anchor) == 1
          block = '''    f6_05_scope = {"P0-ACCOUNT-SESSION", "P0-HOUSEHOLD-MEMBERSHIP", "P0-AUTHORIZATION-ISOLATION", "P0-PLATFORM-AUTHORITY"}\n    f6_05_rows = [row for row in scenarios if row["id"] in f6_05_scope]\n    require(len(f6_05_rows) == 4, "f6_05_exact_four_scope_scenarios")\n    require(\n        all(row["assessments"]["functional_4xx"] == "covered" for row in f6_05_rows),\n        "f6_05_functional_4xx_scope_fully_covered",\n    )\n    require((ROOT / F6_05_VERIFY).exists(), "f6_05_postgresql_verifier_registered")\n    require((ROOT / F6_05_WORKFLOW).exists(), "f6_05_workflow_registered")\n    for row in f6_05_rows:\n        evidence = set(row.get("evidence") or [])\n        require(F6_05_WORKFLOW in evidence, f"f6_05_{row['id']}_workflow_evidence_registered")\n        if row["id"] in {"P0-ACCOUNT-SESSION", "P0-PLATFORM-AUTHORITY"}:\n            require(F6_05_VERIFY in evidence, f"f6_05_{row['id']}_verifier_evidence_registered")\n        proof_note = row.get("notes", {}).get("functional_4xx", "")\n        require(F6_05_PROOF_RUN in proof_note, f"f6_05_{row['id']}_proof_run_registered")\n        require(F6_05_PROOF_JOB in proof_note, f"f6_05_{row['id']}_proof_job_registered")\n        require(F6_05_PROOF_SHA in proof_note, f"f6_05_{row['id']}_candidate_registered")\n\n'''
          text = text.replace(anchor, block + anchor)
          validator_path.write_text(text, encoding='utf-8')
          PY

          python scripts/acceptance/validate_f6_failure_recovery_gap_audit.py | tee /tmp/f6-05-audit.log
          grep -F 'PASS f6_count_covered_43' /tmp/f6-05-audit.log
          grep -F 'PASS f6_count_partial_48' /tmp/f6-05-audit.log
          grep -F 'PASS f6_count_gap_26' /tmp/f6-05-audit.log
          grep -F 'PASS f6_count_na_23' /tmp/f6-05-audit.log
          grep -F 'PASS f6_05_functional_4xx_scope_fully_covered' /tmp/f6-05-audit.log
          grep -F 'F6_FAILURE_RECOVERY_GAP_AUDIT_GREEN' /tmp/f6-05-audit.log

      - name: Commit exact F6-05 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quality/acceptance/f6_failure_recovery_gap_audit.json scripts/acceptance/validate_f6_failure_recovery_gap_audit.py
          git diff --cached --exit-code && { echo 'Expected closure diff missing' >&2; exit 1; } || true
          git commit -m 'F6-05: close functional 4xx audit residuals'
          git push origin HEAD:codex/f6-05-authorization-functional-4xx-closure
