name: Temporal inventory validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/services/temporal_inventory_service.py'
      - 'backend/tests/test_temporal_inventory_service.py'
      - '.github/workflows/temporal-inventory-validation.yml'

jobs:
  validate-temporal-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install --quiet pytest sqlalchemy fastapi
      - name: Compile temporal inventory service
        run: python -m compileall -q backend/app/services/temporal_inventory_service.py backend/tests/test_temporal_inventory_service.py
      - name: Prove import-order invariance
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_temporal_inventory_service.py
