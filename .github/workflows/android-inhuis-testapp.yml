name: Inhuis Android native Jumbo testapp
on:
  pull_request:
    paths:
      - 'packaging/mobile-inhuis-app/**'
      - '.github/workflows/android-inhuis-testapp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packaging/mobile-inhuis-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test native protocol and proven Jumbo/Lidl browser functions
        run: npm test
      - name: Verify Inhuis Jumbo and Lidl bridge and context contracts
        working-directory: frontend
        run: |
          node tests/jumbo-import-context.contract.mjs
          node tests/native-jumbo-transport.contract.mjs
          node tests/native-lidl-transport.contract.mjs
          node tests/lidl-web-receipt-bridge.contract.mjs
          node tests/jumbo-receipt-poc-bridge.contract.mjs
      - name: Install locked dependencies and audit
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Build Inhuis Android project
        run: |
          npm run build
          npx --no-install cap add android
          npx --no-install cap sync android
      - name: Set exact Inhuis Android version from canonical package
        run: node sync-android-version.mjs
      - name: Use optional stable private test signing identity
        env:
          KEYSTORE_B64: ${{ secrets.INHUIS_ANDROID_TEST_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo 'Geen vaste testsleutel: Gradle gebruikt de standaard debug-ondertekening. Updatecompatibiliteit is niet gegarandeerd.'
            exit 0
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Assemble debug-signed test APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify native APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT"
          EXPECTED_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 1 | grep -F "versionName='${EXPECTED_VERSION}'"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: inhuis-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packaging/mobile-inhuis-app/android/app/build/outputs/apk/debug/app-debug.apk
            packaging/mobile-inhuis-app/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
