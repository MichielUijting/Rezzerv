name: Inhuis Android native Jumbo testapp
on:
  pull_request:
    paths:
      - 'packaging/mobile-inhuis-app/**'
      - '.github/workflows/android-inhuis-testapp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packaging/mobile-inhuis-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test native protocol and proven Jumbo browser functions
        run: npm test
      - name: Install locked dependencies and audit
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Build Inhuis Android project
        run: |
          npm run build
          npx --no-install cap add android
          npx --no-install cap sync android
      - name: Restore stable private APK signing identity (fail closed)
        env:
          KEYSTORE_B64: ${{ secrets.INHUIS_ANDROID_TEST_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Geen vaste private Android-testsleutel beschikbaar; APK-publicatie geblokkeerd.'; exit 1; }
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Assemble consistently signed APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify native APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: inhuis-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packaging/mobile-inhuis-app/android/app/build/outputs/apk/debug/app-debug.apk
            packaging/mobile-inhuis-app/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
