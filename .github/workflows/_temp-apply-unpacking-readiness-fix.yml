name: Apply unpacking readiness patch

on:
  push:
    branches:
      - fix/unpacking-readiness-article-model
    paths:
      - '.github/workflows/_temp-apply-unpacking-readiness-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Patch and commit source through GitHub API
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: fix/unpacking-readiness-article-model
        run: |
          import base64
          import json
          import os
          import re
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          path = 'frontend/src/features/stores/StoreBatchDetailPage.jsx'
          api = f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'

          def request(url, *, method='GET', payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          current = request(api)
          sha = current['sha']
          text = base64.b64decode(current['content']).decode('utf-8').replace('\r\n', '\n')
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 match, got {count}'
              text = text.replace(old, new, 1)

          replace_once(
              "  const effectiveLocationId = String(draft?.locationId || '')\n\n  const hasValidArticle",
              "  const effectiveLocationId = String(draft?.locationId || '')\n  const effectiveQuantity = Number(line?.quantity_raw ?? 0)\n\n  const hasValidArticle",
              'effective quantity',
          )
          replace_once(
              "  const hasArticleGroup = Boolean(effectiveArticleGroupId)\n  const hasValidLocation = Boolean(effectiveLocationId) && validLocationIds.has(effectiveLocationId)\n  const isProcessable = hasProcessSource\n    && hasArticleGroup\n    && hasValidLocation",
              "  const hasArticleGroup = Boolean(effectiveArticleGroupId)\n  const hasValidQuantity = Number.isFinite(effectiveQuantity) && effectiveQuantity > 0\n  const hasValidLocation = Boolean(effectiveLocationId) && validLocationIds.has(effectiveLocationId)\n  const isProcessable = hasProcessSource\n    && hasValidQuantity\n    && hasValidLocation",
              'readiness gate',
          )
          replace_once(
              "    effectiveArticleGroupId,\n    effectiveLocationId,\n    hasValidArticle,",
              "    effectiveArticleGroupId,\n    effectiveLocationId,\n    effectiveQuantity,\n    hasValidArticle,",
              'return effective quantity',
          )
          replace_once(
              "    hasProcessSource,\n    hasArticleGroup,\n    hasValidLocation,\n    isProcessable,",
              "    hasProcessSource,\n    hasArticleGroup,\n    hasValidQuantity,\n    hasValidLocation,\n    isProcessable,",
              'return quantity readiness',
          )

          replace_once(
              "        const hasArticle = Boolean(String(line.matched_household_article_id || '').trim())\n        const hasGlobalProduct = Boolean(String(line.matched_global_product_id || '').trim())\n        const hasRawArticleName = Boolean(String(line.article_name_raw || '').trim())\n        const hasArticleGroup = Boolean(String(draft.articleGroupId || '').trim())\n        const hasValidLocation = validLocationIds.has(String(draft.locationId || ''))\n        return !hasArticle\n          && !hasGlobalProduct\n          && hasRawArticleName\n          && hasArticleGroup\n          && hasValidLocation",
              "        const hasArticle = Boolean(String(line.matched_household_article_id || '').trim())\n        const hasRawArticleName = Boolean(String(line.article_name_raw || '').trim())\n        const quantity = Number(line.quantity_raw ?? 0)\n        const hasValidQuantity = Number.isFinite(quantity) && quantity > 0\n        const hasValidLocation = validLocationIds.has(String(draft.locationId || ''))\n        return !hasArticle\n          && hasRawArticleName\n          && hasValidQuantity\n          && hasValidLocation",
              'auto create hidden household article',
          )

          replace_once(
              "        hasProcessSource,\n        hasArticleGroup,\n        hasValidLocation,\n        isProcessable,",
              "        hasProcessSource,\n        hasArticleGroup,\n        hasValidQuantity,\n        hasValidLocation,\n        isProcessable,",
              'line state destructure',
          )
          replace_once(
              "        } else if (!hasValidLocation) {\n          statusKey = 'action_needed'\n          statusLabel = 'Actie nodig'\n          statusReason = 'Locatie ontbreekt.'\n        } else if (!hasArticleGroup) {\n          statusKey = 'action_needed'\n          statusLabel = 'Actie nodig'\n          statusReason = 'Artikelgroep ontbreekt.'\n        } else {",
              "        } else if (!hasValidQuantity) {\n          statusKey = 'action_needed'\n          statusLabel = 'Actie nodig'\n          statusReason = 'Aantal ontbreekt of is niet geldig.'\n        } else if (!hasValidLocation) {\n          statusKey = 'action_needed'\n          statusLabel = 'Actie nodig'\n          statusReason = 'Locatie ontbreekt.'\n        } else {",
              'status reasons',
          )
          replace_once(
              "        hasProcessSource,\n        hasArticleGroup,\n        hasValidLocation,\n        statusKey,",
              "        hasProcessSource,\n        hasArticleGroup,\n        hasValidQuantity,\n        hasValidLocation,\n        statusKey,",
              'line ui state quantity',
          )

          replace_once('>Mijn artikel</ResizableHeaderCell>', '>Artikelgroep</ResizableHeaderCell>', 'table heading')
          old_filter = '<th><select className="rz-input rz-inline-input" value={mappingFilter} onChange={(event) => setMappingFilter(event.target.value)} aria-label="Filter op Mijn artikel">{MAPPING_FILTERS.map((filter) => <option key={filter.key} value={filter.key}>{filter.label}</option>)}</select></th>'
          replace_once(old_filter, '<th />', 'obsolete mapping filter')

          old_selector = '''                      <td onClick={(event) => event.stopPropagation()} onDoubleClick={(event) => event.stopPropagation()}>
                        <StoreArticleSelector
                          lineId={line.id}
                          lineName={line.article_name_raw}
                          selectedArticleId={entry.draft.articleId || ''}
                          articleOptions={articleOptions}
                          disabled={busyLineId === line.id || isProcessingBatch}
                          onChange={(nextArticleId) => persistLineDraft(line, { articleId: nextArticleId ?? '' })}
                          onClearArticle={() => persistLineDraft(line, { articleId: '' })}
                          onCreateArticle={(articleName) => handleCreateArticleFromLine(line.id, articleName)}
                          canCreateArticle={Boolean(household?.permissions?.['article.create'])}
                        />
                      </td>'''
          new_selector = '''                      <td onClick={(event) => event.stopPropagation()} onDoubleClick={(event) => event.stopPropagation()}>
                        <select
                          className="rz-input rz-inline-input"
                          value={entry.draft.articleGroupId || ''}
                          disabled={busyLineId === line.id || isProcessingBatch || isViewer}
                          aria-label={`Artikelgroep voor ${line.article_name_raw}`}
                          data-testid={`receipt-line-article-group-select-${line.id}`}
                          onChange={(event) => {
                            const nextValue = event.target.value
                            if (nextValue === '__add_article_group__') {
                              openCreateArticleGroup(line.id)
                              return
                            }
                            persistLineDraft(line, { articleGroupId: nextValue })
                          }}
                        >
                          <option value="">Niet ingedeeld</option>
                          {articleGroupOptions.map((group) => <option key={group.id} value={group.id}>{group.name}</option>)}
                          {canCreateArticleGroup ? <option value="__add_article_group__">Artikelgroep toevoegen...</option> : null}
                        </select>
                      </td>'''
          replace_once(old_selector, new_selector, 'table article group selector')

          detail_pattern = r'\n\s*<div className="rz-receipt-line-detail__wide"><dt>Mijn artikel</dt><dd data-testid=\{`receipt-line-article-select-\$\{line\.id\}`\}><StoreArticleSelector.*?</dd></div>'
          text, count = re.subn(detail_pattern, '', text, count=1, flags=re.S)
          assert count == 1, f'detail Mijn artikel removal: expected 1 match, got {count}'
          text = text.replace('<option value="">Kies artikelgroep</option>', '<option value="">Niet ingedeeld</option>')
          text = text.replace("'Kies eerst Mijn artikel.'", "'Deze cataloguskoppeling is pas beschikbaar nadat het voorraadartikel technisch bestaat.'")
          text = text.replace("'Mijn artikel was al aan dit universele artikel gekoppeld.'", "'Het voorraadartikel was al aan dit universele artikel gekoppeld.'")
          text = text.replace("'Mijn artikel is aan het universele artikel gekoppeld.'", "'Het voorraadartikel is aan het universele artikel gekoppeld.'")
          text = text.replace("'Koppelen aan Mijn artikel'", "'Koppelen'")
          text = text.replace('<span>Kies eerst Mijn artikel.</span>', '<span>Het technische voorraadartikel bestaat nog niet.</span>')
          replace_once(
              '{processConfirm.readyCount} geselecteerde regel(s) zijn klaar voor verwerking en {processConfirm.incompleteCount} regel(s) missen nog artikel/product, locatie of artikelgroep.',
              '{processConfirm.readyCount} geselecteerde regel(s) zijn klaar voor verwerking en {processConfirm.incompleteCount} regel(s) missen nog bonartikel, geldig aantal of locatie.',
              'process warning',
          )

          assert '&& hasArticleGroup\n    && hasValidLocation' not in text
          assert "statusReason = 'Artikelgroep ontbreekt.'" not in text
          assert 'artikel/product, locatie of artikelgroep' not in text
          assert '&& hasArticleGroup\n          && hasValidLocation' not in text
          assert '&& !hasGlobalProduct\n          && hasRawArticleName' not in text
          assert '>Mijn artikel</ResizableHeaderCell>' not in text
          assert '>Artikelgroep</ResizableHeaderCell>' in text
          assert '<option value="">Niet ingedeeld</option>' in text
          assert 'hasValidQuantity' in text and 'effectiveQuantity' in text
          assert 'matched_household_article_id' in text
          assert text != original

          payload = {
              'message': 'fix: apply unpacking readiness article model',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': sha,
              'branch': branch,
          }
          result = request(f'https://api.github.com/repos/{repo}/contents/{path}', method='PUT', payload=payload)
          print('PRODUCT_COMMIT', result['commit']['sha'])
