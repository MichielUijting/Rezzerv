name: Apply unpacking readiness patch

on:
  push:
    branches:
      - fix/unpacking-readiness-article-model
    paths:
      - '.github/workflows/_temp-apply-unpacking-readiness-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply article group UI repair through GitHub API
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: fix/unpacking-readiness-article-model
        run: |
          import base64
          import json
          import os
          import re
          import sys
          import urllib.request

          def report_exception(exc_type, exc, tb):
              message = f'{exc_type.__name__}: {exc}'.replace('\n', ' ')
              print(f'::error title=Article group UI repair::{message}')
              sys.__excepthook__(exc_type, exc, tb)
          sys.excepthook = report_exception

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          path = 'frontend/src/features/stores/StoreBatchDetailPage.jsx'

          def request(url, *, method='GET', payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          api = f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'
          current = request(api)
          sha = current['sha']
          text = base64.b64decode(current['content']).decode('utf-8').replace('\r\n', '\n')
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)
              print(f'PASS {label}')

          replace_once('>Mijn artikel</ResizableHeaderCell>', '>Artikelgroep</ResizableHeaderCell>', 'table heading')

          text, count = re.subn(
              r'<th><select(?:(?!</th>).)*?value=\{mappingFilter\}(?:(?!</th>).)*?</select></th>',
              '<th />',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'obsolete Mijn artikel filter: expected 1 match, got {count}')
          print('PASS mapping filter removal')

          table_selector = r'''<td onClick=\{\(event\) => event\.stopPropagation\(\)\} onDoubleClick=\{\(event\) => event\.stopPropagation\(\)\}>\s*<StoreArticleSelector\s+lineId=\{line\.id\}\s+lineName=\{line\.article_name_raw\}\s+selectedArticleId=\{entry\.draft\.articleId \|\| ''\}.*?</td>'''
          table_replacement = '''<td onClick={(event) => event.stopPropagation()} onDoubleClick={(event) => event.stopPropagation()}>
                        <select
                          className="rz-input rz-inline-input"
                          value={entry.draft.articleGroupId || ''}
                          disabled={busyLineId === line.id || isProcessingBatch || isViewer}
                          aria-label={`Artikelgroep voor ${line.article_name_raw}`}
                          data-testid={`receipt-line-article-group-select-${line.id}`}
                          onChange={(event) => {
                            const nextValue = event.target.value
                            if (nextValue === '__add_article_group__') {
                              openCreateArticleGroup(line.id)
                              return
                            }
                            persistLineDraft(line, { articleGroupId: nextValue })
                          }}
                        >
                          <option value="">Niet ingedeeld</option>
                          {articleGroupOptions.map((group) => <option key={group.id} value={group.id}>{group.name}</option>)}
                          {canCreateArticleGroup ? <option value="__add_article_group__">Artikelgroep toevoegen...</option> : null}
                        </select>
                      </td>'''
          text, count = re.subn(table_selector, table_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'table article group selector: expected 1 match, got {count}')
          print('PASS table article group selector')

          detail_pattern = r'<div className="rz-receipt-line-detail__wide"><dt>Mijn artikel</dt><dd data-testid=\{`receipt-line-article-select-\$\{line\.id\}`\}>.*?</dd></div>'
          text, count = re.subn(detail_pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'Mijn artikel detail removal: expected 1 match, got {count}')
          print('PASS Mijn artikel detail removal')

          text = text.replace('<option value="">Kies artikelgroep</option>', '<option value="">Niet ingedeeld</option>')
          text = text.replace("'Kies eerst Mijn artikel.'", "'Het technische voorraadartikel bestaat nog niet.'")
          text = text.replace("'Mijn artikel was al aan dit universele artikel gekoppeld.'", "'Het voorraadartikel was al aan dit universele artikel gekoppeld.'")
          text = text.replace("'Mijn artikel is aan het universele artikel gekoppeld.'", "'Het voorraadartikel is aan het universele artikel gekoppeld.'")
          text = text.replace("'Koppelen aan Mijn artikel'", "'Koppelen'")
          text = text.replace('<span>Kies eerst Mijn artikel.</span>', '<span>Het technische voorraadartikel bestaat nog niet.</span>')

          if 'Mijn artikel' in text:
              raise RuntimeError('zichtbare term Mijn artikel staat nog in Uitpakken')
          if '>Artikelgroep</ResizableHeaderCell>' not in text:
              raise RuntimeError('Artikelgroep ontbreekt als hoofdkolom')
          if '<option value="">Niet ingedeeld</option>' not in text:
              raise RuntimeError('Niet ingedeeld ontbreekt als geldige lege Artikelgroep')
          if 'matched_household_article_id' not in text:
              raise RuntimeError('technisch household article-anker is verdwenen')
          if 'articleId' not in text:
              raise RuntimeError('intern articleId is verdwenen')
          if text == original:
              raise RuntimeError('geen UI-bronwijziging geproduceerd')

          payload = {
              'message': 'fix: replace visible Mijn artikel with optional Artikelgroep',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': sha,
              'branch': branch,
          }
          result = request(f'https://api.github.com/repos/{repo}/contents/{path}', method='PUT', payload=payload)
          print('PRODUCT_COMMIT', result['commit']['sha'])
