name: PostgreSQL runtime startup schema authority

on:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/app/api/**'
      - 'backend/app/db.py'
      - 'backend/app/main.py'
      - 'backend/app/migration_db.py'
      - 'backend/app/runtime_preflight.py'
      - 'backend/app/schema_migration_preflight.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/**'
      - 'backend/tests/postgresql_*'
      - 'backend/tests/runtime_startup_schema_authority_selftest.py'
      - '.github/workflows/postgresql-runtime-startup-schema-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-startup-ddl-lockdown:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://rezzerv_app@127.0.0.1:5432/rezzerv
      MIGRATION_DATABASE_URL: postgresql://rezzerv_migrator@127.0.0.1:5432/rezzerv
      RECEIPT_STORAGE_ROOT: /tmp/rezzerv-receipts/raw
      REZZERV_RECEIPT_STARTUP_REMBG_WARMUP: 'false'
      REZZERV_RECEIPT_STARTUP_PADDLE_WARMUP: 'false'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'true'
      REZZERV_ENV: test
      REZZERV_PASSWORD_RESET_RATE_LIMIT_SECRET: 'ci-password-reset-rate-limit-secret-20260902-at-least-32-characters'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure migration and runtime roles
        run: |
          psql -h 127.0.0.1 -U postgres -d rezzerv -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE rezzerv_migrator LOGIN;
          CREATE ROLE rezzerv_app LOGIN;
          GRANT CONNECT ON DATABASE rezzerv TO rezzerv_migrator, rezzerv_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rezzerv_migrator;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Prove runtime source remains schema-mutation free
        run: |
          python backend/tests/runtime_startup_schema_authority_selftest.py | tee /tmp/runtime-startup-static.log
          grep -F 'RUNTIME_STARTUP_SCHEMA_MUTATION_REMOVED_GREEN' /tmp/runtime-startup-static.log
          python backend/tests/postgresql_authorization_sql_portability_selftest.py
          python backend/tests/postgresql_external_catalog_sql_authority_selftest.py
          python backend/tests/postgresql_gpc_barcode_sql_authority_selftest.py
          python backend/tests/postgresql_gpc_residual_sql_authority_selftest.py
          python backend/tests/postgresql_day_article_direct_sql_authority_selftest.py
          python backend/tests/postgresql_onboarding_use_case_sql_portability_selftest.py
          python backend/tests/postgresql_household_invitation_sql_authority_selftest.py
          python backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py

      - name: Migrate with dedicated Alembic role
        working-directory: backend
        run: |
          python -m app.schema_migration_preflight | tee /tmp/runtime-startup-migration.log
          grep -F "'dialect': 'postgresql'" /tmp/runtime-startup-migration.log
          grep -F "'revision': '20260902_01'" /tmp/runtime-startup-migration.log

      - name: Prove runtime role has no schema CREATE privilege
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d rezzerv -Atc "SELECT has_schema_privilege('rezzerv_app', 'public', 'CREATE')")" = "f"
          if psql -h 127.0.0.1 -U rezzerv_app -d rezzerv -v ON_ERROR_STOP=1 -c 'CREATE TABLE runtime_ddl_should_fail(id integer)'; then
            echo 'Runtime role unexpectedly created a table' >&2
            exit 1
          fi
          echo 'POSTGRESQL_RUNTIME_DDL_DENIED_GREEN'

      - name: Prove request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_core_request_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_authorization_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_external_catalog_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_gpc_barcode_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_gpc_residual_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_day_article_direct_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_onboarding_use_case_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_household_invitation_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_platform_feature_support_dml_only_selftest.py
          env -u MIGRATION_DATABASE_URL python tests/postgresql_password_reset_dml_only_selftest.py | tee /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_RUNTIME_CREATE_DENIED_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_RUNTIME_DDL_ABSENT_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_DML_ONLY_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_AUTHORITY_SELFTEST_GREEN' /tmp/password-reset-dml-only.log

      - name: Import full Rezzerv application without migration credential
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python - <<'PY' | tee /tmp/runtime-import.log
          import app.session_entrypoint as runtime
          assert runtime.app is not None
          print('POSTGRESQL_RUNTIME_IMPORT_WITHOUT_DDL_GREEN')
          PY
          grep -F 'POSTGRESQL_RUNTIME_IMPORT_WITHOUT_DDL_GREEN' /tmp/runtime-import.log

      - name: Boot Rezzerv and verify PostgreSQL health
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python -m uvicorn app.session_entrypoint:app --host 127.0.0.1 --port 8000 >/tmp/rezzerv-runtime.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/tmp/rezzerv-health.json; then
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat /tmp/rezzerv-runtime.log
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/rezzerv-health.json').read_text())
          assert payload['status'] == 'ok', payload
          assert payload['datastore'] == 'postgresql', payload
          print('POSTGRESQL_RUNTIME_STARTUP_DML_ONLY_GREEN')
          PY
