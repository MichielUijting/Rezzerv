name: PostgreSQL runtime startup schema authority

on:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/app/api/**'
      - 'backend/app/db.py'
      - 'backend/app/main.py'
      - 'backend/app/migration_db.py'
      - 'backend/app/schema_migration_preflight.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/**'
      - 'backend/tests/password_reset_security_selftest.py'
      - 'backend/tests/postgresql_password_reset_dml_only_selftest.py'
      - 'backend/tests/postgresql_authorization_sql_portability_selftest.py'
      - 'backend/tests/postgresql_authorization_dml_only_selftest.py'
      - 'backend/tests/postgresql_core_request_dml_only_selftest.py'
      - 'backend/tests/postgresql_day_article_direct_sql_authority_selftest.py'
      - 'backend/tests/postgresql_day_article_direct_dml_only_selftest.py'
      - 'backend/tests/postgresql_external_catalog_sql_authority_selftest.py'
      - 'backend/tests/postgresql_external_catalog_dml_only_selftest.py'
      - 'backend/tests/postgresql_gpc_barcode_sql_authority_selftest.py'
      - 'backend/tests/postgresql_gpc_barcode_dml_only_selftest.py'
      - 'backend/tests/postgresql_gpc_residual_sql_authority_selftest.py'
      - 'backend/tests/postgresql_gpc_residual_dml_only_selftest.py'
      - 'backend/tests/postgresql_household_invitation_sql_authority_selftest.py'
      - 'backend/tests/postgresql_household_invitation_dml_only_selftest.py'
      - 'backend/tests/postgresql_onboarding_use_case_sql_portability_selftest.py'
      - 'backend/tests/postgresql_onboarding_use_case_dml_only_selftest.py'
      - 'backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py'
      - 'backend/tests/postgresql_platform_feature_support_dml_only_selftest.py'
      - 'backend/tests/runtime_startup_schema_authority_selftest.py'
      - '.github/workflows/postgresql-runtime-startup-schema-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-startup-ddl-lockdown:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://rezzerv_app@127.0.0.1:5432/rezzerv
      MIGRATION_DATABASE_URL: postgresql://rezzerv_migrator@127.0.0.1:5432/rezzerv
      RECEIPT_STORAGE_ROOT: /tmp/rezzerv-receipts/raw
      REZZERV_RECEIPT_STARTUP_REMBG_WARMUP: 'false'
      REZZERV_RECEIPT_STARTUP_PADDLE_WARMUP: 'false'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure migration and runtime roles
        run: |
          psql -h 127.0.0.1 -U postgres -d rezzerv -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE rezzerv_migrator LOGIN;
          CREATE ROLE rezzerv_app LOGIN;
          GRANT CONNECT ON DATABASE rezzerv TO rezzerv_migrator, rezzerv_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rezzerv_migrator;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Prove production startup has no schema mutator calls
        run: |
          python backend/tests/runtime_startup_schema_authority_selftest.py | tee /tmp/runtime-startup-static.log
          grep -F 'RUNTIME_STARTUP_SCHEMA_MUTATION_REMOVED_GREEN' /tmp/runtime-startup-static.log

      - name: Prove authorization/membership runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_authorization_sql_portability_selftest.py | tee /tmp/authorization-static.log
          grep -F 'POSTGRESQL_AUTHORIZATION_SQL_PORTABLE_GREEN' /tmp/authorization-static.log
          grep -F 'POSTGRESQL_AUTHORIZATION_RUNTIME_DDL_ABSENT_GREEN' /tmp/authorization-static.log
          grep -F 'POSTGRESQL_AUTHORIZATION_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/authorization-static.log
          grep -F 'POSTGRESQL_AUTHORIZATION_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/authorization-static.log

      - name: Prove external catalog/link runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_external_catalog_sql_authority_selftest.py | tee /tmp/external-catalog-static.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_SQL_PORTABLE_GREEN' /tmp/external-catalog-static.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_RUNTIME_DDL_ABSENT_GREEN' /tmp/external-catalog-static.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_ALEMBIC_AUTHORITY_GREEN' /tmp/external-catalog-static.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/external-catalog-static.log

      - name: Prove GPC/barcode runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_gpc_barcode_sql_authority_selftest.py | tee /tmp/gpc-barcode-static.log
          grep -F 'POSTGRESQL_GPC_BARCODE_SQL_PORTABLE_GREEN' /tmp/gpc-barcode-static.log
          grep -F 'POSTGRESQL_GPC_BARCODE_RUNTIME_DDL_ABSENT_GREEN' /tmp/gpc-barcode-static.log
          grep -F 'POSTGRESQL_GPC_BARCODE_VALIDATION_ONLY_ENSURE_GREEN' /tmp/gpc-barcode-static.log
          grep -F 'POSTGRESQL_GPC_BARCODE_ALEMBIC_AUTHORITY_GREEN' /tmp/gpc-barcode-static.log
          grep -F 'POSTGRESQL_GPC_BARCODE_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/gpc-barcode-static.log

      - name: Prove residual GPC assignment/translation runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_gpc_residual_sql_authority_selftest.py | tee /tmp/gpc-residual-static.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_SQL_PORTABLE_GREEN' /tmp/gpc-residual-static.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_RUNTIME_DDL_ABSENT_GREEN' /tmp/gpc-residual-static.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/gpc-residual-static.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_ALEMBIC_AUTHORITY_GREEN' /tmp/gpc-residual-static.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/gpc-residual-static.log

      - name: Prove day article Direct runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_day_article_direct_sql_authority_selftest.py | tee /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_SQL_PORTABLE_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_RUNTIME_DDL_ABSENT_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_ALEMBIC_AUTHORITY_GREEN' /tmp/day-article-direct-static.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/day-article-direct-static.log

      - name: Prove onboarding/use-case runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_onboarding_use_case_sql_portability_selftest.py | tee /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_SQL_PORTABLE_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_RUNTIME_DDL_ABSENT_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_ALEMBIC_AUTHORITY_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/onboarding-use-case-static.log

      - name: Prove household invitation runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_household_invitation_sql_authority_selftest.py | tee /tmp/household-invitation-static.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_SQL_PORTABLE_GREEN' /tmp/household-invitation-static.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_RUNTIME_DDL_ABSENT_GREEN' /tmp/household-invitation-static.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/household-invitation-static.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_ALEMBIC_AUTHORITY_GREEN' /tmp/household-invitation-static.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/household-invitation-static.log

      - name: Prove platform feature/support runtime SQL is schema-free and portable
        run: |
          python backend/tests/postgresql_platform_feature_support_sql_authority_selftest.py | tee /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_SQL_PORTABLE_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_RUNTIME_DDL_ABSENT_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_FLAG_FAIL_CLOSED_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_ALEMBIC_AUTHORITY_GREEN' /tmp/platform-feature-support-static.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/platform-feature-support-static.log

      - name: Migrate with dedicated Alembic role
        working-directory: backend
        run: |
          python -m app.schema_migration_preflight | tee /tmp/runtime-startup-migration.log
          grep -F "'dialect': 'postgresql'" /tmp/runtime-startup-migration.log
          grep -F "'revision': '20260903_01'" /tmp/runtime-startup-migration.log

      - name: Prove runtime role has no schema CREATE privilege
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d rezzerv -Atc "SELECT has_schema_privilege('rezzerv_app', 'public', 'CREATE')")" = "f"
          if psql -h 127.0.0.1 -U rezzerv_app -d rezzerv -v ON_ERROR_STOP=1 -c 'CREATE TABLE runtime_ddl_should_fail(id integer)'; then
            echo 'Runtime role unexpectedly created a table' >&2
            exit 1
          fi
          echo 'POSTGRESQL_RUNTIME_DDL_DENIED_GREEN'

      - name: Prove password reset service security contract on migrated runtime schema
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/password_reset_security_selftest.py | tee /tmp/password-reset-security.log
          grep -F 'PASSWORD_RESET_SECURITY_GREEN' /tmp/password-reset-security.log

      - name: Prove password recovery works with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_password_reset_dml_only_selftest.py | tee /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_RUNTIME_CREATE_DENIED_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_HASHED_TOKEN_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_ALL_SESSIONS_REVOKED_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_DML_ONLY_GREEN' /tmp/password-reset-dml-only.log
          grep -F 'POSTGRESQL_PASSWORD_RESET_AUTHORITY_SELFTEST_GREEN' /tmp/password-reset-dml-only.log

      - name: Prove core request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_core_request_dml_only_selftest.py | tee /tmp/core-request-dml-only.log
          grep -F 'POSTGRESQL_CORE_REQUEST_RUNTIME_CREATE_DENIED_GREEN' /tmp/core-request-dml-only.log
          grep -F 'POSTGRESQL_CORE_REQUEST_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/core-request-dml-only.log
          grep -F 'POSTGRESQL_CORE_REQUEST_DML_ONLY_GREEN' /tmp/core-request-dml-only.log
          grep -F 'POSTGRESQL_CORE_REQUEST_AUTHORITY_SELFTEST_GREEN' /tmp/core-request-dml-only.log

      - name: Prove authorization/membership paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_authorization_dml_only_selftest.py | tee /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_RUNTIME_CREATE_DENIED_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_PLATFORM_READ_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_MEMBERSHIP_READ_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_MEMBERSHIP_DML_ONLY_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_PLATFORM_DML_ONLY_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_DML_ONLY_GREEN' /tmp/authorization-dml-only.log
          grep -F 'POSTGRESQL_AUTHORIZATION_AUTHORITY_SELFTEST_GREEN' /tmp/authorization-dml-only.log

      - name: Prove external catalog/link request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_external_catalog_dml_only_selftest.py | tee /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_RUNTIME_CREATE_DENIED_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_INDEX_REQUEST_READ_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_CANDIDATE_RECOGNITION_DML_ONLY_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_RELATION_BATCH_DML_ONLY_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_LINK_REQUEST_READ_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_DML_ONLY_GREEN' /tmp/external-catalog-dml-only.log
          grep -F 'POSTGRESQL_EXTERNAL_CATALOG_AUTHORITY_SELFTEST_GREEN' /tmp/external-catalog-dml-only.log

      - name: Prove GPC/barcode request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_gpc_barcode_dml_only_selftest.py | tee /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_GPC_BARCODE_RUNTIME_CREATE_DENIED_GREEN' /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_GPC_BARCODE_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_GPC_XML_IMPORT_DML_ONLY_GREEN' /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_GPC_LOCAL_CLASSIFICATION_DML_ONLY_GREEN' /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_BARCODE_GPC_LOOKUP_PORTABLE_GREEN' /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_GPC_BARCODE_DML_ONLY_GREEN' /tmp/gpc-barcode-dml-only.log
          grep -F 'POSTGRESQL_GPC_BARCODE_AUTHORITY_SELFTEST_GREEN' /tmp/gpc-barcode-dml-only.log

      - name: Prove residual GPC assignment/translation paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_gpc_residual_dml_only_selftest.py | tee /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_RUNTIME_CREATE_DENIED_GREEN' /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_ASSIGNMENT_DML_ONLY_GREEN' /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_TRANSLATION_DML_ONLY_GREEN' /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_IMPORT_BOOLEAN_DML_ONLY_GREEN' /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_DML_ONLY_GREEN' /tmp/gpc-residual-dml-only.log
          grep -F 'POSTGRESQL_GPC_RESIDUAL_AUTHORITY_SELFTEST_GREEN' /tmp/gpc-residual-dml-only.log

      - name: Prove day article Direct paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_day_article_direct_dml_only_selftest.py | tee /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_RUNTIME_CREATE_DENIED_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_CONSUMPTION_DML_ONLY_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_BOOLEAN_TIMESTAMP_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_DML_ONLY_GREEN' /tmp/day-article-direct-dml-only.log
          grep -F 'POSTGRESQL_DAY_ARTICLE_DIRECT_AUTHORITY_SELFTEST_GREEN' /tmp/day-article-direct-dml-only.log

      - name: Prove onboarding/use-case request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_onboarding_use_case_dml_only_selftest.py | tee /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_RUNTIME_CREATE_DENIED_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_CAPABILITY_DML_ONLY_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_DML_ONLY_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_AUTHORITY_SELFTEST_GREEN' /tmp/onboarding-use-case-dml-only.log

      - name: Prove household invitation request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_household_invitation_dml_only_selftest.py | tee /tmp/household-invitation-dml-only.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_RUNTIME_CREATE_DENIED_GREEN' /tmp/household-invitation-dml-only.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/household-invitation-dml-only.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_LIFECYCLE_DML_ONLY_GREEN' /tmp/household-invitation-dml-only.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_DELIVERY_DML_ONLY_GREEN' /tmp/household-invitation-dml-only.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_REVOKE_DML_ONLY_GREEN' /tmp/household-invitation-dml-only.log
          grep -F 'POSTGRESQL_HOUSEHOLD_INVITATION_AUTHORITY_SELFTEST_GREEN' /tmp/household-invitation-dml-only.log

      - name: Prove platform feature/support request paths work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_platform_feature_support_dml_only_selftest.py | tee /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_RUNTIME_CREATE_DENIED_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_TYPES_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_FLAG_DML_ONLY_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_FLAG_SCHEMA_FAILURE_VISIBLE_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_SUPPORT_PERSISTENCE_DML_ONLY_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_SUPPORT_REPLY_ALLOWED_BOOLEAN_GREEN' /tmp/platform-feature-support-dml-only.log
          grep -F 'POSTGRESQL_PLATFORM_FEATURE_SUPPORT_AUTHORITY_SELFTEST_GREEN' /tmp/platform-feature-support-dml-only.log

      - name: Import full Rezzerv application without migration credential
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python - <<'PY' | tee /tmp/runtime-import.log
          import app.session_entrypoint as runtime
          assert runtime.app is not None
          print('POSTGRESQL_RUNTIME_IMPORT_WITHOUT_DDL_GREEN')
          PY
          grep -F 'POSTGRESQL_RUNTIME_IMPORT_WITHOUT_DDL_GREEN' /tmp/runtime-import.log

      - name: Boot Rezzerv and verify PostgreSQL health
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python -m uvicorn app.session_entrypoint:app --host 127.0.0.1 --port 8000 >/tmp/rezzerv-runtime.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/tmp/rezzerv-health.json; then
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat /tmp/rezzerv-runtime.log
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/rezzerv-health.json').read_text())
          assert payload['status'] == 'ok', payload
          assert payload['datastore'] == 'postgresql', payload
          print('POSTGRESQL_RUNTIME_STARTUP_DML_ONLY_GREEN')
          PY
