name: Receipt status loyalty local runner validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-receipt-status-loyalty-regression.ps1'
      - '.github/workflows/receipt-status-loyalty-local-runner-validation.yml'
  workflow_dispatch:

jobs:
  validate-local-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/run-receipt-status-loyalty-regression.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Create Windows CRLF runner fixture
        shell: pwsh
        run: |
          $sourcePath = './scripts/run-receipt-status-loyalty-regression.ps1'
          $targetPath = './scripts/run-receipt-status-loyalty-regression.windows-crlf.ps1'
          $source = Get-Content -LiteralPath $sourcePath -Raw
          $crlf = $source -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText(
            $targetPath,
            $crlf,
            [System.Text.UTF8Encoding]::new($false)
          )
          $roundTrip = [System.IO.File]::ReadAllText($targetPath)
          if (-not $roundTrip.Contains("`r`n")) {
            throw 'Windows CRLF runner fixture bevat geen CRLF-regelafbrekingen.'
          }

      - name: Create documented running-backend state
        run: docker compose up -d --build backend

      - name: Execute official local runner with Windows CRLF line endings
        shell: pwsh
        run: ./scripts/run-receipt-status-loyalty-regression.windows-crlf.ps1 -SkipBackendBuild
