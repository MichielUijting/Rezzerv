name: Kassa supermarket baseline validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/alembic/**'
      - 'backend/app/services/receipt_*'
      - 'backend/app/receipt_ingestion/**'
      - 'backend/app/integrations/receipt_scanners/**'
      - 'backend/app/runtime_preflight.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/api/**/*receipt*'
      - 'backend/tests/test_kassa_*'
      - 'backend/tests/test_receipt_financial_components_regression.py'
      - 'backend/tests/test_receipt_inventory_eligibility.py'
      - 'backend/tests/test_receipt_runtime_preflight.py'
      - 'backend/tests/test_receipt_semantic_text_independence.py'
      - 'backend/tests/test_pr245_status_and_loyalty_contract.py'
      - 'backend/Dockerfile'
      - 'backend/requirements.txt'
      - '.github/workflows/kassa-supermarket-baseline-validation.yml'
  workflow_dispatch:

concurrency:
  group: kassa-supermarket-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-supermarket-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_kassa_supermarket_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_kassa_supermarket_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_kassa_supermarket_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_kassa_supermarket_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build production-like backend image
        run: |
          docker build -t rezzerv-kassa-pr-gate ./backend

      - name: Bootstrap PostgreSQL migration and runtime roles
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_kassa_supermarket_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_kassa_supermarket_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_kassa_supermarket_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic in production image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e MIGRATION_DATABASE_URL="$MIGRATION_DATABASE_URL" \
            -e REZZERV_DATASTORE_POLICY="$REZZERV_DATASTORE_POLICY" \
            rezzerv-kassa-pr-gate \
            sh -lc "python -m alembic upgrade head"

      - name: Assert runtime role is DML-only
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_kassa_supermarket_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"

      - name: Run fast representative supermarket PR gate
        run: |
          timeout --signal=TERM --kill-after=30s 5m \
            docker run --rm --network host \
              -e DATABASE_URL="$DATABASE_URL" \
              -e MIGRATION_DATABASE_URL="$MIGRATION_DATABASE_URL" \
              -e REZZERV_DATASTORE_POLICY="$REZZERV_DATASTORE_POLICY" \
              rezzerv-kassa-pr-gate \
              sh -lc "python -m pip install --disable-pip-version-check -q pytest && python -m pytest -s -q tests/test_kassa_supermarket_baseline_gate.py tests/test_pr245_status_and_loyalty_contract.py tests/test_receipt_financial_components_regression.py tests/test_receipt_inventory_eligibility.py tests/test_receipt_runtime_preflight.py tests/test_receipt_semantic_text_independence.py"
