name: Kassa supermarket baseline validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-supermarket-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production-like backend image
        run: |
          docker build -t rezzerv-kassa-baseline ./backend

      - name: Run 18-receipt supermarket baseline including Picnic 4/4
        run: |
          timeout --signal=TERM --kill-after=30s 10m \
            docker run --rm \
              -e DATABASE_URL=sqlite:////tmp/rezzerv-kassa-baseline.db \
              -e SQLITE_RUNTIME_VOLUME=github-actions-temp \
              rezzerv-kassa-baseline \
              sh -lc "python -m pip install --disable-pip-version-check -q pytest && python -m pytest -q tests/test_kassa_supermarket_baseline_gate.py"
