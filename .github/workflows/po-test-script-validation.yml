name: Canonical PO test script validation and delivery

on:
  pull_request:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing PR number to test'
        required: true
        type: number
      branch:
        description: 'Exact codex task branch'
        required: true
        type: string
      sha:
        description: 'Current 40-character PR head SHA'
        required: true
        type: string
      title:
        description: 'Simple ASCII test title'
        required: true
        type: string
      test_instructions:
        description: 'Plain ASCII test instructions, one per line'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  safety-tests:
    name: Run canonical source and rejection tests on Windows
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/inhuis-po-test '))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python self-tests
        shell: pwsh
        run: |
          python -m py_compile scripts/po-tests/generate_po_test.py scripts/po-tests/test_generate_po_test.py
          python scripts/po-tests/test_generate_po_test.py
          python scripts/po-tests/test_po_test_windows.py
      - name: Prove missing reference fails closed
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'unavailable-reference'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $target = Join-Path $work 'should-not-exist.bat'
          $original = 'scripts/po-tests/po-test-template.bat'
          $temporary = 'scripts/po-tests/po-test-template.bat.hidden'
          Move-Item $original $temporary
          try {
            Set-Content -LiteralPath (Join-Path $work 'scenario.txt') 'Controleer Lidl datum.'
            python scripts/po-tests/generate_po_test.py --branch codex/lidl-import-date-window --sha 45836836038ad5c7fe985e8a4c81d2de277ebc5b --title 'Lidl datum' --instructions-file (Join-Path $work 'scenario.txt') --output $target
            if ($LASTEXITCODE -eq 0) { throw 'Generator fail-open: missing template accepted' }
            if (Test-Path $target) { throw 'Generator left output when reference absent' }
            Write-Host 'PO_TEST_MISSING_SOURCE_FAIL_CLOSED_GREEN'
            exit 0
          } finally {
            Move-Item $temporary $original
          }

  release-script:
    name: Release validated PR-specific one-click batch
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
    needs: safety-tests
    runs-on: windows-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_BRANCH: ${{ inputs.branch }}
      EXPECTED_SHA: ${{ inputs.sha }}
      PO_TITLE: ${{ inputs.title }}
      PO_INSTRUCTIONS: ${{ inputs.test_instructions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Authorize and resolve PO comment
        if: github.event_name == 'issue_comment'
        shell: pwsh
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REQUESTED_PR: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Only the repository owner can authorize Windows script generation.
          # All comment text is passed as environment data, never evaluated as code.
          if ($env:COMMENT_AUTHOR -ine $env:REPOSITORY_OWNER) {
            throw 'Only the repository owner may request a PO test script'
          }
          $lines = @($env:COMMENT_BODY -split '\r?\n')
          if ($lines.Count -lt 2 -or $lines[0] -cnotmatch '^/inhuis-po-test ([0-9a-f]{40})$') {
            throw 'Expected /inhuis-po-test SHA and at least one instruction'
          }
          $requestedSha = $Matches[1]
          $instructions = ($lines | Select-Object -Skip 1) -join "`n"
          if ([string]::IsNullOrWhiteSpace($instructions)) { throw 'PO test instructions are missing' }
          $instructionFile = Join-Path $env:GITHUB_WORKSPACE 'po-test-comment-instructions.txt'
          Set-Content -LiteralPath $instructionFile -Value $instructions -Encoding ascii
          "PO_INSTRUCTIONS_FILE=$instructionFile" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "EXPECTED_SHA=$requestedSha" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "PR_NUMBER=$env:REQUESTED_PR" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "PO_TITLE=Inhuis PR $env:REQUESTED_PR" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host 'PO_TEST_OWNER_COMMAND_AUTHORIZED'
      - name: Verify live PR head, branch and repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub PR could not be verified' }
          if ($pr.state -ne 'open') { throw 'PR is not open' }
          if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Wrong head repository' }
          if ($env:GITHUB_EVENT_NAME -eq 'issue_comment') {
            if ($pr.head.ref -cnotmatch '^codex/[a-z0-9][a-z0-9_./-]*$' -or $pr.head.ref.Contains('..')) {
              throw 'Invalid PO task branch'
            }
            $env:EXPECTED_BRANCH = $pr.head.ref
            "EXPECTED_BRANCH=$env:EXPECTED_BRANCH" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          }
          if ($pr.head.ref -cne $env:EXPECTED_BRANCH) { throw 'Wrong current PR branch' }
          if ($pr.head.sha -cne $env:EXPECTED_SHA) { throw 'PR head SHA has changed' }
          Write-Host 'PO_TEST_LIVE_CANDIDATE_VERIFIED'
      - name: Generate script from canonical source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path po-test-artifact -Force | Out-Null
          if ($env:GITHUB_EVENT_NAME -eq 'issue_comment') {
            if (-not (Test-Path -LiteralPath $env:PO_INSTRUCTIONS_FILE)) { throw 'PO comment instructions missing' }
            Copy-Item -LiteralPath $env:PO_INSTRUCTIONS_FILE -Destination po-test-artifact/instructions.txt
          } else {
            Set-Content -LiteralPath po-test-artifact/instructions.txt -Value $env:PO_INSTRUCTIONS -Encoding Ascii
          }
          $output = "po-test-artifact/Inhuis_PR$env:PR_NUMBER" + "_Lokaal_Testen.bat"
          python scripts/po-tests/generate_po_test.py --branch $env:EXPECTED_BRANCH --sha $env:EXPECTED_SHA --title $env:PO_TITLE --instructions-file po-test-artifact/instructions.txt --output $output
          if ($LASTEXITCODE -ne 0) { throw 'PO script validation/generation failed' }
          # The exact bytes about to be uploaded must match fresh canonical output.
          # A failure here prevents both evidence creation and artifact publication.
          python scripts/po-tests/generate_po_test.py --branch $env:EXPECTED_BRANCH --sha $env:EXPECTED_SHA --title $env:PO_TITLE --instructions-file po-test-artifact/instructions.txt --output $output --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Exact PO batch artifact verification failed' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $output).Hash
          $evidence = [ordered]@{
            pr_number = $env:PR_NUMBER
            candidate_branch = $env:EXPECTED_BRANCH
            candidate_sha = $env:EXPECTED_SHA
            generator_commit = $env:GITHUB_SHA
            script_sha256 = $hash
            workflow_run_id = $env:GITHUB_RUN_ID
            windows_self_tests = 'passed'
            exact_artifact_verification = 'PO_TEST_EXACT_ARTIFACT_VERIFIED_GREEN'
          }
          $evidence | ConvertTo-Json | Set-Content po-test-artifact/evidence.json -Encoding UTF8
          Remove-Item po-test-artifact/instructions.txt
          Write-Host "PO_TEST_VALIDATED_SHA256=$hash"
      - name: Upload validated single-click script with evidence
        uses: actions/upload-artifact@v4
        with:
          name: validated-inhuis-po-test-${{ github.run_id }}
          path: po-test-artifact/*
          if-no-files-found: error
          retention-days: 30
