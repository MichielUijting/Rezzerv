name: Support message foundation validation

on:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/app/services/support_message_service.py'
      - 'backend/tests/support_message_migrated_fixture.py'
      - 'backend/tests/test_support_message_service.py'
      - '.github/workflows/support-message-foundation-validation.yml'

jobs:
  support-message-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest sqlalchemy alembic==1.19.1

      - name: Run support message contract tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_support_message_service.py
