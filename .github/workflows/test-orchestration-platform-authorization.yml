name: Test orchestration platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/dev_test_routes.py'
      - 'backend/app/services/platform_admin_route_guard.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - 'backend/tests/test_technical_schema_platform_route_authorization.py'
      - 'backend/tests/test_support_platform_route_authorization.py'
      - '.github/workflows/test-orchestration-platform-authorization.yml'

jobs:
  test-orchestration-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy

      - name: Compile migrated route and focused test
        run: |
          python -m py_compile \
            app/api/dev_test_routes.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run platform permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_test_orchestration_platform_route_authorization.py \
            tests/test_technical_schema_platform_route_authorization.py \
            tests/test_support_platform_route_authorization.py
