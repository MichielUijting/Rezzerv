name: Test orchestration platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/dev_test_routes.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/postgresql_platform_authorization_fixture.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - 'backend/tests/test_technical_schema_platform_route_authorization.py'
      - 'backend/tests/test_support_platform_route_authorization.py'
      - '.github/workflows/test-orchestration-platform-authorization.yml'
  workflow_dispatch:

jobs:
  test-orchestration-platform-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_test_orchestration
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_test_orchestration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DB: rezzerv_test_orchestration
      TEST_BOOTSTRAP_URL: postgresql+psycopg://rezzerv_bootstrap:rezzerv_bootstrap_ci@127.0.0.1:55432/rezzerv_test_orchestration
      TEST_MIGRATOR_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_test_orchestration
      TEST_RUNTIME_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_test_orchestration
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_test_orchestration
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_test_orchestration
      REZZERV_DATASTORE_POLICY: postgresql-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migration and runtime roles
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_test_orchestration TO rezzerv_migrator;
          GRANT CONNECT ON DATABASE rezzerv_test_orchestration TO rezzerv_app;
          ALTER DATABASE rezzerv_test_orchestration OWNER TO rezzerv_migrator;
          \connect rezzerv_test_orchestration
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: python -m alembic upgrade head

      - name: Compile migrated route and focused tests
        run: |
          python -m py_compile \
            app/api/dev_test_routes.py \
            app/testing/postgresql_platform_authorization_fixture.py \
            tests/test_test_orchestration_platform_route_authorization.py \
            tests/test_technical_schema_platform_route_authorization.py \
            tests/test_support_platform_route_authorization.py

      - name: Run platform permission cutover tests on PostgreSQL
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_test_orchestration_platform_route_authorization.py \
            tests/test_technical_schema_platform_route_authorization.py \
            tests/test_support_platform_route_authorization.py
