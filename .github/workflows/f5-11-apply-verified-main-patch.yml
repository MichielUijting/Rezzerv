name: F5-11 apply verified main patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/f5-11-apply-verified-main-patch.yml'

permissions:
  contents: write

jobs:
  apply-main-patch:
    name: Apply exact F5-11 main.py patch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify and patch exact main.py
        shell: bash
        run: |
          set -euo pipefail
          actual_blob="$(git hash-object backend/app/main.py)"
          test "$actual_blob" = '2933f49726002512143e693e0fd0ac87ad806427' || {
            echo "main.py blob mismatch: $actual_blob" >&2
            exit 1
          }
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          targets = (
              'get_latest_external_article_link',
              'get_household_article_event_rows',
              'get_household_product_event_rows',
              'article_history',
              'count_history_events_for_article',
          )
          old = 'ORDER BY created_at DESC, id DESC'
          new = 'ORDER BY created_at DESC NULLS LAST, id DESC'

          for name in targets:
              match = re.search(rf'(?m)^def {re.escape(name)}\(', text)
              assert match, f'functie ontbreekt: {name}'
              next_match = re.search(r'(?m)^def [A-Za-z_][A-Za-z0-9_]*\(', text[match.end():])
              end = match.end() + next_match.start() if next_match else len(text)
              block = text[match.start():end]
              count = block.count(old)
              assert count == 1, f'{name}: verwacht exact 1 kwetsbare sortering, gevonden {count}'
              text = text[:match.start()] + block.replace(old, new, 1) + text[end:]

          path.write_text(text, encoding='utf-8', newline='')
          PY
          python -m py_compile backend/app/main.py
          test "$(git hash-object backend/app/main.py)" = '8682431a5d23604218cd4901fc53b9208460fda8'
          git diff --check
          git diff -- backend/app/main.py

      - name: Commit exact product fix to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'fix: sort PostgreSQL history null timestamps last'
          git push origin "HEAD:${HEAD_REF}"
