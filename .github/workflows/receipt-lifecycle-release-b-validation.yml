name: Receipt lifecycle Release B validation

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/services/receipt_service.py'
      - 'backend/app/services/receipt_reimport_lineage_service.py'
      - 'backend/app/services/receipt_lifecycle_foundation_service.py'
      - 'backend/tests/test_receipt_reimport_lineage_service.py'
      - 'backend/tests/test_receipt_lifecycle_foundation.py'
      - 'docs/technical/RECEIPT-LIFECYCLE-RELEASE-B.md'
      - '.github/workflows/receipt-lifecycle-release-b-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/main.py'
      - 'backend/app/services/receipt_service.py'
      - 'backend/app/services/receipt_reimport_lineage_service.py'
      - 'backend/app/services/receipt_lifecycle_foundation_service.py'
      - 'backend/tests/test_receipt_reimport_lineage_service.py'
      - 'backend/tests/test_receipt_lifecycle_foundation.py'
      - '.github/workflows/receipt-lifecycle-release-b-validation.yml'

jobs:
  release-b-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest sqlalchemy

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            backend/app/main.py \
            backend/app/services/receipt_service.py \
            backend/app/services/receipt_reimport_lineage_service.py \
            backend/app/services/receipt_lifecycle_foundation_service.py

      - name: Run Release A foundation and Release B lineage tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_receipt_lifecycle_foundation.py \
            tests/test_receipt_reimport_lineage_service.py

      - name: Enforce Release B source contract
        shell: python
        run: |
          from pathlib import Path

          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          service = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          lineage = Path('backend/app/services/receipt_reimport_lineage_service.py').read_text(encoding='utf-8')
          foundation = Path('backend/app/services/receipt_lifecycle_foundation_service.py').read_text(encoding='utf-8')

          start = main.index('def delete_receipts(payload: ReceiptDeleteRequest')
          end = main.index('@app.post("/api/admin/receipts/purge-archived")', start)
          delete_block = main[start:end]

          required_delete_tokens = [
              "workflow_state = 'removed_reimport_allowed'",
              'UPDATE raw_receipts SET deleted_at = CURRENT_TIMESTAMP',
              "'reimport_allowed': True",
          ]
          for token in required_delete_tokens:
              assert token in delete_block, f'Release B delete contract ontbreekt: {token}'

          forbidden_delete_tokens = [
              'remove_receipt_inventory_events(',
              "sha256_hash = sha256_hash || ':deleted:'",
              'DELETE FROM inventory_events',
          ]
          for token in forbidden_delete_tokens:
              assert token not in delete_block, f'Verboden Kassa-delete gedrag teruggekeerd: {token}'

          required_reimport_tokens = [
              'load_deleted_reimport_lineage(conn, household_id, digest)',
              "'logical_receipt_key': (reimport_lineage or {}).get('logical_receipt_key') or uuid.uuid4().hex",
              'resolve_reimport_logical_line_key(reimport_lineage, index, line)',
              'was_prior_line_validated(reimport_lineage, index, line)',
              'get_prior_processed_line_fact(',
          ]
          for token in required_reimport_tokens:
              assert token in service, f'Reimportcontract ontbreekt: {token}'

          required_lineage_tokens = [
              "rt.workflow_state = 'removed_reimport_allowed'",
              'rr.sha256_hash = :sha256_hash',
              'COALESCE(is_validated, 0) AS is_validated',
              'purchase_import_lines',
              'processed_event_id',
          ]
          for token in required_lineage_tokens:
              assert token in lineage, f'Lineagecontract ontbreekt: {token}'

          forbidden_tables = [
              'receipt_identities',
              'receipt_line_identities',
              'receipt_line_processing',
              'archived_receipts',
              'receipt_inventory_events',
          ]
          combined = '\n'.join([main, service, lineage, foundation])
          for table in forbidden_tables:
              create_token = f'CREATE TABLE IF NOT EXISTS {table}'
              assert create_token not in combined, f'Parallelle lifecycle-tabel verboden: {table}'

          assert "WHERE deleted_at IS NULL" in foundation
          print('RECEIPT_LIFECYCLE_RELEASE_B_SOURCE_CONTRACT_GREEN')

      - name: No diff whitespace errors
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
