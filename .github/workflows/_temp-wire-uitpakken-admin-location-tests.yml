name: TEMP wire Uitpakken admin location tests

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create
          fetch-depth: 0

      - name: Wire central frontend regression
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/run-frontend-regression-report.ps1')
          text = path.read_text(encoding='utf-8')
          needle = '    "tests/e2e/uitpakken.frontend-regression.spec.js",\n'
          addition = needle + '    "tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js",\n'
          if 'uitpakken-admin-location-create.frontend-regression.spec.js' not in text:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'STOP runner anchor: expected 1, found {count}')
              text = text.replace(needle, addition, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
              print('PASS: central frontend regression wired')
          else:
              print('Runner already wired')

      - name: Commit runner patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No runner changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-frontend-regression-report.ps1
          git diff --cached --check
          git commit -m "test(uitpakken): require admin location create regression"
          git push origin HEAD:fix/uitpakken-admin-location-create
