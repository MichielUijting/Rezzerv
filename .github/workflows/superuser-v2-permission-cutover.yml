name: Superuser v2 permission cutover validation

on:
  pull_request:
    paths:
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/testing/authorization_matrix_acceptance.py'
      - 'backend/tests/test_superuser_v2_permission_cutover.py'
      - 'backend/tests/test_roles_v2_foundation_contract.py'
      - 'backend/tests/test_authorization_foundation_contract.py'
      - 'backend/tests/platform_admin_acceptance_closure_selftest.py'
      - 'backend/tests/test_superuser_foundation.py'
      - 'backend/tests/test_platform_audit_route_authorization.py'
      - 'backend/tests/test_platform_users_route_authorization.py'
      - 'backend/tests/test_platform_sessions_route_authorization.py'
      - 'backend/tests/platform_feature_flag_migrated_fixture.py'
      - 'backend/tests/test_platform_feature_flags_route_authorization.py'
      - 'backend/tests/test_platform_authorizations_route_authorization.py'
      - 'backend/tests/test_external_database_route_authorization.py'
      - 'backend/tests/test_external_relation_batch_decision_platform_authorization.py'
      - 'docs/security/SUPERUSER-V2-PERMISSION-CUTOVER.md'
      - '.github/workflows/superuser-v2-permission-cutover.yml'
  workflow_dispatch:

jobs:
  superuser-v2-permission-cutover:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_superuser_v2_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_superuser_v2_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_superuser_v2_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_superuser_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy alembic httpx 'psycopg[binary]==3.3.4'

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_superuser_v2_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_superuser_v2_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_superuser_v2_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema for migrated identity contract
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Compile authority cutover and contracts
        run: |
          python -m py_compile \
            app/services/authorization_foundation_service.py \
            app/testing/authorization_matrix_acceptance.py \
            tests/test_superuser_v2_permission_cutover.py \
            tests/test_roles_v2_foundation_contract.py \
            tests/platform_admin_acceptance_closure_selftest.py \
            tests/test_platform_audit_route_authorization.py \
            tests/test_platform_users_route_authorization.py \
            tests/test_platform_sessions_route_authorization.py \
            tests/platform_feature_flag_migrated_fixture.py \
            tests/test_platform_feature_flags_route_authorization.py \
            tests/test_platform_authorizations_route_authorization.py \
            tests/test_external_database_route_authorization.py \
            tests/test_external_relation_batch_decision_platform_authorization.py

      - name: Run dedicated Superuser v2 cutover contract
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_superuser_v2_permission_cutover.py

      - name: Run roles-v2 and authorization foundation contracts
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_roles_v2_foundation_contract.py \
            tests/test_authorization_foundation_contract.py

      - name: Validate authorization matrix separation
        env:
          PYTHONPATH: .
        run: python -m app.testing.authorization_matrix_acceptance

      - name: Prove technical Platformbeheerder separation
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_platform_audit_route_authorization.py \
            tests/test_platform_users_route_authorization.py \
            tests/test_platform_sessions_route_authorization.py \
            tests/test_platform_feature_flags_route_authorization.py \
            tests/test_platform_authorizations_route_authorization.py

      - name: Prove functional Superuser v2 external-product authority
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_external_database_route_authorization.py \
            tests/test_external_relation_batch_decision_platform_authorization.py

      - name: Preserve Superuser identity boundary on PostgreSQL
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_superuser_foundation.py

      - name: Preserve Platformbeheerder 9.1.7 closure
        env:
          PYTHONPATH: .
        run: python tests/platform_admin_acceptance_closure_selftest.py

      - name: Acceptance marker
        run: echo SUPERUSER_V2_9_1_8A_PERMISSION_CUTOVER_GREEN
