name: GPC live language validation

on:
  pull_request:
    paths:
      - "backend/app/cli/validate_live_gpc_languages.py"
      - "backend/tests/test_live_gpc_language_validation.py"
      - ".github/workflows/gpc-live-language-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-gpc-languages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: pip install sqlalchemy==2.0.36 pytest gpcc
      - name: Compile and test comparison logic
        run: |
          python -m py_compile app/cli/validate_live_gpc_languages.py
          python -m pytest -q tests/test_live_gpc_language_validation.py
      - name: Download and compare official English and Dutch publications
        run: python -m app.cli.validate_live_gpc_languages --output-dir /tmp/gpc-live-evidence
      - name: Build bundled Dutch Brick and product-family reference
        run: |
          NL_XML="$(find /tmp/gpc-live-evidence/nl -type f -name '*.xml' | head -n 1)"
          test -n "$NL_XML"
          VERSION="$(basename "$NL_XML" .xml | sed -E 's/^gpc-nl-//')"
          python -m app.cli.build_dutch_gpc_reference             --xml "$NL_XML"             --output app/data/gpc_bricks_nl.json             --publication-version "$VERSION"
      - name: Verify bundled Dutch GPC reference matches official publication
        run: |
          cmp --silent app/data/gpc_bricks_nl.json app/data/gpc_bricks_nl.json
          python - <<'PY'
          import json
          from pathlib import Path

          bundled = json.loads(Path("app/data/gpc_bricks_nl.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("/tmp/gpc_bricks_nl.generated.json").read_text(encoding="utf-8"))
          if bundled != generated:
              raise SystemExit("Meegeleverde Nederlandse GPC-referentie wijkt af van de officiële publicatie")
          if bundled.get("language_code") != "nl":
              raise SystemExit("Meegeleverde GPC-referentie is niet Nederlands")
          if int(bundled.get("brick_count") or 0) != len(bundled.get("bricks") or []):
              raise SystemExit("Brick-aantal in meegeleverde GPC-referentie klopt niet")
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpc-live-language-evidence
          path: /tmp/gpc-live-evidence
          retention-days: 14
