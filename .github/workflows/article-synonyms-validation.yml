name: Article synonyms validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/article-synonyms-validation.yml'
      - 'backend/app/api/article_synonym_routes.py'
      - 'backend/app/services/article_synonym_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/gtin_validation_service.py'
      - 'backend/app/api/system_routes.py'
      - 'backend/alembic/**'
      - 'backend/tests/test_article_synonyms.py'
      - 'backend/requirements.txt'
      - 'frontend/src/features/articleSynonyms/**'
      - 'frontend/tests/e2e/article-synonyms.frontend-regression.spec.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_synonyms
          POSTGRES_PASSWORD: rezzerv_synonyms_ci
          POSTGRES_DB: rezzerv_article_synonyms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_synonyms -d rezzerv_article_synonyms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_synonyms:rezzerv_synonyms_ci@127.0.0.1:5432/rezzerv_article_synonyms_test
      INHUIS_ARTICLE_SYNONYMS_TEST_DATABASE_URL: postgresql+psycopg://rezzerv_synonyms:rezzerv_synonyms_ci@127.0.0.1:5432/rezzerv_article_synonyms_test
      REZZERV_DATASTORE_POLICY: postgresql-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies using canonical constraints
        run: |
          mapfile -t packages < <(grep -E '^(sqlalchemy|alembic|fastapi|pydantic|httpx|psycopg\[binary\])==' backend/requirements.txt)
          test "${#packages[@]}" -eq 6
          python -m pip install "${packages[@]}"
      - name: Matching, API authorization and atomic persistence contracts
        run: python -m unittest discover -s backend/tests -p test_article_synonyms.py -v

  frontend-regression:
    name: Artikel-synoniemen Playwright regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Start isolated frontend
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/article-synonyms-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/article-synonyms-vite.log
          exit 1
      - name: Check seven columns, pagination, selection and both authorized roles
        run: ./node_modules/.bin/playwright test tests/e2e/article-synonyms.frontend-regression.spec.js --project=chromium --no-deps
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: article-synonyms-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
