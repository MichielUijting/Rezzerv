name: Kassa review API validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - '.github/workflows/kassa-review-api-validation.yml'
      - 'backend/alembic.ini'
      - 'backend/alembic/**'
      - 'backend/app/main.py'
      - 'backend/app/database.py'
      - 'backend/app/schemas/receipts.py'
      - 'backend/app/receipt_ingestion/receipt_line_semantics.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/authorization_membership_service.py'
      - 'backend/app/testing/canonical_scenario_catalog.py'
      - 'backend/app/testing/postgresql_acceptance_foundation.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/app/testing/receipt_acceptance/baseline.json'
      - 'quality/acceptance/canonical_scenario_catalog.json'
      - 'backend/tests/kassa_review_api_selftest.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kassa-review-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kassa-review-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_f3_kassa_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_f3_kassa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_f3_kassa_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_f3_kassa_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      REZZERV_EMAIL_ENABLED: 'false'
      REZZERV_SESSION_COOKIE_SECURE: 'false'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'false'
      RECEIPT_STORAGE_ROOT: /tmp/rezzerv-f3-kassa/receipts/raw
      REZZERV_TEST_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Prepare shared PostgreSQL acceptance foundation
        uses: ./.github/actions/postgresql-acceptance-foundation
        with:
          database-name: rezzerv_f3_kassa_ci
          bootstrap-user: rezzerv_bootstrap
          bootstrap-password: rezzerv_bootstrap_ci
          port: '55432'
          migrator-password: rezzerv_migrator_ci
          runtime-password: rezzerv_app_ci
          migration-mode: alembic
          evidence-file: kassa-review-shared-postgresql-foundation.log

      - name: Compile F3-04 API authority
        run: |
          python -m py_compile \
            backend/tests/kassa_review_api_selftest.py \
            backend/app/main.py \
            backend/app/schemas/receipts.py \
            backend/app/receipt_ingestion/receipt_line_semantics.py

      - name: Validate Kassa review and approval through real PostgreSQL API
        shell: bash
        run: |
          set -euo pipefail
          python backend/tests/kassa_review_api_selftest.py | tee kassa-review-api.log
          grep -F 'PASS postgresql_dml_only_runtime' kassa-review-api.log
          grep -F 'PASS canonical_kassa_fixture_is_visible_through_real_api' kassa-review-api.log
          grep -F 'PASS review_edit_persists_canonical_line_state' kassa-review-api.log
          grep -F 'PASS uncertain_line_accepts_explicit_review' kassa-review-api.log
          grep -F 'PASS weighted_quantity_roundtrips_exactly_in_kassa' kassa-review-api.log
          grep -F 'PASS cross_household_kassa_read_write_and_approval_are_blocked' kassa-review-api.log
          grep -F 'PASS approval_persists_state_and_creates_unpack_boundary_without_inventory_mutation' kassa-review-api.log
          grep -F 'PASS non_physical_line_remains_outside_unpack_inventory_flow' kassa-review-api.log
          grep -F 'PASS approval_validation_rejects_incomplete_receipt' kassa-review-api.log
          grep -F 'KASSA_REVIEW_API_POSTGRESQL_GREEN' kassa-review-api.log

      - name: Upload F3-04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kassa-review-api-evidence
          path: |
            kassa-review-shared-postgresql-foundation.log
            kassa-review-api.log
          if-no-files-found: error
          retention-days: 7
