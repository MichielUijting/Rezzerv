name: Temporary zero-residual inspection patch

on:
  push:
    branches:
      - codex/postgresql-zero-residual-gate
    paths:
      - '.github/workflows/temporary-zero-residual-main-patch.yml'

permissions:
  contents: write

jobs:
  exact-inspection-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-zero-residual-gate
          fetch-depth: 0

      - name: Replace dialect SQL introspection with SQLAlchemy inspection
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text: str, old: str, new: str, label: str) -> None:
              path = Path(path_text)
              content = path.read_text(encoding='utf-8-sig')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              path.write_text(content.replace(old, new), encoding='utf-8')

          replace_once(
              'backend/app/services/off_product_link_service.py',
              'from sqlalchemy import text\n',
              'from sqlalchemy import inspect, text\n',
              'off_product import',
          )
          replace_once(
              'backend/app/services/off_product_link_service.py',
              '''def _table_columns(conn, table_name: str) -> set[str]:
              dialect = str(engine.dialect.name or "").lower()
              if dialect == "sqlite":
                  rows = conn.execute(text(f'PRAGMA table_info("{table_name}")')).mappings().all()
                  return {str(row.get("name") or "") for row in rows}
              rows = conn.execute(
                  text("SELECT column_name FROM information_schema.columns WHERE table_name = :table_name"),
                  {"table_name": table_name},
              ).mappings().all()
              return {str(row.get("column_name") or "") for row in rows}


              def _table_exists(conn, table_name: str) -> bool:
              dialect = str(engine.dialect.name or "").lower()
              if dialect == "sqlite":
                  return bool(
                      conn.execute(
                          text("SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = :name LIMIT 1"),
                          {"name": table_name},
                      ).scalar()
                  )
              return bool(
                  conn.execute(
                      text("SELECT 1 FROM information_schema.tables WHERE table_name = :name LIMIT 1"),
                      {"name": table_name},
                  ).scalar()
              )
              ''',
              '''def _table_columns(conn, table_name: str) -> set[str]:
              inspector = inspect(conn)
              if not inspector.has_table(str(table_name)):
                  return set()
              return {
                  str(column.get("name") or "")
                  for column in inspector.get_columns(str(table_name))
              }


              def _table_exists(conn, table_name: str) -> bool:
              return bool(inspect(conn).has_table(str(table_name)))
              ''',
              'off_product inspection helpers',
          )

          replace_once(
              'backend/app/services/off_search_service.py',
              'from sqlalchemy import text\n',
              'from sqlalchemy import inspect, text\n',
              'off_search import',
          )
          replace_once(
              'backend/app/services/off_search_service.py',
              '''def _table_exists(conn, table_name: str) -> bool:
              dialect = str(engine.dialect.name or "").lower()
              if dialect == "sqlite":
                  return conn.execute(
                      text("SELECT name FROM sqlite_master WHERE type = 'table' AND name = :name"),
                      {"name": table_name},
                  ).first() is not None
              return conn.execute(
                  text(
                      '''
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_name = :name
                      LIMIT 1
                      '''
                  ),
                  {"name": table_name},
              ).first() is not None
              ''',
              '''def _table_exists(conn, table_name: str) -> bool:
              return bool(inspect(conn).has_table(str(table_name)))
              ''',
              'off_search table exists',
          )

          replace_once(
              'backend/app/api/routes/receipt_parser_diagnosis.py',
              'from sqlalchemy import text\n',
              'from sqlalchemy import inspect, text\n',
              'receipt diagnosis import',
          )
          replace_once(
              'backend/app/api/routes/receipt_parser_diagnosis.py',
              '''def _table_columns(conn: Any, table_name: str) -> set[str]:
              return {str(row[1]) for row in conn.execute(text(f"PRAGMA table_info({table_name})")).fetchall()}
              ''',
              '''def _table_columns(conn: Any, table_name: str) -> set[str]:
              inspector = inspect(conn)
              if not inspector.has_table(str(table_name)):
                  return set()
              return {
                  str(column.get("name") or "")
                  for column in inspector.get_columns(str(table_name))
              }
              ''',
              'receipt diagnosis columns',
          )

          replace_once(
              'backend/app/services/canonical_inventory_identity_service.py',
              '''def _locationless_index_sql(conn) -> str | None:
              dialect = conn.dialect.name
              if dialect == "sqlite":
                  return conn.execute(text(
                      """
                      SELECT sql
                      FROM sqlite_master
                      WHERE type = 'index' AND name = :name
                      LIMIT 1
                      """
                  ), {"name": LOCATIONLESS_ACTIVE_IDENTITY_INDEX}).scalar_one_or_none()
              if dialect == "postgresql":
                  return conn.execute(text(
                      """
                      SELECT indexdef
                      FROM pg_indexes
                      WHERE schemaname = current_schema()
                        AND tablename = 'inventory'
                        AND indexname = :name
                      LIMIT 1
                      """
                  ), {"name": LOCATIONLESS_ACTIVE_IDENTITY_INDEX}).scalar_one_or_none()
              raise RuntimeError(f"Unsupported Rezzerv inventory identity dialect: {dialect}")
              ''',
              '''def _locationless_index_sql(conn) -> str | None:
              indexes = {
                  str(index.get("name") or ""): index
                  for index in inspect(conn).get_indexes("inventory")
              }
              index = indexes.get(LOCATIONLESS_ACTIVE_IDENTITY_INDEX)
              if not index:
                  return None
              dialect_options = index.get("dialect_options") or {}
              predicate = dialect_options.get(f"{conn.dialect.name}_where")
              if predicate is None:
                  return None
              return (
                  "CREATE INDEX canonical ON inventory (household_id, household_article_id) "
                  f"WHERE {predicate}"
              )
              ''',
              'inventory partial index inspection',
          )
          PY

      - name: Commit exact inspection patches to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/services/off_product_link_service.py \
            backend/app/services/off_search_service.py \
            backend/app/api/routes/receipt_parser_diagnosis.py \
            backend/app/services/canonical_inventory_identity_service.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor: remove dialect SQL introspection from runtime helpers'
          git push origin HEAD:codex/postgresql-zero-residual-gate
