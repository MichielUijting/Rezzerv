name: Temporary zero-residual inspection patch

on:
  push:
    branches:
      - codex/postgresql-zero-residual-gate
    paths:
      - '.github/workflows/temporary-zero-residual-main-patch.yml'

permissions:
  contents: write

jobs:
  exact-inspection-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-zero-residual-gate
          fetch-depth: 1

      - name: Replace dialect SQL introspection with SQLAlchemy inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_literal(path_text: str, old: str, new: str, label: str) -> None:
              path = Path(path_text)
              content = path.read_text(encoding='utf-8-sig')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              path.write_text(content.replace(old, new), encoding='utf-8')

          def replace_function(path_text: str, function_name: str, replacement: str) -> None:
              path = Path(path_text)
              content = path.read_text(encoding='utf-8-sig')
              pattern = rf'^def {re.escape(function_name)}\([^\n]*\)[^\n]*:\n.*?(?=^def |\Z)'
              updated, count = re.subn(
                  pattern,
                  replacement.rstrip() + '\n\n\n',
                  content,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f'{path_text}:{function_name}: expected exactly one function, found {count}')
              path.write_text(updated, encoding='utf-8')

          replace_literal(
              'backend/app/services/off_product_link_service.py',
              'from sqlalchemy import text\n',
              'from sqlalchemy import inspect, text\n',
              'off_product import',
          )
          replace_function(
              'backend/app/services/off_product_link_service.py',
              '_table_columns',
              (
                  'def _table_columns(conn, table_name: str) -> set[str]:\n'
                  '    inspector = inspect(conn)\n'
                  '    if not inspector.has_table(str(table_name)):\n'
                  '        return set()\n'
                  '    return {\n'
                  '        str(column.get("name") or "")\n'
                  '        for column in inspector.get_columns(str(table_name))\n'
                  '    }\n'
              ),
          )
          replace_function(
              'backend/app/services/off_product_link_service.py',
              '_table_exists',
              (
                  'def _table_exists(conn, table_name: str) -> bool:\n'
                  '    return bool(inspect(conn).has_table(str(table_name)))\n'
              ),
          )

          replace_literal(
              'backend/app/services/off_search_service.py',
              'from sqlalchemy import text\n',
              'from sqlalchemy import inspect, text\n',
              'off_search import',
          )
          replace_function(
              'backend/app/services/off_search_service.py',
              '_table_exists',
              (
                  'def _table_exists(conn, table_name: str) -> bool:\n'
                  '    return bool(inspect(conn).has_table(str(table_name)))\n'
              ),
          )

          replace_literal(
              'backend/app/api/routes/receipt_parser_diagnosis.py',
              'from sqlalchemy import text\n',
              'from sqlalchemy import inspect, text\n',
              'receipt diagnosis import',
          )
          replace_function(
              'backend/app/api/routes/receipt_parser_diagnosis.py',
              '_table_columns',
              (
                  'def _table_columns(conn: Any, table_name: str) -> set[str]:\n'
                  '    inspector = inspect(conn)\n'
                  '    if not inspector.has_table(str(table_name)):\n'
                  '        return set()\n'
                  '    return {\n'
                  '        str(column.get("name") or "")\n'
                  '        for column in inspector.get_columns(str(table_name))\n'
                  '    }\n'
              ),
          )

          replace_function(
              'backend/app/services/canonical_inventory_identity_service.py',
              '_locationless_index_sql',
              (
                  'def _locationless_index_sql(conn) -> str | None:\n'
                  '    indexes = {\n'
                  '        str(index.get("name") or ""): index\n'
                  '        for index in inspect(conn).get_indexes("inventory")\n'
                  '    }\n'
                  '    index = indexes.get(LOCATIONLESS_ACTIVE_IDENTITY_INDEX)\n'
                  '    if not index:\n'
                  '        return None\n'
                  '    dialect_options = index.get("dialect_options") or {}\n'
                  '    predicate = dialect_options.get(f"{conn.dialect.name}_where")\n'
                  '    if predicate is None:\n'
                  '        return None\n'
                  '    return (\n'
                  '        "CREATE INDEX canonical ON inventory (household_id, household_article_id) "\n'
                  '        f"WHERE {predicate}"\n'
                  '    )\n'
              ),
          )
          PY

      - name: Compile and commit exact inspection patches
        run: |
          python -m py_compile \
            backend/app/services/off_product_link_service.py \
            backend/app/services/off_search_service.py \
            backend/app/api/routes/receipt_parser_diagnosis.py \
            backend/app/services/canonical_inventory_identity_service.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/services/off_product_link_service.py \
            backend/app/services/off_search_service.py \
            backend/app/api/routes/receipt_parser_diagnosis.py \
            backend/app/services/canonical_inventory_identity_service.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor: remove dialect SQL introspection from runtime helpers'
          git push origin HEAD:codex/postgresql-zero-residual-gate
