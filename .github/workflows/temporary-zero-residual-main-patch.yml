name: Temporary zero-residual inventory validation patch

on:
  push:
    branches:
      - codex/postgresql-zero-residual-gate
    paths:
      - '.github/workflows/temporary-zero-residual-main-patch.yml'

permissions:
  contents: write

jobs:
  exact-inventory-validation-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-zero-residual-gate
          fetch-depth: 1

      - name: Narrow runtime inventory validation and pin SQLite adoption boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          inventory_path = Path('backend/app/services/canonical_inventory_identity_service.py')
          content = inventory_path.read_text(encoding='utf-8-sig')

          if content.count('import re\n') != 1:
              raise SystemExit('Expected exactly one re import')
          content = content.replace('import re\n', '', 1)

          for function_name in ('_locationless_index_sql', '_normalized_predicate_terms'):
              pattern = rf'^def {re.escape(function_name)}\([^\n]*\)[^\n]*:\n.*?(?=^def |\Z)'
              content, count = re.subn(
                  pattern,
                  '',
                  content,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f'Expected exactly one {function_name}, found {count}')

          predicate_pattern = (
              r'\n    index_sql = _locationless_index_sql\(conn\)\n'
              r'.*?'
              r'(?=\n\ndef _temporal_ledger_available_for_article)'
          )
          content, count = re.subn(
              predicate_pattern,
              '',
              content,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one runtime predicate validation block, found {count}')
          inventory_path.write_text(content, encoding='utf-8')

          gate_path = Path('backend/tests/postgresql_zero_residual_selftest.py')
          gate = gate_path.read_text(encoding='utf-8-sig')
          old = '        "sqlite_master": 2,\n'
          new = '        "sqlite_master": 3,\n'
          if gate.count(old) != 1:
              raise SystemExit(f'Expected sqlite_master pinned count once, found {gate.count(old)}')
          gate_path.write_text(gate.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile, validate and commit inventory validation patch
        run: |
          python -m py_compile \
            backend/app/services/canonical_inventory_identity_service.py \
            backend/tests/postgresql_zero_residual_selftest.py
          python backend/tests/postgresql_zero_residual_selftest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/services/canonical_inventory_identity_service.py \
            backend/tests/postgresql_zero_residual_selftest.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor: keep exact partial-index authority outside runtime'
          git push origin HEAD:codex/postgresql-zero-residual-gate
