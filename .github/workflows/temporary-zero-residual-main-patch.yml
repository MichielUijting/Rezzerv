name: Temporary zero-residual final portability patch

on:
  push:
    branches:
      - codex/postgresql-zero-residual-gate
    paths:
      - '.github/workflows/temporary-zero-residual-main-patch.yml'

permissions:
  contents: write

jobs:
  exact-final-portability-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-zero-residual-gate
          fetch-depth: 1

      - name: Apply exact Boolean and revision replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_text: str, old: str, new: str, expected: int, label: str) -> None:
              path = Path(path_text)
              content = path.read_text(encoding='utf-8-sig')
              count = content.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} targets, found {count}')
              path.write_text(content.replace(old, new), encoding='utf-8')

          replace_exact(
              'backend/app/receipt_ingestion/service_parts/source_detection.py',
              'is_active = 1, updated_at = CURRENT_TIMESTAMP',
              'is_active = TRUE, updated_at = CURRENT_TIMESTAMP',
              1,
              'receipt source update Boolean',
          )
          replace_exact(
              'backend/app/receipt_ingestion/service_parts/source_detection.py',
              "VALUES (:id, :household_id, :type, :label, NULL, 1)",
              "VALUES (:id, :household_id, :type, :label, NULL, TRUE)",
              1,
              'receipt source insert Boolean',
          )

          replace_exact(
              'backend/app/services/product_taxonomy_store.py',
              '                1, :created_by, :updated_by',
              '                TRUE, :created_by, :updated_by',
              1,
              'taxonomy insert Boolean',
          )
          replace_exact(
              'backend/app/services/product_taxonomy_store.py',
              '                is_active = 1,',
              '                is_active = TRUE,',
              3,
              'taxonomy update Booleans',
          )
          replace_exact(
              'backend/app/services/product_taxonomy_store.py',
              ':normalized_synonym, :priority, 1, :source',
              ':normalized_synonym, :priority, TRUE, :source',
              1,
              'synonym insert Boolean',
          )
          replace_exact(
              'backend/app/services/product_taxonomy_store.py',
              ':intent_key, :confidence, 1, :source',
              ':intent_key, :confidence, TRUE, :source',
              1,
              'retailer term insert Boolean',
          )

          for workflow in (
              '.github/workflows/postgresql-main-legacy-schema-retirement.yml',
              '.github/workflows/postgresql-runtime-startup-schema-authority.yml',
          ):
              replace_exact(
                  workflow,
                  "'revision': '20260829_15'",
                  "'revision': '20260830_01'",
                  1,
                  f'{workflow} migration head',
              )
          PY

      - name: Compile, validate and commit final portability patches
        run: |
          python -m py_compile \
            backend/app/receipt_ingestion/service_parts/source_detection.py \
            backend/app/services/product_taxonomy_store.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/receipt_ingestion/service_parts/source_detection.py \
            backend/app/services/product_taxonomy_store.py \
            .github/workflows/postgresql-main-legacy-schema-retirement.yml \
            .github/workflows/postgresql-runtime-startup-schema-authority.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: close final PostgreSQL Boolean and revision residue'
          git push origin HEAD:codex/postgresql-zero-residual-gate
