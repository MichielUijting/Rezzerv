name: TEMP F6-03 central audit gate patch

on:
  pull_request:
    paths:
      - '.github/workflows/f6-03-audit-gate-patch.yml'

permissions:
  contents: write

jobs:
  patch-f6-audit-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch exact stale F6 audit gate markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/f6-failure-recovery-gap-audit-validation.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "grep -F 'PASS f6_count_covered_31' f6-failure-recovery-gap-audit.log":
                  "grep -F 'PASS f6_count_covered_33' f6-failure-recovery-gap-audit.log",
              "grep -F 'PASS f6_count_partial_54' f6-failure-recovery-gap-audit.log":
                  "grep -F 'PASS f6_count_partial_52' f6-failure-recovery-gap-audit.log",
          }
          for old, new in replacements.items():
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected one stale gate marker: {old}')
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Neither old nor new gate marker found: {old}')

          marker = "          grep -F 'PASS f6_02_shared_postgresql_workflow_registered' f6-failure-recovery-gap-audit.log\n"
          added = "          grep -F 'PASS f6_03_invalid_import_scope_fully_covered' f6-failure-recovery-gap-audit.log\n"
          if added not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Expected exactly one F6-02 shared workflow gate marker')
              text = text.replace(marker, marker + added, 1)

          path.write_text(text, encoding='utf-8')
          print('F6_03_CENTRAL_AUDIT_GATE_PATCH_APPLIED')
          PY

          git diff --check -- .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          grep -F "grep -F 'PASS f6_count_covered_33'" .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          grep -F "grep -F 'PASS f6_count_partial_52'" .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          grep -F "grep -F 'PASS f6_03_invalid_import_scope_fully_covered'" .github/workflows/f6-failure-recovery-gap-audit-validation.yml

      - name: Commit central audit gate correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/f6-failure-recovery-gap-audit-validation.yml; then
            echo 'No central audit gate correction left to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          git commit -m 'F6-03: align central audit gate with closure counts'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
