name: Superuser Platform Admin stacking cutover validation

on:
  pull_request:
    paths:
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/services/platform_authorization_management_service.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/test_superuser_platform_admin_stacking_cutover.py'
      - 'backend/tests/test_special_role_management_v2.py'
      - 'backend/tests/test_server_session_service.py'
      - 'backend/tests/server_session_security_selftest.py'
      - 'docs/security/SUPERUSER-PLATFORM-ADMIN-STACKING-CUTOVER.md'
      - '.github/workflows/superuser-platform-admin-stacking-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stacking-cutover:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_stacking_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_stacking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client, backend and test dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_stacking_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_stacking_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_stacking_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_stacking_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_stacking_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: python -m alembic upgrade head

      - name: Compile stacking boundary and contracts
        working-directory: backend
        run: |
          PYTHONPATH=. python -m py_compile \
            app/api/server_session_routes.py \
            app/services/server_session_service.py \
            app/services/platform_authorization_management_service.py \
            tests/test_superuser_platform_admin_stacking_cutover.py \
            tests/test_special_role_management_v2.py \
            tests/test_server_session_service.py \
            tests/server_session_security_selftest.py

      - name: Run stacking role contracts
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_superuser_platform_admin_stacking_cutover.py \
            tests/test_special_role_management_v2.py

      - name: Run stacking session contracts on PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_stacking_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_stacking_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
          REZZERV_SESSION_COOKIE_SECURE: 'false'
        run: |
          python -m pytest -q tests/test_server_session_service.py
          python tests/server_session_security_selftest.py
          echo SUPERUSER_PLATFORM_ADMIN_9_1_8C_STACKING_GREEN
