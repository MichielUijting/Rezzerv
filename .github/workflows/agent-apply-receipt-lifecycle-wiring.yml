name: Agent apply receipt lifecycle wiring

on:
  push:
    branches:
      - agent/chronological-inventory-processing
    paths:
      - .github/agent-patches/apply_receipt_lifecycle_wiring.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chronological-inventory-processing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lifecycle wiring
        run: python .github/agent-patches/apply_receipt_lifecycle_wiring.py
      - name: Validate patch
        run: |
          python -m py_compile backend/app/main.py backend/app/services/receipt_inventory_lifecycle_service.py
          git diff --check
      - name: Commit applied wiring
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/tests/test_receipt_inventory_lifecycle_route_wiring.py
          git commit -m "fix: wire receipt lifecycle into mutation routes"
          git push origin HEAD:agent/chronological-inventory-processing
