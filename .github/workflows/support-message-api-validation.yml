name: Support message API validation

on:
  pull_request:
    paths:
      - 'backend/app/api/support_message_routes.py'
      - 'backend/app/api/platform_access_routes.py'
      - 'backend/app/api/platform_dependencies.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/support_message_service.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/platform_actor_service.py'
      - 'backend/tests/test_support_message_api_contract.py'
      - 'backend/tests/test_platform_actor_service.py'
      - 'backend/tests/test_platform_access_routes.py'
      - '.github/workflows/support-message-api-validation.yml'

jobs:
  support-message-api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/rezzerv-support-message-api-test.db
      SQLITE_RUNTIME_VOLUME: github-actions-temporary-test-database
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy

      - name: Run support message and central authorization contract tests
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_support_message_api_contract.py
          tests/test_support_message_service.py
          tests/test_platform_actor_service.py
          tests/test_platform_access_routes.py
