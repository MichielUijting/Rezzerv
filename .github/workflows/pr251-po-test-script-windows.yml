name: PR251 PO runner Windows validation

on:
  push:
    branches:
      - fix/article-detail-mutation-contracts
    paths:
      - scripts/po-test-pr251-v011296.ps1
      - scripts/START-PO-TEST-PR251.cmd
      - .github/workflows/pr251-po-test-script-windows.yml
  pull_request:
    paths:
      - scripts/po-test-pr251-v011296.ps1
      - scripts/START-PO-TEST-PR251.cmd
      - .github/workflows/pr251-po-test-script-windows.yml

jobs:
  windows-powershell-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell with Windows parser
        shell: powershell
        run: |
          $path = Resolve-Path '.\scripts\po-test-pr251-v011296.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PO_TEST_SCRIPT_WINDOWS_PARSE_GREEN'

      - name: Run canonical PowerShell self-test
        shell: powershell
        run: |
          $logDir = Join-Path $env:TEMP 'Rezzerv-PO-tests'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\po-test-pr251-v011296.ps1' -SelfTest
          $output | Write-Host
          if (($output -join "`n") -notmatch 'PO_TEST_SCRIPT_SELFTEST_GREEN') {
            throw 'Canonical PowerShell self-test GREEN marker ontbreekt.'
          }

      - name: Run standalone launcher from ZIP-like temp location
        shell: powershell
        run: |
          $zipLikeDir = Join-Path $env:TEMP ('e8658047-3693-44b1-a61f-Rezzerv-PO-test.zip.' + (Get-Random))
          New-Item -ItemType Directory -Path $zipLikeDir -Force | Out-Null
          $standalone = Join-Path $zipLikeDir 'START-PO-TEST-PR251.cmd'
          Copy-Item '.\scripts\START-PO-TEST-PR251.cmd' $standalone
          if (Test-Path (Join-Path $zipLikeDir 'po-test-pr251-v011296.ps1')) {
            throw 'Isolatietest bevat ten onrechte een los PowerShell-buurbestand.'
          }
          $output = & cmd.exe /d /c "`"$standalone`" -SelfTest" 2>&1
          $rc = $LASTEXITCODE
          $output | Write-Host
          if ($rc -ne 0) { throw "Standalone launcher self-test gaf exitcode $rc." }
          if (($output -join "`n") -notmatch 'PO_TEST_SCRIPT_SELFTEST_GREEN') {
            throw 'Standalone launcher kon ingebouwde PowerShell-runner niet zelfstandig uitvoeren.'
          }
          Write-Host 'PO_TEST_STANDALONE_ZIP_TEMP_GREEN'

      - name: Validate standalone safety guardrails
        shell: powershell
        run: |
          $launcher = Get-Content '.\scripts\START-PO-TEST-PR251.cmd' -Raw
          $required = @(
            '::REZZERV_POWERSHELL_PAYLOAD::',
            'C:\Users\Gebruiker\Rezzerv_Github',
            "`$LogDir = Join-Path `$env:TEMP 'Rezzerv-PO-tests'",
            '51d20083012f3f094b7407c538741ef329e61d68',
            "worktree','add','--detach'",
            "Copy-Item -LiteralPath `$LiveDb -Destination `$TestDb",
            'ARTICLE_DETAIL_MUTATION_CONTRACT_GREEN',
            'ARTICLE_FIXTURE_GREEN:',
            'Dit venster sluit pas nadat je een toets indrukt.',
            'pause'
          )
          foreach ($needle in $required) {
            if (-not $launcher.Contains($needle)) { throw "Verplichte standalone-guardrail ontbreekt: $needle" }
          }
          if ($launcher -match '(?i)OneDrive|Downloads|GetFolderPath\(''Desktop''\)') {
            throw 'Standalone PO-runner bevat een verboden cloud/download/Desktop-pad-aanname.'
          }
          if ($launcher -match '(?i)%~dp0po-test-pr251-v011296\.ps1') {
            throw 'Standalone launcher mag niet afhankelijk zijn van een naastliggend PowerShell-bestand.'
          }
          if ($launcher -match '(?im)\bgit\s+(reset|stash|switch|clean)\b') {
            throw 'Verboden Git-mutatie gevonden in ingebouwde PO-runner.'
          }
          if ($launcher -match '(?im)Copy-Item[^\r\n]+Destination\s+\$LiveDb') {
            throw 'Ingebouwde runner mag nooit naar de live database terugkopieren.'
          }
          Write-Host 'PO_TEST_STANDALONE_GUARDRAILS_GREEN'
