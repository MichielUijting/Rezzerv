name: Temporary PR335 legacy predicate fix

on:
  push:
    branches:
      - codex/postgresql-inventory-temporal-authority-cutover
    paths:
      - 'tools/_tmp_pr335_legacy_predicate_fix.py'
      - '.github/workflows/_tmp_pr335_legacy_predicate_fix.yml'

permissions:
  contents: write

jobs:
  legacy-predicate-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependencies
        run: |
          python -m pip install --quiet pytest \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)" fastapi pydantic
      - name: Apply known-legacy normalization fix
        run: python tools/_tmp_pr335_legacy_predicate_fix.py
      - name: Compile
        run: |
          python -m py_compile \
            backend/alembic/versions/20260828_03_inventory_temporal_schema_authority.py \
            backend/tests/test_temporal_inventory_service.py
      - name: Run targeted inventory regressions
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_locationless_inventory_identity_guard.py \
            backend/tests/test_temporal_inventory_service.py
      - name: Commit code and tests only
        shell: bash
        run: |
          git config user.name 'rezzerv-ci-bot'
          git config user.email 'rezzerv-ci-bot@users.noreply.github.com'
          git add -- \
            backend/alembic/versions/20260828_03_inventory_temporal_schema_authority.py \
            backend/tests/test_temporal_inventory_service.py
          git commit -m 'Normalize legacy locationless PostgreSQL predicate'
          git push origin HEAD:${{ github.ref_name }}
