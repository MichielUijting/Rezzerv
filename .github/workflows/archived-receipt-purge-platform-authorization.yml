name: Archived receipt purge platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/archived_receipt_purge_route_authorization.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_archived_receipt_purge_platform_authorization.py'
      - 'backend/tests/test_maintenance_recompute_platform_authorization.py'
      - 'backend/tests/test_receipt_status_baseline_platform_authorization.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - '.github/workflows/archived-receipt-purge-platform-authorization.yml'

jobs:
  archived-receipt-purge-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile archived receipt purge boundary and tests
        run: |
          python -m py_compile \
            app/session_entrypoint.py \
            app/services/archived_receipt_purge_route_authorization.py \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_maintenance_recompute_platform_authorization.py \
            tests/test_receipt_status_baseline_platform_authorization.py \
            tests/test_hybrid_regression_platform_authorization.py

      - name: Run archived receipt purge permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_maintenance_recompute_platform_authorization.py \
            tests/test_receipt_status_baseline_platform_authorization.py \
            tests/test_hybrid_regression_platform_authorization.py
