name: Platform Admin 9.1.7 acceptance closure validation

on:
  pull_request:
    paths:
      - '.github/workflows/platform-admin-acceptance-closure-validation.yml'
      - 'backend/app/api/platform_*.py'
      - 'backend/app/services/platform_*.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/testing/postgresql_platform_authorization_fixture.py'
      - 'backend/tests/platform_admin_acceptance_closure_selftest.py'
      - 'backend/tests/test_*platform*'
      - 'backend/tests/test_authorization_foundation_contract.py'
      - 'backend/tests/test_platform_*.py'
      - 'backend/tests/server_session_security_selftest.py'
      - 'docs/product/PLATFORM_ADMIN_ACCEPTANCE_CLOSURE.md'
      - 'frontend/package.json'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/src/features/platform/**'
      - 'frontend/tests/e2e/session-none-context.frontend-regression.spec.js'
      - 'frontend/tests/e2e/platform-*.frontend-regression.spec.js'
  workflow_dispatch:

jobs:
  platform-admin-acceptance-closure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_platform_admin_closure_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_platform_admin_closure_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client, backend and test dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_platform_admin_closure_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_platform_admin_closure_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_platform_admin_closure_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: python -m alembic upgrade head

      - name: Compile closure and authorization foundation
        working-directory: backend
        run: |
          PYTHONPATH=. python -m py_compile \
            app/services/authorization_foundation_service.py \
            tests/platform_admin_acceptance_closure_selftest.py

      - name: Run 9.1.7 executable closure contract
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python tests/platform_admin_acceptance_closure_selftest.py

      - name: Run canonical authorization foundation contract
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_authorization_foundation_contract.py

      - name: Run insight capability contracts
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_testing_status_platform_authorization.py \
            tests/test_platform_audit_route_authorization.py \
            tests/test_platform_logs_route_authorization.py

      - name: Run platform operations capability contracts on PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: |
          python -m pytest -q \
            tests/test_platform_integrations_route_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py \
            tests/test_platform_background_jobs_ui_contract.py \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_technical_schema_platform_route_authorization.py \
            tests/test_fixture_lifecycle_platform_authorization.py \
            tests/test_platform_feature_flags_route_authorization.py

      - name: Run platform security capability contracts on PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
        run: |
          python -m pytest -q \
            tests/test_platform_sessions_route_authorization.py \
            tests/test_platform_users_route_authorization.py \
            tests/test_platform_authorizations_route_authorization.py

      - name: Run existing server-side session security selftest on PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_platform_admin_closure_ci
          REZZERV_DATASTORE_POLICY: postgresql-only
          REZZERV_SESSION_COOKIE_SECURE: 'false'
        run: python tests/server_session_security_selftest.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Acceptance marker
        run: echo PLATFORM_ADMIN_9_1_7_ACCEPTANCE_CLOSURE_GREEN
