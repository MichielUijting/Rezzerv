name: Platform background jobs authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/dev_test_routes.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/services/testing_service.py'
      - 'backend/app/services/testing_status_route_authorization.py'
      - 'backend/app/testing/postgresql_platform_authorization_fixture.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - 'backend/tests/test_testing_status_platform_authorization.py'
      - 'backend/tests/test_platform_background_jobs_ui_contract.py'
      - 'frontend/src/features/platform/PlatformBackgroundJobsPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-background-jobs.frontend-regression.spec.js'
      - '.github/workflows/platform-background-jobs-authorization.yml'

jobs:
  platform-background-jobs-authorization:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_background_jobs_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_background_jobs_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_background_jobs_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_background_jobs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_background_jobs_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_background_jobs_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_background_jobs_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: python -m alembic upgrade head

      - name: Compile background jobs boundary and tests
        run: |
          python -m py_compile \
            app/api/dev_test_routes.py \
            app/services/testing_service.py \
            app/services/testing_status_route_authorization.py \
            app/testing/postgresql_platform_authorization_fixture.py \
            tests/test_test_orchestration_platform_route_authorization.py \
            tests/test_testing_status_platform_authorization.py \
            tests/test_platform_background_jobs_ui_contract.py

      - name: Run focused background jobs UI/status contracts
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_testing_status_platform_authorization.py \
            tests/test_platform_background_jobs_ui_contract.py

      - name: Run background jobs orchestration authorization on PostgreSQL
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_test_orchestration_platform_route_authorization.py
