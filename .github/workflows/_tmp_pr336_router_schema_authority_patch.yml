name: Temporary PR336 router schema authority patch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  patch-router-schema-authority:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Apply guarded router authority patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Feature flags: keep legacy test creator, add strict production validator.
          path = Path('app/services/platform_feature_flag_service.py')
          source = path.read_text(encoding='utf-8')
          old_import = 'from sqlalchemy import text\n'
          new_import = 'from sqlalchemy import inspect, text\n'
          marker = '\n\ndef ensure_platform_feature_flag_schema(conn: Connection) -> None:\n'
          validator = '''\n\ndef validate_platform_feature_flag_schema(conn: Connection) -> None:\n    \"\"\"Fail closed when Alembic has not installed the feature-flag table.\"\"\"\n\n    inspector = inspect(conn)\n    if not inspector.has_table(\"platform_feature_flags\"):\n        raise RuntimeError(\"platform_feature_flags is niet gemigreerd\")\n    required_columns = {\"flag_key\", \"enabled\", \"updated_by\", \"updated_at\"}\n    actual_columns = {\n        str(column.get(\"name\") or \"\").strip().lower()\n        for column in inspector.get_columns(\"platform_feature_flags\")\n    }\n    missing_columns = sorted(required_columns - actual_columns)\n    if missing_columns:\n        raise RuntimeError(\n            \"platform_feature_flags schema drift; ontbrekende kolommen: \"\n            + \", \".join(missing_columns)\n        )\n'''
          if source.count(old_import) != 1 or source.count(marker) != 1:
              raise SystemExit('feature flag patch guard failed')
          if 'def validate_platform_feature_flag_schema' in source:
              raise SystemExit('feature flag validator already exists')
          source = source.replace(old_import, new_import, 1).replace(marker, validator + marker, 1)
          path.write_text(source, encoding='utf-8')

          # 2. Account status: add strict validator and separate DML normalization.
          path = Path('app/services/platform_user_suspension_service.py')
          source = path.read_text(encoding='utf-8')
          marker = '\n\ndef ensure_user_account_status_schema(conn: Connection) -> None:\n'
          validator = '''\n\ndef validate_user_account_status_schema(conn: Connection) -> None:\n    \"\"\"Fail closed when Alembic has not installed account suspension columns.\"\"\"\n\n    inspector = inspect(conn)\n    if not inspector.has_table(\"app_users\"):\n        raise RuntimeError(\"app_users ontbreekt\")\n    columns = {\n        str(column.get(\"name\") or \"\").strip().lower()\n        for column in inspector.get_columns(\"app_users\")\n    }\n    missing_columns = sorted({\"account_status\", \"suspended_at\"} - columns)\n    if missing_columns:\n        raise RuntimeError(\n            \"app_users schema drift; ontbrekende kolommen: \"\n            + \", \".join(missing_columns)\n        )\n\n\ndef normalize_user_account_status_data(conn: Connection) -> None:\n    \"\"\"Normalize legacy empty statuses using DML only after schema validation.\"\"\"\n\n    conn.execute(text(\"\"\"\n        UPDATE app_users\n        SET account_status = 'active'\n        WHERE account_status IS NULL OR trim(account_status) = ''\n    \"\"\"))\n'''
          if source.count(marker) != 1:
              raise SystemExit('account status patch guard failed')
          if 'def validate_user_account_status_schema' in source or 'def normalize_user_account_status_data' in source:
              raise SystemExit('account status validator already exists')
          source = source.replace(marker, validator + marker, 1)
          path.write_text(source, encoding='utf-8')

          # 3. Production router: no schema-mutating ensure calls at import time.
          path = Path('app/api/router.py')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'from app.services.platform_feature_flag_service import ensure_platform_feature_flag_schema\n',
                  'from app.services.platform_feature_flag_service import validate_platform_feature_flag_schema\n',
              ),
              (
                  '    ensure_user_account_status_schema,\n    install_server_session_suspension_guard,\n',
                  '    install_server_session_suspension_guard,\n    normalize_user_account_status_data,\n    validate_user_account_status_schema,\n',
              ),
              (
                  '# Platform feature-flag persistence is initialized once during backend startup.\n# GET requests never create schema or seed default rows.\nwith engine.begin() as schema_conn:\n    ensure_platform_feature_flag_schema(schema_conn)\n',
                  '# Alembic owns platform feature-flag persistence; runtime startup validates only.\nwith engine.begin() as schema_conn:\n    validate_platform_feature_flag_schema(schema_conn)\n',
              ),
              (
                  '# Account suspension is canonical identity authority. Existing accounts are\n# migrated idempotently to active status before requests are accepted, and the\n# cookie-login resolver is guarded without changing household or role state.\nwith engine.begin() as schema_conn:\n    ensure_user_account_status_schema(schema_conn)\n',
                  '# Account suspension schema is Alembic-owned. Runtime startup validates the\n# columns and may normalize legacy empty values with DML only.\nwith engine.begin() as schema_conn:\n    validate_user_account_status_schema(schema_conn)\n    normalize_user_account_status_data(schema_conn)\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'router patch guard failed: {old[:80]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

          # 4. Static regression: cover imported router startup, not main.py only.
          path = Path('tests/runtime_startup_schema_authority_selftest.py')
          source = path.read_text(encoding='utf-8')
          old_path = 'MAIN_PATH = Path(__file__).resolve().parents[1] / "app" / "main.py"\n'
          new_path = old_path + 'ROUTER_PATH = Path(__file__).resolve().parents[1] / "app" / "api" / "router.py"\n'
          if source.count(old_path) != 1 or 'ROUTER_PATH =' in source:
              raise SystemExit('runtime authority path guard failed')
          source = source.replace(old_path, new_path, 1)
          old_tail = '''    if violations:\n        raise AssertionError(\n            \"Production startup still executes schema mutation: \"\n            + \", \".join(sorted(set(violations)))\n        )\n\n    print(\"RUNTIME_STARTUP_SCHEMA_MUTATION_REMOVED_GREEN\")\n'''
          new_tail = '''    router_source = ROUTER_PATH.read_text(encoding=\"utf-8\")\n    router_module = ast.parse(router_source, filename=str(ROUTER_PATH))\n    for node in _startup_nodes(router_module):\n        if not isinstance(node, ast.Call):\n            continue\n        call_name = _call_name(node.func)\n        short_name = call_name.rsplit(\".\", 1)[-1]\n        if short_name.startswith(\"ensure_\") and short_name.endswith(\"_schema\"):\n            violations.append(f\"router:{call_name or short_name}\")\n\n    if violations:\n        raise AssertionError(\n            \"Production startup still executes schema mutation: \"\n            + \", \".join(sorted(set(violations)))\n        )\n\n    print(\"RUNTIME_STARTUP_SCHEMA_MUTATION_REMOVED_GREEN\")\n'''
          if source.count(old_tail) != 1:
              raise SystemExit('runtime authority tail guard failed')
          source = source.replace(old_tail, new_tail, 1)
          path.write_text(source, encoding='utf-8')

          print('PR336_ROUTER_SCHEMA_AUTHORITY_PATCH_APPLIED')
          PY
      - name: Validate router authority and affected platform contracts
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          python -m py_compile \
            app/api/router.py \
            app/services/platform_feature_flag_service.py \
            app/services/platform_user_suspension_service.py \
            tests/runtime_startup_schema_authority_selftest.py
          PYTHONPATH=. python tests/runtime_startup_schema_authority_selftest.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_platform_feature_flags_route_authorization.py \
            tests/test_platform_users_route_authorization.py
          python - <<'PY'
          from pathlib import Path
          router = Path('app/api/router.py').read_text(encoding='utf-8')
          assert 'ensure_platform_feature_flag_schema(schema_conn)' not in router
          assert 'ensure_user_account_status_schema(schema_conn)' not in router
          assert 'validate_platform_feature_flag_schema(schema_conn)' in router
          assert 'validate_user_account_status_schema(schema_conn)' in router
          assert 'normalize_user_account_status_data(schema_conn)' in router
          print('PR336_ROUTER_SCHEMA_AUTHORITY_CONTRACT_GREEN')
          PY
          git -C .. diff --check
      - name: Commit router schema authority fix
        run: |
          git -C .. config user.name rezzerv-ci-bot
          git -C .. config user.email 169062718+MichielUijting@users.noreply.github.com
          git -C .. add -- \
            backend/app/api/router.py \
            backend/app/services/platform_feature_flag_service.py \
            backend/app/services/platform_user_suspension_service.py \
            backend/tests/runtime_startup_schema_authority_selftest.py
          git -C .. commit -m 'Remove router startup schema mutation calls'
          git -C .. push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
