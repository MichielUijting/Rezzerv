name: Frontteam personal household validation

on:
  pull_request:
    paths:
      - 'backend/app/services/frontteam_household_provisioning.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/test_frontteam_household_provisioning.py'
      - 'backend/tests/test_server_session_routes.py'
      - 'backend/tests/test_server_session_service.py'
      - '.github/workflows/frontteam-personal-household-validation.yml'
  workflow_dispatch:

concurrency:
  group: frontteam-personal-household-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontteam-personal-households:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_frontteam_personal_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_frontteam_personal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_frontteam_personal_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_frontteam_personal_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Bootstrap PostgreSQL migration and runtime roles
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_frontteam_personal_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_frontteam_personal_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_frontteam_personal_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        working-directory: .
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_frontteam_personal_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'FRONTTEAM_PERSONAL_HOUSEHOLD_RUNTIME_DML_ONLY_GREEN'

      - name: Compile 9.1.5 Frontteam session contract
        run: |
          python -m py_compile app/services/frontteam_household_provisioning.py
          python -m py_compile app/services/server_session_service.py
          python -m py_compile app/api/server_session_routes.py
          python -m py_compile app/testing/postgresql_onboarding_selftest_fixture.py

      - name: Run focused 9.1.5 regressions on PostgreSQL
        run: |
          python -m pytest -q \
            tests/test_frontteam_household_provisioning.py \
            tests/test_server_session_routes.py \
            tests/test_server_session_service.py

      - name: Confirm Frontteam personal household gate
        run: echo 'FRONTTEAM_PERSONAL_HOUSEHOLD_9_1_5_GREEN'
