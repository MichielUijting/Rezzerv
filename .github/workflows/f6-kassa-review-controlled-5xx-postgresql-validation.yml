name: F6 Kassa review controlled 5xx PostgreSQL rollback

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/db.py'
      - 'backend/app/main.py'
      - 'backend/app/services/f6_failure_injection.py'
      - 'backend/app/testing/receipt_acceptance/baseline.json'
      - 'backend/tests/kassa_review_api_selftest.py'
      - 'backend/tests/p0_kassa_review_fixture.py'
      - 'backend/tests/f6_kassa_controlled_5xx_fixture.py'
      - 'quality/acceptance/canonical_scenario_catalog.json'
      - 'frontend/src/features/receipts/KassaPage.jsx'
      - 'frontend/src/features/stores/storeImportShared.jsx'
      - 'frontend/src/lib/authSession.js'
      - 'frontend/tests/e2e/f6-kassa-review-controlled-5xx.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'scripts/ci/workflow_delta_gate.py'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
      - '.github/workflows/f6-kassa-review-controlled-5xx-postgresql-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f6-kassa-review-controlled-5xx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delta-gate:
    name: F6 Kassa current-delta gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.delta.outputs.run }}
    steps:
      - name: Checkout exact candidate for delta inspection
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Decide whether this pushed delta requires the expensive authority
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/workflow_delta_gate.py \
            --workflow .github/workflows/f6-kassa-review-controlled-5xx-postgresql-validation.yml \
            | tee f6-kassa-delta-gate.log
          grep -E '^RUN=(true|false)$' f6-kassa-delta-gate.log

  f6-kassa-review-controlled-5xx:
    needs: delta-gate
    if: needs.delta-gate.outputs.run == 'true'
    name: F6 Kassa real 500 feedback and approval rollback authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174
      F6_KASSA_TARGET_RECEIPT_ID: f3-kassa-receipt-l4-review-financial

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Guard F6 Kassa browser authority against shortcuts
        shell: bash
        run: |
          set -euo pipefail
          spec='frontend/tests/e2e/f6-kassa-review-controlled-5xx.fullstack.spec.js'
          if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
            echo 'F6 Kassa authority mag de kern-API niet mocken of via browserrequest-mutaties uitvoeren.' >&2
            exit 1
          fi
          grep -F "getByRole('button', { name: 'Goedkeuren', exact: true }).click()" "$spec"
          grep -F 'expect(approvalResponse.status()).toBe(500)' "$spec"
          grep -F 'Bon kon niet worden goedgekeurd.' "$spec"
          grep -F 'F6_KASSA_BROWSER_ROLLBACK_GREEN' "$spec"
          echo 'F6_KASSA_NO_CORE_SHORTCUTS_GREEN'

      - name: Compile F6 Kassa authority sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/app/services/f6_failure_injection.py backend/tests/f6_kassa_controlled_5xx_fixture.py
          node --check frontend/tests/e2e/f6-kassa-review-controlled-5xx.fullstack.spec.js
          node --check frontend/playwright.fullstack.config.js
          node --check frontend/src/lib/authSession.js
          echo 'F6_KASSA_AUTHORITY_COMPILE_GREEN'

      - name: Enable test-only Kassa approval failure
        shell: bash
        run: |
          set -euo pipefail
          cat > f6-kassa-compose.override.yml <<YAML
          services:
            backend:
              environment:
                REZZERV_TEST_ONLY_F6_SQL_FAILURE_INJECTION: "1"
                REZZERV_TEST_ONLY_F6_KASSA_APPROVAL_FAILURE: "1"
                REZZERV_TEST_ONLY_F6_KASSA_RECEIPT_ID: "$F6_KASSA_TARGET_RECEIPT_ID"
          YAML
          echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.postgresql.yml:f6-kassa-compose.override.yml' >> "$GITHUB_ENV"
          echo 'F6_KASSA_TEST_ONLY_FAILURE_ENV_CONFIGURED_GREEN'

      - name: Build real frontend backend and PostgreSQL images
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 600s docker compose --progress plain build

      - name: Start real frontend backend and PostgreSQL
        run: docker compose up -d --no-build

      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              echo 'F6_KASSA_BACKEND_HEALTH_GREEN'
              exit 0
            fi
            if (( attempt % 30 == 0 )); then docker compose logs --no-color --tail=100 backend; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Prove PostgreSQL boundary and active Kassa hook
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend python -u - <<'PY' | tee f6-kassa-runtime-boundary.log
          import os
          from sqlalchemy import text
          from app.db import engine
          from app.services.f6_failure_injection import _enabled, _kassa_approval_enabled, F6_KASSA_RECEIPT_ID_ENV

          assert engine.dialect.name == 'postgresql', engine.dialect.name
          assert _enabled() is True
          assert _kassa_approval_enabled() is True
          assert os.getenv(F6_KASSA_RECEIPT_ID_ENV) == 'f3-kassa-receipt-l4-review-financial'
          with engine.begin() as conn:
              current_user = str(conn.execute(text('SELECT current_user')).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
          assert current_user == 'rezzerv_app', current_user
          assert runtime_create is False
          print(f'runtime_user={current_user}')
          print('F6_KASSA_FAILURE_HOOK_ENABLED_GREEN')
          print('F6_KASSA_POSTGRESQL_RUNTIME_GREEN')
          PY
          grep -F 'F6_KASSA_FAILURE_HOOK_ENABLED_GREEN' f6-kassa-runtime-boundary.log
          grep -F 'F6_KASSA_POSTGRESQL_RUNTIME_GREEN' f6-kassa-runtime-boundary.log

      - name: Stage canonical Kassa fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend mkdir -p /quality/acceptance /backend/app/testing/receipt_acceptance
          docker compose cp quality/acceptance/canonical_scenario_catalog.json backend:/quality/acceptance/canonical_scenario_catalog.json
          docker compose cp backend/app/testing/receipt_acceptance/baseline.json backend:/backend/app/testing/receipt_acceptance/baseline.json
          docker compose exec -T backend test -s /quality/acceptance/canonical_scenario_catalog.json
          docker compose exec -T backend test -s /backend/app/testing/receipt_acceptance/baseline.json
          echo 'F6_KASSA_CANONICAL_FIXTURES_STAGED_GREEN'

      - name: Prepare deterministic Kassa rollback fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend python /app/tests/f6_kassa_controlled_5xx_fixture.py prepare | tee f6-kassa-fixture.log
          grep -F 'F6_KASSA_FIXTURE_GREEN' f6-kassa-fixture.log
          fixture_json="$(grep '^F6_KASSA_FIXTURE=' f6-kassa-fixture.log | tail -1 | cut -d= -f2-)"
          test -n "$fixture_json"
          email="$(jq -r '.email' <<<"$fixture_json")"
          password="$(jq -r '.password' <<<"$fixture_json")"
          receipt_id="$(jq -r '.financial_receipt_id' <<<"$fixture_json")"
          test "$receipt_id" = "$F6_KASSA_TARGET_RECEIPT_ID"
          echo "PLAYWRIGHT_F6_KASSA_EMAIL=$email" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_F6_KASSA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_F6_KASSA_RECEIPT_ID=$receipt_id" >> "$GITHUB_ENV"
          echo "::add-mask::$password"
          echo 'F6_KASSA_PRESTATE_CAPTURED_GREEN'

      - name: Trigger controlled 500 through real Kassa browser UI
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_F6_KASSA_EMAIL="$PLAYWRIGHT_F6_KASSA_EMAIL" \
            -e PLAYWRIGHT_F6_KASSA_PASSWORD="$PLAYWRIGHT_F6_KASSA_PASSWORD" \
            -e PLAYWRIGHT_F6_KASSA_RECEIPT_ID="$PLAYWRIGHT_F6_KASSA_RECEIPT_ID" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npm ci && npx playwright test tests/e2e/f6-kassa-review-controlled-5xx.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/f6-kassa-review-controlled-5xx-browser.log"
          grep -F 'F6_KASSA_REAL_500_FEEDBACK_GREEN' frontend/f6-kassa-review-controlled-5xx-browser.log
          grep -F 'F6_KASSA_BROWSER_ROLLBACK_GREEN' frontend/f6-kassa-review-controlled-5xx-browser.log
          test -s frontend/f6-kassa-review-controlled-5xx-browser-proof.json

      - name: Prove exact PostgreSQL approval rollback
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend python /app/tests/f6_kassa_controlled_5xx_fixture.py verify | tee f6-kassa-postgresql-rollback.log
          grep -F 'F6_KASSA_POSTGRESQL_ROLLBACK_GREEN' f6-kassa-postgresql-rollback.log

      - name: Prove backend actually injected controlled Kassa failure
        shell: bash
        run: |
          set -euo pipefail
          docker compose logs --no-color backend > f6-kassa-backend.log
          grep -F 'F6-01-KASSA-CONTROLLED-500: injected controlled Kassa approval failure' f6-kassa-backend.log
          echo 'F6_KASSA_SERVER_INJECTION_PROVEN_GREEN'

      - name: Verify browser proof markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.approvalStatus' frontend/f6-kassa-review-controlled-5xx-browser-proof.json)" = '500'
          test "$(jq -r '.receiptRemainsInInbox' frontend/f6-kassa-review-controlled-5xx-browser-proof.json)" = 'true'
          grep -F 'F6_KASSA_REAL_500_FEEDBACK_GREEN' frontend/f6-kassa-review-controlled-5xx-browser.log
          grep -F 'F6_KASSA_BROWSER_ROLLBACK_GREEN' frontend/f6-kassa-review-controlled-5xx-browser.log
          echo 'F6_KASSA_BROWSER_PROOF_GREEN'

      - name: Upload F6 Kassa evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6-kassa-review-controlled-5xx-evidence
          path: |
            f6-kassa-runtime-boundary.log
            f6-kassa-fixture.log
            f6-kassa-postgresql-rollback.log
            f6-kassa-backend.log
            frontend/f6-kassa-review-controlled-5xx-browser.log
            frontend/f6-kassa-review-controlled-5xx-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: F6 Kassa gate marker
        run: echo 'F6_KASSA_REVIEW_CONTROLLED_5XX_POSTGRESQL_ROLLBACK_GREEN'

      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=500 backend || true
          docker compose logs --no-color --tail=300 frontend || true

      - name: Cleanup containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
