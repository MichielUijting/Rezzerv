name: TEMP verify Uitpakken admin location runtime

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create
    paths:
      - '.github/workflows/_temp-diagnose-uitpakken-admin-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        run: npm run build

      - name: Start production preview
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 5174 > /tmp/rezzerv-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5174 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rezzerv-vite-preview.log
          exit 1

      - name: Create empty Playwright storage state
        run: |
          mkdir -p playwright/.auth
          node -e "require('fs').writeFileSync('playwright/.auth/user.json',JSON.stringify({cookies:[],origins:[]}))"

      - name: Run exact Admin location regression tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
        run: npx playwright test --project=chromium --no-deps --workers=1 tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js

      - name: Dump preview log
        if: always()
        run: cat /tmp/rezzerv-vite-preview.log || true
