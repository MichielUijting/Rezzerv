name: Temporary PR336 runtime authority fixer

on:
  pull_request:
    paths:
      - 'tools/_tmp_pr336_runtime_authority_fix.py'
      - '.github/workflows/_tmp_pr336_runtime_authority_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/postgresql-runtime-startup-authority-cutover'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply migration-first runtime authority patch
        run: |
          python tools/_tmp_pr336_runtime_authority_fix.py
          git diff --check
          python -m py_compile \
            backend/app/services/frontteam_household_provisioning.py \
            backend/alembic/versions/20260828_04_runtime_startup_schema_authority.py \
            backend/tests/test_frontteam_household_provisioning.py \
            backend/tests/migration_foundation_selftest.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/services/frontteam_household_provisioning.py \
            backend/alembic/versions/20260828_04_runtime_startup_schema_authority.py \
            backend/tests/test_frontteam_household_provisioning.py \
            backend/tests/migration_foundation_selftest.py \
            .github/workflows/postgresql-runtime-startup-schema-authority.yml
          git commit -m 'Move Frontteam startup schema authority to Alembic'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
