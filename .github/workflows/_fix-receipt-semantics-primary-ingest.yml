name: Fix receipt semantics primary ingest

on:
  push:
    branches:
      - agent/receipt-inventory-eligibility-gate
    paths:
      - scripts/_fix_receipt_semantics_primary_ingest.py
      - .github/workflows/_fix-receipt-semantics-primary-ingest.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receipt-inventory-eligibility-gate
          fetch-depth: 0
      - name: Apply primary ingest fix
        run: python scripts/_fix_receipt_semantics_primary_ingest.py
      - name: Compile and run semantic tests
        run: |
          python -m py_compile backend/app/services/receipt_service.py backend/app/receipt_ingestion/receipt_line_semantics.py backend/app/main.py
          cd backend
          python -m pip install -q -r requirements.txt pytest
          PYTHONPATH=. python -m pytest -q tests/test_receipt_inventory_eligibility.py
          PYTHONPATH=. python app/testing/unpack_copies_kassa_contract.py
      - name: Static persistence audit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          assert s.count('INSERT INTO receipt_table_lines') == 2
          assert s.count('line_role, inventory_eligible') == 2
          assert s.count('semantics = derive_receipt_line_semantics(line, store_name=parse_result.store_name)') == 2
          assert s.count('ensure_receipt_line_semantics_schema(conn)') >= 2
          print('PERSISTENCE_CONTRACT=PASS')
          PY
          git diff --check
      - name: Commit fix and remove temporary runner
        run: |
          git config user.name "Rezzerv Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/_fix_receipt_semantics_primary_ingest.py .github/workflows/_fix-receipt-semantics-primary-ingest.yml
          git add backend/app/services/receipt_service.py backend/tests/test_receipt_inventory_eligibility.py
          git commit -m "fix(receipts): persist semantics in primary ingest"
          git push origin HEAD:agent/receipt-inventory-eligibility-gate
