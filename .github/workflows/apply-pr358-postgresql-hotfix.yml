name: Apply PR358 PostgreSQL portability hotfix

on:
  push:
    branches:
      - codex/postgresql-receipt-inventory-chain

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/postgresql-receipt-inventory-chain
          fetch-depth: 0

      - name: Replace one SQLite datetime ordering expression
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          old = 'ORDER BY datetime(created_at) DESC, id DESC'
          new = 'ORDER BY created_at DESC, id DESC'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target occurrence, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit exact one-line portability fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- backend/app/main.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git diff --cached --exit-code && { echo 'No change produced'; exit 1; } || true
          git commit -m 'Fix PostgreSQL receipt event ordering'
          git push origin HEAD:codex/postgresql-receipt-inventory-chain
