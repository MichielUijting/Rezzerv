name: F5 PostgreSQL household article canonical identity regression

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/tests/unpacking_inventory_article_identity_api_selftest.py'
      - 'frontend/src/features/articles/**'
      - 'frontend/src/pages/Voorraad.jsx'
      - 'frontend/src/features/kassa/**'
      - 'frontend/src/features/receipts/**'
      - 'frontend/tests/e2e/p0-article-identity-history.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'scripts/acceptance/l4_06_article_identity_history.py'
      - 'quality/regression/historical_defect_registry.json'
      - 'scripts/acceptance/validate_historical_defect_registry.py'
      - '.github/workflows/f5-postgresql-household-article-canonical-identity-regression.yml'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f5-household-article-canonical-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-identity:
    name: F5-10 canonical household article identity through browser and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Phase 5 historical defect registry
        run: python scripts/acceptance/validate_historical_defect_registry.py

      - name: Prepare deterministic F5-10 identity
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="F5-10-Canonical-Identity-${suffix}-Pass!"
          echo "PLAYWRIGHT_L4_06_EMAIL=f5-10-canonical-${suffix}@example.com" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_06_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_06_HOUSEHOLD=F5-10 Canonical Identity ${suffix}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_06_SHARED_NAME=F5-10 Gedeelde Naam ${suffix}" >> "$GITHUB_ENV"
          echo "::add-mask::$password"

      - name: Guard canonical identity authorities
        shell: bash
        run: |
          spec='frontend/tests/e2e/p0-article-identity-history.fullstack.spec.js'
          pg='scripts/acceptance/l4_06_article_identity_history.py'
          l3='backend/tests/unpacking_inventory_article_identity_api_selftest.py'
          if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
            echo 'F5-10 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
            exit 1
          fi
          grep -F 'Twee verschillende aankoopregels mogen niet op dezelfde canonical identity instorten.' "$spec"
          grep -F 'P0_L4_06_RENAME_IDENTITY_GREEN' "$spec"
          grep -F 'P0_L4_06_DETAIL_HISTORY_IDENTITY_GREEN' "$spec"
          grep -F 'assert article_a_id != article_b_id' "$pg"
          grep -F 'P0_L4_06_POSTGRESQL_HISTORY_OWNERSHIP_GREEN' "$pg"
          grep -F 'cross_household_unpack_mutation_and_processing_are_blocked' "$l3"
          grep -F 'first_unpack_process_persists_one_canonical_article_identity' "$l3"
          echo 'F5_10_CANONICAL_IDENTITY_CONTRACT_GUARD_GREEN'

      - name: Build and start real frontend, backend and PostgreSQL
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              docker compose logs --no-color --tail=100 backend
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Prove production-like PostgreSQL runtime boundary
        shell: bash
        run: |
          docker compose exec -T backend python -u - <<'PY' | tee f5-10-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine

          assert engine.dialect.name == 'postgresql', engine.dialect.name
          with engine.begin() as conn:
              current_user = str(conn.execute(text('SELECT current_user')).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
              alembic_head = str(conn.execute(text('SELECT version_num FROM public.alembic_version')).scalar_one())
          assert current_user == 'rezzerv_app', current_user
          assert runtime_create is False
          assert alembic_head
          print(f'runtime_user={current_user}')
          print(f'alembic_head={alembic_head}')
          print('F5_10_POSTGRESQL_BOUNDARY_GREEN')
          PY

      - name: Run canonical identity through real browser UI
        shell: bash
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_06_EMAIL="$PLAYWRIGHT_L4_06_EMAIL" \
            -e PLAYWRIGHT_L4_06_PASSWORD="$PLAYWRIGHT_L4_06_PASSWORD" \
            -e PLAYWRIGHT_L4_06_HOUSEHOLD="$PLAYWRIGHT_L4_06_HOUSEHOLD" \
            -e PLAYWRIGHT_L4_06_SHARED_NAME="$PLAYWRIGHT_L4_06_SHARED_NAME" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npm ci && npx playwright test tests/e2e/p0-article-identity-history.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/f5-10-browser.log"
          grep -F 'P0_L4_06_SAME_NAME_DIFFERENT_IDENTITY_GREEN' frontend/f5-10-browser.log
          grep -F 'P0_L4_06_RENAME_IDENTITY_GREEN' frontend/f5-10-browser.log
          grep -F 'P0_L4_06_DETAIL_HISTORY_IDENTITY_GREEN' frontend/f5-10-browser.log
          test -s frontend/p0-l4-06-browser-proof.json

      - name: Capture exact browser identities
        shell: bash
        run: |
          proof='frontend/p0-l4-06-browser-proof.json'
          for pair in \
            'householdId:L4_HOUSEHOLD_ID' 'receiptId:L4_RECEIPT_ID' 'batchId:L4_BATCH_ID' \
            'lineAId:L4_LINE_A_ID' 'lineBId:L4_LINE_B_ID' \
            'articleAId:L4_ARTICLE_A_ID' 'articleBId:L4_ARTICLE_B_ID' \
            'eventAId:L4_EVENT_A_ID' 'eventBId:L4_EVENT_B_ID' \
            'sharedArticleName:L4_SHARED_ARTICLE_NAME'; do
            key="${pair%%:*}"
            env_name="${pair##*:}"
            value="$(jq -r --arg key "$key" '.[$key] // empty' "$proof")"
            test -n "$value" || { echo "Browser proof mist $key" >&2; exit 1; }
            echo "$env_name=$value" >> "$GITHUB_ENV"
          done

      - name: Verify exact canonical identity PostgreSQL end state
        shell: bash
        run: |
          cat scripts/acceptance/l4_06_article_identity_history.py | docker compose exec -T \
            -e L4_HOUSEHOLD_ID -e L4_RECEIPT_ID -e L4_BATCH_ID \
            -e L4_LINE_A_ID -e L4_LINE_B_ID \
            -e L4_ARTICLE_A_ID -e L4_ARTICLE_B_ID \
            -e L4_EVENT_A_ID -e L4_EVENT_B_ID -e L4_SHARED_ARTICLE_NAME \
            backend python -u - 2>&1 | tee f5-10-postgresql-end-state.log
          grep -F 'P0_L4_06_POSTGRESQL_DISTINCT_IDENTITIES_GREEN' f5-10-postgresql-end-state.log
          grep -F 'P0_L4_06_POSTGRESQL_RENAME_PRESERVES_IDENTITY_GREEN' f5-10-postgresql-end-state.log
          grep -F 'P0_L4_06_POSTGRESQL_HISTORY_OWNERSHIP_GREEN' f5-10-postgresql-end-state.log

      - name: Upload F5-10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-10-household-article-canonical-identity-evidence
          path: |
            f5-10-postgresql-boundary.log
            f5-10-postgresql-end-state.log
            frontend/f5-10-browser.log
            frontend/p0-l4-06-browser-proof.json
            frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: F5-10 gate marker
        run: echo 'F5_10_HOUSEHOLD_ARTICLE_CANONICAL_IDENTITY_GREEN'

      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=400 backend || true
          docker compose logs --no-color --tail=200 frontend || true

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
