name: TEMP F6-03 patch Kassa rejected upload feedback

on:
  pull_request:
    paths:
      - '.github/workflows/f6-03-kassa-visible-error-patch.yml'
      - 'frontend/src/features/receipts/KassaPage.jsx'

permissions:
  contents: write

jobs:
  patch-kassa-visible-rejection:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic F6-03 product fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/receipts/KassaPage.jsx')
          text = path.read_text(encoding='utf-8')
          changed = False

          # Patch only uploadReceiptFile: retain the HTTP status on the thrown error.
          receipt_start = text.index('async function uploadReceiptFile(householdId, file) {')
          receipt_end = text.index('async function uploadSharedReceiptFile(', receipt_start)
          receipt_block = text[receipt_start:receipt_end]
          status_marker = "error.technicalUploadError = createUploadTechnicalError(response, responseText, '/api/receipts/import')"
          if 'error.status = response.status' not in receipt_block:
              if receipt_block.count(status_marker) != 1:
                  raise SystemExit('Expected exactly one technicalUploadError assignment inside uploadReceiptFile')
              marker_index = receipt_block.index(status_marker)
              line_start = receipt_block.rfind('\n', 0, marker_index) + 1
              indent = receipt_block[line_start:marker_index]
              receipt_block = receipt_block[:line_start] + f'{indent}error.status = response.status\n' + receipt_block[line_start:]
              text = text[:receipt_start] + receipt_block + text[receipt_end:]
              changed = True

          # Patch only processReceiptFileImport: a clean 4xx is a terminal visible rejection,
          # so stop progress and surface the backend message before any recovery refresh.
          process_start = text.index('  async function processReceiptFileImport(file) {')
          process_end = text.index('  async function processLandingReceiptFile(file) {', process_start)
          process_block = text[process_start:process_end]
          guard_marker = 'const responseStatus = Number(err?.status || 0)'
          refresh_marker = 'let refreshedItems = []'
          if guard_marker not in process_block:
              if process_block.count("const technical = err?.technicalUploadError || null") != 1:
                  raise SystemExit('Expected exactly one technical error capture inside processReceiptFileImport')
              if process_block.count('if (technical) setTechnicalUploadError(technical)') != 1:
                  raise SystemExit('Expected exactly one technical error state assignment inside processReceiptFileImport')
              if process_block.count(refresh_marker) != 1:
                  raise SystemExit('Expected exactly one recovery refresh marker inside processReceiptFileImport')

              marker_index = process_block.index(refresh_marker)
              line_start = process_block.rfind('\n', 0, marker_index) + 1
              indent = process_block[line_start:marker_index]
              guard_lines = [
                  'const responseStatus = Number(err?.status || 0)',
                  'if (responseStatus >= 400 && responseStatus < 500) {',
                  "  const message = normalizeErrorMessage(err?.message) || 'Upload van het bonbestand is mislukt.'",
                  '  setIsUploading(false)',
                  '  resetUploadProgress()',
                  "  setStatus('')",
                  "  setDuplicateNotice('')",
                  '  setEmailRouteError(message)',
                  "  setError('')",
                  "  showKassaFeedback('error', message, {",
                  "    title: 'Upload geweigerd',",
                  "    technicalDetail: technical?.detail || '',",
                  '    showTechnicalToggle: Boolean(technical?.detail),',
                  '    key: `kassa-receipt-upload-rejected-${responseStatus}`,',
                  '    dedupeMs: 0,',
                  "    testId: 'kassa-upload-rejected',",
                  '  })',
                  '  return',
                  '}',
                  '',
              ]
              guard = ''.join(f'{indent}{line}\n' if line else '\n' for line in guard_lines)
              process_block = process_block[:line_start] + guard + process_block[line_start:]
              text = text[:process_start] + process_block + text[process_end:]
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('F6_03_KASSA_VISIBLE_REJECTION_PATCH_APPLIED')
          else:
              print('F6_03_KASSA_VISIBLE_REJECTION_ALREADY_APPLIED')
          PY

          git diff --check -- frontend/src/features/receipts/KassaPage.jsx
          grep -F 'error.status = response.status' frontend/src/features/receipts/KassaPage.jsx
          grep -F "testId: 'kassa-upload-rejected'" frontend/src/features/receipts/KassaPage.jsx

      - name: Commit product fix when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/features/receipts/KassaPage.jsx; then
            echo 'No product patch left to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/receipts/KassaPage.jsx
          git commit -m 'F6-03: surface rejected receipt import immediately'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
