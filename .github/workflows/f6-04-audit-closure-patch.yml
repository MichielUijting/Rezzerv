name: TEMP F6-04 finalize audit closure

on:
  pull_request:
    paths:
      - '.github/workflows/f6-04-audit-closure-patch.yml'

permissions:
  contents: write

jobs:
  finalize-f6-04-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch central F6 gate and verify closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/f6-failure-recovery-gap-audit-validation.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "grep -F 'PASS f6_count_covered_33' f6-failure-recovery-gap-audit.log": "grep -F 'PASS f6_count_covered_39' f6-failure-recovery-gap-audit.log",
              "grep -F 'PASS f6_count_gap_32' f6-failure-recovery-gap-audit.log": "grep -F 'PASS f6_count_gap_26' f6-failure-recovery-gap-audit.log",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)

          anchor = "          grep -F 'PASS f6_03_invalid_import_scope_fully_covered' f6-failure-recovery-gap-audit.log\n"
          marker = "          grep -F 'PASS f6_04_interrupted_mutation_scope_fully_covered' f6-failure-recovery-gap-audit.log\n"
          if marker not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + marker, 1)

          path.write_text(text, encoding='utf-8')
          print('F6_04_CENTRAL_GATE_PATCHED')
          PY

          python -m py_compile scripts/acceptance/validate_f6_failure_recovery_gap_audit.py
          python scripts/acceptance/validate_f6_failure_recovery_gap_audit.py | tee f6-04-final-audit-validation.log
          grep -F 'PASS f6_count_covered_39' f6-04-final-audit-validation.log
          grep -F 'PASS f6_count_partial_52' f6-04-final-audit-validation.log
          grep -F 'PASS f6_count_gap_26' f6-04-final-audit-validation.log
          grep -F 'PASS f6_count_na_23' f6-04-final-audit-validation.log
          grep -F 'PASS f6_04_interrupted_mutation_scope_fully_covered' f6-04-final-audit-validation.log
          grep -F 'F6_FAILURE_RECOVERY_GAP_AUDIT_GREEN' f6-04-final-audit-validation.log
          grep -F "PASS f6_count_covered_39" .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          grep -F "PASS f6_count_gap_26" .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          grep -F "PASS f6_04_interrupted_mutation_scope_fully_covered" .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          git diff --check -- .github/workflows/f6-failure-recovery-gap-audit-validation.yml

      - name: Commit definitive F6-04 administrative closure and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/f6-failure-recovery-gap-audit-validation.yml
          git rm .github/workflows/f6-04-audit-closure-patch.yml
          git commit -m 'F6-04: finalize audit closure gates'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
