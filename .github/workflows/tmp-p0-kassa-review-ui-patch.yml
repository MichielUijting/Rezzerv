name: Temporary P0 Kassa review UI patch

on:
  push:
    branches:
      - codex/p0-kassa-review-l4-closure
    paths:
      - .github/workflows/tmp-p0-kassa-review-ui-patch.yml

permissions:
  contents: write

jobs:
  patch-kassa-review-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-kassa-review-l4-closure
          fetch-depth: 0

      - name: Add selected-line review action with exact anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/receipts/KassaPage.jsx')
          text = path.read_text(encoding='utf-8')

          function_anchor = "  async function deleteSelectedLines() {\n"
          if text.count(function_anchor) != 1:
              raise SystemExit(f'Expected exactly one function anchor, got {text.count(function_anchor)}')

          review_function = "\n".join([
              "  async function markSelectedLinesReviewed() {",
              "    if (!canEdit || selectedLineIds.length === 0) return",
              "    try {",
              "      let updated = null",
              "      for (const lineId of selectedLineIds) {",
              "        const draft = lineDrafts[lineId] || {}",
              "        updated = await fetchJson(`/api/receipts/${encodeURIComponent(receipt.id)}/lines/${encodeURIComponent(lineId)}`, {",
              "          method: 'PATCH',",
              "          body: JSON.stringify({",
              "            article_name: draft.article_name,",
              "            quantity: draft.quantity === '' ? null : Number(draft.quantity),",
              "            unit: draft.unit,",
              "            unit_price: draft.unit_price === '' ? null : Number(draft.unit_price),",
              "            line_total: draft.line_total === '' ? null : Number(draft.line_total),",
              "            is_validated: true,",
              "            is_deleted: Boolean(draft.is_deleted),",
              "          }),",
              "        })",
              "      }",
              "      if (updated) onReceiptUpdated?.(updated)",
              "      setSelectedLineIds([])",
              "      onFeedback?.('success', 'Geselecteerde bonregels zijn gecontroleerd.')",
              "    } catch (err) {",
              "      onFeedback?.('error', normalizeErrorMessage(err?.message) || 'Bonregels konden niet als gecontroleerd worden gemarkeerd.')",
              "    }",
              "  }",
              "",
              "",
          ])
          text = text.replace(function_anchor, review_function + function_anchor, 1)

          button_anchor = '                  <Button type="button" variant="secondary" onClick={exportSelected} disabled={selectedLineIds.length === 0} data-testid="receipt-export-button">Exporteren</Button>'
          if text.count(button_anchor) != 1:
              raise SystemExit(f'Expected exactly one button anchor, got {text.count(button_anchor)}')

          review_button = '                  {canEdit ? <Button type="button" variant="secondary" onClick={markSelectedLinesReviewed} disabled={selectedLineIds.length === 0} data-testid="receipt-lines-mark-reviewed">Alles goed</Button> : null}\n'
          text = text.replace(button_anchor, review_button + button_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- frontend/src/features/receipts/KassaPage.jsx

      - name: Commit product fix to candidate branch
        shell: bash
        run: |
          git config user.name "Rezzerv CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/features/receipts/KassaPage.jsx
          git commit -m "Add Kassa selected-line review action"
          git push origin HEAD:codex/p0-kassa-review-l4-closure
