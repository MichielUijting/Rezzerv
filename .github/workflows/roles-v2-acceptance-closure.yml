name: Roles v2 9.1 acceptance closure validation

on:
  pull_request:
    paths:
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/authorization_membership_service.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/testing/authorization_matrix_acceptance.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/app/testing/postgresql_platform_authorization_fixture.py'
      - 'backend/tests/test_authorization_role_matrix.py'
      - 'backend/tests/test_roles_v2_acceptance_closure.py'
      - 'backend/tests/test_roles_v2_foundation_contract.py'
      - 'backend/tests/test_server_session_service.py'
      - 'backend/tests/test_special_role_management_v2.py'
      - 'backend/tests/test_superuser_platform_admin_stacking_cutover.py'
      - 'backend/tests/test_frontteam_household_provisioning.py'
      - 'backend/tests/test_support_platform_route_authorization.py'
      - 'backend/tests/test_external_database_route_authorization.py'
      - 'backend/tests/test_gpc_nl_import_platform_authorization.py'
      - 'backend/tests/server_session_security_selftest.py'
      - 'frontend/src/lib/authSession.js'
      - 'frontend/src/app/router/SuperuserGuard.jsx'
      - 'frontend/tests/session-context-normalization.contract.mjs'
      - 'docs/security/ROLLEN-EN-ACCOUNTMODEL-v2.0.md'
      - 'docs/security/AUTORISATIEMECHANISME-EN-MATRIX-v1.1.md'
      - 'docs/security/ROLLEN-V2-9.1-ACCEPTANCE-CLOSURE.md'
      - 'docs/testing/AUTORISATIE-REGRESSIEPROTOCOL-v1.1.md'
      - 'docs/testing/AUTORISATIE-REGRESSIEPROTOCOL-v2.0.md'
      - '.github/workflows/authorization-matrix-acceptance.yml'
      - '.github/workflows/roles-v2-acceptance-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roles-v2-acceptance-closure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_roles_v2_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_roles_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_roles_v2_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_roles_v2_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      REZZERV_SESSION_COOKIE_SECURE: 'false'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client and backend test dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migration and runtime roles
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_roles_v2_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_roles_v2_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_roles_v2_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_roles_v2_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'ROLES_V2_RUNTIME_DML_ONLY_GREEN'

      - name: Compile roles-v2 closure boundary and contracts
        working-directory: backend
        run: |
          PYTHONPATH=. python -m py_compile \
            app/services/authorization_foundation_service.py \
            app/services/authorization_membership_service.py \
            app/services/server_session_service.py \
            app/testing/authorization_matrix_acceptance.py \
            app/testing/postgresql_onboarding_selftest_fixture.py \
            app/testing/postgresql_platform_authorization_fixture.py \
            tests/test_authorization_role_matrix.py \
            tests/test_roles_v2_acceptance_closure.py

      - name: Run roles-v2 compatibility and PostgreSQL closure contracts
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_roles_v2_acceptance_closure.py \
            tests/test_authorization_role_matrix.py \
            tests/test_roles_v2_foundation_contract.py \
            tests/test_server_session_service.py \
            tests/test_special_role_management_v2.py \
            tests/test_superuser_platform_admin_stacking_cutover.py \
            tests/test_frontteam_household_provisioning.py \
            tests/test_support_platform_route_authorization.py \
            tests/test_external_database_route_authorization.py \
            tests/test_gpc_nl_import_platform_authorization.py
          python -m app.testing.authorization_matrix_acceptance
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python tests/server_session_security_selftest.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend system capability boundary
        run: node frontend/tests/session-context-normalization.contract.mjs

      - name: Mark roles-v2 closure green
        run: echo ROLES_V2_9_1_ACCEPTANCE_CLOSURE_GREEN
