name: Temporary rename Standard processing label

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b

      - name: Replace visible frontend terminology only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('frontend/src')
          changed = []
          old = 'Standaardverwerking'
          new = 'Directe consumptie'
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.js', '.jsx', '.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(str(path))

          if not changed:
              raise SystemExit('Geen frontendvoorkomens van Standaardverwerking gevonden')

          print('Gewijzigde bestanden:')
          for path in changed:
              print(path)
          PY

      - name: Guard terminology-only change
        shell: bash
        run: |
          if ! git diff --quiet -- backend; then
            echo 'Backend wijzigde onverwacht.'
            git diff -- backend
            exit 1
          fi
          if grep -R --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' -n 'Standaardverwerking' frontend/src; then
            echo 'Oude zichtbare term resteert in frontend/src.'
            exit 1
          fi
          git diff --check
          git diff -- frontend/src

      - name: Commit terminology-only change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          git commit -m 'fix(ui): rename Standaardverwerking to Directe consumptie'
          git push origin HEAD:feature/uitpakken-dagartikelen-release-b
