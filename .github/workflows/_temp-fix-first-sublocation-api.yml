name: TEMP fix first sublocation via API

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch files through GitHub contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fix/uitpakken-admin-location-create
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/contents'

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def read_file(path):
              encoded_path = urllib.parse.quote(path, safe='/')
              payload = request('GET', f'{api}/{encoded_path}?ref={urllib.parse.quote(branch)}')
              return base64.b64decode(payload['content']).decode('utf-8'), payload['sha']

          def write_file(path, text, sha, message):
              encoded_path = urllib.parse.quote(path, safe='/')
              return request('PUT', f'{api}/{encoded_path}', {
                  'message': message,
                  'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                  'sha': sha,
                  'branch': branch,
              })

          product_path = 'frontend/src/features/stores/StoreBatchDetailPage.jsx'
          text, sha = read_file(product_path)
          changed = False

          old_start = """  function startInlineLocationCreate(mode) {
    if (!canManageLocations) return
    if (mode === 'sublocation' && !activeLocationSpaceId) {
      showUitpakkenFeedback('warning', 'Selecteer eerst de locatie waaronder je een sublocatie wilt toevoegen.')
      return
    }
    setLocationCreateMode(mode)
    setNewLocationName('')
  }
"""
          new_start = """  function startInlineLocationCreate(mode) {
    if (!canManageLocations) return
    setLocationCreateMode(mode)
    setNewLocationName('')
  }
"""
          if old_start in text:
              text = text.replace(old_start, new_start, 1); changed = True
          elif new_start not in text:
              raise SystemExit('STOP: startInlineLocationCreate anchor not found')

          old_disabled = 'disabled={pickerLineBusy || isCreatingLocation || !activeLocationSpaceId}'
          if old_disabled in text:
              text = text.replace(old_disabled, 'disabled={pickerLineBusy || isCreatingLocation}', 1); changed = True

          old_parent = """                      {locationCreateMode === 'sublocation' ? (
                        <div style={{ color: '#5f7a68', fontSize: 13 }}>
                          Locatie: {spaceLocationOptions(locationOptions).find((option) => String(option.id) === String(activeLocationSpaceId))?.label || '-'}
                        </div>
                      ) : null}
                      <input
"""
          new_parent = """                      {locationCreateMode === 'sublocation' ? (
                        <label className=\"rz-input-field\">
                          <div className=\"rz-label\">Locatie</div>
                          <select
                            className=\"rz-input\"
                            value={activeLocationSpaceId}
                            onChange={(event) => setActiveLocationSpaceId(event.target.value)}
                            data-testid=\"receipt-location-create-parent-space\"
                          >
                            <option value=\"\">Kies een locatie</option>
                            {spaceLocationOptions(locationOptions).map((option) => (
                              <option key={option.id} value={String(option.id)}>{option.label}</option>
                            ))}
                          </select>
                        </label>
                      ) : null}
                      <input
"""
          if old_parent in text:
              text = text.replace(old_parent, new_parent, 1); changed = True
          elif 'receipt-location-create-parent-space' not in text:
              raise SystemExit('STOP: parent selector anchor not found')

          if changed:
              write_file(product_path, text, sha, 'fix(uitpakken): allow creating first sublocation')
              print('PASS product updated')
          else:
              print('Product already updated')

          test_path = 'frontend/tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js'
          t, test_sha = read_file(test_path)
          old_test = """    await page.goto(`/kassabonnen?batch=${batchId}`);
    await page.getByTestId(`receipt-line-location-select-${lineId}`).click();
    await page.getByRole('button', { name: 'Keuken', exact: true }).click();

    await page.getByTestId('receipt-location-create-sublocation').click();
    await page.getByTestId('receipt-location-create-name').fill('Voorraadkast');
"""
          new_test = """    await page.goto(`/kassabonnen?batch=${batchId}`);
    await page.getByTestId(`receipt-line-location-select-${lineId}`).click();

    await page.getByTestId('receipt-location-create-sublocation').click();
    await page.getByTestId('receipt-location-create-parent-space').selectOption('space-keuken');
    await page.getByTestId('receipt-location-create-name').fill('Voorraadkast');
"""
          if old_test in t:
              t = t.replace(old_test, new_test, 1)
              write_file(test_path, t, test_sha, 'test(uitpakken): cover first sublocation creation')
              print('PASS regression updated')
          elif "receipt-location-create-parent-space').selectOption('space-keuken')" in t:
              print('Regression already updated')
          else:
              raise SystemExit('STOP: regression anchor not found')
          PY
