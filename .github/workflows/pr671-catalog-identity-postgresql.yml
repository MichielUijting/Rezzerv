name: Catalogus article identity permanent regressions

on:
  pull_request:
    paths:
      - 'backend/app/services/catalog_identity_resolution_service.py'
      - 'backend/app/services/ed2_receipt_family_link_service.py'
      - 'backend/app/services/automatic_curated_identity_matching_service.py'
      - 'backend/app/services/proven_exact_receipt_name_service.py'
      - 'backend/app/services/curated_identity_batch_service.py'
      - 'backend/alembic/versions/20261113_01_ed2_receipt_family_links.py'
      - 'backend/app/services/catalog_identity_backfill_preview_service.py'
      - 'backend/app/services/catalog_identity_backfill_apply_service.py'
      - 'backend/app/services/catalog_identity_confirmation_service.py'
      - 'backend/app/services/catalog_identity_live_repair_service.py'
      - 'backend/app/services/catalog_retailer_identity_keys.py'
      - 'backend/app/api/barcode_routes.py'
      - 'backend/app/main.py'
      - 'backend/app/services/almost_out_group_service.py'
      - 'backend/app/services/external_article_product_link_service.py'
      - 'backend/app/services/external_article_ui_projection.py'
      - 'backend/app/services/external_unlinked_articles_service.py'
      - 'backend/tests/test_ed2_receipt_family_links.py'
      - 'backend/tests/test_automatic_curated_identity_matching_service.py'
      - 'backend/tests/test_proven_exact_receipt_name_service.py'
      - 'backend/tests/test_proven_exact_receipt_name_postgresql.py'
      - 'backend/tests/test_curated_identity_batch_service.py'
      - 'backend/tests/test_catalog_identity_resolution_service.py'
      - 'backend/tests/test_catalog_identity_backfill_preview_service.py'
      - 'backend/tests/test_catalog_identity_route_security.py'
      - 'backend/tests/test_catalog_identity_chain_postgresql.py'
      - 'backend/tests/test_barcode_purchase_household_article_reuse_contract.py'
      - 'backend/tests/test_household_identity_prevention.py'
      - 'backend/tests/test_receipt_to_unpack_retailer_code_contract.py'
      - 'frontend/src/features/externalDatabases/**'
      - 'frontend/src/features/barcodes/**'
      - 'frontend/src/features/articles/**'
      - 'frontend/src/features/almostOut/**'
      - 'frontend/src/features/kassa/**'
      - 'frontend/src/features/purchaseImport/**'
      - 'frontend/src/lib/barcodeScanner.js'
      - 'frontend/src/lib/useBarcodeScanner.js'
      - 'frontend/src/ui/AppFeedbackProvider.jsx'
      - 'frontend/tests/e2e/article-identity-confirmation.frontend-regression.spec.js'
      - 'frontend/tests/e2e/ed2-catalog-return-manual-barcode.frontend-regression.spec.js'
      - 'frontend/playwright.identity.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/pr671-catalog-identity-postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-catalog-identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inhuis_identity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d inhuis_identity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      INHUIS_IDENTITY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/inhuis_identity_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/inhuis_identity_test
      REZZERV_DATASTORE_POLICY: postgresql-only
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install --quiet pytest==8.4.2 sqlalchemy==2.0.36 'psycopg[binary]==3.3.4' fastapi==0.115.0 pydantic==2.12.5 httpx==0.28.1 cryptography==46.0.3
      - name: PostgreSQL exact identity and historical preview tests
        run: |
          python -m pytest -q \
            backend/tests/test_ed2_receipt_family_links.py \
            backend/tests/test_automatic_curated_identity_matching_service.py \
            backend/tests/test_proven_exact_receipt_name_service.py \
            backend/tests/test_proven_exact_receipt_name_postgresql.py \
            backend/tests/test_curated_identity_batch_service.py \
            backend/tests/test_catalog_identity_resolution_service.py \
            backend/tests/test_catalog_identity_backfill_preview_service.py \
            backend/tests/test_receipt_to_unpack_retailer_code_contract.py \
            backend/tests/test_catalog_identity_route_security.py \
            backend/tests/test_catalog_identity_chain_postgresql.py \
            backend/tests/test_barcode_purchase_household_article_reuse_contract.py \
            backend/tests/test_household_identity_prevention.py

  articlebeheer-browser:
    name: Articlebeheer barcode confirmation browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Run locked Chromium test in existing official Playwright image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e CI=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc 'set -euo pipefail; npm ci --no-audit --no-fund && npx playwright test --config=playwright.identity.config.js'
      - name: Capture browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-identity-browser-regression
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            frontend/playwright-report-identity/
