name: Temporary PR336 authorization fixture migration

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  migrate-authorization-test-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Patch isolated authorization fixtures
        run: python backend/tests/_tmp_pr336_authorization_fixture_patch.py
      - name: Run all patched authorization tests
        run: |
          mapfile -t tests < /tmp/pr336_authorization_fixture_tests.txt
          PYTHONPATH=backend pytest -q "${tests[@]}" backend/tests/test_authorization_foundation_contract.py
      - name: Compile and whitespace check
        run: |
          python -m py_compile backend/app/testing/authorization_schema_fixture.py
          git diff --check
      - name: Commit test-only fixture migration
        run: |
          rm backend/tests/_tmp_pr336_authorization_fixture_patch.py
          git config user.name rezzerv-ci-bot
          git config user.email 169062718+MichielUijting@users.noreply.github.com
          git add -- backend/app/testing/authorization_schema_fixture.py backend/tests backend/tests/_tmp_pr336_authorization_fixture_patch.py
          git commit -m 'Use migration-owned authorization schema in tests'
          git push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
