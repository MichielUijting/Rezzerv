name: Temporary PR336 receipt source boolean patch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  patch-receipt-source-boolean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch cross-dialect receipt source boolean DML
        run: python backend/tests/_tmp_pr336_receipt_source_boolean_patch.py
      - name: Validate exact receipt source boolean contract
        run: |
          python -m py_compile backend/app/services/receipt_service.py
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          start = source.index('def ensure_default_receipt_sources(')
          end = source.index('def _format_duplicate_amount', start)
          contract = source[start:end]
          assert 'is_active = 1' not in contract
          assert 'is_active = :is_active' in contract
          assert 'VALUES (:id, :household_id, :type, :label, :source_path, :is_active)' in contract
          assert contract.count("'is_active': True") == 2
          print('PR336_RECEIPT_SOURCE_BOOLEAN_CONTRACT_GREEN')
          PY
          git diff --check
      - name: Commit PostgreSQL-safe receipt source DML
        run: |
          rm backend/tests/_tmp_pr336_receipt_source_boolean_patch.py
          git config user.name rezzerv-ci-bot
          git config user.email 169062718+MichielUijting@users.noreply.github.com
          git add -- backend/app/services/receipt_service.py backend/tests/_tmp_pr336_receipt_source_boolean_patch.py
          git commit -m 'Use bound boolean for receipt source startup DML'
          git push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
