name: F3-03 PostgreSQL prefill boolean patch

on:
  push:
    branches:
      - codex/integral-test-foundation-phase-0
    paths:
      - '.github/workflows/f3-03-postgresql-prefill-boolean-patch.yml'

permissions:
  contents: write

jobs:
  patch-f3-03-prefill-boolean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/integral-test-foundation-phase-0
          fetch-depth: 0

      - name: Normalize parameter-map indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          source = path.read_text(encoding='utf-8')
          old = '                                "matched_household_article_id": matched_article_id if can_auto_fill else None,'
          new = '                "matched_household_article_id": matched_article_id if can_auto_fill else None,'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one indentation target, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Commit indentation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rezzerv-ci'
          git config user.email 'rezzerv-ci@users.noreply.github.com'
          git add backend/app/main.py
          git diff --cached --check
          git commit -m 'Normalize unpacking prefill parameter formatting'
          git push origin HEAD:codex/integral-test-foundation-phase-0
