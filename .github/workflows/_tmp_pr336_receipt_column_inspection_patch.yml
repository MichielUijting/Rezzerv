name: Temporary PR336 consumer account fixture patch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  patch-consumer-account-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply consumer account authorization fixture patch
        run: python backend/tests/_tmp_pr336_consumer_account_fixture_patch.py
      - name: Validate exact consumer fixture contract
        run: |
          python -m py_compile backend/tests/consumer_account_registration_selftest.py
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/tests/consumer_account_registration_selftest.py').read_text(encoding='utf-8')
          assert 'from app.testing.authorization_schema_fixture import install_authorization_schema' in source
          setup = source[source.index('def _prepare_database(engine)'):source.index('\ndef run()', source.index('def _prepare_database(engine)'))]
          assert setup.count('install_authorization_schema(conn)') == 1
          assert setup.index('ensure_roles_v2_account_and_household_foundation(conn)') < setup.index('install_authorization_schema(conn)') < setup.index('ensure_authorization_foundation(conn)')
          print('PR336_CONSUMER_ACCOUNT_FIXTURE_CONTRACT_GREEN')
          PY
          git diff --check
      - name: Commit consumer account fixture migration
        run: |
          rm backend/tests/_tmp_pr336_consumer_account_fixture_patch.py
          git config user.name rezzerv-ci-bot
          git config user.email 169062718+MichielUijting@users.noreply.github.com
          git add -- backend/tests/consumer_account_registration_selftest.py backend/tests/_tmp_pr336_consumer_account_fixture_patch.py
          git commit -m 'Use authorization test fixture in consumer account selftest'
          git push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
