name: GPC catalog validation

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/services/gpc_catalog_service.py"
      - "backend/app/cli/import_gpc_catalog.py"
      - "backend/tests/test_gpc_catalog_service.py"
      - ".github/workflows/gpc-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gpc-catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_gpc_catalog_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_gpc_catalog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_gpc_catalog_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_gpc_catalog_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migration and runtime roles
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_gpc_catalog_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_gpc_catalog_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_gpc_catalog_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        working-directory: .
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_gpc_catalog_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'GPC_CATALOG_RUNTIME_DML_ONLY_GREEN'

      - name: Compile GPC modules
        run: |
          python -m py_compile app/services/gpc_catalog_service.py
          python -m py_compile app/cli/import_gpc_catalog.py
          python -m py_compile tests/test_gpc_catalog_service.py

      - name: Run focused GPC tests on PostgreSQL
        run: python -m pytest -q tests/test_gpc_catalog_service.py

      - name: Reset isolated PostgreSQL database before CLI proof
        run: python -c "from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()"

      - name: Run isolated CLI import on PostgreSQL
        run: |
          mkdir -p /tmp/gpc-validation
          cat > /tmp/gpc-validation/nl-v-ci.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <schema>
            <segment code="50000000" text="Voedingsmiddelen/Dranken/Tabak">
              <family code="50100000" text="Groenten/Noten/Zaden">
                <class code="50101700" text="Groenten - Onbewerkt">
                  <brick code="10006144" text="Mosterdblad">
                    <attType code="20000794" text="Teeltmethode">
                      <attValue code="30002654" text="Conventioneel" />
                    </attType>
                  </brick>
                </class>
              </family>
            </segment>
          </schema>
          XML
          python -m app.cli.import_gpc_catalog /tmp/gpc-validation/nl-v-ci.xml --language nl --source-version ci > /tmp/gpc-validation/import-result.json

      - name: Verify PostgreSQL database and audit record
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sqlalchemy import create_engine, text

          result = json.loads(Path('/tmp/gpc-validation/import-result.json').read_text(encoding='utf-8'))
          assert result['status'] == 'success'
          assert result['datastore']['datastore'] == 'postgresql'
          assert result['import']['language_code'] == 'nl'
          assert result['import']['counts']['bricks'] == 1

          engine = create_engine(os.environ['DATABASE_URL'])
          try:
              with engine.connect() as conn:
                  revision = conn.execute(text('SELECT version_num FROM alembic_version')).scalar_one()
                  brick = conn.execute(text("SELECT description, class_code FROM gpc_bricks WHERE brick_code = '10006144'" )).one()
                  audit = conn.execute(text("SELECT language_code, source_version, status FROM gpc_import_runs ORDER BY id DESC LIMIT 1")).one()
          finally:
              engine.dispose()

          assert revision == '20260902_01'
          assert tuple(brick) == ('Mosterdblad', '50101700')
          assert tuple(audit) == ('nl', 'ci', 'success')
          print('GPC_CATALOG_POSTGRESQL_VALIDATION_GREEN')
          PY

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: gpc-catalog-validation-evidence
          path: /tmp/gpc-validation/import-result.json
          if-no-files-found: error
