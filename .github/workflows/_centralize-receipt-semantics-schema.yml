name: Centralize receipt semantics schema

on:
  push:
    branches:
      - agent/receipt-inventory-eligibility-gate
    paths:
      - scripts/_centralize_receipt_semantics_schema.py
      - .github/workflows/_centralize-receipt-semantics-schema.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receipt-inventory-eligibility-gate
          fetch-depth: 0
      - name: Centralize schema authority
        run: python scripts/_centralize_receipt_semantics_schema.py
      - name: Compile and semantic tests
        run: |
          python -m py_compile backend/app/main.py backend/app/services/receipt_service.py backend/app/receipt_ingestion/receipt_line_semantics.py backend/app/receipt_ingestion/line_classifier.py
          cd backend
          python -m pip install -q -r requirements.txt pytest
          PYTHONPATH=. python -m pytest -q tests/test_receipt_inventory_eligibility.py
          PYTHONPATH=. python app/testing/unpack_copies_kassa_contract.py
      - name: Architecture audit
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          semantics = Path('backend/app/receipt_ingestion/receipt_line_semantics.py').read_text(encoding='utf-8')
          service = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          start = main.index('line_additions = {')
          block = main[start:start+1200]
          assert "'line_role': 'TEXT'" in block
          assert "'inventory_eligible': 'INTEGER'" in block
          assert 'ensure_receipt_line_semantics_schema' not in main
          assert 'ensure_receipt_line_semantics_schema' not in semantics
          assert 'ensure_receipt_line_semantics_schema' not in service
          assert service.count("'line_role': semantics['line_role']") == 2
          assert service.count("'inventory_eligible': 1 if semantics['inventory_eligible'] else 0") == 2
          print('CENTRAL_SCHEMA_AUTHORITY=PASS')
          PY
          git diff --check
      - name: Commit integration and remove temporary runner
        run: |
          git config user.name "Rezzerv Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/_centralize_receipt_semantics_schema.py .github/workflows/_centralize-receipt-semantics-schema.yml
          git add backend/app/main.py backend/app/services/receipt_service.py backend/app/receipt_ingestion/receipt_line_semantics.py backend/tests/test_receipt_inventory_eligibility.py
          git commit -m "refactor(receipts): centralize semantic schema authority"
          git push origin HEAD:agent/receipt-inventory-eligibility-gate
