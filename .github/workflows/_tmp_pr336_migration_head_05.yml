name: Temporary PR336 migration head 05 fixer

on:
  pull_request:
    paths:
      - 'tools/_tmp_pr336_migration_head_05.py'
      - '.github/workflows/_tmp_pr336_migration_head_05.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/postgresql-runtime-startup-authority-cutover'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Patch migration foundation head
        run: |
          python tools/_tmp_pr336_migration_head_05.py
          git diff --check
          python -m py_compile backend/tests/migration_foundation_selftest.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/migration_foundation_selftest.py
          git commit -m 'Advance migration foundation selftest to 20260828_05'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
