name: Technical schema platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/api/product_inventory_group_routes.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_technical_schema_platform_route_authorization.py'
      - 'backend/tests/test_support_platform_route_authorization.py'
      - 'frontend/src/features/platform/PlatformTechnicalConfigurationPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/session-none-context.frontend-regression.spec.js'
      - '.github/workflows/technical-schema-platform-authorization.yml'

jobs:
  technical-schema-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy

      - name: Run platform permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: pytest -q tests/test_technical_schema_platform_route_authorization.py tests/test_support_platform_route_authorization.py
