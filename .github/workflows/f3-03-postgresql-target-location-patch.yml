name: F3-03 PostgreSQL target-location patch

on:
  push:
    branches:
      - codex/integral-test-foundation-phase-0
    paths:
      - '.github/workflows/f3-03-postgresql-target-location-patch.yml'

permissions:
  contents: write

jobs:
  patch-f3-03:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/integral-test-foundation-phase-0
          fetch-depth: 0

      - name: Make nullable review decision PostgreSQL-typed and clean whitespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('backend/app/main.py')
          source = main_path.read_text(encoding='utf-8')
          old = "review_decision = CASE WHEN :next_review_decision IS NOT NULL THEN :next_review_decision ELSE review_decision END,"
          new = "review_decision = COALESCE(CAST(:next_review_decision AS TEXT), review_decision),"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly two nullable unpacking review decision expressions, found {count}')
          main_path.write_text(source.replace(old, new), encoding='utf-8')

          docs = [
              Path('docs/TEST_IMPLEMENTATION_BACKLOG.md'),
              Path('docs/TEST_MATRIX.md'),
              Path('docs/TEST_WORKFLOW_CLASSIFICATION.md'),
          ]
          for path in docs:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              if len(lines) < 4:
                  raise SystemExit(f'Unexpected short document: {path}')
              lines[2] = lines[2].rstrip()
              lines[3] = lines[3].rstrip()
              suffix = '\n' if text.endswith('\n') else ''
              path.write_text('\n'.join(lines) + suffix, encoding='utf-8')
          PY

      - name: Commit focused F3-03 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rezzerv-ci'
          git config user.email 'rezzerv-ci@users.noreply.github.com'
          git add backend/app/main.py docs/TEST_IMPLEMENTATION_BACKLOG.md docs/TEST_MATRIX.md docs/TEST_WORKFLOW_CLASSIFICATION.md
          git diff --cached --check
          git commit -m 'Type nullable unpacking review decision for PostgreSQL'
          git push origin HEAD:codex/integral-test-foundation-phase-0
