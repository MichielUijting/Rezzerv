name: Temporary PR335 review fix

on:
  push:
    branches:
      - codex/postgresql-inventory-temporal-authority-cutover
    paths:
      - 'tools/_tmp_pr335_review_fix.py'
      - '.github/workflows/_tmp_pr335_review_fix.yml'

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install targeted review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet \
            pytest \
            "$(grep '^sqlalchemy==' backend/requirements.txt)" \
            "$(grep '^alembic==' backend/requirements.txt)" \
            fastapi pydantic

      - name: Apply review fixes
        run: python tools/_tmp_pr335_review_fix.py

      - name: Compile changed Python files
        run: |
          python -m py_compile \
            backend/alembic/versions/20260828_03_inventory_temporal_schema_authority.py \
            backend/app/services/canonical_inventory_identity_service.py \
            backend/app/services/temporal_inventory_service.py \
            backend/tests/migration_foundation_selftest.py \
            backend/tests/postgresql_inventory_writer_selftest.py \
            backend/tests/test_inventory_event_writer_temporal_contract.py \
            backend/tests/test_locationless_inventory_identity_guard.py \
            backend/tests/test_temporal_inventory_service.py

      - name: Run targeted review regressions
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_inventory_event_writer_temporal_contract.py \
            backend/tests/test_locationless_inventory_identity_guard.py \
            backend/tests/test_temporal_inventory_service.py

      - name: Verify central writer no longer uses SQLite datetime fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/main.py').read_text(encoding='utf-8')
          start = source.index('def resolve_or_create_inventory_household_article(')
          end = source.index('\n\ndef create_inventory_event(', start)
          section = source[start:end]
          assert 'datetime(created_at)' not in section
          assert 'ORDER BY created_at ASC, id ASC' in section
          print('INVENTORY_WRITER_CROSS_DIALECT_ORDERING_GREEN')
          PY

      - name: Exclude permanent workflow mutation from Actions push
        run: git checkout -- .github/workflows/postgresql-migration-foundation-validation.yml

      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name 'rezzerv-ci-bot'
          git config user.email 'rezzerv-ci-bot@users.noreply.github.com'
          git add -- \
            backend/alembic/versions/20260828_03_inventory_temporal_schema_authority.py \
            backend/app/main.py \
            backend/app/services/canonical_inventory_identity_service.py \
            backend/app/services/temporal_inventory_service.py \
            backend/tests/migration_foundation_selftest.py \
            backend/tests/postgresql_inventory_writer_selftest.py \
            backend/tests/test_locationless_inventory_identity_guard.py \
            backend/tests/test_temporal_inventory_service.py
          git status --short
          git commit -m 'Address inventory authority review blockers'
          git push origin HEAD:${{ github.ref_name }}
