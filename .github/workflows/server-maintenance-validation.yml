name: Server maintenance isolated PostgreSQL validation
on:
  pull_request:
    paths:
      - 'backend/app/services/maintenance*'
      - 'backend/app/services/household_notification_service.py'
      - 'backend/app/maintenance/postgresql_legacy_production_rebuild.py'
      - 'backend/app/api/server_maintenance_routes.py'
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/main.py'
      - 'backend/app/services/testing_service.py'
      - 'backend/app/api/routes/kassa*'
      - 'backend/alembic/**'
      - 'backend/tests/test_maintenance*'
      - 'frontend/src/features/platform/PlatformMaintenancePanel.jsx'
      - 'scripts/server-maintenance/**'
      - 'backend/app/maintenance/server_maintenance_host_probe.py'
      - 'docker-compose.maintenance.yml'
      - '.github/workflows/server-maintenance-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maintenance_ci
          POSTGRES_PASSWORD: maintenance_ci_ephemeral
          POSTGRES_DB: inhuis_maintenance_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_ci -d inhuis_maintenance_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INHUIS_MAINTENANCE_TEST_DATABASE_URL: postgresql+psycopg://maintenance_ci:maintenance_ci_ephemeral@127.0.0.1:55432/inhuis_maintenance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sqlalchemy==2.0.36 alembic==1.19.1 'psycopg[binary]==3.3.4' fastapi==0.115.0 httpx==0.28.1 cryptography==46.0.3 pytest
      - name: Unit and real PostgreSQL concurrency, persistence and migration tests
        env:
          INHUIS_MAINTENANCE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          python -m pytest -q
          backend/tests/test_maintenance_platform_api.py
          backend/tests/test_maintenance_login_identity.py
          backend/tests/test_maintenance_host_proof.py
          backend/tests/test_maintenance_postgres_admission.py
          backend/tests/test_maintenance_postgres_integration.py
          backend/tests/test_maintenance_runtime_integration.py
          backend/tests/test_maintenance_runtime_preflight.py
          backend/tests/test_maintenance_schema_contract.py
          backend/tests/test_maintenance_state_contract.py

  windows-host-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse operational host agent without executing host/Docker actions
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/server-maintenance/Windows-Host-Agent.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'Host agent syntax invalid' }
          Write-Host 'WINDOWS_HOST_AGENT_PARSE_GREEN'
      - name: Exact database IP identity including PostgreSQL CIDR notation
        shell: pwsh
        run: ./scripts/server-maintenance/Test-Host-Network-Identity.ps1
      - name: Parse isolated rehearsal CMD embedded PowerShell without Docker actions
        shell: pwsh
        run: |
          $script=Get-Content 'scripts/server-maintenance/Inhuis_Server_Geisoleerde_Herstartproef.cmd' -Raw
          $marker='# INHUIS_POWERSHELL_START'
          $index=$script.LastIndexOf($marker)
          if ($index -lt 0) { throw 'Rehearsal script marker missing' }
          $body=$script.Substring($index+$marker.Length)
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($body,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'Rehearsal PowerShell syntax invalid' }
          Write-Host 'ISOLATED_REHEARSAL_POWERSHELL_PARSE_GREEN'
