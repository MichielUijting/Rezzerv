name: P0 receipt inventory full-stack PostgreSQL validation

on:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/app/main.py'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'backend/app/testing/receipt_parsing/**'
      - 'frontend/src/app/router/**'
      - 'frontend/src/features/kassa/**'
      - 'frontend/src/features/receipts/**'
      - 'frontend/src/features/stores/**'
      - 'frontend/src/features/onboarding/**'
      - 'frontend/src/features/articles/**'
      - 'frontend/src/features/almostOut/**'
      - 'frontend/src/pages/Voorraad.jsx'
      - 'frontend/tests/e2e/p0-receipt-inventory.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
      - '.github/workflows/p0-receipt-inventory-fullstack-postgresql-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-receipt-inventory-fullstack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l4-receipt-inventory:
    name: L4-03 Kassa to inventory and Bijna-op with locations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare deterministic L4-03 identity
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="L4-Receipt-${suffix}-Pass!"
          echo "PLAYWRIGHT_L4_RECEIPT_EMAIL=l4-receipt-${suffix}@example.com" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_RECEIPT_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_RECEIPT_HOUSEHOLD=L4 Receipt Household ${suffix}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_L4_RECEIPT_LOCATION=L4 Voorraad ${suffix}" >> "$GITHUB_ENV"
          echo "::add-mask::$password"

      - name: Build and start real frontend, backend and PostgreSQL
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              docker compose logs --no-color --tail=100 backend
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Prove production-like PostgreSQL runtime boundary
        shell: bash
        run: |
          docker compose exec -T backend python -u - <<'PY' | tee p0-l4-03-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine

          assert engine.dialect.name == "postgresql", engine.dialect.name
          with engine.begin() as conn:
              current_user = str(conn.execute(text("SELECT current_user")).scalar_one())
              current_database = str(conn.execute(text("SELECT current_database() ")).scalar_one())
              current_schema = str(conn.execute(text("SELECT current_schema() ")).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
              alembic_head = str(conn.execute(text("SELECT version_num FROM public.alembic_version")).scalar_one())
              required_relations = {
                  "receipt_tables", "receipt_table_lines", "purchase_import_batches",
                  "purchase_import_lines", "inventory", "inventory_events", "spaces",
                  "household_articles",
              }
              actual_relations = set(conn.execute(text("""
                  SELECT table_name FROM information_schema.tables
                  WHERE table_schema = 'public'
              """)).scalars().all())
          assert current_user == "rezzerv_app", current_user
          assert current_schema == "public", current_schema
          assert runtime_create is False
          assert alembic_head
          assert required_relations.issubset(actual_relations), sorted(required_relations - actual_relations)
          print(f"database={current_database}")
          print(f"runtime_user={current_user}")
          print(f"alembic_head={alembic_head}")
          print("P0_L4_03_POSTGRESQL_BOUNDARY_GREEN")
          PY

      - name: Guard L4-03 browser authority against core route mocks
        shell: bash
        run: |
          spec='frontend/tests/e2e/p0-receipt-inventory.fullstack.spec.js'
          if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
            echo 'L4-03 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
            exit 1
          fi
          echo 'P0_L4_03_NO_CORE_ROUTE_MOCKS_GREEN'

      - name: Run complete L4-03 through the real browser UI
        shell: bash
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_L4_RECEIPT_EMAIL="$PLAYWRIGHT_L4_RECEIPT_EMAIL" \
            -e PLAYWRIGHT_L4_RECEIPT_PASSWORD="$PLAYWRIGHT_L4_RECEIPT_PASSWORD" \
            -e PLAYWRIGHT_L4_RECEIPT_HOUSEHOLD="$PLAYWRIGHT_L4_RECEIPT_HOUSEHOLD" \
            -e PLAYWRIGHT_L4_RECEIPT_LOCATION="$PLAYWRIGHT_L4_RECEIPT_LOCATION" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npm ci && npx playwright test tests/e2e/p0-receipt-inventory.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/p0-l4-03-browser.log"
          grep -F 'P0_L4_03_RECEIPT_INVENTORY_BROWSER_GREEN' frontend/p0-l4-03-browser.log
          grep -F 'P0_L4_03_ALMOST_OUT_TRANSITION_BROWSER_GREEN' frontend/p0-l4-03-browser.log
          test -s frontend/p0-l4-03-browser-proof.json

      - name: Capture exact browser identities for PostgreSQL proof
        shell: bash
        run: |
          proof='frontend/p0-l4-03-browser-proof.json'
          test "$(jq -r '.almostOutBefore' "$proof")" = 'false' || { echo 'Browser proof mist Bijna-op NEE.' >&2; exit 1; }
          test "$(jq -r '.almostOutAfter' "$proof")" = 'true' || { echo 'Browser proof mist Bijna-op JA.' >&2; exit 1; }
          for key in householdId receiptId batchId lineId locationName inventoryId householdArticleId initialQuantity minStock idealStock consumeQuantity finalQuantity; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' "$proof")"
            test -n "$value" || { echo "Browser proof mist $key" >&2; exit 1; }
            case "$key" in
              householdId) echo "L4_HOUSEHOLD_ID=$value" >> "$GITHUB_ENV" ;;
              receiptId) echo "L4_RECEIPT_ID=$value" >> "$GITHUB_ENV" ;;
              batchId) echo "L4_BATCH_ID=$value" >> "$GITHUB_ENV" ;;
              lineId) echo "L4_LINE_ID=$value" >> "$GITHUB_ENV" ;;
              locationName) echo "L4_LOCATION_NAME=$value" >> "$GITHUB_ENV" ;;
              inventoryId) echo "L4_INVENTORY_ID=$value" >> "$GITHUB_ENV" ;;
              householdArticleId) echo "L4_HOUSEHOLD_ARTICLE_ID=$value" >> "$GITHUB_ENV" ;;
              initialQuantity) echo "L4_INITIAL_QUANTITY=$value" >> "$GITHUB_ENV" ;;
              minStock) echo "L4_MIN_STOCK=$value" >> "$GITHUB_ENV" ;;
              idealStock) echo "L4_IDEAL_STOCK=$value" >> "$GITHUB_ENV" ;;
              consumeQuantity) echo "L4_CONSUME_QUANTITY=$value" >> "$GITHUB_ENV" ;;
              finalQuantity) echo "L4_FINAL_QUANTITY=$value" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Verify exact PostgreSQL end state and Bijna-op transition after browser actions
        shell: bash
        run: |
          docker compose exec -T \
            -e L4_EMAIL="$PLAYWRIGHT_L4_RECEIPT_EMAIL" \
            -e L4_HOUSEHOLD_ID="$L4_HOUSEHOLD_ID" \
            -e L4_RECEIPT_ID="$L4_RECEIPT_ID" \
            -e L4_BATCH_ID="$L4_BATCH_ID" \
            -e L4_LINE_ID="$L4_LINE_ID" \
            -e L4_LOCATION_NAME="$L4_LOCATION_NAME" \
            -e L4_INVENTORY_ID="$L4_INVENTORY_ID" \
            -e L4_HOUSEHOLD_ARTICLE_ID="$L4_HOUSEHOLD_ARTICLE_ID" \
            -e L4_INITIAL_QUANTITY="$L4_INITIAL_QUANTITY" \
            -e L4_MIN_STOCK="$L4_MIN_STOCK" \
            -e L4_IDEAL_STOCK="$L4_IDEAL_STOCK" \
            -e L4_CONSUME_QUANTITY="$L4_CONSUME_QUANTITY" \
            -e L4_FINAL_QUANTITY="$L4_FINAL_QUANTITY" \
            backend python -u - <<'PY' 2>&1 | tee p0-l4-03-postgresql-end-state.log
          import os
          from decimal import Decimal
          from sqlalchemy import text
          from app.db import engine
          from app.main import (
              build_almost_out_items,
              evaluate_household_article_almost_out,
              get_household_article_row_by_id,
          )

          email = os.environ["L4_EMAIL"].strip().lower()
          household_id = os.environ["L4_HOUSEHOLD_ID"].strip()
          receipt_id = os.environ["L4_RECEIPT_ID"].strip()
          batch_id = os.environ["L4_BATCH_ID"].strip()
          line_id = os.environ["L4_LINE_ID"].strip()
          location_name = os.environ["L4_LOCATION_NAME"].strip()
          inventory_id = os.environ["L4_INVENTORY_ID"].strip()
          household_article_id = os.environ["L4_HOUSEHOLD_ARTICLE_ID"].strip()
          initial_quantity = Decimal(os.environ["L4_INITIAL_QUANTITY"])
          min_stock = Decimal(os.environ["L4_MIN_STOCK"])
          ideal_stock = Decimal(os.environ["L4_IDEAL_STOCK"])
          consume_quantity = Decimal(os.environ["L4_CONSUME_QUANTITY"])
          final_quantity = Decimal(os.environ["L4_FINAL_QUANTITY"])

          assert initial_quantity > min_stock, (initial_quantity, min_stock)
          assert final_quantity <= min_stock, (final_quantity, min_stock)
          assert initial_quantity - consume_quantity == final_quantity

          with engine.begin() as conn:
              membership = conn.execute(text("""
                  SELECT household_id, role
                  FROM public.household_memberships
                  WHERE lower(trim(user_email)) = :email
              """), {"email": email}).mappings().one()
              assert str(membership["household_id"]) == household_id, membership
              assert str(membership["role"]) == "admin", membership

              configuration = conn.execute(text("""
                  SELECT inventory_tracking_level, location_tracking_level, almost_out_enabled
                  FROM public.household_product_configuration
                  WHERE household_id = :household_id
              """), {"household_id": household_id}).mappings().one()
              assert str(configuration["inventory_tracking_level"]) == "quantity", configuration
              assert str(configuration["location_tracking_level"]) == "global", configuration
              assert bool(configuration["almost_out_enabled"]) is True, configuration

              receipt = conn.execute(text("""
                  SELECT id, household_id, approved_at, parse_status
                  FROM public.receipt_tables
                  WHERE id = :receipt_id
              """), {"receipt_id": receipt_id}).mappings().one()
              assert str(receipt["household_id"]) == household_id, receipt
              assert receipt["approved_at"] is not None, receipt

              batch = conn.execute(text("""
                  SELECT id, household_id, import_status
                  FROM public.purchase_import_batches
                  WHERE id = :batch_id
              """), {"batch_id": batch_id}).mappings().one()
              assert str(batch["household_id"]) == household_id, batch

              line = conn.execute(text("""
                  SELECT id, batch_id, quantity_raw, target_location_id, processing_status,
                         processed_event_id
                  FROM public.purchase_import_lines
                  WHERE id = :line_id
              """), {"line_id": line_id}).mappings().one()
              assert str(line["batch_id"]) == batch_id, line
              assert Decimal(str(line["quantity_raw"])) > 0, line
              assert str(line["processing_status"]) == "processed", line
              assert line["processed_event_id"] is not None, line

              space = conn.execute(text("""
                  SELECT id, household_id, naam
                  FROM public.spaces
                  WHERE id = :space_id
              """), {"space_id": str(line["target_location_id"])}).mappings().one()
              assert str(space["household_id"]) == household_id, space
              assert str(space["naam"]) == location_name, space

              inventory = conn.execute(text("""
                  SELECT id, aantal, household_article_id, space_id, status
                  FROM public.inventory
                  WHERE id = :inventory_id
                    AND household_id = :household_id
              """), {"inventory_id": inventory_id, "household_id": household_id}).mappings().first()
              if final_quantity == 0:
                  assert inventory is None, inventory
              else:
                  assert inventory is not None
                  assert str(inventory["household_article_id"]) == household_article_id, inventory
                  assert str(inventory["space_id"]) == str(space["id"]), (inventory, space)
                  assert Decimal(str(inventory["aantal"] or 0)) == final_quantity, inventory
                  assert str(inventory["status"] or "active") == "active", inventory

              article = conn.execute(text("""
                  SELECT id, household_id, min_stock, ideal_stock
                  FROM public.household_articles
                  WHERE id = :article_id
                    AND household_id = :household_id
              """), {"article_id": household_article_id, "household_id": household_id}).mappings().one()
              assert Decimal(str(article["min_stock"])) == min_stock, article
              assert Decimal(str(article["ideal_stock"])) == ideal_stock, article

              purchase_event = conn.execute(text("""
                  SELECT id, household_id, household_article_id, location_id,
                         event_type, quantity, source
                  FROM public.inventory_events
                  WHERE id = :event_id
              """), {"event_id": str(line["processed_event_id"])}).mappings().one()
              assert str(purchase_event["id"]) == str(line["processed_event_id"]), (purchase_event, line)
              assert str(purchase_event["household_id"]) == household_id, purchase_event
              assert str(purchase_event["event_type"]) == "purchase", purchase_event
              assert Decimal(str(purchase_event["quantity"])) > 0, purchase_event
              assert str(purchase_event["source"]) == "store_import", purchase_event
              assert str(purchase_event["household_article_id"]) == household_article_id, (purchase_event, household_article_id)
              assert str(purchase_event["location_id"]) == str(space["id"]), (purchase_event, space)

              consume_event = conn.execute(text("""
                  SELECT id, household_id, household_article_id, location_id,
                         event_type, quantity, old_quantity, new_quantity, source, note
                  FROM public.inventory_events
                  WHERE household_id = :household_id
                    AND household_article_id = :article_id
                    AND event_type = 'consume'
                  ORDER BY created_at DESC, id DESC
                  LIMIT 1
              """), {"household_id": household_id, "article_id": household_article_id}).mappings().one()
              assert str(consume_event["household_id"]) == household_id, consume_event
              assert str(consume_event["household_article_id"]) == household_article_id, consume_event
              assert str(consume_event["location_id"]) == str(space["id"]), (consume_event, space)
              assert Decimal(str(consume_event["quantity"])) == -consume_quantity, consume_event
              assert Decimal(str(consume_event["old_quantity"])) == initial_quantity, consume_event
              assert Decimal(str(consume_event["new_quantity"])) == final_quantity, consume_event
              assert str(consume_event["source"]) == "manual_inventory_api", consume_event

              article_row = get_household_article_row_by_id(conn, household_id, household_article_id)
              assert article_row is not None
              evaluation = evaluate_household_article_almost_out(conn, household_id, article_row)
              almost_out_items = build_almost_out_items(conn, household_id)
              almost_out_ids = {str(item.get("household_article_id") or "") for item in almost_out_items}

              assert str(evaluation.get("data_state") or "") == "ok", evaluation
              assert Decimal(str(evaluation.get("current_quantity") or 0)) == final_quantity, evaluation
              assert bool(evaluation.get("include_in_almost_out")) is True, evaluation
              assert household_article_id in almost_out_ids, almost_out_ids

          print(f"email={email}")
          print(f"household_id={household_id}")
          print(f"receipt_id={receipt_id}")
          print(f"batch_id={batch_id}")
          print(f"line_id={line_id}")
          print(f"location={location_name}")
          print(f"inventory_id={inventory_id}")
          print(f"household_article_id={household_article_id}")
          print(f"inventory_transition={initial_quantity}->{final_quantity}")
          print(f"almost_out_threshold={min_stock}")
          print(f"inventory_zero_row_deleted={str(final_quantity == 0).lower()}")
          print("receipt_approved=true")
          print("line_processed=true")
          print("purchase_history_event=true")
          print("consume_history_event=true")
          print("almost_out_before=false")
          print("almost_out_after=true")
          print("P0_L4_03_ALMOST_OUT_TRANSITION_GREEN")
          print("P0_L4_03_POSTGRESQL_END_STATE_GREEN")
          PY

      - name: L4-03 complete gate marker
        run: echo 'P0_RECEIPT_INVENTORY_FULLSTACK_POSTGRESQL_GREEN'

      - name: Upload L4-03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-l4-03-receipt-inventory-fullstack-evidence
          path: |
            p0-l4-03-postgresql-boundary.log
            p0-l4-03-postgresql-end-state.log
            frontend/p0-l4-03-browser.log
            frontend/p0-l4-03-browser-proof.json
            frontend/playwright-report-fullstack
          if-no-files-found: warn
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=500 backend frontend postgres

      - name: Stop L4-03 stack
        if: always()
        run: docker compose down -v --remove-orphans
