name: Dynamic settings validation

on:
  pull_request:
    paths:
      - 'frontend/src/features/settings/**'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/tests/dynamic-settings-navigation.contract.mjs'
      - 'frontend/tests/e2e/dynamic-settings.frontend-regression.spec.js'
      - '.github/workflows/dynamic-settings-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate dynamic settings matrix
        run: |
          node frontend/tests/dynamic-settings-navigation.contract.mjs | tee /tmp/dynamic-settings.log
          grep -F 'DYNAMIC_SETTINGS_NAVIGATION_CONTRACT_GREEN' /tmp/dynamic-settings.log

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Dynamic settings gate marker
        run: echo 'DYNAMIC_SETTINGS_VALIDATION_GREEN'
