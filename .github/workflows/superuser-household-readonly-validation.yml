name: Superuser household read-only validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/api/superuser_household_routes.py'
      - 'backend/app/services/actor_attribution_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/tests/test_superuser_household_readonly.py'
      - 'backend/tests/test_actor_attribution_service.py'
      - 'backend/tests/test_household_zero_superuser_user_filter_regression.py'
      - 'frontend/src/features/superuser/SuperuserDashboardPage.jsx'
      - '.github/workflows/superuser-household-readonly-validation.yml'
  workflow_dispatch:

jobs:
  validate-superuser-household-readonly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --quiet pytest sqlalchemy fastapi
      - name: Compile S2 backend
        run: |
          python -m compileall -q \
            backend/app/api/superuser_household_routes.py \
            backend/app/services/actor_attribution_service.py \
            backend/app/services/session_request_context.py \
            backend/app/session_entrypoint.py \
            backend/tests/test_superuser_household_readonly.py \
            backend/tests/test_actor_attribution_service.py \
            backend/tests/test_household_zero_superuser_user_filter_regression.py
      - name: Validate S2 read-only, actor attribution and Household 0 user filtering
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_superuser_household_readonly.py \
            backend/tests/test_actor_attribution_service.py \
            backend/tests/test_household_zero_superuser_user_filter_regression.py
