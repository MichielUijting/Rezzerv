name: F5-09 verified main patch

on: [pull_request]

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact F5-09 product fix
        shell: bash
        run: |
          set -euo pipefail
          current_blob="$(git hash-object backend/app/main.py)"
          test "$current_blob" = "140b007418a7f3c6c1b0e749c650889a819a5b9e" || {
            echo "Unexpected main.py blob: $current_blob" >&2
            exit 1
          }
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '                    if not article_group_id:\n'
              '                        results.append({\n'
              '                            "line_id": line_id,\n'
              '                            "line_reference": line_reference,\n'
              '                            "status": "skipped",\n'
              '                            "reason": "Nog geen artikelgroep gekozen",\n'
              '                            "failure_stage": "article_group_resolution",\n'
              '                        })\n'
              '                        skipped_count += 1\n'
              '                        continue\n'
          )
          if text.count(old) != 1:
              raise SystemExit('F5-09 ready_only artikelgroepguard niet exact eenmaal gevonden')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          python -m py_compile backend/app/main.py
          patched_blob="$(git hash-object backend/app/main.py)"
          test "$patched_blob" = "2933f49726002512143e693e0fd0ac87ad806427" || {
            echo "Unexpected patched main.py blob: $patched_blob" >&2
            exit 1
          }

      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'fix: allow unclassified article group in ready-only unpacking'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
