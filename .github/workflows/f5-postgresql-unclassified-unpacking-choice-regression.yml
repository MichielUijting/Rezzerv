name: F5 PostgreSQL unclassified unpacking choice regression

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'frontend/src/features/stores/**'
      - 'frontend/tests/e2e/f5-unclassified-unpacking-choice.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'quality/regression/historical_defect_registry.json'
      - 'scripts/acceptance/validate_historical_defect_registry.py'
      - '.github/workflows/f5-postgresql-unclassified-unpacking-choice-regression.yml'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f5-unclassified-unpacking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unclassified-unpacking-choice:
    name: F5-09 Niet ingedeeld through real browser and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Phase 5 historical defect registry
        run: python scripts/acceptance/validate_historical_defect_registry.py

      - name: Prepare deterministic F5-09 identity
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="F5-09-Unclassified-${suffix}-Pass!"
          echo "PLAYWRIGHT_F5_09_EMAIL=f5-09-unclassified-${suffix}@example.com" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_F5_09_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_F5_09_HOUSEHOLD=F5-09 Niet ingedeeld ${suffix}" >> "$GITHUB_ENV"
          echo "::add-mask::$password"

      - name: Guard F5-09 browser authority and product contract
        shell: bash
        run: |
          spec='frontend/tests/e2e/f5-unclassified-unpacking-choice.fullstack.spec.js'
          ui='frontend/src/features/stores/StoreBatchDetailPage.jsx'
          if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
            echo 'F5-09 mag geen kern-API mocken of via request-mutaties uitvoeren.' >&2
            exit 1
          fi
          grep -F '<option value="">Niet ingedeeld</option>' "$ui"
          grep -F "receipt-line-article-group-select-${lineId}" "$spec"
          grep -F "selectOption('')" "$spec"
          grep -F "receipt-process-button')).toBeEnabled()" "$spec"
          echo 'F5_09_BROWSER_CONTRACT_GUARD_GREEN'

      - name: Build and start real frontend, backend and PostgreSQL
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              docker compose logs --no-color --tail=100 backend
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Prove production-like PostgreSQL runtime boundary
        shell: bash
        run: |
          docker compose exec -T backend python -u - <<'PY' | tee f5-09-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine

          assert engine.dialect.name == 'postgresql', engine.dialect.name
          with engine.begin() as conn:
              current_user = str(conn.execute(text('SELECT current_user')).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
              alembic_head = str(conn.execute(text('SELECT version_num FROM public.alembic_version')).scalar_one())
          assert current_user == 'rezzerv_app', current_user
          assert runtime_create is False
          assert alembic_head
          print(f'runtime_user={current_user}')
          print(f'alembic_head={alembic_head}')
          print('F5_09_POSTGRESQL_BOUNDARY_GREEN')
          PY

      - name: Run Niet ingedeeld through the real browser UI
        shell: bash
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_F5_09_EMAIL="$PLAYWRIGHT_F5_09_EMAIL" \
            -e PLAYWRIGHT_F5_09_PASSWORD="$PLAYWRIGHT_F5_09_PASSWORD" \
            -e PLAYWRIGHT_F5_09_HOUSEHOLD="$PLAYWRIGHT_F5_09_HOUSEHOLD" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npm ci && npx playwright test tests/e2e/f5-unclassified-unpacking-choice.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee /work/f5-09-browser.log"
          grep -F 'F5_09_UNCLASSIFIED_UNPACKING_BROWSER_GREEN' frontend/f5-09-browser.log
          test -s frontend/f5-09-browser-proof.json

      - name: Capture exact browser identities
        shell: bash
        run: |
          proof='frontend/f5-09-browser-proof.json'
          test "$(jq -r '.locationTrackingLevel' "$proof")" = 'none'
          test "$(jq -r '.articleGroupId' "$proof")" = 'null'
          for key in householdId receiptId batchId lineId processedEventId; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' "$proof")"
            test -n "$value" || { echo "Browser proof mist $key" >&2; exit 1; }
            case "$key" in
              householdId) echo "F5_HOUSEHOLD_ID=$value" >> "$GITHUB_ENV" ;;
              receiptId) echo "F5_RECEIPT_ID=$value" >> "$GITHUB_ENV" ;;
              batchId) echo "F5_BATCH_ID=$value" >> "$GITHUB_ENV" ;;
              lineId) echo "F5_LINE_ID=$value" >> "$GITHUB_ENV" ;;
              processedEventId) echo "F5_EVENT_ID=$value" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Verify exact unclassified PostgreSQL end state
        shell: bash
        run: |
          docker compose exec -T \
            -e F5_HOUSEHOLD_ID="$F5_HOUSEHOLD_ID" \
            -e F5_LINE_ID="$F5_LINE_ID" \
            -e F5_EVENT_ID="$F5_EVENT_ID" \
            backend python -u - <<'PY' 2>&1 | tee f5-09-postgresql-end-state.log
          import os
          from sqlalchemy import text
          from app.db import engine

          household_id = os.environ['F5_HOUSEHOLD_ID'].strip()
          line_id = os.environ['F5_LINE_ID'].strip()
          event_id = os.environ['F5_EVENT_ID'].strip()

          with engine.begin() as conn:
              line = conn.execute(text('''
                  SELECT household_article_id, article_group_id, processing_status,
                         target_location_id, processed_event_id
                  FROM public.purchase_import_lines
                  WHERE id = :line_id
              '''), {'line_id': line_id}).mappings().one()
              assert str(line['processing_status']) == 'processed', line
              assert line['article_group_id'] is None, line
              assert line['target_location_id'] is None, line
              assert str(line['processed_event_id']) == event_id, line
              article_id = str(line['household_article_id'])
              assert article_id, line

              article = conn.execute(text('''
                  SELECT household_id, article_group_id
                  FROM public.household_articles
                  WHERE id = :article_id
              '''), {'article_id': article_id}).mappings().one()
              assert str(article['household_id']) == household_id, article
              assert article['article_group_id'] is None, article

              event = conn.execute(text('''
                  SELECT household_id, household_article_id, location_id, event_type, source
                  FROM public.inventory_events
                  WHERE id = :event_id
              '''), {'event_id': event_id}).mappings().one()
              assert str(event['household_id']) == household_id, event
              assert str(event['household_article_id']) == article_id, event
              assert event['location_id'] is None, event
              assert str(event['event_type']) == 'purchase', event
              assert str(event['source']) == 'store_import', event

          print('purchase_import_line=processed_with_article_group_null')
          print('household_article.article_group_id=null')
          print('purchase_event=store_import')
          print('F5_09_UNCLASSIFIED_UNPACKING_POSTGRESQL_GREEN')
          PY

      - name: Upload F5-09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-09-unclassified-unpacking-evidence
          path: |
            f5-09-postgresql-boundary.log
            f5-09-postgresql-end-state.log
            frontend/f5-09-browser.log
            frontend/f5-09-browser-proof.json
            frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: F5-09 gate marker
        run: echo 'F5_09_UNCLASSIFIED_UNPACKING_GREEN'

      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=400 backend || true
          docker compose logs --no-color --tail=200 frontend || true

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
