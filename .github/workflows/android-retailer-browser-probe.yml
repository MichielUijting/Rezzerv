name: Android winkelbrowser haalbaarheidsproef
on:
  pull_request:
    paths:
      - 'packaging/mobile-browser-probe/**'
      - '.github/workflows/android-retailer-browser-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packaging/mobile-browser-probe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated browser contract
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install only locked dependencies and audit security
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Build isolated web bundle and Android project
        run: |
          npm run build
          npx --no-install cap add android
          npx --no-install cap sync android
      - name: Build isolated Android debug app
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK and create SHA-256 proof
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          cat android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: inhuis-browserprobe-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packaging/mobile-browser-probe/android/app/build/outputs/apk/debug/app-debug.apk
            packaging/mobile-browser-probe/android/app/build/outputs/apk/debug/app-debug.apk.sha256
            packaging/mobile-browser-probe/package-lock.json
          if-no-files-found: error
          retention-days: 7
