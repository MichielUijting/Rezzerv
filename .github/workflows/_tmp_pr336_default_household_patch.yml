name: Temporary PR336 default household DML patch

on:
  push:
    branches:
      - codex/postgresql-runtime-startup-authority-cutover

permissions:
  contents: write

jobs:
  patch-default-household:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postgresql-runtime-startup-authority-cutover
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply default household DML patch
        run: python backend/tests/_tmp_pr336_default_household_patch.py
      - name: Validate bootstrap contract
        run: |
          python -m py_compile backend/app/main.py
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/main.py').read_text(encoding='utf-8')
          start = source.index('def bootstrap_auth_registry():')
          end = source.index('\ndef refresh_runtime_users_from_db', start)
          contract = source[start:end]
          assert 'INSERT INTO households (id, naam, created_at)' in contract
          assert 'INSERT INTO household_registry (id, naam, created_at)' in contract
          assert contract.index('INSERT INTO households') < contract.index('INSERT INTO household_registry')
          assert contract.count('ON CONFLICT(id) DO NOTHING') >= 2
          print('PR336_DEFAULT_HOUSEHOLD_DML_CONTRACT_GREEN')
          PY
          git diff --check
      - name: Commit default household DML bootstrap
        run: |
          rm backend/tests/_tmp_pr336_default_household_patch.py
          git config user.name rezzerv-ci-bot
          git config user.email 169062718+MichielUijting@users.noreply.github.com
          git add -- backend/app/main.py backend/tests/_tmp_pr336_default_household_patch.py
          git commit -m 'Seed default household before receipt sources'
          git push origin HEAD:codex/postgresql-runtime-startup-authority-cutover
