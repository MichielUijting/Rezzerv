name: One-shot Superuser PostgreSQL boolean fix

on:
  push:
    branches:
      - codex/postgresql-test-infrastructure-cutover

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/postgresql-test-infrastructure-cutover
          fetch-depth: 1

      - name: Apply exact PostgreSQL BOOLEAN predicate fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/api/superuser_routes.py')
          source = path.read_text(encoding='utf-8')
          old = '              AND active = 1\n'
          new = '              AND active = TRUE\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Superuser active=1 predicate, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          print('SUPERUSER_POSTGRES_BOOLEAN_PATCH_GREEN matches=1')
          PY
          git diff --check
          git diff -- backend/app/api/superuser_routes.py

      - name: Commit exact runtime portability fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api/superuser_routes.py
          git diff --cached --quiet && { echo 'No patch staged'; exit 1; }
          git commit -m 'Fix Superuser PostgreSQL boolean predicate'
          git push origin HEAD:codex/postgresql-test-infrastructure-cutover
