name: Platform Authorizations validation

on:
  pull_request:
    paths:
      - 'backend/app/api/platform_authorizations_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/platform_authorization_management_service.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/frontteam_household_provisioning.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_platform_authorizations_route_authorization.py'
      - 'backend/tests/test_special_role_management_v2.py'
      - 'backend/tests/test_frontteam_household_provisioning.py'
      - 'backend/tests/test_server_session_service.py'
      - 'backend/tests/test_authorization_foundation_contract.py'
      - 'frontend/src/features/platform/PlatformAuthorizationsPage.jsx'
      - 'frontend/src/features/platform/PlatformCapabilityPage.jsx'
      - 'frontend/tests/e2e/platform-authorizations.frontend-regression.spec.js'
      - 'frontend/package.json'
      - '.github/workflows/platform-authorizations-authorization.yml'

jobs:
  platform-authorizations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_platform_authorizations_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_platform_authorizations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_platform_authorizations_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_platform_authorizations_ci
      REZZERV_DATASTORE_POLICY: postgresql-only

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client, backend and test dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_platform_authorizations_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_platform_authorizations_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_platform_authorizations_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Assert runtime role is DML-only
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_platform_authorizations_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'PLATFORM_AUTHORIZATIONS_RUNTIME_DML_ONLY_GREEN'

      - name: Compile special-role boundary and tests
        working-directory: backend
        run: |
          PYTHONPATH=. python -m py_compile \
            app/api/platform_authorizations_routes.py \
            app/services/platform_authorization_management_service.py \
            tests/test_platform_authorizations_route_authorization.py \
            tests/test_special_role_management_v2.py

      - name: Run special-role management contracts
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_platform_authorizations_route_authorization.py \
            tests/test_special_role_management_v2.py \
            tests/test_frontteam_household_provisioning.py \
            tests/test_server_session_service.py \
            tests/test_authorization_foundation_contract.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Platformautorisaties frontend regression
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 >/tmp/rezzerv-platform-authorizations-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/ >/dev/null; then
              echo "Focused Vite server is ready after ${attempt} attempts."
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              echo "Focused Vite server exited before becoming ready."
              cat /tmp/rezzerv-platform-authorizations-vite.log
              exit 1
            fi
            if (( attempt == 30 )); then
              echo "Focused Vite server did not become ready."
              cat /tmp/rezzerv-platform-authorizations-vite.log
              exit 1
            fi
            sleep 1
          done

          npx playwright test tests/e2e/platform-authorizations.frontend-regression.spec.js --project=chromium --no-deps

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
