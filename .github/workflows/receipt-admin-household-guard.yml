name: Receipt parser diagnosis route cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/__init__.py'
      - 'backend/app/services/receipt_parser_diagnosis_route_cleanup.py'
      - 'backend/tests/test_receipt_parser_diagnosis_route_cleanup.py'
      - '.github/workflows/receipt-admin-household-guard.yml'
  workflow_dispatch:

concurrency:
  group: receipt-parser-diagnosis-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-receipt-parser-diagnosis-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer minimale backend-afhankelijkheden
        run: |
          python -m pip install --quiet pytest

      - name: Compileer receipt-parser diagnosis cleanup
        run: |
          python -m py_compile \
            backend/app/services/receipt_parser_diagnosis_route_cleanup.py \
            backend/tests/test_receipt_parser_diagnosis_route_cleanup.py

      - name: Test receipt-parser diagnosis route cleanup
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_receipt_parser_diagnosis_route_cleanup.py
