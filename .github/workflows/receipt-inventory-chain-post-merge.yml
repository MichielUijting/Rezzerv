name: Receipt inventory chain merge gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/testing/receipt_inventory_*'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'backend/app/api/**/*receipt*'
      - 'backend/app/api/**/*inventory*'
      - 'backend/tests/**/*receipt*'
      - 'backend/tests/**/*inventory*'
      - 'scripts/run-receipt-inventory-chain.ps1'
      - '.github/workflows/receipt-inventory-chain-post-merge.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/testing/receipt_inventory_*'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'backend/app/api/**/*receipt*'
      - 'backend/app/api/**/*inventory*'
      - 'backend/tests/**/*receipt*'
      - 'backend/tests/**/*inventory*'
      - 'scripts/run-receipt-inventory-chain.ps1'
      - '.github/workflows/receipt-inventory-chain-post-merge.yml'
  workflow_dispatch:

concurrency:
  group: receipt-inventory-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-chain-after-merge:
    name: Verplichte kassabonketentest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout te valideren versie
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1/7 Compileer ketentestmodules
        run: |
          python -m py_compile \
            backend/app/testing/receipt_inventory_chain_contract.py \
            backend/app/testing/receipt_inventory_chain_test_db.py \
            backend/app/testing/receipt_inventory_chain_step3.py \
            backend/app/testing/receipt_inventory_chain_step4.py \
            backend/app/testing/receipt_inventory_production_chain.py \
            backend/app/testing/receipt_inventory_locationless_production_contract.py

      - name: 2/7 Valideer contract en geïsoleerde testdatabase
        run: |
          python -m backend.app.testing.receipt_inventory_chain_contract
          python -m backend.app.testing.receipt_inventory_chain_test_db

      - name: 3/7 Voer geïsoleerde keten 0-2-5-5 uit
        run: |
          python -m backend.app.testing.receipt_inventory_chain_step3
          python -m backend.app.testing.receipt_inventory_chain_step4

      - name: 4/7 Installeer minimale productie-afhankelijkheden
        run: |
          python -m pip install --quiet \
            fastapi==0.115.0 \
            sqlalchemy==2.0.36 \
            pydantic==2.12.5 \
            python-multipart==0.0.20 \
            pypdf==5.4.0 \
            Pillow \
            beautifulsoup4==4.12.3 \
            opencv-python-headless

      - name: 5/7 Voer bestaande productie-ketentest uit
        env:
          PYTHONPATH: backend
          RECEIPT_STORAGE_ROOT: ${{ runner.temp }}/rezzerv-receipts
        run: python backend/app/testing/receipt_inventory_production_chain.py

      - name: 6/7 Bewijs locationless ready-only productiepad
        env:
          PYTHONPATH: backend
          RECEIPT_STORAGE_ROOT: ${{ runner.temp }}/rezzerv-receipts-locationless
        run: |
          python backend/app/testing/receipt_inventory_locationless_production_contract.py | tee locationless-receipt-production.log
          grep -F 'LOCATIONLESS_RECEIPT_READY_ONLY_PRODUCTION_GREEN' locationless-receipt-production.log

      - name: 7/7 Bevestig groene merge-gate
        run: echo 'KETENTEST GROEN - voorraadpad 0 -> 2 -> 5 -> 5 plus locationless ready_only NULL/NULL'

  validate-powershell-runner:
    name: Valideer zichtbare PowerShell-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout te valideren versie
        uses: actions/checkout@v4

      - name: Toon gevalideerd ketenresultaat in PowerShell
        shell: pwsh
        run: ./scripts/run-receipt-inventory-chain.ps1 -DisplayValidatedResult
