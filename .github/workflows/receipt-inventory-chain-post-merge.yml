name: Receipt inventory chain merge gate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - 'backend/alembic/**'
      - 'backend/app/testing/postgresql_acceptance_foundation.py'
      - 'backend/app/testing/receipt_inventory_*'
      - 'backend/app/testing/postgresql_receipt_inventory_production_chain.py'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'backend/app/api/**/*receipt*'
      - 'backend/app/api/**/*inventory*'
      - 'backend/tests/**/*receipt*'
      - 'backend/tests/**/*inventory*'
      - 'scripts/run-receipt-inventory-chain.ps1'
      - '.github/workflows/receipt-inventory-chain-post-merge.yml'
  push:
    branches:
      - main
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - 'backend/alembic/**'
      - 'backend/app/testing/postgresql_acceptance_foundation.py'
      - 'backend/app/testing/receipt_inventory_*'
      - 'backend/app/testing/postgresql_receipt_inventory_production_chain.py'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/services/**/*inventory*'
      - 'backend/app/api/**/*receipt*'
      - 'backend/app/api/**/*inventory*'
      - 'backend/tests/**/*receipt*'
      - 'backend/tests/**/*inventory*'
      - 'scripts/run-receipt-inventory-chain.ps1'
      - '.github/workflows/receipt-inventory-chain-post-merge.yml'
  workflow_dispatch:

concurrency:
  group: receipt-inventory-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-chain-after-merge:
    name: Verplichte kassabonketentest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout te valideren versie
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1/10 Compileer ketentestmodules
        run: |
          python -m py_compile \
            backend/app/testing/postgresql_acceptance_foundation.py \
            backend/app/testing/receipt_inventory_chain_contract.py \
            backend/app/testing/receipt_inventory_chain_test_db.py \
            backend/app/testing/receipt_inventory_chain_step3.py \
            backend/app/testing/receipt_inventory_chain_step4.py \
            backend/app/testing/receipt_inventory_production_chain.py \
            backend/app/testing/postgresql_receipt_inventory_production_chain.py \
            backend/app/testing/receipt_inventory_locationless_production_contract.py

      - name: 2/10 Valideer contract en geïsoleerde legacy-testdatabase
        run: |
          python -m backend.app.testing.receipt_inventory_chain_contract
          python -m backend.app.testing.receipt_inventory_chain_test_db

      - name: 3/10 Voer geïsoleerde contractketen 0-2-5-5 uit
        run: |
          python -m backend.app.testing.receipt_inventory_chain_step3
          python -m backend.app.testing.receipt_inventory_chain_step4

      - name: 4/10 Installeer productie- en PostgreSQL-afhankelijkheden
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --quiet \
            fastapi==0.115.0 \
            sqlalchemy==2.0.36 \
            alembic==1.19.1 \
            'psycopg[binary]==3.3.4' \
            pydantic==2.12.5 \
            python-multipart==0.0.20 \
            pypdf==5.4.0 \
            Pillow \
            beautifulsoup4==4.12.3 \
            opencv-python-headless

      - name: 5-6/10 Bereid gedeelde PostgreSQL acceptance foundation voor
        uses: ./.github/actions/postgresql-acceptance-foundation
        with:
          database-name: rezzerv
          bootstrap-user: postgres
          bootstrap-password: postgres
          port: '5432'
          migrator-password: migration-pass
          runtime-password: runtime-pass
          migration-mode: preflight
          evidence-file: receipt-postgresql-foundation.log

      - name: 7/10 Voer volledige productie-keten uit als DML-only PostgreSQL-runtime
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://rezzerv_app:runtime-pass@127.0.0.1:5432/rezzerv
          MIGRATION_DATABASE_URL: ''
          REZZERV_DATASTORE_POLICY: postgresql-only
          RECEIPT_STORAGE_ROOT: ${{ runner.temp }}/rezzerv-receipts
        run: |
          python backend/app/testing/postgresql_receipt_inventory_production_chain.py | tee /tmp/postgresql-receipt-chain.log
          grep -F 'POSTGRESQL_RECEIPT_CHAIN_RUNTIME_CREATE_DENIED_GREEN' /tmp/postgresql-receipt-chain.log
          grep -F "'datastore': 'postgresql'" /tmp/postgresql-receipt-chain.log
          grep -F "'migration_credential_available': False" /tmp/postgresql-receipt-chain.log
          grep -F "'inventory_path': [0, 2, 5, 5, 1]" /tmp/postgresql-receipt-chain.log
          grep -F "'almost_out_path': [False, True]" /tmp/postgresql-receipt-chain.log
          grep -F 'POSTGRESQL_RECEIPT_INVENTORY_ALMOST_OUT_CHAIN_GREEN' /tmp/postgresql-receipt-chain.log

      - name: 8/10 Bewijs locationless ready-only legacycontract (sqlite-test-only)
        env:
          PYTHONPATH: backend
          MIGRATION_DATABASE_URL: ''
          REZZERV_DATASTORE_POLICY: ''
          RECEIPT_STORAGE_ROOT: ${{ runner.temp }}/rezzerv-receipts-locationless
        run: |
          python backend/app/testing/receipt_inventory_locationless_production_contract.py | tee locationless-receipt-production.log
          grep -F 'LOCATIONLESS_RECEIPT_READY_ONLY_PRODUCTION_GREEN' locationless-receipt-production.log

      - name: 9/10 Controleer PostgreSQL runtime blijft schema-ongewijzigd
        env:
          PGPASSWORD: runtime-pass
        run: |
          if psql -h 127.0.0.1 -U rezzerv_app -d rezzerv -v ON_ERROR_STOP=1 -c 'CREATE TABLE receipt_chain_ci_ddl_should_fail(id integer);'; then
            echo 'Runtime CREATE unexpectedly succeeded' >&2
            exit 1
          fi
          echo 'POSTGRESQL_RECEIPT_CHAIN_FINAL_CREATE_DENIED_GREEN'

      - name: Upload shared PostgreSQL foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-shared-postgresql-foundation
          path: receipt-postgresql-foundation.log
          if-no-files-found: error
          retention-days: 7

      - name: 10/10 Bevestig groene PostgreSQL merge-gate
        run: echo 'KETENTEST GROEN - PostgreSQL DML-only - voorraadpad 0 -> 2 -> 5 -> 5 -> 1 - Bijna-op NEE -> JA'

  validate-powershell-runner:
    name: Valideer zichtbare PowerShell-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout te valideren versie
        uses: actions/checkout@v4

      - name: Toon gevalideerd PostgreSQL-ketenresultaat in PowerShell
        shell: pwsh
        run: ./scripts/run-receipt-inventory-chain.ps1 -DisplayValidatedResult
