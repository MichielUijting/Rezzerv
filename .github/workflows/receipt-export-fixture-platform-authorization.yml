name: Receipt export fixture platform authorization validation

on:
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/platform_admin_route_guard.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/receipt_admin_household_guard_contract.py'
      - 'backend/tests/test_receipt_export_fixture_platform_authorization.py'
      - 'backend/tests/test_test_orchestration_platform_route_authorization.py'
      - 'backend/tests/test_authorization_foundation_contract.py'
      - '.github/workflows/receipt-export-fixture-platform-authorization.yml'

jobs:
  receipt-export-fixture-platform-authorization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile authorization guard and focused tests
        run: |
          python -m py_compile \
            app/services/authorization_foundation_service.py \
            app/services/platform_admin_route_guard.py \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py

      - name: Run receipt export fixture authorization tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_receipt_export_fixture_platform_authorization.py \
            tests/test_test_orchestration_platform_route_authorization.py \
            tests/test_authorization_foundation_contract.py

      - name: Run legacy platform guard contract
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m app.testing.receipt_admin_household_guard_contract
