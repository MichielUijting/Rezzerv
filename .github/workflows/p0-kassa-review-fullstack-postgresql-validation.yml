name: P0 Kassa review full-stack PostgreSQL validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/alembic/**'
      - 'backend/app/main.py'
      - 'backend/app/services/**/*receipt*'
      - 'backend/app/testing/receipt_acceptance/baseline.json'
      - 'backend/tests/kassa_review_api_selftest.py'
      - 'backend/tests/p0_kassa_review_fixture.py'
      - 'quality/acceptance/canonical_scenario_catalog.json'
      - 'frontend/src/features/receipts/KassaPage.jsx'
      - 'frontend/tests/e2e/p0-kassa-review.fullstack.spec.js'
      - 'frontend/playwright.fullstack.config.js'
      - 'docker-compose.yml'
      - 'docker-compose.postgresql.yml'
      - '.github/workflows/p0-kassa-review-fullstack-postgresql-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-kassa-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p0-kassa-review:
    name: P0 Kassa uncertain and financial browser review
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgresql.yml
      COMPOSE_PROFILES: postgresql
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:5174

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Guard browser authority against core route shortcuts
        shell: bash
        run: |
          set -euo pipefail
          spec='frontend/tests/e2e/p0-kassa-review.fullstack.spec.js'
          if grep -nE 'page\.route\(|context\.route\(|page\.request\.(post|put|patch|delete)\(' "$spec"; then
            echo 'P0 Kassa review authority mag kern-API niet mocken of via browserrequest-mutaties uitvoeren.' >&2
            exit 1
          fi
          grep -F "getByTestId('receipt-lines-mark-reviewed').click()" "$spec"
          grep -F "getByRole('button', { name: 'Goedkeuren', exact: true }).click()" "$spec"
          grep -F "Totaalbedrag wijkt af van de bonregels" "$spec"
          echo 'P0_KASSA_REVIEW_NO_CORE_SHORTCUTS_GREEN'

      - name: Build and start real frontend backend and PostgreSQL
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8011/api/health >/dev/null; then
              echo "Backend health is groen na $attempt pogingen."
              exit 0
            fi
            if (( attempt % 30 == 0 )); then
              docker compose logs --no-color --tail=100 backend
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=500 backend
          exit 1

      - name: Prove production-like PostgreSQL runtime boundary
        shell: bash
        run: |
          docker compose exec -T backend python -u - <<'PY' | tee p0-kassa-review-postgresql-boundary.log
          from sqlalchemy import text
          from app.db import engine

          assert engine.dialect.name == 'postgresql', engine.dialect.name
          with engine.begin() as conn:
              current_user = str(conn.execute(text('SELECT current_user')).scalar_one())
              runtime_create = bool(conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one())
              alembic_head = str(conn.execute(text('SELECT version_num FROM public.alembic_version')).scalar_one())
          assert current_user == 'rezzerv_app', current_user
          assert runtime_create is False
          assert alembic_head
          print(f'runtime_user={current_user}')
          print(f'alembic_head={alembic_head}')
          print('P0_KASSA_REVIEW_POSTGRESQL_BOUNDARY_GREEN')
          PY

      - name: Stage canonical acceptance fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend mkdir -p /quality/acceptance /backend/app/testing/receipt_acceptance
          docker compose cp quality/acceptance/canonical_scenario_catalog.json backend:/quality/acceptance/canonical_scenario_catalog.json
          docker compose cp backend/app/testing/receipt_acceptance/baseline.json backend:/backend/app/testing/receipt_acceptance/baseline.json
          docker compose exec -T backend test -s /quality/acceptance/canonical_scenario_catalog.json
          docker compose exec -T backend test -s /backend/app/testing/receipt_acceptance/baseline.json
          echo 'P0_KASSA_REVIEW_CANONICAL_FIXTURES_STAGED_GREEN'

      - name: Prepare deterministic review receipts
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend python /app/tests/p0_kassa_review_fixture.py prepare | tee p0-kassa-review-fixture.log
          grep -F 'P0_KASSA_REVIEW_FIXTURE_GREEN' p0-kassa-review-fixture.log
          fixture_json="$(grep '^P0_KASSA_REVIEW_FIXTURE=' p0-kassa-review-fixture.log | tail -1 | cut -d= -f2-)"
          test -n "$fixture_json"
          echo "PLAYWRIGHT_P0_KASSA_REVIEW_EMAIL=$(jq -r '.email' <<<"$fixture_json")" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_P0_KASSA_REVIEW_PASSWORD=$(jq -r '.password' <<<"$fixture_json")" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_P0_KASSA_REVIEW_UNCERTAIN_RECEIPT_ID=$(jq -r '.uncertain_receipt_id' <<<"$fixture_json")" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_P0_KASSA_REVIEW_UNCERTAIN_LINE_ID=$(jq -r '.uncertain_line_id' <<<"$fixture_json")" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_P0_KASSA_REVIEW_FINANCIAL_RECEIPT_ID=$(jq -r '.financial_receipt_id' <<<"$fixture_json")" >> "$GITHUB_ENV"
          echo "::add-mask::$(jq -r '.password' <<<"$fixture_json")"

      - name: Run both review variants through the real browser UI
        shell: bash
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            -e PLAYWRIGHT_P0_KASSA_REVIEW_EMAIL="$PLAYWRIGHT_P0_KASSA_REVIEW_EMAIL" \
            -e PLAYWRIGHT_P0_KASSA_REVIEW_PASSWORD="$PLAYWRIGHT_P0_KASSA_REVIEW_PASSWORD" \
            -e PLAYWRIGHT_P0_KASSA_REVIEW_UNCERTAIN_RECEIPT_ID="$PLAYWRIGHT_P0_KASSA_REVIEW_UNCERTAIN_RECEIPT_ID" \
            -e PLAYWRIGHT_P0_KASSA_REVIEW_UNCERTAIN_LINE_ID="$PLAYWRIGHT_P0_KASSA_REVIEW_UNCERTAIN_LINE_ID" \
            -e PLAYWRIGHT_P0_KASSA_REVIEW_FINANCIAL_RECEIPT_ID="$PLAYWRIGHT_P0_KASSA_REVIEW_FINANCIAL_RECEIPT_ID" \
            -v "$GITHUB_WORKSPACE/frontend:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "set -o pipefail; npm ci && npx playwright test tests/e2e/p0-kassa-review.fullstack.spec.js --config=playwright.fullstack.config.js --project=chromium-fullstack | tee p0-kassa-review-browser.log"

      - name: Prove exact PostgreSQL review end state
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend python /app/tests/p0_kassa_review_fixture.py verify | tee p0-kassa-review-postgresql-proof.log
          grep -F 'P0_KASSA_REVIEW_POSTGRESQL_GREEN' p0-kassa-review-postgresql-proof.log

      - name: Verify browser proof markers
        shell: bash
        run: |
          grep -F 'P0_KASSA_UNCERTAIN_BROWSER_REVIEW_GREEN' frontend/p0-kassa-review-browser.log
          grep -F 'P0_KASSA_FINANCIAL_BROWSER_REVIEW_GREEN' frontend/p0-kassa-review-browser.log
          test -s frontend/p0-kassa-review-browser-proof.json
          echo 'P0_KASSA_REVIEW_BROWSER_PROOF_GREEN'

      - name: Upload P0 Kassa review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-kassa-review-postgresql-evidence
          path: |
            p0-kassa-review-postgresql-boundary.log
            p0-kassa-review-fixture.log
            p0-kassa-review-postgresql-proof.log
            frontend/p0-kassa-review-browser.log
            frontend/p0-kassa-review-browser-proof.json
            frontend/test-results/
            frontend/playwright-report-fullstack/
          if-no-files-found: warn
          retention-days: 14

      - name: P0 Kassa review gate marker
        run: echo 'P0_KASSA_REVIEW_FULLSTACK_POSTGRESQL_GREEN'

      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps
          docker compose logs --no-color --tail=500 backend || true
          docker compose logs --no-color --tail=200 frontend || true

      - name: Cleanup containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
