name: Onboarding v2 acceptance closure validation

on:
  pull_request:
    paths:
      - '.github/workflows/onboarding-v2-acceptance-closure-validation.yml'
      - 'docs/product/INHUIS_PRODUCTONTWERP_ONBOARDING_V2.md'
      - 'docs/product/ONBOARDING_V2_ACCEPTANCE_CLOSURE.md'
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

jobs:
  onboarding-v2-acceptance-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_onboarding_v2_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_onboarding_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      REZZERV_EMAIL_ENABLED: 'false'
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_onboarding_v2_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_onboarding_v2_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      RECEIPT_STORAGE_ROOT: '/tmp/rezzerv_i5_receipts'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Bootstrap PostgreSQL migration/runtime roles and isolated identity database
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_onboarding_v2_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_onboarding_v2_ci OWNER TO rezzerv_migrator;
          CREATE DATABASE rezzerv_onboarding_identity_guard_ci OWNER rezzerv_migrator;
          GRANT CONNECT ON DATABASE rezzerv_onboarding_identity_guard_ci TO rezzerv_app;
          \connect rezzerv_onboarding_v2_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          \connect rezzerv_onboarding_identity_guard_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical backend schema through Alembic on PostgreSQL
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Assert onboarding runtime role is DML-only
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_onboarding_v2_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'ONBOARDING_V2_RUNTIME_DML_ONLY_GREEN'

      - name: Validate A — consumer account foundation on PostgreSQL
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/consumer_account_registration_selftest.py

      - name: Validate B — onboarding use-case foundation on PostgreSQL
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/onboarding_use_case_foundation_selftest.py

      - name: Validate C — Inhuis halen on PostgreSQL
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/inhuis_halen_onboarding_selftest.py

      - name: Validate D — Wat Inhuis on PostgreSQL
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/wat_inhuis_onboarding_selftest.py

      - name: Validate E — Waar Inhuis and shared foundations on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/waar_inhuis_onboarding_selftest.py
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/shared_household_minimum_selftest.py

      - name: Validate E — isolated locationless inventory schema guard on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_onboarding_identity_guard_ci
          TEST_SCHEMA_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_onboarding_identity_guard_ci
        run: python -m pytest -q backend/tests/test_locationless_inventory_identity_guard.py

      - name: Validate F — dynamic navigation projection
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/dynamic_navigation_product_projection_selftest.py

      - name: Validate H — circular capability expansion
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/circular_capability_expansion_selftest.py

      - name: Validate I.1 — invitation foundation and target policy
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/household_invitation_foundation_selftest.py
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/household_invitation_target_policy_selftest.py

      - name: Validate I.2 — invitation acceptance and household context
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/household_invitation_acceptance_selftest.py

      - name: Validate I.3 — invitation delivery and secret redaction
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/household_invitation_delivery_selftest.py
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/household_invitation_delivery_redaction_selftest.py

      - name: Validate I.4 — legacy member-create closure
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python backend/tests/household_member_legacy_closure_selftest.py

      - name: Validate server-session household authority on PostgreSQL
        run: |
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          python -m pytest -q \
            backend/tests/test_server_session_routes.py \
            backend/tests/test_server_session_service.py \
            backend/tests/test_session_request_context.py

      - name: Validate I.5 cross-slice closure invariants
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from app.testing.postgresql_onboarding_selftest_fixture import reset_postgresql_test_database; reset_postgresql_test_database()'
          output="$(python backend/tests/onboarding_v2_acceptance_closure_selftest.py)"
          printf '%s\n' "$output"
          grep -Fq 'ONBOARDING_V2_I5_ACCEPTANCE_CLOSURE_SELFTEST_GREEN' <<<"$output"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate F/G/H frontend product contracts
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node tests/dynamic-home-navigation.contract.mjs
          node tests/dynamic-settings-navigation.contract.mjs
          node tests/circular-capability-expansion.contract.mjs

      - name: Validate onboarding choice visibility UX
        working-directory: frontend
        run: node tests/onboarding-choice-visibility.contract.mjs

      - name: Validate I.2/I.4 frontend invitation contracts
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node tests/invitation-acceptance.contract.mjs
          node src/features/settings/SettingsHouseholdPage.invitations.contract.test.js

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Emit I.5 acceptance marker
        run: echo ONBOARDING_V2_I5_ACCEPTANCE_CLOSURE_GREEN
