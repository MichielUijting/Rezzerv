name: Circular capability expansion validation

on:
  pull_request:
    paths:
      - 'backend/app/api/household_capability_expansion_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/household_capability_expansion_service.py'
      - 'backend/app/services/household_product_use_case_service.py'
      - 'backend/app/services/household_location_onboarding_service.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/circular_capability_expansion_selftest.py'
      - 'frontend/src/features/settings/**'
      - 'frontend/src/features/articles/tabs/ArticleStockTab.jsx'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/tests/circular-capability-expansion.contract.mjs'
      - 'frontend/tests/e2e/circular-capability-expansion.frontend-regression.spec.js'
      - '.github/workflows/circular-capability-expansion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_circular_capability_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_circular_capability_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_circular_capability_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_circular_capability_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client and backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -r requirements.txt

      - name: Bootstrap PostgreSQL migrator and DML-only runtime role
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_circular_capability_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_circular_capability_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_circular_capability_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              allowed = conn.execute(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')")).scalar_one()
          engine.dispose()
          assert allowed is False, allowed
          print('CIRCULAR_CAPABILITY_RUNTIME_DML_ONLY_GREEN')
          PY

      - name: Compile H backend
        working-directory: backend
        run: |
          python -m py_compile app/api/household_capability_expansion_routes.py
          python -m py_compile app/services/household_capability_expansion_service.py
          python -m py_compile app/services/household_product_use_case_service.py
          python -m py_compile app/services/household_location_onboarding_service.py
          python -m py_compile tests/circular_capability_expansion_selftest.py

      - name: Validate monotonic backend expansion on PostgreSQL
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/circular_capability_expansion_selftest.py | tee /tmp/circular-backend.log
          grep -F 'CIRCULAR_CAPABILITY_EXPANSION_BACKEND_GREEN' /tmp/circular-backend.log

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate missing-question contract
        run: |
          node frontend/tests/circular-capability-expansion.contract.mjs | tee /tmp/circular-frontend.log
          grep -F 'CIRCULAR_CAPABILITY_EXPANSION_FRONTEND_GREEN' /tmp/circular-frontend.log

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Circular expansion gate marker
        run: echo 'CIRCULAR_CAPABILITY_EXPANSION_H_GREEN'
