name: Circular capability expansion validation

on:
  pull_request:
    paths:
      - '.github/actions/postgresql-acceptance-foundation/action.yml'
      - 'backend/alembic/**'
      - 'backend/app/api/household_capability_expansion_routes.py'
      - 'backend/app/api/server_session_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/household_capability_expansion_service.py'
      - 'backend/app/services/household_product_configuration_service.py'
      - 'backend/app/services/household_product_use_case_service.py'
      - 'backend/app/services/household_location_onboarding_service.py'
      - 'backend/app/services/inventory_location_policy_service.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/postgresql_acceptance_foundation.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/circular_capability_expansion_selftest.py'
      - 'backend/tests/settings_location_policy_api_selftest.py'
      - 'frontend/src/features/settings/**'
      - 'frontend/src/features/articles/tabs/ArticleStockTab.jsx'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/tests/circular-capability-expansion.contract.mjs'
      - 'frontend/tests/e2e/circular-capability-expansion.frontend-regression.spec.js'
      - '.github/workflows/circular-capability-expansion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_circular_capability_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_circular_capability_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_circular_capability_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_circular_capability_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
      REZZERV_SESSION_COOKIE_SECURE: 'false'
      REZZERV_PROVISION_TEST_HOUSEHOLD_ZERO: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client and backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -r requirements.txt

      - name: Prepare shared PostgreSQL acceptance foundation
        uses: ./.github/actions/postgresql-acceptance-foundation
        with:
          database-name: rezzerv_circular_capability_ci
          bootstrap-user: rezzerv_bootstrap
          bootstrap-password: rezzerv_bootstrap_ci
          port: '55432'
          migrator-password: rezzerv_migrator_ci
          runtime-password: rezzerv_app_ci
          migration-mode: alembic
          evidence-file: circular-shared-postgresql-foundation.log

      - name: Compile H backend and F3-01 API authority
        working-directory: backend
        run: |
          python -m py_compile app/api/household_capability_expansion_routes.py
          python -m py_compile app/services/household_capability_expansion_service.py
          python -m py_compile app/services/household_product_configuration_service.py
          python -m py_compile app/services/household_product_use_case_service.py
          python -m py_compile app/services/household_location_onboarding_service.py
          python -m py_compile app/services/inventory_location_policy_service.py
          python -m py_compile app/services/server_session_service.py
          python -m py_compile app/services/session_request_context.py
          python -m py_compile tests/circular_capability_expansion_selftest.py
          python -m py_compile tests/settings_location_policy_api_selftest.py

      - name: Validate monotonic backend expansion on PostgreSQL
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/circular_capability_expansion_selftest.py | tee /tmp/circular-backend.log
          grep -F 'CIRCULAR_CAPABILITY_EXPANSION_BACKEND_GREEN' /tmp/circular-backend.log

      - name: Validate Settings to location policy through real PostgreSQL API
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/settings_location_policy_api_selftest.py | tee /tmp/settings-location-policy-api.log
          grep -F 'PASS missing_server_session_401' /tmp/settings-location-policy-api.log
          grep -F 'PASS household_member_cannot_manage_settings' /tmp/settings-location-policy-api.log
          grep -F 'PASS settings_api_persists_locationless_mode' /tmp/settings-location-policy-api.log
          grep -F 'PASS settings_api_persists_global_location_mode' /tmp/settings-location-policy-api.log
          grep -F 'PASS database_and_runtime_policy_match_saved_settings' /tmp/settings-location-policy-api.log
          grep -F 'PASS unrelated_household_remains_isolated' /tmp/settings-location-policy-api.log
          grep -F 'SETTINGS_LOCATION_POLICY_API_POSTGRESQL_GREEN' /tmp/settings-location-policy-api.log

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate missing-question contract
        run: |
          node frontend/tests/circular-capability-expansion.contract.mjs | tee /tmp/circular-frontend.log
          grep -F 'CIRCULAR_CAPABILITY_EXPANSION_FRONTEND_GREEN' /tmp/circular-frontend.log

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload shared PostgreSQL foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circular-capability-shared-postgresql-foundation
          path: circular-shared-postgresql-foundation.log
          if-no-files-found: error
          retention-days: 7

      - name: Circular expansion gate marker
        run: echo 'CIRCULAR_CAPABILITY_EXPANSION_H_GREEN'
