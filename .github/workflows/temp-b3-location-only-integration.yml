name: Temporary B3 location-only integration

on:
  push:
    branches:
      - feature/uitpakken-dagartikelen-release-b
    paths:
      - .github/workflows/temp-b3-location-only-integration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/uitpakken-dagartikelen-release-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply location-only B3 design
        run: python scripts/temp_b3_location_only.py
      - name: Validate frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm test -- --run src/features/stores/StoreBatchDetailPage.b3-native.contract.test.js
      - name: Commit location-only design
        run: |
          git config user.name "Rezzerv CI"
          git config user.email "actions@rezzerv.local"
          git add frontend/src/features/stores/StoreBatchDetailPage.jsx frontend/src/features/stores/StoreBatchDetailPage.b3-native.contract.test.js
          git commit -m "refactor(day-articles): use Locatie as the only B3 control"
          git push origin HEAD:feature/uitpakken-dagartikelen-release-b
