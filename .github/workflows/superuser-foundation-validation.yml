name: Superuser foundation validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/api/superuser_routes.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/testing/postgresql_onboarding_selftest_fixture.py'
      - 'backend/tests/support_message_migrated_fixture.py'
      - 'backend/tests/test_superuser_foundation.py'
      - 'backend/tests/test_superuser_frontend_contract.py'
      - 'frontend/src/app/router/SuperuserGuard.jsx'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/src/features/home/HomePage.jsx'
      - 'frontend/src/features/superuser/SuperuserDashboardPage.jsx'
      - 'frontend/src/lib/authSession.js'
      - '.github/workflows/superuser-foundation-validation.yml'
  workflow_dispatch:

jobs:
  validate-superuser-foundation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_superuser_foundation_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_superuser_foundation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_superuser_foundation_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_superuser_foundation_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Bootstrap PostgreSQL migration and runtime roles
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_superuser_foundation_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_superuser_foundation_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_superuser_foundation_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_superuser_foundation_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"
          echo 'SUPERUSER_FOUNDATION_RUNTIME_DML_ONLY_GREEN'

      - name: Compile Superuser foundation
        run: |
          python -m compileall -q \
            backend/app/api/superuser_routes.py \
            backend/app/session_entrypoint.py \
            backend/app/testing/postgresql_onboarding_selftest_fixture.py \
            backend/tests/support_message_migrated_fixture.py \
            backend/tests/test_superuser_foundation.py \
            backend/tests/test_superuser_frontend_contract.py

      - name: Validate Superuser authorization and UI contracts on PostgreSQL
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_superuser_foundation.py backend/tests/test_superuser_frontend_contract.py
