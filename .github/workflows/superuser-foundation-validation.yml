name: Superuser foundation validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/api/superuser_routes.py'
      - 'backend/tests/test_superuser_foundation.py'
      - 'backend/tests/test_superuser_frontend_contract.py'
      - 'frontend/src/app/router/SuperuserGuard.jsx'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/src/features/home/HomePage.jsx'
      - 'frontend/src/features/superuser/SuperuserDashboardPage.jsx'
      - 'frontend/src/lib/authSession.js'
      - '.github/workflows/superuser-foundation-validation.yml'
  workflow_dispatch:

jobs:
  validate-superuser-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused backend dependencies
        run: python -m pip install --quiet pytest sqlalchemy fastapi
      - name: Compile Superuser foundation
        run: |
          python -m compileall -q \
            backend/app/api/superuser_routes.py \
            backend/tests/test_superuser_foundation.py \
            backend/tests/test_superuser_frontend_contract.py
      - name: Validate Superuser authorization and UI contracts
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_superuser_foundation.py backend/tests/test_superuser_frontend_contract.py
