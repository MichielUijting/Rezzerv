name: Apply receipt semantic persistence patch

on:
  push:
    branches:
      - agent/receipt-inventory-eligibility-gate
    paths:
      - scripts/_apply_receipt_semantics_patch.py
      - scripts/_run_receipt_semantics_patch_v2.py
      - .github/workflows/_apply-receipt-semantics-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/receipt-inventory-eligibility-gate
          fetch-depth: 0
      - name: Apply corrected deterministic patch
        run: python scripts/_run_receipt_semantics_patch_v2.py
      - name: Syntax and targeted tests
        run: |
          python -m py_compile backend/app/receipt_ingestion/line_classifier.py backend/app/receipt_ingestion/receipt_line_semantics.py backend/app/services/receipt_service.py backend/app/main.py backend/app/testing/unpack_copies_kassa_contract.py
          cd backend
          python -m pip install -q -r requirements.txt pytest
          PYTHONPATH=. python -m pytest -q tests/test_receipt_inventory_eligibility.py
          PYTHONPATH=. python app/testing/unpack_copies_kassa_contract.py
      - name: Audit receipt-table persistence paths and dead gate
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('backend/app/services/receipt_service.py').read_text(encoding='utf-8')
          classifier = Path('backend/app/receipt_ingestion/line_classifier.py').read_text(encoding='utf-8')
          print('receipt_table_line_insert_count=', service.count('INSERT INTO receipt_table_lines'))
          print('semantic_insert_column_count=', service.count('line_role, inventory_eligible'))
          if 'receipt_line_is_inventory_eligible' in classifier:
              raise SystemExit('dead downstream inventory gate still exists')
          if service.count('INSERT INTO receipt_table_lines') < 1:
              raise SystemExit('receipt-table persistence path missing')
          PY
      - name: Diff hygiene
        run: git diff --check
      - name: Commit functional patch and remove all temporary applicators
        run: |
          git config user.name "Rezzerv Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/_apply_receipt_semantics_patch.py scripts/_run_receipt_semantics_patch_v2.py .github/workflows/_apply-receipt-semantics-patch.yml .github/workflows/_apply-receipt-semantics-patch-v2.yml
          git add backend/app/main.py backend/app/services/receipt_service.py backend/app/receipt_ingestion/line_classifier.py backend/app/receipt_ingestion/receipt_line_semantics.py backend/app/testing/unpack_copies_kassa_contract.py backend/tests/test_receipt_inventory_eligibility.py
          git commit -m "fix(receipts): persist semantic inventory eligibility"
          git push origin HEAD:agent/receipt-inventory-eligibility-gate
