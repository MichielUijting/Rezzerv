name: Temp apply backend optional article group

on:
  push:
    branches:
      - fix/unpacking-readiness-article-model
    paths:
      - '.github/workflows/_temp-apply-backend-optional-article-group.yml'
      - 'backend/tests/test_unpacking_readiness_article_model_contract.py'

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unpacking-readiness-article-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused backend patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          old = '''                article_group_id = str(line.get("selected_article_group_id") or "").strip()
                if not article_group_id:
                    error = "Geen geldige artikelgroep gekozen"
                    conn.execute(
                        text("UPDATE purchase_import_lines SET processing_status = 'failed', processing_error = :error, updated_at = CURRENT_TIMESTAMP WHERE id = :id"),
                        {"error": error, "id": line_id},
                    )
                    results.append({"line_id": line_id, "line_reference": line_reference, "status": "failed", "error": error})
                    failed_count += 1
                    continue

                valid_article_group = conn.execute(
                    text(
                        """
                        SELECT id
                        FROM article_groups
                        WHERE id = :article_group_id
                          AND household_id = :household_id
                          AND COALESCE(status, 'active') = 'active'
                        LIMIT 1
                        """
                    ),
                    {
                        "article_group_id": article_group_id,
                        "household_id": str(batch["household_id"]),
                    },
                ).mappings().first()
                if not valid_article_group:
                    error = "De gekozen artikelgroep bestaat niet binnen het actieve huishouden"
                    conn.execute(
                        text("UPDATE purchase_import_lines SET processing_status = 'failed', processing_error = :error, updated_at = CURRENT_TIMESTAMP WHERE id = :id"),
                        {"error": error, "id": line_id},
                    )
                    results.append({"line_id": line_id, "line_reference": line_reference, "status": "failed", "error": error})
                    failed_count += 1
                    continue
'''
          new = '''                article_group_id = str(line.get("selected_article_group_id") or "").strip() or None
                if article_group_id:
                    valid_article_group = conn.execute(
                        text(
                            """
                            SELECT id
                            FROM article_groups
                            WHERE id = :article_group_id
                              AND household_id = :household_id
                              AND COALESCE(status, 'active') = 'active'
                            LIMIT 1
                            """
                        ),
                        {
                            "article_group_id": article_group_id,
                            "household_id": str(batch["household_id"]),
                        },
                    ).mappings().first()
                    if not valid_article_group:
                        error = "De gekozen artikelgroep bestaat niet binnen het actieve huishouden"
                        conn.execute(
                            text("UPDATE purchase_import_lines SET processing_status = 'failed', processing_error = :error, updated_at = CURRENT_TIMESTAMP WHERE id = :id"),
                            {"error": error, "id": line_id},
                        )
                        results.append({"line_id": line_id, "line_reference": line_reference, "status": "failed", "error": error})
                        failed_count += 1
                        continue
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 backend article-group gate, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run article-model regression tests
        run: python -m pytest -q backend/tests/test_unpacking_readiness_article_model_contract.py
      - name: Whitespace check
        run: git diff --check
      - name: Commit product code
        run: |
          if git diff --quiet -- backend/app/main.py; then
            echo 'No backend product-code change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'fix: make article group optional in backend unpacking'
          git push origin HEAD:fix/unpacking-readiness-article-model
