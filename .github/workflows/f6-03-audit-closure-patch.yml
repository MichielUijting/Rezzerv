name: TEMP F6-03 audit closure patch

on:
  pull_request:
    paths:
      - '.github/workflows/f6-03-audit-closure-patch.yml'

permissions:
  contents: write

jobs:
  close-f6-03-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact F6-03 audit closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path('quality/acceptance/f6_failure_recovery_gap_audit.json')
          validator_path = Path('scripts/acceptance/validate_f6_failure_recovery_gap_audit.py')

          proof_run = '34625163561'
          proof_job = '103348569125'
          proof_sha = '309e113a8e4cfb550d54b28d78861029f66861d6'
          spec = 'frontend/tests/e2e/f6-03-invalid-import-fail-closed.fullstack.spec.js'
          workflow = '.github/workflows/f6-03-invalid-import-fail-closed-postgresql-validation.yml'

          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          targets = {
              'P0-RECEIPT-INVENTORY-ALMOSTOUT': (
                  'F6-03 Receipt/Inventory bewijst via de echte Kassa-upload een zichtbare HTTP 400-afwijzing '
                  "('Leeg bestand') en nul receipt-, importbatch-, inventory- en inventory-eventvervuiling in PostgreSQL; "
                  f'proof run {proof_run}, job {proof_job} op candidate {proof_sha}.'
              ),
              'P0-KASSA-REVIEW': (
                  'F6-03 Kassa Review bewijst via de echte Kassa-upload een zichtbare HTTP 400-afwijzing '
                  "('Leeg bestand') en nul receipt-, importbatch-, inventory- en inventory-eventvervuiling in PostgreSQL; "
                  f'proof run {proof_run}, job {proof_job} op candidate {proof_sha}.'
              ),
          }

          seen = set()
          for row in audit['scenarios']:
              scenario_id = row['id']
              if scenario_id not in targets:
                  continue
              seen.add(scenario_id)
              current = row['assessments']['invalid_import']
              if current not in {'partial', 'covered'}:
                  raise SystemExit(f'Unexpected invalid_import status for {scenario_id}: {current}')
              row['assessments']['invalid_import'] = 'covered'
              evidence = row.setdefault('evidence', [])
              for item in (spec, workflow):
                  if item not in evidence:
                      evidence.append(item)
              row.setdefault('notes', {})['invalid_import'] = targets[scenario_id]

          if seen != set(targets):
              raise SystemExit(f'Missing F6-03 target scenarios: {sorted(set(targets) - seen)}')

          audit['summary']['covered'] = 33
          audit['summary']['partial'] = 52
          audit['summary']['gap'] = 32
          audit['summary']['na'] = 23
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          validator = validator_path.read_text(encoding='utf-8')
          old_counts = 'EXPECTED_COUNTS = {"covered": 31, "partial": 54, "gap": 32, "na": 23}'
          new_counts = 'EXPECTED_COUNTS = {"covered": 33, "partial": 52, "gap": 32, "na": 23}'
          if old_counts in validator:
              validator = validator.replace(old_counts, new_counts, 1)
          elif new_counts not in validator:
              raise SystemExit('F6 count contract marker not found')

          constant_anchor = 'F6_02_PROOF_SHA = "0b79b1b4fe9ae6fc47d0dcacaca78e1be56c44bf"\n'
          constants = (
              'F6_03_SPEC = "frontend/tests/e2e/f6-03-invalid-import-fail-closed.fullstack.spec.js"\n'
              'F6_03_WORKFLOW = ".github/workflows/f6-03-invalid-import-fail-closed-postgresql-validation.yml"\n'
              f'F6_03_PROOF_RUN = "{proof_run}"\n'
              f'F6_03_PROOF_JOB = "{proof_job}"\n'
              f'F6_03_PROOF_SHA = "{proof_sha}"\n'
          )
          if 'F6_03_PROOF_RUN' not in validator:
              if constant_anchor not in validator:
                  raise SystemExit('F6-02 constant anchor not found')
              validator = validator.replace(constant_anchor, constant_anchor + constants, 1)

          closure_anchor = '    require((ROOT / F6_02_WORKFLOW).exists(), "f6_02_shared_postgresql_workflow_registered")\n\n'
          closure_block = '''    f6_03_scope = {"P0-RECEIPT-INVENTORY-ALMOSTOUT", "P0-KASSA-REVIEW"}\n    f6_03_rows = [row for row in scenarios if row["id"] in f6_03_scope]\n    require(len(f6_03_rows) == 2, "f6_03_exact_two_scope_scenarios")\n    require(\n        all(row["assessments"]["invalid_import"] == "covered" for row in f6_03_rows),\n        "f6_03_invalid_import_scope_fully_covered",\n    )\n    require((ROOT / F6_03_SPEC).exists(), "f6_03_browser_authority_registered")\n    require((ROOT / F6_03_WORKFLOW).exists(), "f6_03_postgresql_workflow_registered")\n    for row in f6_03_rows:\n        evidence = set(row.get("evidence") or [])\n        require(F6_03_SPEC in evidence, f"f6_03_{row['id']}_spec_registered")\n        require(F6_03_WORKFLOW in evidence, f"f6_03_{row['id']}_workflow_registered")\n        proof_note = row.get("notes", {}).get("invalid_import", "")\n        require(F6_03_PROOF_RUN in proof_note, f"f6_03_{row['id']}_proof_run_registered")\n        require(F6_03_PROOF_JOB in proof_note, f"f6_03_{row['id']}_proof_job_registered")\n        require(F6_03_PROOF_SHA in proof_note, f"f6_03_{row['id']}_candidate_registered")\n\n'''
          if 'f6_03_invalid_import_scope_fully_covered' not in validator:
              if closure_anchor not in validator:
                  raise SystemExit('F6-02 closure anchor not found')
              validator = validator.replace(closure_anchor, closure_anchor + closure_block, 1)

          validator_path.write_text(validator, encoding='utf-8')
          print('F6_03_AUDIT_PATCH_APPLIED')
          PY

          python scripts/acceptance/validate_f6_failure_recovery_gap_audit.py
          git diff --check -- quality/acceptance/f6_failure_recovery_gap_audit.json scripts/acceptance/validate_f6_failure_recovery_gap_audit.py
          grep -F '"covered":33,"partial":52,"gap":32,"na":23' quality/acceptance/f6_failure_recovery_gap_audit.json
          grep -F 'f6_03_invalid_import_scope_fully_covered' scripts/acceptance/validate_f6_failure_recovery_gap_audit.py

      - name: Commit audit closure
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- quality/acceptance/f6_failure_recovery_gap_audit.json scripts/acceptance/validate_f6_failure_recovery_gap_audit.py; then
            echo 'No F6-03 audit closure changes left to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quality/acceptance/f6_failure_recovery_gap_audit.json scripts/acceptance/validate_f6_failure_recovery_gap_audit.py
          git commit -m 'F6-03: close invalid import audit residuals'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
