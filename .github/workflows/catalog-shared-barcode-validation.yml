name: Catalogus shared barcode validation
# draft-ci-router: routed

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'backend/app/api/catalog_routes.py'
      - 'backend/app/api/barcode_import_routes.py'
      - 'backend/tests/test_superuser_barcode_import.py'
      - 'frontend/src/features/externalDatabases/BarcodeImportReview.jsx'
      - 'backend/app/services/barcode_identity_service.py'
      - 'backend/app/api/barcode_routes.py'
      - 'backend/tests/test_catalog_scan_replacement.py'
      - 'backend/tests/test_unpacked_scanned_barcode_expected_old.py'
      - 'frontend/src/features/barcodes/ArticleBarcodeScanAction.jsx'
      - 'frontend/src/features/externalDatabases/Ed2ArticleBarcodeAction.jsx'
      - 'frontend/tests/article-barcode-scan.contract.mjs'
      - 'frontend/tests/barcode-camera-recovery.contract.mjs'
      - 'frontend/src/lib/barcodeScanner.js'
      - 'frontend/src/lib/useBarcodeScanner.js'
      - 'frontend/src/lib/barcodeCameraRecovery.js'
      - 'frontend/src/features/barcodes/BarcodeScannerModal.jsx'
      - 'frontend/src/features/externalDatabases/Ed2BarcodeScanner.jsx'
      - 'backend/tests/test_catalog_shared_gtin_assignment.py'
      - 'backend/tests/test_catalog_shared_name_update.py'
      - 'backend/app/services/ed2_confirmed_barcode_service.py'
      - 'backend/app/services/ed2_barcode_correction_service.py'
      - 'backend/app/services/ed2_barcode_conflict_resolution_service.py'
      - 'backend/tests/test_ed2_barcode_conflict_resolution.py'
      - 'backend/tests/test_ed2_saved_barcode_catalog.py'
      - 'backend/tests/test_external_unlinked_articles_service.py'
      - 'frontend/src/features/externalDatabases/Ed2ManualBarcodeEntry.jsx'
      - 'frontend/src/features/externalDatabases/OffCandidatePanel.jsx'
      - 'backend/app/services/external_ed2_delete_service.py'
      - 'backend/app/services/external_unlinked_articles_service.py'
      - 'backend/tests/test_external_ed2_delete_service.py'
      - 'frontend/src/features/externalDatabases/ExternalDatabases2Page.jsx'
      - 'frontend/tests/ed2-delete-catalog.contract.mjs'
      - 'frontend/src/features/catalog/CatalogBarcodeEntry.jsx'
      - 'frontend/src/features/catalog/CatalogDetailPageV2.jsx'
      - 'frontend/src/features/catalog/CatalogNameEditor.jsx'
      - 'frontend/src/features/catalog/catalog.css'
      - 'frontend/src/ui/AppFeedbackProvider.jsx'
      - 'frontend/tests/catalog-clarity.contract.mjs'
      - 'frontend/tests/catalog-product-image.contract.mjs'
      - 'frontend/tests/inhuis-feedback-bar.contract.mjs'
      - 'frontend/tests/e2e/catalog-gpc-search.frontend-regression.spec.js'
      - '.github/workflows/catalog-shared-barcode-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-shared-barcode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-barcode-contract:
    name: Central GTIN validation and catalog safety
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci_test:ci_test@127.0.0.1:5432/ci_test
      REZZERV_DATASTORE_POLICY: postgresql-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Compile and run focused shared Catalogus GTIN contracts
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile backend/app/api/catalog_routes.py backend/app/api/barcode_import_routes.py backend/tests/test_superuser_barcode_import.py backend/tests/test_catalog_shared_gtin_assignment.py backend/tests/test_catalog_shared_name_update.py
          python -m py_compile backend/app/services/external_ed2_delete_service.py backend/tests/test_external_ed2_delete_service.py
          python -m py_compile backend/app/services/ed2_confirmed_barcode_service.py backend/app/services/ed2_barcode_correction_service.py backend/tests/test_ed2_saved_barcode_catalog.py backend/app/services/external_unlinked_articles_service.py backend/tests/test_external_unlinked_articles_service.py
          python -m py_compile backend/app/services/ed2_barcode_conflict_resolution_service.py backend/tests/test_ed2_barcode_conflict_resolution.py
          python -m pytest -q backend/tests/test_superuser_barcode_import.py
          python -m pytest -q backend/tests/test_catalog_shared_gtin_assignment.py backend/tests/test_catalog_shared_name_update.py
          python -m pytest -q backend/tests/test_external_ed2_delete_service.py
          python -m pytest -q backend/tests/test_ed2_saved_barcode_catalog.py backend/tests/test_external_unlinked_articles_service.py
          python -m pytest -q backend/tests/test_ed2_barcode_conflict_resolution.py
          python -m py_compile backend/app/api/barcode_routes.py backend/tests/test_catalog_scan_replacement.py
          python -m pytest -q backend/tests/test_catalog_scan_replacement.py
          python -m py_compile backend/tests/test_unpacked_scanned_barcode_expected_old.py
          python -m pytest -q backend/tests/test_unpacked_scanned_barcode_expected_old.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend Catalogus identity contract
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/catalog-clarity.contract.mjs
          node tests/catalog-product-image.contract.mjs
          node tests/inhuis-feedback-bar.contract.mjs
          node tests/ed2-delete-catalog.contract.mjs
          node tests/article-barcode-scan.contract.mjs
          node tests/barcode-camera-recovery.contract.mjs
          npm run build
