name: External relation batch decision platform authorization validation

on:
  push:
    branches:
      - 'codex/9.1.6e5-external-relations-decisioning'
    paths:
      - 'backend/app/api/system_routes.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/external_relation_batch_decision_route_authorization.py'
      - 'backend/app/services/external_relation_batch_store.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_external_relation_batch_decision_platform_authorization.py'
      - 'backend/tests/test_archived_receipt_purge_platform_authorization.py'
      - 'backend/tests/test_maintenance_recompute_platform_authorization.py'
      - 'backend/tests/test_receipt_status_baseline_platform_authorization.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - '.github/workflows/external-relation-batch-decision-platform-authorization.yml'
  pull_request:
    paths:
      - 'backend/app/api/system_routes.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/external_relation_batch_decision_route_authorization.py'
      - 'backend/app/services/external_relation_batch_store.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/tests/test_external_relation_batch_decision_platform_authorization.py'
      - 'backend/tests/test_archived_receipt_purge_platform_authorization.py'
      - 'backend/tests/test_maintenance_recompute_platform_authorization.py'
      - 'backend/tests/test_receipt_status_baseline_platform_authorization.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - '.github/workflows/external-relation-batch-decision-platform-authorization.yml'
  workflow_dispatch:

jobs:
  external-relation-batch-decision-platform-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile external relation decision boundary and regressions
        run: |
          python -m py_compile \
            app/session_entrypoint.py \
            app/services/external_relation_batch_decision_route_authorization.py \
            tests/test_external_relation_batch_decision_platform_authorization.py \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_maintenance_recompute_platform_authorization.py \
            tests/test_receipt_status_baseline_platform_authorization.py \
            tests/test_hybrid_regression_platform_authorization.py

      - name: Run external relation decision permission cutover tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_external_relation_batch_decision_platform_authorization.py \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_maintenance_recompute_platform_authorization.py \
            tests/test_receipt_status_baseline_platform_authorization.py \
            tests/test_hybrid_regression_platform_authorization.py
