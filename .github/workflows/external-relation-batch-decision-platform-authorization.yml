name: External relation batch decision platform authorization validation

on:
  push:
    branches:
      - 'codex/9.1.6e5-external-relations-decisioning'
    paths:
      - 'backend/app/api/system_routes.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/external_relation_batch_decision_route_authorization.py'
      - 'backend/app/services/external_relation_batch_store.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/postgresql_platform_authorization_fixture.py'
      - 'backend/tests/test_external_relation_batch_decision_platform_authorization.py'
      - 'backend/tests/test_archived_receipt_purge_platform_authorization.py'
      - 'backend/tests/test_maintenance_recompute_platform_authorization.py'
      - 'backend/tests/test_receipt_status_baseline_platform_authorization.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - '.github/workflows/external-relation-batch-decision-platform-authorization.yml'
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/app/api/system_routes.py'
      - 'backend/app/session_entrypoint.py'
      - 'backend/app/services/authorization_foundation_service.py'
      - 'backend/app/services/external_relation_batch_decision_route_authorization.py'
      - 'backend/app/services/external_relation_batch_store.py'
      - 'backend/app/services/session_request_context.py'
      - 'backend/app/testing/postgresql_platform_authorization_fixture.py'
      - 'backend/tests/test_external_relation_batch_decision_platform_authorization.py'
      - 'backend/tests/test_archived_receipt_purge_platform_authorization.py'
      - 'backend/tests/test_maintenance_recompute_platform_authorization.py'
      - 'backend/tests/test_receipt_status_baseline_platform_authorization.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - '.github/workflows/external-relation-batch-decision-platform-authorization.yml'
  workflow_dispatch:

jobs:
  external-relation-batch-decision-platform-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rezzerv_bootstrap
          POSTGRES_PASSWORD: rezzerv_bootstrap_ci
          POSTGRES_DB: rezzerv_external_relation_decision_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rezzerv_bootstrap -d rezzerv_external_relation_decision_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rezzerv_app:rezzerv_app_ci@127.0.0.1:55432/rezzerv_external_relation_decision_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://rezzerv_migrator:rezzerv_migrator_ci@127.0.0.1:55432/rezzerv_external_relation_decision_ci
      REZZERV_DATASTORE_POLICY: postgresql-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Bootstrap PostgreSQL migration and runtime roles
        working-directory: .
        env:
          PGPASSWORD: rezzerv_bootstrap_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U rezzerv_bootstrap -d postgres <<'SQL'
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'rezzerv_migrator_ci';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'rezzerv_app_ci';
          GRANT CONNECT ON DATABASE rezzerv_external_relation_decision_ci TO rezzerv_migrator, rezzerv_app;
          ALTER DATABASE rezzerv_external_relation_decision_ci OWNER TO rezzerv_migrator;
          \connect rezzerv_external_relation_decision_ci
          ALTER SCHEMA public OWNER TO rezzerv_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM rezzerv_app;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Initialize canonical PostgreSQL schema through Alembic
        run: python -m alembic upgrade head

      - name: Assert runtime role is DML-only
        working-directory: .
        env:
          PGPASSWORD: rezzerv_app_ci
        run: |
          result=$(psql -At -h 127.0.0.1 -p 55432 -U rezzerv_app -d rezzerv_external_relation_decision_ci -c "SELECT has_schema_privilege(current_user, 'public', 'CREATE');")
          test "$result" = "f"

      - name: Compile external relation decision boundary and regressions
        run: |
          python -m py_compile \
            app/session_entrypoint.py \
            app/services/external_relation_batch_decision_route_authorization.py \
            tests/test_external_relation_batch_decision_platform_authorization.py \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_maintenance_recompute_platform_authorization.py \
            tests/test_receipt_status_baseline_platform_authorization.py \
            tests/test_hybrid_regression_platform_authorization.py

      - name: Run external relation decision permission cutover tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_external_relation_batch_decision_platform_authorization.py \
            tests/test_archived_receipt_purge_platform_authorization.py \
            tests/test_maintenance_recompute_platform_authorization.py \
            tests/test_receipt_status_baseline_platform_authorization.py \
            tests/test_hybrid_regression_platform_authorization.py
