name: Apply receipt inventory eligibility repair

on:
  push:
    branches:
      - agent/receipt-inventory-eligibility-gate

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted repair
        run: python tools/_apply_receipt_inventory_eligibility_repair.py

      - name: Validate repair
        run: |
          export PYTHONPATH=backend
          python -m py_compile backend/app/receipt_ingestion/line_classifier.py backend/app/main.py backend/app/testing/unpack_copies_kassa_contract.py
          python backend/app/testing/unpack_copies_kassa_contract.py
          python -m pip install --quiet pytest
          pytest -q backend/tests/test_receipt_inventory_eligibility.py
          git diff --check

      - name: Remove temporary execution helpers
        run: |
          rm tools/_apply_receipt_inventory_eligibility_repair.py
          rm .github/workflows/_apply-receipt-inventory-eligibility-repair.yml

      - name: Commit repaired implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix receipts inventory eligibility gate'
          git push origin HEAD:agent/receipt-inventory-eligibility-gate
