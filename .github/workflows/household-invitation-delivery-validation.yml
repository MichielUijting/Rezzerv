name: Household invitation delivery validation

on:
  pull_request:
    paths:
      - 'backend/app/api/household_invitation_routes.py'
      - 'backend/app/services/household_invitation_delivery_service.py'
      - 'backend/tests/household_invitation_delivery_selftest.py'
      - '.github/workflows/household-invitation-delivery-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile invitation delivery
        working-directory: backend
        run: |
          python -m py_compile app/api/household_invitation_routes.py
          python -m py_compile app/services/household_invitation_delivery_service.py
          python -m py_compile tests/household_invitation_delivery_selftest.py

      - name: Validate invitation delivery security contract
        working-directory: backend
        run: |
          PYTHONPATH=. python tests/household_invitation_delivery_selftest.py | tee /tmp/invitation-delivery.log
          grep -F 'HOUSEHOLD_INVITATION_DELIVERY_GREEN' /tmp/invitation-delivery.log

      - name: Invitation delivery gate marker
        run: echo 'ONBOARDING_V2_I3_INVITATION_DELIVERY_GREEN'
