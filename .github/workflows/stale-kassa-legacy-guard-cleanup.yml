name: Stale kassa legacy guard cleanup validation

on:
  pull_request:
    paths:
      - 'backend/app/services/platform_admin_route_guard.py'
      - 'backend/app/testing/receipt_admin_household_guard_contract.py'
      - 'backend/tests/test_stale_kassa_legacy_guard_cleanup.py'
      - 'backend/tests/test_hybrid_regression_platform_authorization.py'
      - 'backend/tests/server_session_route_guard_audit.py'
      - '.github/workflows/stale-kassa-legacy-guard-cleanup.yml'

jobs:
  stale-kassa-legacy-guard-cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy httpx

      - name: Compile cleanup boundary and tests
        run: |
          python -m py_compile \
            app/services/platform_admin_route_guard.py \
            app/testing/receipt_admin_household_guard_contract.py \
            tests/test_stale_kassa_legacy_guard_cleanup.py \
            tests/test_hybrid_regression_platform_authorization.py \
            tests/server_session_route_guard_audit.py

      - name: Run stale kassa cleanup tests
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest -q \
            tests/test_stale_kassa_legacy_guard_cleanup.py \
            tests/test_hybrid_regression_platform_authorization.py

      - name: Run legacy platform guard contract
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m app.testing.receipt_admin_household_guard_contract

      - name: Run server session route guard audit
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
        run: python tests/server_session_route_guard_audit.py
