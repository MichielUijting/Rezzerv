name: Uitpakken admin location create validation

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply proven picker restoration
        run: python scripts/_temp_restore_uitpakken_location_picker.py

      - name: Backend source contract
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/test_uitpakken_location_admin_contract.py

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: B3 contract
        working-directory: frontend
        run: npm test -- --run src/features/stores/StoreBatchDetailPage.b3-native.contract.test.js

      - name: Diff hygiene
        run: git diff --check

      - name: Commit proven restoration
        run: |
          git config user.name "Rezzerv CI"
          git config user.email "actions@rezzerv.local"
          git add frontend/src/features/stores/StoreBatchDetailPage.jsx frontend/tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js
          git commit -m "fix(uitpakken): restore location picker in receipt table"
          git push origin HEAD:fix/uitpakken-admin-location-create
