name: Uitpakken admin location create validation

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend and B3 source contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/test_uitpakken_location_admin_contract.py

      - name: Frontend install and production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated browser state
        working-directory: frontend
        run: |
          mkdir -p playwright/.auth
          printf '%s\n' '{"cookies":[],"origins":[]}' > playwright/.auth/user.json

      - name: Targeted production-preview regression
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 >/tmp/rezzerv-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5174 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5174 >/dev/null
          npx playwright test tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js --project=chromium --no-deps --workers=1

      - name: Diff hygiene
        run: git diff --check
