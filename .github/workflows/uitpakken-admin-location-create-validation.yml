name: Uitpakken admin location create validation

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uitpakken-admin-location-create
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply proven race fix
        run: python scripts/_temp_restore_uitpakken_location_picker.py

      - name: Backend and B3 source contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/test_uitpakken_location_admin_contract.py

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit proven race fix
        run: |
          git config user.name "Rezzerv CI"
          git config user.email "actions@rezzerv.local"
          git add frontend/src/features/stores/StoreBatchDetailPage.jsx backend/tests/test_uitpakken_location_admin_contract.py
          git commit -m "fix(uitpakken): apply newly created location deterministically"
          git push origin HEAD:fix/uitpakken-admin-location-create
