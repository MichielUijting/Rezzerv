name: Uitpakken admin location create validation

on:
  push:
    branches:
      - fix/uitpakken-admin-location-create
    paths:
      - 'backend/tests/test_uitpakken_location_admin_contract.py'
      - 'frontend/tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js'
      - 'frontend/src/features/**unpack**'
      - '.github/workflows/uitpakken-admin-location-create-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/tests/test_uitpakken_location_admin_contract.py'
      - 'frontend/tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js'
      - 'frontend/src/features/**unpack**'
      - '.github/workflows/uitpakken-admin-location-create-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend and B3 source contracts
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q backend/tests/test_uitpakken_location_admin_contract.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 5174 > /tmp/rezzerv-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5174 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rezzerv-vite-preview.log
          exit 1

      - name: Create empty Playwright storage state
        working-directory: frontend
        run: |
          mkdir -p playwright/.auth
          node -e "require('fs').writeFileSync('playwright/.auth/user.json',JSON.stringify({cookies:[],origins:[]}))"

      - name: Exact Uitpakken Admin location browser regression
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
        run: npx playwright test --project=chromium --no-deps --workers=1 tests/e2e/uitpakken-admin-location-create.frontend-regression.spec.js

      - name: Diff hygiene
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
