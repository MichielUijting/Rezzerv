name: Settings My account validation

on:
  pull_request:
    paths:
      - 'backend/app/api/consumer_account_routes.py'
      - 'backend/app/api/router.py'
      - 'backend/app/services/consumer_account_management_service.py'
      - 'backend/app/services/password_service.py'
      - 'backend/app/services/server_session_service.py'
      - 'backend/tests/consumer_account_management_selftest.py'
      - 'frontend/src/app/router/AppRouter.jsx'
      - 'frontend/src/features/settings/SettingsMyAccountPage.jsx'
      - 'frontend/src/features/settings/settingsNavigation.js'
      - 'frontend/tests/dynamic-settings-navigation.contract.mjs'
      - 'frontend/tests/settings-v2-information-architecture.contract.mjs'
      - 'frontend/tests/e2e/dynamic-settings.frontend-regression.spec.js'
      - 'frontend/tests/e2e/settings-my-account.frontend-regression.spec.js'
      - 'frontend/package.json'
      - '.github/workflows/settings-my-account.yml'
  workflow_dispatch:

concurrency:
  group: settings-my-account-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile consumer account boundary
        working-directory: backend
        run: |
          PYTHONPATH=. python -m py_compile \
            app/api/consumer_account_routes.py \
            app/services/consumer_account_management_service.py \
            tests/consumer_account_management_selftest.py

      - name: Validate consumer account password management
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/rezzerv-my-account.db
        run: python tests/consumer_account_management_selftest.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Settings v2 navigation contracts
        run: |
          node frontend/tests/settings-v2-information-architecture.contract.mjs
          node frontend/tests/dynamic-settings-navigation.contract.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: My account gate marker
        run: echo 'SETTINGS_MY_ACCOUNT_VALIDATION_GREEN'
