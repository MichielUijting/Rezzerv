name: PostgreSQL onboarding use-case portability

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/20260829_10_household_product_use_case_authority.py'
      - 'backend/app/services/household_capability_expansion_service.py'
      - 'backend/app/services/household_product_use_case_service.py'
      - 'backend/tests/postgresql_onboarding_use_case_sql_portability_selftest.py'
      - 'backend/tests/postgresql_onboarding_use_case_dml_only_selftest.py'
      - '.github/workflows/postgresql-onboarding-use-case-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-use-case-portability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rezzerv
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rezzerv"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://rezzerv_app:runtime-pass@127.0.0.1:5432/rezzerv
      MIGRATION_DATABASE_URL: postgresql://rezzerv_migrator:migration-pass@127.0.0.1:5432/rezzerv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure migration and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d rezzerv -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE ROLE rezzerv_migrator LOGIN PASSWORD 'migration-pass';
          CREATE ROLE rezzerv_app LOGIN PASSWORD 'runtime-pass';
          GRANT CONNECT ON DATABASE rezzerv TO rezzerv_migrator, rezzerv_app;
          GRANT USAGE, CREATE ON SCHEMA public TO rezzerv_migrator;
          GRANT USAGE ON SCHEMA public TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO rezzerv_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE rezzerv_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO rezzerv_app;
          SQL

      - name: Prove onboarding use-case runtime SQL is portable
        run: |
          python backend/tests/postgresql_onboarding_use_case_sql_portability_selftest.py | tee /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_SQL_PORTABLE_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_RUNTIME_DDL_ABSENT_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_VALIDATION_ONLY_SCHEMA_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_ALEMBIC_AUTHORITY_GREEN' /tmp/onboarding-use-case-static.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_STATIC_AUTHORITY_SELFTEST_GREEN' /tmp/onboarding-use-case-static.log

      - name: Migrate through household use-case authority revision
        working-directory: backend
        run: |
          python -m app.schema_migration_preflight | tee /tmp/onboarding-use-case-migration.log
          grep -F "'dialect': 'postgresql'" /tmp/onboarding-use-case-migration.log
          grep -F "'revision': '20260829_10'" /tmp/onboarding-use-case-migration.log

      - name: Prove onboarding use-case requests work with DML-only runtime role
        working-directory: backend
        run: |
          env -u MIGRATION_DATABASE_URL python tests/postgresql_onboarding_use_case_dml_only_selftest.py | tee /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_RUNTIME_CREATE_DENIED_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_SCHEMA_VALIDATION_ONLY_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_CAPABILITY_DML_ONLY_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_DML_ONLY_GREEN' /tmp/onboarding-use-case-dml-only.log
          grep -F 'POSTGRESQL_ONBOARDING_USE_CASE_AUTHORITY_SELFTEST_GREEN' /tmp/onboarding-use-case-dml-only.log
